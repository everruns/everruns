<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 512 512">

  <!--
    Three rings on the vertices of an equilateral triangle (true 3-fold
    symmetry), translated so the rings' centroid — the 3-fold symmetry
    center — sits exactly at the canvas center (256, 256). Centering on the
    centroid (not the bounding box) keeps the mark balanced in circular/
    square crops.
      r = 120, side d = 125.34, circumradius R = d/sqrt(3) = 72.36
    Original centroid (256, 274.09) shifted up 18.09 to center it.
  -->

  <!-- Rings -->
  <g fill="none"
     stroke="#0A0A0A"
     stroke-width="18"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Top -->
    <circle cx="256" cy="183.64" r="120"/>

    <!-- Bottom-left -->
    <circle cx="193.33" cy="292.18" r="120"/>

    <!-- Bottom-right -->
    <circle cx="318.67" cy="292.18" r="120"/>

  </g>
</svg>
