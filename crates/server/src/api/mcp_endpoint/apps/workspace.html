<!doctype html><html><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; frame-src __WORKSPACE_ORIGIN__"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everruns</title><style>html,body{margin:0;width:100%;height:100%;font:14px system-ui;background:Canvas;color:CanvasText}iframe{border:0;width:100%;height:100%;min-height:80px}#message{padding:16px}button{padding:7px 12px;font:inherit;border:1px solid #888;background:Canvas;color:CanvasText}#expand{position:absolute;right:10px;top:10px;z-index:2}#retry{margin:0 16px}button[hidden]{display:none}</style></head><body><button id="expand" hidden>Expand</button><p id="message" role="status">Opening Everruns…</p><button id="retry" hidden>Retry connection</button><iframe id="workspace" title="Everruns workspace" sandbox="allow-scripts allow-same-origin" allow="clipboard-write" referrerpolicy="no-referrer" hidden></iframe><script>
(function () {
  "use strict";
  const config = __WORKSPACE_CONFIG__;
  const frame = document.getElementById("workspace");
  const message = document.getElementById("message");
  const expand = document.getElementById("expand");
  const retry = document.getElementById("retry");
  let height = 760, next = 1, host = {}, context = {}, current = null, org = null;
  let ready = false, initialized = false, initializing = false, closed = false, generation = 0;
  const pending = new Map();

  function layout() {
    const full = context.displayMode === "fullscreen";
    frame.style.height = full ? "100dvh" : height + "px";
    document.documentElement.style.colorScheme = context.theme === "dark" ? "dark" : "light";
    expand.hidden = full || !(context.availableDisplayModes || []).includes("fullscreen");
  }
  function send(method, params, timeout = 30000) {
    if (closed) return Promise.reject(new Error("Workspace closed"));
    const id = next++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        if (pending.delete(id)) reject(new Error("Host request timed out"));
      }, timeout);
      pending.set(id, { resolve, reject, timer, scoped: method === "tools/call" || method === "ui/download-file" });
      window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
    });
  }
  function cancelPending(reason, scopedOnly = false) {
    for (const [id, item] of pending) {
      if (scopedOnly && !item.scoped) continue;
      pending.delete(id);
      clearTimeout(item.timer);
      item.reject(new Error(reason));
    }
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*"); }
  function toFrame(type, data) {
    if (ready && !closed) frame.contentWindow.postMessage({ type, ...data }, config.origin);
  }
  function structured(result) {
    if (result?.structuredContent) return result.structuredContent;
    try { return JSON.parse((result?.content || []).find(c => c.type === "text")?.text || "null"); }
    catch { return null; }
  }
  function openFrame() {
    if (current && initialized && !frame.src) {
      frame.src = config.base;
      frame.hidden = false;
      message.hidden = true;
    }
  }
  function show(result) {
    const data = structured(result);
    if (!data) return;
    const nextOrg = data.organization_id || data.organization?.id || org;
    if (org && org !== nextOrg) {
      generation += 1;
      cancelPending("Organization changed", true);
    }
    org = nextOrg;
    const view = data.view || { kind: data.session_id ? "session" : data.agent_card ? "agent" : config.kind, id: data.session_id || data.agent_card?.public_id };
    current = { view, organization_id: org };
    if (ready) toFrame("everruns:init", { ...current, context, capabilities: host });
    else openFrame();
  }
  window.addEventListener("message", async event => {
    const m = event.data;
    if (closed || !m || typeof m !== "object") return;
    if (event.source === frame.contentWindow && event.origin === config.origin) {
      if (m.type === "everruns:ready") { ready = true; toFrame("everruns:init", { ...current, context, capabilities: host }); return; }
      if (m.type === "everruns:labels" && typeof m.expand === "string") { expand.textContent = m.expand; return; }
      if (m.type === "everruns:size") {
        height = Math.max(80, Math.min(1200, Number(m.height) || 760));
        layout();
        if (context.displayMode !== "fullscreen") notify("ui/notifications/size-changed", { height });
        return;
      }
      if (m.type === "everruns:open-link") {
        if (host.openLinks && typeof m.url === "string") send("ui/open-link", { url: m.url }).catch(() => {});
        return;
      }
      const requestGeneration = generation;
      function respond(data) {
        // A result from an old organization or closed frame has no recipient.
        if (requestGeneration === generation) toFrame("everruns:response", { id: m.id, ...data });
      }
      if (m.type === "everruns:download") {
        try {
          if (!host.downloadFile) throw new Error("This host does not support downloads. Open the file in Everruns.");
          if (typeof m.filename !== "string" || !m.filename || m.filename.length > 1024 || typeof m.mimeType !== "string" || m.mimeType.length > 256 || typeof m.blob !== "string" || m.blob.length > 11184812 || !/^[A-Za-z0-9+/]*={0,2}$/.test(m.blob)) throw new Error("Invalid workspace download");
          const name = m.filename.split(/[\\/]/).pop();
          const result = await send("ui/download-file", { contents: [{ type: "resource", resource: { uri: "file:///" + encodeURIComponent(name), mimeType: m.mimeType, blob: m.blob } }] }, 120000);
          respond({ result });
        } catch (error) { respond({ error: error.message }); }
        return;
      }
      if (m.type !== "everruns:request" || !["app_read", "app_write", "app_bootstrap"].includes(m.tool)) return;
      try {
        if (!host.serverTools) throw new Error("This host does not support workspace data access");
        const result = await send("tools/call", { name: m.tool, arguments: { ...m.arguments, organization_id: org } });
        if (result?.isError) throw new Error((result.content || []).map(c => c.text || "").join("\n"));
        respond({ result: structured(result) });
      } catch (error) { respond({ error: error.message }); }
      return;
    }
    if (event.source !== window.parent || m.jsonrpc !== "2.0") return;
    if (m.id != null && !m.method) {
      const item = pending.get(m.id);
      if (item) {
        pending.delete(m.id);
        clearTimeout(item.timer);
        m.error ? item.reject(new Error(m.error.message)) : item.resolve(m.result);
      }
      return;
    }
    if (m.method === "ui/notifications/tool-result") show(m.params);
    if (m.method === "ui/notifications/host-context-changed") {
      context = { ...context, ...m.params }; layout(); toFrame("everruns:context", { context });
    }
    if (m.method === "ui/resource-teardown") {
      toFrame("everruns:teardown", {});
      closed = true; ready = false; generation += 1;
      cancelPending("Workspace closed");
      frame.src = "about:blank";
      if (m.id != null) window.parent.postMessage({ jsonrpc: "2.0", id: m.id, result: {} }, "*");
    }
  });
  expand.addEventListener("click", () => send("ui/request-display-mode", { mode: "fullscreen" }).then(result => {
    if (closed) return;
    context = { ...context, displayMode: result.mode }; layout();
  }).catch(() => {}));
  function initialize() {
    if (closed || initializing) return;
    initializing = true;
    retry.hidden = true;
    message.textContent = "Opening Everruns…";
    send("ui/initialize", { protocolVersion: "2026-01-26", appInfo: { name: "everruns", version: "3" }, appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] } }).then(result => {
      if (closed) return;
      host = result.hostCapabilities || {}; context = result.hostContext || {};
      initialized = true; initializing = false;
      openFrame(); layout(); notify("ui/notifications/initialized", {}); toFrame("everruns:context", { context });
    }).catch(error => {
      initializing = false;
      if (closed) return;
      message.textContent = error.message;
      retry.hidden = false;
    });
  }
  retry.addEventListener("click", initialize);
  initialize();
})();
</script></body></html>
