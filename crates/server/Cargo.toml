[package]
name = "everruns-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "everruns-server"

[[bin]]
name = "everruns-server"
path = "src/main.rs"

[[bin]]
name = "reencrypt-secrets"
path = "src/bin/reencrypt_secrets.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
sqlx.workspace = true
chrono.workspace = true
dotenvy.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
base64.workspace = true
reqwest.workspace = true
time.workspace = true
regex.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
governor.workspace = true
fred.workspace = true
parking_lot.workspace = true
cron = "0.15"
inventory.workspace = true
moka.workspace = true
zip = { version = "2", default-features = false, features = ["deflate"] }

everruns-core = { path = "../core", features = ["openapi", "sqlx"] }
everruns-integrations-docker = { path = "../../integrations/docker" }
everruns-integrations-brave-search = { path = "../../integrations/brave-search" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }
everruns-integrations-daytona = { path = "../../integrations/daytona" }
everruns-session-sqldb = { path = "../session-sqldb" }
everruns-worker = { path = "../worker" }  # For AgentRunner trait
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-durable = { path = "../durable" }  # For durable execution gRPC service
image.workspace = true  # For image thumbnail generation

# gRPC
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-native-certs", "blocking", "http2"] }
futures.workspace = true
http-body-util = "0.1"
sysinfo = "0.33"
serde_html_form = "0.2"  # Same deserializer axum-extra::extract::Query uses
everruns-sdk.workspace = true
wiremock = "0.6"

[[bench]]
name = "load_test"
harness = false
