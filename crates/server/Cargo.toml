[package]
name = "everruns-server"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "everruns-server"

[[bin]]
name = "everruns-server"
path = "src/main.rs"

[[bin]]
name = "reencrypt-secrets"
path = "src/bin/reencrypt_secrets.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[features]
# Experimental sandboxed Lua execution capability (knowledge/execution/lua-execution.md).
# Off by default; `lua` compiles the mlua engine into core. Also runtime-gated
# by FEATURE_LUA.
lua = ["everruns-platform/lua"]

[dependencies]
mimalloc.workspace = true
axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
sqlx.workspace = true
chrono.workspace = true
dotenvy.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
object_store.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
ethers-core = "2.0.14"
ethers-signers = "2.0.14"
time.workspace = true
regex.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
governor.workspace = true
fred.workspace = true
async-nats.workspace = true
parking_lot.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
cron = "0.17"
inventory.workspace = true
moka.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
urlencoding = "2"
git2.workspace = true
tempfile.workspace = true
mime_guess = "2"
tokio-tungstenite.workspace = true
futures-util.workspace = true
flate2.workspace = true
tar.workspace = true

bashkit = { version = "0.16.0", features = ["scripted_tool", "jq"] }

everruns-capability = { workspace = true }
everruns-core = { path = "../core", features = ["openapi", "tree-sitter-outlines"] }
# sqlx Postgres encode/decode for TypedId lives on everruns-provider (EVE-888).
# The kernel never used sqlx, so the server asks the crate that owns the impls.
everruns-provider = { path = "../provider", features = ["sqlx"] }
# Backend identity entities (Organization, Principal) — moved out of core in EVE-837.
everruns-builtins = { workspace = true, features = ["ui-capabilities"] }
everruns-platform = { path = "../platform", features = ["openapi", "environment-capabilities", "portable-builtins", "a2a"] }
# Observability exporters (Braintrust, OpenTelemetry event listeners). The OTLP
# init these rely on stays in core's `telemetry` feature (on by default).
everruns-observability = { workspace = true }
everruns-mcp = { path = "../mcp" }
everruns-http.workspace = true
everruns-integrations-bashkit.workspace = true
everruns-integrations-web-fetch.workspace = true
everruns-ard = { path = "../ard" }
everruns-integrations-docker = { path = "../../integrations/docker" }
everruns-integrations-brave-search = { path = "../../integrations/brave-search" }
everruns-integrations-openai-image = { path = "../../integrations/openai-image" }
everruns-integrations-parallel = { path = "../../integrations/parallel" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }
everruns-integrations-github = { path = "../../integrations/github" }
everruns-integrations-cursor = { path = "../../integrations/cursor" }
everruns-integrations-daytona = { path = "../../integrations/daytona" }
everruns-integrations-deno = { path = "../../integrations/deno" }
everruns-integrations-browserless = { path = "../../integrations/browserless" }
everruns-integrations-e2b = { path = "../../integrations/e2b" }
everruns-integrations-sprites = { path = "../../integrations/sprites" }
everruns-container-sandbox = { path = "../container-sandbox" }
everruns-session-sqldb = { path = "../session-sqldb" }
everruns-host = { path = "../host" }  # HostComposition, the execution surface the OSS preset builds
everruns-worker = { path = "../worker" }  # For AgentRunner trait
everruns-turbopuffer = { path = "../turbopuffer" }  # Opt-in vector-store backend
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-durable = { path = "../durable" }  # For durable execution gRPC service
image.workspace = true  # For image thumbnail generation

# gRPC
tonic.workspace = true
prost-types.workspace = true
serde_urlencoded = "0.7.1"
ag-ui-core = "0.1.0"
url = "2"

[dev-dependencies]
a2a.workspace = true
a2a-client.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "stream", "rustls", "blocking", "http2"] }
futures.workspace = true
http-body-util = "0.1"
sysinfo = "0.39"
serde_html_form = "0.4"  # Same deserializer axum-extra::extract::Query uses
everruns-sdk.workspace = true
wiremock = "0.6"
flate2.workspace = true
tar.workspace = true

[[bench]]
name = "load_test"
harness = false
