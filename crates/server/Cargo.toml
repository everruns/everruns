[package]
name = "everruns-server"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "everruns-server"

[[bin]]
name = "everruns-server"
path = "src/main.rs"

[[bin]]
name = "reencrypt-secrets"
path = "src/bin/reencrypt_secrets.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[features]
# Experimental sandboxed Lua execution capability (knowledge/execution/lua-execution.md).
# Off by default; `lua` compiles the mlua engine into core. Also runtime-gated
# by FEATURE_LUA.
lua = ["everruns-capabilities/lua"]

[dependencies]
mimalloc.workspace = true
axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
hyper-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
sqlx.workspace = true
chrono.workspace = true
dotenvy.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
sha2.workspace = true
hmac.workspace = true
hex.workspace = true
object_store.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
# secp256k1 signing for the x402 payment rail. EIP-712 hashing is in-tree
# (domains/payments/eip712.rs); see knowledge/project/dependency-surface.md.
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.12"
time.workspace = true
regex.workspace = true
async-trait.workspace = true
everruns-drivers = { workspace = true, features = ["chatgpt"] }
aes-gcm.workspace = true
argon2.workspace = true
governor.workspace = true
fred.workspace = true
async-nats.workspace = true
parking_lot.workspace = true
metrics.workspace = true
cron = "0.17"
inventory.workspace = true
everruns-server-macros = { path = "../server-macros" }
moka.workspace = true
zip = { version = "8", default-features = false, features = ["deflate"] }
urlencoding = "2"
git2.workspace = true
tempfile.workspace = true
mime_guess = "2"
tokio-tungstenite.workspace = true
futures-util.workspace = true
http-body-util = "0.1"
flate2.workspace = true
tar.workspace = true

# `default-features = false` drops bashkit's default `ring`; the rest of its
# default set is restored explicitly so only the crypto backend changes (EVE-924).
bashkit = { version = "0.18.1", default-features = false, features = ["scripted_tool", "jq", "tzdata", "aws-lc-rs"] }

everruns-contracts = { workspace = true, default-features = false, features = ["http", "sqlx"] }
# sqlx Postgres encode/decode for TypedId lives on everruns-contracts (EVE-888).
# The kernel never used sqlx, so the server asks the crate that owns the impls.
# Backend identity entities (Organization, Principal) — moved out of core in EVE-837.
everruns-capabilities = { path = "../capabilities", features = ["openapi", "environment-capabilities", "portable-builtins", "a2a", "ag-ui", "container-sandbox"] }
# Observability exporters are enabled through everruns-host below; core retains
# neutral event-listener contracts only.
everruns-cli-contract.workspace = true
everruns-integrations-catalog.workspace = true
# Sandbox Templates validate Modal egress with the provider's own rules.
everruns-integrations = { workspace = true, features = ["modal"] }
everruns-integrations-typesafe = { path = "../../integrations/typesafe" }
everruns-integrations-bashkit.workspace = true
everruns-integrations-web-fetch.workspace = true
rusqlite = { version = "0.39", features = ["bundled", "serialize", "column_decltype", "hooks"] }
everruns-worker = { path = "../worker" }  # For AgentRunner trait
everruns-turbopuffer = { path = "../turbopuffer" }  # Opt-in vector-store backend
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-durable = { path = "../durable" }  # For durable execution gRPC service
image.workspace = true  # For image thumbnail generation

# gRPC
tonic.workspace = true
prost-types.workspace = true
serde_urlencoded = "0.7.1"
url = "2"

everruns-core = { path = "../core", features = ["agent-package", "ag-ui", "ag-ui-projection", "builtins", "direct-egress", "host", "mcp", "observability", "openai-agents-api", "openapi", "tree-sitter-outlines", "ui-capabilities"], default-features = false }
everruns = { workspace = true, default-features = false, features = ["utility-llm"] }
[dev-dependencies]
a2a.workspace = true
a2a-client.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "stream", "rustls", "blocking", "http2"] }
futures.workspace = true
serde_html_form = "0.4"  # Same deserializer axum-extra::extract::Query uses
everruns-sdk.workspace = true
everruns-test-support = { path = "../test-support", default-features = false }
# Template tests check the `github` capability enforces template settings.
everruns-integrations-github = { path = "../../integrations/github" }
wiremock = "0.6"
jsonschema = { version = "0.58.1", default-features = false }
flate2.workspace = true
tar.workspace = true

[[bench]]
name = "load_test"
harness = false
