[package]
name = "everruns-server"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "everruns-server"

[[bin]]
name = "everruns-server"
path = "src/main.rs"

[[bin]]
name = "reencrypt-secrets"
path = "src/bin/reencrypt_secrets.rs"

[[bin]]
name = "export-openapi"
path = "src/bin/export_openapi.rs"

[dependencies]
axum.workspace = true
axum-extra.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
futures.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-swagger-ui.workspace = true
sqlx.workspace = true
chrono.workspace = true
dotenvy.workspace = true
clap.workspace = true
jsonwebtoken.workspace = true
rand.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
reqwest.workspace = true
time.workspace = true
regex.workspace = true
async-trait.workspace = true
aes-gcm.workspace = true
argon2.workspace = true
parking_lot.workspace = true

everruns-core = { path = "../core", features = ["openapi", "sqlx"] }
everruns-worker = { path = "../worker" }  # For AgentRunner trait
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-durable = { path = "../durable" }  # For durable execution gRPC service
image.workspace = true  # For image thumbnail generation

# gRPC
tonic.workspace = true
prost.workspace = true

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-native-certs", "blocking"] }
http-body-util = "0.1"
