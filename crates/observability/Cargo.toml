# Everruns Observability
# Decision: Exporter event-listeners (Braintrust, OpenTelemetry) live outside
# `everruns-core` (EVE-651) so core carries no exporter HTTP/telemetry deps and
# an exporter cannot panic core's init path. Depends on core only for the
# `EventListener` trait + event types.
# Decision (EVE-876): OpenTelemetry initialization (OTLP exporter wiring,
# tracing-subscriber layers, TelemetryConfig/TelemetryGuard) and the
# CompositeEventListener fan-out also live here. Core keeps only the neutral
# gen-AI span conventions; it carries no OTel SDK, OTLP, or subscriber deps.
# Guard: scripts/lib/check-observability-isolation.sh.

[package]
name = "everruns-observability"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-observability"
description = "Observability exporters (Braintrust, OpenTelemetry) for Everruns agents"
readme = "README.md"
keywords = ["agent", "llm", "observability", "opentelemetry", "braintrust"]
categories = ["development-tools::profiling", "asynchronous"]

[dependencies]
async-trait.workspace = true

# HTTP client (Braintrust delivery). Always-on, like the original core module.
reqwest = { workspace = true, features = ["json", "stream", "rustls", "blocking"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time and randomized jitter for Braintrust span ids / retries
chrono.workspace = true
rand.workspace = true

# Async runtime: delivery worker (rt), bounded queue (sync), batch flush (time)
tokio = { workspace = true, features = ["sync", "rt", "time"] }

# Tracing: OtelEventListener emits gen-AI spans; Braintrust logs delivery state
tracing.workspace = true

# OpenTelemetry SDK + OTLP exporter + tracing bridge (init_telemetry). Moved
# from core's `telemetry` feature (EVE-876) — this crate is the only workspace
# owner of the exporter dependency subtree.
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-otlp.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true

# Internal: EventListener trait + event types + gen-AI attribute constants.
# default-features = false sheds core's heavy optional subtrees (a2a,
# web-fetch) that the exporters do not need — they only use the always-on
# event/trait/telemetry-conventions surface.
everruns-core = { path = "../core", version = "0.18.0", default-features = false }
# Server/worker startup selects ring before observability or HTTP clients can
# initialize rustls. This keeps the concrete TLS choice outside core.
everruns-provider = { path = "../provider", version = "0.18.0", default-features = false, features = ["tls-ring"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
uuid.workspace = true
wiremock = "0.6"
insta = { version = "1.40", features = ["json", "redactions"] }
