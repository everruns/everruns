[package]
name = "everruns-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-host"
description = "Deprecated shim: use everruns-core host module"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "runtime"]
categories = ["development-tools", "asynchronous"]


[dependencies]
everruns-core = { workspace = true, default-features = false, features = ["host"] }
everruns = { workspace = true, default-features = false }

[features]
default = []
openai-agents-api = ["everruns-core/openai-agents-api"]
direct-egress = ["everruns-core/direct-egress"]
builtins = ["everruns/builtins"]
mcp = ["everruns-core/mcp"]
mcp-stdio = ["everruns-core/mcp-stdio"]
filesystem = ["everruns/filesystem"]
bashkit = ["everruns/bashkit"]
host-shell = ["everruns-core/host-shell"]
web-fetch = ["everruns/web-fetch"]
duckduckgo = ["everruns/duckduckgo"]
lua = ["everruns/lua"]
process = ["everruns-core/process"]
native-containment = ["everruns-core/native-containment"]
utility-llm = ["everruns/utility-llm"]
utility-openai = ["everruns/utility-openai"]
otel = ["everruns-core/otel"]
braintrust = ["everruns-core/braintrust"]
observability = ["everruns-core/observability"]

[lints]
workspace = true
