# Shared effectful host orchestration below the application-facing facade.
#
# This crate is published because published facades and compatibility adapters
# depend on it. It is not an application entrypoint: ordinary embedders use
# `everruns`, while worker/local and advanced hosts may use this boundary.

[package]
name = "everruns-host"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-host"
description = "Shared host orchestration for Everruns execution adapters"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "runtime"]
categories = ["development-tools", "asynchronous"]

[dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
ignore.workspace = true
reqwest = { workspace = true, optional = true, features = ["json", "stream", "rustls", "blocking"] }
regex.workspace = true
rand = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
tracing.workspace = true
uuid.workspace = true

everruns-core.workspace = true
everruns-capability.workspace = true
everruns-builtins = { workspace = true, optional = true }
everruns-engine.workspace = true
everruns-mcp = { workspace = true, optional = true }
everruns-provider.workspace = true
everruns-integrations-filesystem = { workspace = true, optional = true }
everruns-integrations-bashkit = { workspace = true, optional = true }
everruns-integrations-web-fetch = { workspace = true, optional = true }
everruns-integrations-duckduckgo = { workspace = true, optional = true }
everruns-integrations-lua = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
default = []
direct-egress = ["dep:reqwest"]
builtins = ["dep:everruns-builtins"]
mcp = ["dep:everruns-mcp", "direct-egress"]
mcp-stdio = ["mcp", "everruns-mcp/stdio"]
filesystem = ["dep:everruns-integrations-filesystem"]
bashkit = ["filesystem", "dep:everruns-integrations-bashkit", "direct-egress"]
web-fetch = ["dep:everruns-integrations-web-fetch", "direct-egress"]
duckduckgo = ["dep:everruns-integrations-duckduckgo", "direct-egress"]
lua = ["dep:everruns-integrations-lua", "direct-egress"]
process = []
utility-openai = ["everruns-provider/http"]
observability = [
    "direct-egress",
    "tokio/time",
    "everruns-provider/tls-ring",
    "dep:rand",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[[example]]
name = "real_disk_file_system_tools"
required-features = ["filesystem"]

[[example]]
name = "lua_code_mode_agent"
required-features = ["lua"]

[[test]]
name = "mcp_runtime_test"
required-features = ["mcp"]

[dev-dependencies]
everruns-builtins.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
# Deterministic simulator for host tests/examples. Version-less path
# dependency: stripped on publish, so the optional llmsim -> host edge does
# not create a published cycle.
everruns-llmsim = { version = "0.18.0", path = "../llmsim", features = ["host"] }
# Test doubles and demo fixtures.
everruns-test-support = { version = "0.18.0", path = "../test-support" }
wiremock = "0.6"
