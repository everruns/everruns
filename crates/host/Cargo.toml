[package]
name = "everruns-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-host"
description = "Deprecated shim: use everruns-core host module"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "runtime"]
categories = ["development-tools", "asynchronous"]


[dependencies]
everruns-core = { workspace = true, default-features = false, features = ["host"] }
everruns = { workspace = true, default-features = false }

[features]
default = []
openai-agents-api = ["direct-egress", "everruns-core/openai-agents-api"]
direct-egress = ["everruns-core/direct-egress"]
builtins = ["everruns/builtins"]
mcp = ["direct-egress", "everruns/mcp"]
mcp-stdio = ["mcp", "everruns/mcp-stdio"]
filesystem = ["everruns/filesystem"]
bashkit = ["filesystem", "direct-egress", "everruns/bashkit"]
host-shell = ["filesystem", "native-containment", "everruns/host-shell"]
web-fetch = ["direct-egress", "everruns/web-fetch"]
duckduckgo = ["direct-egress", "everruns/duckduckgo"]
lua = ["direct-egress", "everruns/lua"]
process = ["everruns-core/process"]
native-containment = ["process", "everruns-core/native-containment"]
utility-llm = ["everruns/utility-llm"]
utility-openai = ["utility-llm", "everruns/utility-openai"]
otel = ["everruns-core/otel"]
braintrust = ["direct-egress", "everruns-core/braintrust"]
observability = ["otel", "braintrust"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
