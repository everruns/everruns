# Google Gemini Provider Implementation
# Decision: Implements the core LlmDriver trait for Google Gemini API
# Decision: Uses Gemini's generateContent API with streaming support

[package]
name = "everruns-gemini"
readme = "README.md"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Google Gemini provider implementation for Everruns"
documentation = "https://docs.rs/everruns-gemini"

[dependencies]
# Core dependencies
async-trait.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# HTTP client
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Tracing
tracing.workspace = true

# Internal dependencies
everruns-core.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
