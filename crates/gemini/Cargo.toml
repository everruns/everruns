# Google Gemini Provider Implementation
# Decision: Implements the core LlmDriver trait for Google Gemini API
# Decision: Uses Gemini's generateContent API with streaming support

[package]
name = "everruns-gemini"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Google Gemini provider implementation for Everruns"

[dependencies]
# Core dependencies
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# HTTP client
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time
chrono.workspace = true

# Tracing
tracing.workspace = true

# Internal dependencies
everruns-core = { path = "../core" }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true
