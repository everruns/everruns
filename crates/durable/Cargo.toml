# Durable Execution Engine
#
# A PostgreSQL-backed workflow orchestration engine providing:
# - Event-sourced workflow persistence
# - Automatic retries with exponential backoff
# - Circuit breakers for external service protection
# - Distributed task queue with backpressure
#
# This crate is designed to be testable in isolation with comprehensive
# unit tests, integration tests, and load/stress tests.

[package]
name = "everruns-durable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-durable"
description = "PostgreSQL-backed durable execution for Everruns: event-sourced workflows, task queue, retries and schedules"
readme = "README.md"
keywords = ["durable", "workflow", "postgres", "task-queue", "orchestration"]
categories = ["asynchronous", "database", "development-tools"]
# Benchmark checkpoints and baselines are maintainer history (~1.3 MB) and
# never needed to build the crate. The bench sources stay packaged so the
# manifest's [[bench]] targets resolve.
exclude = ["benches/checkpoints/", "benches/baseline.jsonl"]

[dependencies]
# Decision: no `everruns-*` normal dependencies. This crate is a generic
# durable-execution engine; agent/turn semantics live in the worker and server.
# Enforced by `scripts/check-durable-isolation.sh`.

# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true

# Database
sqlx.workspace = true
rusqlite = { version = "0.39", features = ["bundled", "backup"], optional = true }

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# UUID and time
uuid.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Observability
tracing.workspace = true

# Utilities
rand.workspace = true
parking_lot = "0.12"
cron = "0.17"
hostname = "0.4"

# Benchmark support (`bench` feature only)
indicatif = { version = "0.18", optional = true }

# Fault injection (optional, zero-cost when disabled)
fail = { workspace = true, optional = true }

[dev-dependencies]
# Test-only drift guard: the local database-failure classifier must match the
# shared one in core, because dashboards key on its log fields (EVE-1071).
everruns-core.workspace = true
# Test-only: capturing log output is how `db_failure` proves every starved
# subsystem reports one incident under one message (EVE-1071).
tracing-subscriber.workspace = true

[features]
# Decision: the generic workflow executor is on by default, so `cargo add
# everruns-durable` gets the whole engine the README and crate docs describe.
# Everruns' own crates drive the task queue directly and never run it, so the
# workspace dependency sets `default-features = false` and they compile only the
# store, queue, reliability, scheduler and worker pool core.
default = ["workflows"]
# Experimental: the `Workflow`/`Activity` traits, `WorkflowExecutor` (timers,
# child workflows, system tasks) and `TimeoutManager`. Exercised
# by this crate's tests, benches and `examples/order_pipeline.rs`; no Everruns
# production path uses it.
workflows = []
sqlite = ["dep:rusqlite"]
failpoints = ["fail/failpoints"]
postgres-tests = []
# Metrics, reports and checkpoints used by the bench binaries. Not part of the
# supported API; off by default so library users do not pull in indicatif.
bench = ["dep:indicatif", "workflows"]

# The generic workflow executor's own suites. Store-only suites carry no
# feature requirement, so they also run under `--no-default-features`.
[[test]]
name = "timers_and_children_test"
required-features = ["workflows"]

[[test]]
name = "agent_reliability_test"
required-features = ["workflows"]

# An isolated consumer of the generic engine: no Everruns crate, memory store.
# `harness = false` runs `main`, so `cargo test --example order_pipeline` runs it
# to completion and fails on any assertion.
[[example]]
name = "order_pipeline"
required-features = ["workflows"]
harness = false

[[bench]]
name = "concurrent_workers"
harness = false
required-features = ["bench"]

[[bench]]
name = "workflow_throughput"
harness = false
required-features = ["bench"]

[[bench]]
name = "cold_start_latency"
harness = false
required-features = ["bench"]

[[bench]]
name = "db_concurrent_workers"
harness = false
required-features = ["bench"]

[[bench]]
name = "db_workflow_throughput"
harness = false
required-features = ["bench"]

[[bench]]
name = "db_cold_start_latency"
harness = false
required-features = ["bench"]
