# Durable Execution Engine
#
# A PostgreSQL-backed workflow orchestration engine providing:
# - Event-sourced workflow persistence
# - Automatic retries with exponential backoff
# - Circuit breakers for external service protection
# - Distributed task queue with backpressure
#
# This crate is designed to be testable in isolation with comprehensive
# unit tests, integration tests, and load/stress tests.

[package]
name = "everruns-durable"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
everruns-engine.workspace = true

# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true

# Database
sqlx.workspace = true

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# UUID and time
uuid.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Observability
tracing.workspace = true

# Utilities
rand.workspace = true
parking_lot = "0.12"
cron = "0.17"
hostname = "0.4"

# Benchmark support
sysinfo = "0.39"
indicatif = "0.18"

# Fault injection (optional, zero-cost when disabled)
fail = { workspace = true, optional = true }

[dev-dependencies]
everruns-provider.workspace = true

[features]
failpoints = ["fail/failpoints"]
postgres-tests = []

[[bench]]
name = "concurrent_workers"
harness = false

[[bench]]
name = "workflow_throughput"
harness = false

[[bench]]
name = "cold_start_latency"
harness = false

[[bench]]
name = "db_concurrent_workers"
harness = false

[[bench]]
name = "db_workflow_throughput"
harness = false

[[bench]]
name = "db_cold_start_latency"
harness = false
