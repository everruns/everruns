# Durable Execution Engine
#
# A PostgreSQL-backed workflow orchestration engine providing:
# - Event-sourced workflow persistence
# - Automatic retries with exponential backoff
# - Circuit breakers for external service protection
# - Distributed task queue with backpressure
#
# This crate is designed to be testable in isolation with comprehensive
# unit tests, integration tests, and load/stress tests.

[package]
name = "everruns-durable"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-durable"
description = "Generic PostgreSQL-backed durable workflow substrate for Everruns"
keywords = ["workflow", "postgresql", "durable", "distributed"]
categories = ["asynchronous", "database"]
exclude = ["benches/checkpoints/**"]

[dependencies]
# Async runtime
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait.workspace = true

# Database
sqlx.workspace = true

# Serialization
serde = { workspace = true }
serde_json.workspace = true

# UUID and time
uuid.workspace = true
chrono.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Observability
tracing.workspace = true

# Utilities
rand.workspace = true
parking_lot = "0.12"
cron = "0.17"
hostname = "0.4"

# Benchmark support
sysinfo = "0.39"
minijinja = { version = "2", optional = true }
indicatif = { version = "0.18", optional = true }

# Fault injection (optional, zero-cost when disabled)
fail = { workspace = true, optional = true }

[features]
failpoints = ["fail/failpoints"]
postgres-tests = []
benchmarks = ["dep:indicatif", "dep:minijinja"]

[[bench]]
name = "concurrent_workers"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "workflow_throughput"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "cold_start_latency"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "db_concurrent_workers"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "db_workflow_throughput"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "db_cold_start_latency"
harness = false
required-features = ["benchmarks"]
