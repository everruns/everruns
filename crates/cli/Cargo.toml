[package]
name = "everruns-cli"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-cli"
description = "Command-line interface for Everruns — run and manage agents from your terminal"
keywords = ["everruns", "agent", "agentic", "cli", "ai"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "everruns"
path = "src/main.rs"

[dependencies]
# CLI
clap.workspace = true

# Everruns SDK
everruns-sdk.workspace = true

# HTTP client (for endpoints not yet in SDK)
reqwest.workspace = true

# TLS crypto provider
rustls.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml = "0.8"

# Error handling
anyhow.workspace = true

# File sync dependencies
sha2.workspace = true
base64.workspace = true
chrono.workspace = true
notify.workspace = true
ignore.workspace = true

# Interactive prompts
dialoguer.workspace = true

# Browser launch
webbrowser.workspace = true

# XDG config directory
dirs.workspace = true

# Hostname resolution
hostname = "0.4"

[dev-dependencies]
tempfile.workspace = true
