# OpenUI Component Definitions and Prompt Generator
#
# Decision: Separate crate from core — reusable, matches crates/openai/ pattern.
# Decision: Static component definitions (no Zod runtime) — we only need prompt text generation.
# Decision: Component schemas mirror @openuidev/react-ui exactly for compatibility.
# Ref: https://github.com/thesysdev/openui (packages/react-ui/src/genui-lib/)

[package]
name = "everruns-openui"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-openui"
description = "OpenUI component definitions and prompt generator for Everruns agents"
readme = "README.md"
keywords = ["everruns", "openui", "agent", "ui", "llm"]
categories = ["development-tools"]

