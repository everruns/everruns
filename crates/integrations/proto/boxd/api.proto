// NOTE: the client-utilities DeviceBridge service lives in `device.proto`
// (same package) — deliberately out of this file so the SDK regen scripts,
// which compile only api.proto, never ship it in the TS/Python stubs.

message GetOrgMachineLimitRequest {
  string org_id = 1;  // name or id; "" = your home org (an API key's own org)
}

message GetOrgMachineLimitResponse {
  string org_id   = 1;
  string org_name = 2;
  uint32 max_vms  = 3;  // the machine limit
  uint32 vm_count = 4;  // machines that count against it now
  bool   is_owner = 5;  // the caller is the org's owner, who may ask for more
  // The open request for a higher limit, if any: when it was made (unix
  // seconds; 0 = none open) and the limit it asks for (0 when none is open,
  // or for a request that named no number).
  int64  requested_at      = 6;
  uint32 requested_max_vms = 7;
}

message RequestOrgMachineLimitRequest {
  string org_id = 1;  // name or id; "" = your home org (an API key's own org)
  // The new total limit wanted: above the current limit, at most 1000.
  uint32 max_vms = 2;
  // Why, optional; at most 1000 characters.
  string message = 3;
}

message RequestOrgMachineLimitResponse {
  int64  requested_at      = 1;  // unix seconds
  uint32 requested_max_vms = 2;
}

message ListRegionsRequest {
  string org_id = 1;  // name or id; "" = your default org (the one a list with no org shows; an API key's own org)
}

message Region {
  string id               = 1;  // a short code, e.g. "fra"
  string name             = 2;  // e.g. "Frankfurt"
  string zone             = 3;  // machines are reached at <name>.<zone>
  string api_endpoint     = 4;  // the region's API
  string console_endpoint = 5;
  double latitude         = 6;
  double longitude        = 7;
  bool   home             = 8;  // accounts, billing and settings live in the home region
  // For the org asked about: "enabled" (it can create here: always the
  // home region), "requested" (an admin asked), or "available".
  string org_state        = 9;
}

message ListRegionsResponse {
  repeated Region regions = 1;
  string org_id           = 2;
  // The region this endpoint serves; "" when boxd runs in one place.
  string this_region      = 3;
}

message RequestOrgRegionRequest {
  string org_id = 1;  // name or id; "" = your default org (the one a list with no org shows; an API key's own org)
  string region = 2;
}

message RequestOrgRegionResponse {
  string state = 1;  // "requested", or "enabled" when the org has it already
}

message FindElsewhereRequest {
  string kind = 1;  // machine, snapshot, disk or template
  string name = 2;
  string org  = 3;  // org context (name or id); empty = every org you belong to
}

message ElsewhereItem {
  string region = 1;
  string name   = 2;
  string org_id = 3;
  string id     = 4;
}

message RegionCount {
  string region = 1;
  uint64 count  = 2;
}

message FindElsewhereResponse {
  // The same name, in another region.
  repeated ElsewhereItem exact      = 1;
  // A name one or two letters off, in another region; a few at most.
  repeated ElsewhereItem close      = 2;
  // Regions that could not be asked just now.
  repeated string        unavailable = 3;
}
