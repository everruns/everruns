# Published integration implementations, organized by capability vendor.
[package]
name = "everruns-integrations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations"
description = "Everruns agent integrations, one feature per vendor"
keywords = ["everruns", "agents", "integrations"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"
build = "build.rs"

[package.metadata.docs.rs]
all-features = true

[package.metadata.cargo-machete]
ignored = ["prost", "protox", "tonic-prost", "tonic-prost-build", "connectrpc-build", "connectrpc", "buffa", "http-body"]

[features]
default = []
bashkit = ["dep:everruns-cli-contract", "dep:async-trait", "dep:bashkit", "dep:clap", "dep:serde_json", "dep:futures", "dep:tokio", "dep:tracing", "dep:url", "dep:everruns-contracts", "everruns-contracts/runtime"]
brave-search = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:chrono", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/definition", "everruns-contracts/runtime"]
browserless = ["dep:reqwest", "reqwest/brotli", "reqwest/deflate", "reqwest/gzip", "reqwest/zstd", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-native-certs", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:chrono", "dep:tracing", "dep:base64", "dep:flate2", "dep:url", "dep:everruns-contracts", "everruns-contracts/http", "everruns-contracts/runtime"]
cursor = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/runtime"]
daytona = ["dep:inventory", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:chrono", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/runtime", "everruns-contracts/session-sandbox"]
docker = ["dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:tracing", "dep:base64", "dep:everruns-contracts", "everruns-contracts/runtime"]
duckduckgo = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/runtime"]
e2b = ["dep:async-trait", "dep:base64", "dep:chrono", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tracing", "dep:urlencoding", "dep:http", "dep:http-body", "dep:futures", "dep:connectrpc", "dep:buffa", "dep:rustls", "dep:rustls-native-certs", "dep:tokio", "dep:everruns-contracts", "everruns-contracts/runtime", "dep:connectrpc-build", "dep:protox", "dep:prost"]
filesystem = ["dep:anyhow", "dep:async-trait", "dep:base64", "dep:globset", "dep:serde_json", "dep:sha2", "dep:hex", "dep:similar", "dep:everruns-contracts", "everruns-contracts/runtime"]
github = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tracing", "dep:base64", "dep:everruns-contracts", "everruns-contracts/definition", "everruns-contracts/runtime"]
lua = ["dep:async-trait", "dep:base64", "dep:mlua", "dep:serde_json", "dep:tokio", "dep:everruns-contracts", "everruns-contracts/runtime"]
openai-decisions = ["dep:everruns-drivers", "everruns-drivers/openai", "dep:async-trait", "dep:futures", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/runtime"]
openai-image = ["dep:reqwest", "dep:eventsource-stream", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:tokio", "dep:futures", "dep:base64", "dep:anyhow", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/http", "everruns-contracts/runtime"]
openrouter = ["dep:everruns-drivers", "everruns-drivers/openrouter", "dep:async-trait", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:everruns-contracts", "everruns-contracts/definition", "everruns-contracts/runtime"]
parallel = ["dep:reqwest", "dep:serde", "dep:serde_json", "dep:async-trait", "dep:everruns-contracts", "everruns-contracts/runtime"]
typesafe = ["dep:everruns-drivers", "everruns-drivers/typesafe", "everruns-drivers/openrouter", "dep:async-trait", "dep:futures", "dep:reqwest", "dep:serde", "dep:serde_json", "dep:thiserror", "dep:tokio", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/definition", "everruns-contracts/runtime"]
web-fetch = ["dep:async-trait", "dep:base64", "dep:bytes", "dep:ed25519-dalek", "dep:fetchkit", "dep:serde_json", "dep:futures", "dep:sha2", "dep:tracing", "dep:everruns-contracts", "everruns-contracts/runtime"]
modal = ["dep:inventory", "dep:async-trait", "dep:base64", "dep:chrono", "dep:futures", "dep:hyper-util", "dep:prost", "dep:serde", "dep:serde_json", "dep:tokio", "dep:tonic", "dep:tonic-prost", "dep:tracing", "dep:uuid", "dep:everruns-contracts", "everruns-contracts/runtime", "dep:protox", "dep:tonic-prost-build"]
brave-search-hosted = ["brave-search"]
brave-search-integration = ["brave-search"]
duckduckgo-integration = ["duckduckgo"]
parallel-integration = ["parallel"]
typesafe-hosted = ["typesafe", "dep:inventory"]
typesafe-integration = ["typesafe"]
typesafe-live-tests = ["typesafe"]
cursor-live-tests = ["cursor"]
daytona-live-tests = ["daytona", "dep:urlencoding"]
daytona-test-util = ["daytona"]
browserless-live-tests = ["browserless"]
e2b-live-tests = ["e2b"]
github-live-tests = ["github"]
openai-decisions-live-tests = ["openai-decisions"]
modal-live-tests = ["modal"]
modal-test-util = ["modal"]


[dependencies]
everruns-contracts = { workspace = true, default-features = false, optional = true }
anyhow = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
bashkit = { version = "0.18.1", default-features = false, features = ["aws-lc-rs", "bash_tool", "bot-auth", "http_client", "jq", "tzdata"], optional = true }
buffa = { version = "0.9", optional = true }
bytes = { version = "1", optional = true }
chrono = { workspace = true, optional = true }
clap = { workspace = true, features = ["string"], optional = true }
connectrpc = { version = "0.9.0", features = ["client", "client-tls"], optional = true }
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }
eventsource-stream = { workspace = true, optional = true }
everruns-cli-contract = { workspace = true, optional = true }
everruns-drivers = { workspace = true, default-features = false, optional = true }
fetchkit = { version = "=0.5.0", features = ["bot-auth"], optional = true }
flate2 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
globset = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
http = { version = "1", optional = true }
http-body = { version = "1", optional = true }
hyper-util = { version = "0.1.21", optional = true, default-features = false, features = ["client-legacy", "client-proxy", "http2", "tokio"] }
inventory = { workspace = true, optional = true }
mlua = { version = "0.12", features = ["async", "lua54", "send", "serialize", "vendored"], optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "multipart"], optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
similar = { version = "3", optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"], optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tonic = { workspace = true, optional = true, features = ["tls-native-roots", "tls-webpki-roots"] }
tonic-prost = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url = { version = "2", optional = true }
urlencoding = { version = "2", optional = true }
uuid = { workspace = true, optional = true }

[build-dependencies]
connectrpc-build = { version = "0.9.0", optional = true }
prost = { workspace = true, optional = true }
protox = { version = "0.9", optional = true }
tonic-prost-build = { workspace = true, optional = true }

[dev-dependencies]
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-stream = { workspace = true, features = ["net"] }
serde_json.workspace = true
wiremock = "0.6"
regex.workspace = true
fancy-regex = "0.19"
tempfile.workspace = true
everruns-core = { workspace = true, default-features = false, features = ["host", "direct-egress"] }

[lints]
workspace = true

