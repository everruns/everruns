# Internal Protocol (gRPC)
# Decision: gRPC for worker <-> control plane communication
# Decision: Uses tonic for gRPC
# Decision: Proto definitions mirror Rust types in core crate
#
# Proto regeneration: Types are auto-generated by tonic-build during `cargo build`.
# When you modify proto/worker.proto:
#   1. Edit the proto file
#   2. Run: cargo build -p everruns-internal-protocol
#   3. Rust types are regenerated automatically in target/debug/build/everruns-internal-protocol-*/out/
#   4. Update grpc_service.rs (server) and grpc_adapters.rs (worker) to use new types

[package]
name = "everruns-internal-protocol"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Internal gRPC protocol for Everruns worker-control plane communication"

[package.metadata.cargo-machete]
ignored = ["prost", "protox", "tonic-prost", "tonic-prost-build"]

[dependencies]
# gRPC
tonic.workspace = true
tonic-prost.workspace = true
prost.workspace = true
prost-types.workspace = true

# Internal dependencies
everruns-core = { path = "../core" }
everruns-provider.workspace = true
# Stored Agent records moved to everruns-platform (EVE-877); the worker wire
# still carries them between the two platform-side processes (server, worker).
everruns-platform = { path = "../platform" }

# Serialization (for JSON conversion)
serde.workspace = true
serde_json.workspace = true

# UUID and time
uuid.workspace = true
chrono.workspace = true

# Observability: make conversion data-loss visible instead of silent (EVE-652)
tracing.workspace = true

[dev-dependencies]
everruns-capability.workspace = true

[build-dependencies]
tonic-prost-build.workspace = true
protox = "0.9"

# EVE-642 evidence bench: session-task payload encode/decode, old JSON-in-protobuf
# path vs new native protobuf path. Custom main (harness = false), matching the
# durable-crate bench convention.
[[bench]]
name = "session_task_encoding"
harness = false
