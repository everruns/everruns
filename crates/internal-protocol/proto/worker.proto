// ============================================================================
// User connection token types
// ============================================================================

message GetConnectionTokenRequest {
    Uuid session_id = 1;
    string provider = 2;  // e.g. "github", "daytona", "gitlab"
}

message GetConnectionTokenResponse {
    optional string token = 1;  // Decrypted token, or None if not connected
}

message GetConnectionUserRequest {
    Uuid session_id = 1;
    string provider = 2;
}

message GetConnectionUserResponse {
    optional Uuid user_id = 1;
}

message GetConnectionTokenForUserRequest {
    Uuid user_id = 1;
    string provider = 2;
}

message GetConnectionTokenForUserResponse {
    optional string token = 1;
}

// ============================================================================
// Leased resource types
// ============================================================================

message LeasedResourceProto {
    Uuid id = 1;
    optional Uuid session_id = 2;
    string provider = 3;
    string resource_type = 4;
    string external_id = 5;
    optional string display_name = 6;
    string status = 7;
    optional Uuid owner_user_id = 8;
    uint32 lease_duration_seconds = 9;
    Timestamp last_touched_at = 10;
    Timestamp lease_expires_at = 11;
    optional Timestamp cleanup_started_at = 12;
    optional Timestamp cleanup_completed_at = 13;
    uint32 cleanup_attempts = 14;
    optional string last_cleanup_error = 15;
    optional google.protobuf.Struct metadata = 16;
    Timestamp created_at = 17;
    Timestamp updated_at = 18;
}

message UpsertLeasedResourceRequest {
    Uuid session_id = 1;
    string provider = 2;
    string resource_type = 3;
    string external_id = 4;
    optional string display_name = 5;
    optional Uuid owner_user_id = 6;
    uint32 lease_duration_seconds = 7;
    optional google.protobuf.Struct metadata = 8;
}

message UpsertLeasedResourceResponse {
    LeasedResourceProto resource = 1;
}

message ReleaseLeasedResourceRequest {
    Uuid session_id = 1;
    string provider = 2;
    string resource_type = 3;
    string external_id = 4;
}

message ReleaseLeasedResourceResponse {
    optional LeasedResourceProto resource = 1;
}

message ListSessionLeasedResourcesRequest {
    Uuid session_id = 1;
}

message ListSessionLeasedResourcesResponse {
    repeated LeasedResourceProto resources = 1;
}

message ClaimDueLeasedResourcesRequest {
    uint32 limit = 1;
    uint32 stale_after_seconds = 2;
}

message ClaimDueLeasedResourcesResponse {
    repeated LeasedResourceProto resources = 1;
}

message MarkLeasedResourceReleasedRequest {
    Uuid resource_id = 1;
    Timestamp expected_cleanup_started_at = 2;
}

message MarkLeasedResourceReleasedResponse {
    bool updated = 1;
}

message MarkLeasedResourceCleanupFailedRequest {
    Uuid resource_id = 1;
    Timestamp expected_cleanup_started_at = 2;
    uint32 retry_after_seconds = 3;
    string error = 4;
}

message MarkLeasedResourceCleanupFailedResponse {
    bool updated = 1;
}

// ============================================================================
// Session schedule types
// ============================================================================

message SessionScheduleProto {
    Uuid id = 1;
    Uuid session_id = 2;
    string description = 3;
    optional string cron_expression = 4;
    optional Timestamp scheduled_at = 5;
    string timezone = 6;
    string schedule_type = 7;  // "oneshot" or "recurring"
    bool enabled = 8;
    optional Timestamp next_trigger_at = 9;
    optional Timestamp last_triggered_at = 10;
    int32 trigger_count = 11;
    Timestamp created_at = 12;
    Timestamp updated_at = 13;
}

message CreateSessionScheduleRequest {
    Uuid session_id = 1;
    string description = 2;
    optional string cron_expression = 3;
    optional Timestamp scheduled_at = 4;
    string timezone = 5;
    int64 org_id = 6;
}

message CreateSessionScheduleResponse {
    SessionScheduleProto schedule = 1;
}

message CancelSessionScheduleRequest {
    Uuid session_id = 1;
    Uuid schedule_id = 2;
    int64 org_id = 3;
}

message CancelSessionScheduleResponse {
    SessionScheduleProto schedule = 1;
}

message ListSessionSchedulesRequest {
    Uuid session_id = 1;
    int64 org_id = 2;
}

message ListSessionSchedulesResponse {
    repeated SessionScheduleProto schedules = 1;
}

message CountActiveSessionSchedulesRequest {
    Uuid session_id = 1;
    int64 org_id = 2;
}

message CountActiveSessionSchedulesResponse {
    uint32 count = 1;
}

// ============================================================================
// Session SQL database types
// ============================================================================

// Database metadata (mirrors core::session_sqldb::DatabaseInfo)
message SessionSqlDbDatabaseInfo {
    string name = 1;
    int64 size_bytes = 2;
    int32 page_count = 3;
    Timestamp created_at = 4;
    Timestamp updated_at = 5;
}

// Column schema (mirrors core::session_sqldb::ColumnSchema)
message SessionSqlDbColumnSchema {
    string name = 1;
    string column_type = 2;
    bool notnull = 3;
    bool pk = 4;
    optional string default_value = 5;
}

// Table schema (mirrors core::session_sqldb::TableSchema)
message SessionSqlDbTableSchema {
    string name = 1;
    repeated SessionSqlDbColumnSchema columns = 2;
    int64 row_count = 3;
}

// === Create database ===

message SessionSqlDbCreateDatabaseRequest {
    Uuid session_id = 1;
    string name = 2;
}

message SessionSqlDbCreateDatabaseResponse {
    SessionSqlDbDatabaseInfo database = 1;
}

// === List databases ===

message SessionSqlDbListDatabasesRequest {
    Uuid session_id = 1;
}

message SessionSqlDbListDatabasesResponse {
    repeated SessionSqlDbDatabaseInfo databases = 1;
}

// === Get database ===

message SessionSqlDbGetDatabaseRequest {
    Uuid session_id = 1;
    string name = 2;
}

message SessionSqlDbGetDatabaseResponse {
    optional SessionSqlDbDatabaseInfo database = 1;
}

// === Delete database ===

message SessionSqlDbDeleteDatabaseRequest {
    Uuid session_id = 1;
    string name = 2;
}

message SessionSqlDbDeleteDatabaseResponse {
    bool deleted = 1;
}

// === Execute SQL (DDL/DML) ===

message SessionSqlDbExecuteRequest {
    Uuid session_id = 1;
    string db_name = 2;
    string sql = 3;
}

message SessionSqlDbExecuteResponse {
    uint64 rows_affected = 1;
}

// === Query SQL (read-only) ===

message SessionSqlDbQueryRequest {
    Uuid session_id = 1;
    string db_name = 2;
    string sql = 3;
}

message SessionSqlDbQueryResponse {
    repeated string columns = 1;
    // Rows encoded as JSON arrays (each row is a ListValue of column values)
    repeated google.protobuf.ListValue rows = 2;
    uint64 row_count = 3;
    bool truncated = 4;
}

// === Schema ===

message SessionSqlDbSchemaRequest {
    Uuid session_id = 1;
    string db_name = 2;
    optional string table = 3;
}

message SessionSqlDbSchemaResponse {
    repeated SessionSqlDbTableSchema tables = 1;
}

// ============================================================================
// Platform management types
// ============================================================================

// Simplified message for platform management (role + text + timestamp)
message PlatformMessage {
    string role = 1;
    string content = 2;
    Timestamp created_at = 3;
}

// === Harness operations ===

message PlatformListHarnessesRequest {
    int64 org_id = 1;
}

message PlatformListHarnessesResponse {
    repeated Harness harnesses = 1;
}

message PlatformCreateHarnessRequest {
    int64 org_id = 1;
    string name = 2;
    optional string description = 3;
    string system_prompt = 4;
    repeated string capabilities = 5;
    optional Uuid parent_harness_id = 6;
}

message PlatformCreateHarnessResponse {
    Harness harness = 1;
}

message PlatformUpdateHarnessRequest {
    int64 org_id = 1;
    Uuid harness_id = 2;
    optional string name = 3;
    optional string description = 4;
    optional string system_prompt = 5;
    optional Uuid parent_harness_id = 6;
    optional bool clear_parent_harness_id = 7;
}

message PlatformUpdateHarnessResponse {
    Harness harness = 1;
}

message PlatformDeleteHarnessRequest {
    int64 org_id = 1;
    Uuid harness_id = 2;
}

message PlatformDeleteHarnessResponse {}

message PlatformCopyHarnessRequest {
    int64 org_id = 1;
    Uuid harness_id = 2;
    optional string new_name = 3;
}

message PlatformCopyHarnessResponse {
    Harness harness = 1;
}

// === Agent operations ===

message PlatformListAgentsRequest {
    int64 org_id = 1;
}

message PlatformListAgentsResponse {
    repeated Agent agents = 1;
}

message PlatformCreateAgentRequest {
    int64 org_id = 1;
    string name = 2;
    optional string description = 3;
    string system_prompt = 4;
    repeated string capabilities = 5;
}

message PlatformCreateAgentResponse {
    Agent agent = 1;
}

message PlatformUpdateAgentRequest {
    int64 org_id = 1;
    Uuid agent_id = 2;
    optional string name = 3;
    optional string description = 4;
    optional string system_prompt = 5;
}

message PlatformUpdateAgentResponse {
    Agent agent = 1;
}

message PlatformDeleteAgentRequest {
    int64 org_id = 1;
    Uuid agent_id = 2;
}

message PlatformDeleteAgentResponse {}

// === Session operations ===

message PlatformListSessionsRequest {
    int64 org_id = 1;
    optional uint32 limit = 2;
    optional Uuid agent_id = 3;
}

message PlatformListSessionsResponse {
    repeated Session sessions = 1;
}

message PlatformCreateSessionRequest {
    int64 org_id = 1;
    Uuid harness_id = 2;
    optional Uuid agent_id = 3;
    optional string title = 4;
    optional string locale = 5;
    optional string blueprint_id = 6;
    optional string blueprint_config_json = 7;
}

message PlatformCreateSessionResponse {
    Session session = 1;
}

message PlatformDeleteSessionRequest {
    int64 org_id = 1;
    Uuid session_id = 2;
}

message PlatformDeleteSessionResponse {}

// === Messaging operations ===

message PlatformSendMessageRequest {
    int64 org_id = 1;
    Uuid session_id = 2;
    string content = 3;
}

message PlatformSendMessageResponse {}

message PlatformGetMessagesRequest {
    int64 org_id = 1;
    Uuid session_id = 2;
    optional uint32 limit = 3;
}

message PlatformGetMessagesResponse {
    repeated PlatformMessage messages = 1;
}

// === Turn management ===

message PlatformWaitForIdleRequest {
    int64 org_id = 1;
    Uuid session_id = 2;
    optional uint64 timeout_secs = 3;
}

message PlatformWaitForIdleResponse {
    string status = 1;
}

// === Capability discovery ===

message PlatformListCapabilitiesRequest {
    int64 org_id = 1;
    optional string search = 2;
}

message PlatformCapabilityInfo {
    string id = 1;
    string name = 2;
    string description = 3;
    string status = 4;
    optional string category = 5;
    optional string icon = 6;
    bool is_mcp = 7;
    bool is_skill = 8;
    uint32 tool_count = 9;
    repeated string tool_names = 10;
    repeated string dependencies = 11;
}

message PlatformListCapabilitiesResponse {
    repeated PlatformCapabilityInfo capabilities = 1;
}

// === Base URL ===

message PlatformGetBaseUrlRequest {}

message PlatformGetBaseUrlResponse {
    string base_url = 1;
}

// === Budget check messages ===

message CheckBudgetsForSessionRequest {
    int64 org_id = 1;
    string session_id = 2;
    optional string agent_id = 3;
}

message BudgetSummaryProto {
    string currency = 1;
    double limit = 2;
    double balance = 3;
    optional double soft_limit = 4;
    double percent_remaining = 5;
    string status = 6;
}

message CheckBudgetsForSessionResponse {
    string status = 1;
    repeated BudgetSummaryProto budgets = 2;
    optional string hint = 3;
}
