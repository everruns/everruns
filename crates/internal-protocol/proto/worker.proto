// Internal protocol for worker <-> control plane communication
// Decision: gRPC for worker communication (industry standard)
// Decision: Rust types in schemas crate are source of truth, proto mirrors them
// Decision: Batched RPCs for latency optimization (GetTurnContext, EmitEventStream)
// Decision: Use google.protobuf.Value/Struct for JSON values instead of strings

syntax = "proto3";

package everruns.internal;

import "google/protobuf/struct.proto";

// Service for workers to communicate with control plane
service WorkerService {
    // === Batched operations (latency optimized) ===

    // Get all context needed to start a turn (replaces 4 separate calls)
    // Combines: GetAgent + GetSession + LoadMessages + GetResolvedModel
    rpc GetTurnContext(GetTurnContextRequest) returns (GetTurnContextResponse);

    // Stream events to control plane (efficient bulk emission)
    rpc EmitEventStream(stream EmitEventRequest) returns (EmitEventStreamResponse);

    // === Individual operations (still available) ===

    // Agent operations
    rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);

    // Harness operations
    rpc GetHarness(GetHarnessRequest) returns (GetHarnessResponse);

    // Session operations
    rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
    rpc SetSessionStatus(SetSessionStatusRequest) returns (SetSessionStatusResponse);
    rpc SetSessionTitle(SetSessionTitleRequest) returns (SetSessionTitleResponse);
    // Message operations
    rpc GetMessage(GetMessageRequest) returns (GetMessageResponse);
    rpc LoadMessages(LoadMessagesRequest) returns (LoadMessagesResponse);
    rpc AddMessage(AddMessageRequest) returns (AddMessageResponse);
    rpc GetCompactionCheckpoint(GetCompactionCheckpointRequest) returns (GetCompactionCheckpointResponse);
    rpc InstallCompactionCheckpoint(InstallCompactionCheckpointRequest) returns (InstallCompactionCheckpointResponse);

    // Event operations
    rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);
    rpc CommitExec(CommitExecRequest) returns (CommitExecResponse);

    // LLM Provider operations
    rpc GetResolvedModel(GetResolvedModelRequest) returns (GetResolvedModelResponse);
    rpc GetDefaultModel(GetDefaultModelRequest) returns (GetDefaultModelResponse);

    // Session file operations (virtual filesystem)
    rpc SessionReadFile(SessionReadFileRequest) returns (SessionReadFileResponse);
    rpc SessionWriteFile(SessionWriteFileRequest) returns (SessionWriteFileResponse);
    rpc SessionWriteFileIfContentMatches(SessionWriteFileIfContentMatchesRequest) returns (SessionWriteFileIfContentMatchesResponse);
    rpc SessionDeleteFile(SessionDeleteFileRequest) returns (SessionDeleteFileResponse);
    rpc SessionListDirectory(SessionListDirectoryRequest) returns (SessionListDirectoryResponse);
    rpc SessionStatFile(SessionStatFileRequest) returns (SessionStatFileResponse);
    rpc SessionGrepFiles(SessionGrepFilesRequest) returns (SessionGrepFilesResponse);
    rpc SessionCreateDirectory(SessionCreateDirectoryRequest) returns (SessionCreateDirectoryResponse);

    // === Durable execution operations ===
    // These operations allow workers to interact with the durable task queue
    // without direct database access

    // Create a new durable workflow instance
    rpc CreateDurableWorkflow(CreateDurableWorkflowRequest) returns (CreateDurableWorkflowResponse);

    // Get workflow status
    rpc GetDurableWorkflowStatus(GetDurableWorkflowStatusRequest) returns (GetDurableWorkflowStatusResponse);

    // Update workflow status
    rpc UpdateDurableWorkflowStatus(UpdateDurableWorkflowStatusRequest) returns (UpdateDurableWorkflowStatusResponse);

    // Enqueue a task to the durable task queue
    rpc EnqueueDurableTask(EnqueueDurableTaskRequest) returns (EnqueueDurableTaskResponse);

    // Claim tasks from the queue (for worker polling)
    rpc ClaimDurableTasks(ClaimDurableTasksRequest) returns (ClaimDurableTasksResponse);

    // Complete a task successfully
    rpc CompleteDurableTask(CompleteDurableTaskRequest) returns (CompleteDurableTaskResponse);

    // Fail a task
    rpc FailDurableTask(FailDurableTaskRequest) returns (FailDurableTaskResponse);

    // Send heartbeat for a claimed task
    rpc HeartbeatDurableTask(HeartbeatDurableTaskRequest) returns (HeartbeatDurableTaskResponse);

    // Count active (non-terminal) workflows
    rpc CountActiveDurableWorkflows(CountActiveDurableWorkflowsRequest) returns (CountActiveDurableWorkflowsResponse);

    // Send a signal to a running workflow (e.g. user_message steering)
    rpc SendDurableWorkflowSignal(SendDurableWorkflowSignalRequest) returns (SendDurableWorkflowSignalResponse);

    // Get and consume pending signals for a workflow
    rpc GetAndConsumeDurableWorkflowSignals(GetAndConsumeDurableWorkflowSignalsRequest) returns (GetAndConsumeDurableWorkflowSignalsResponse);

    // Register a durable worker
    rpc RegisterDurableWorker(RegisterDurableWorkerRequest) returns (RegisterDurableWorkerResponse);

    // Heartbeat for a durable worker (keeps worker alive)
    rpc HeartbeatDurableWorker(HeartbeatDurableWorkerRequest) returns (HeartbeatDurableWorkerResponse);

    // Deregister a durable worker
    rpc DeregisterDurableWorker(DeregisterDurableWorkerRequest) returns (DeregisterDurableWorkerResponse);

    // === Circuit breaker operations ===
    // Used by workers to check circuit breaker state before external calls

    // Check if a circuit breaker allows the call
    rpc CheckCircuitBreaker(CheckCircuitBreakerRequest) returns (CheckCircuitBreakerResponse);

    // Record a successful call (circuit breaker tracking)
    rpc RecordCircuitBreakerSuccess(RecordCircuitBreakerSuccessRequest) returns (RecordCircuitBreakerSuccessResponse);

    // Record a failed call (circuit breaker tracking)
    rpc RecordCircuitBreakerFailure(RecordCircuitBreakerFailureRequest) returns (RecordCircuitBreakerFailureResponse);

    // === Push-based task notifications ===
    // Stream task availability notifications to workers for low-latency task pickup
    // Workers subscribe with their activity types and receive notifications when tasks become available
    rpc SubscribeTaskNotifications(SubscribeTaskNotificationsRequest) returns (stream TaskNotification);

    // === Image resolution operations ===
    // Used to resolve image_file content parts to actual image data for LLM calls

    // Resolve a single image by ID (returns base64 + media_type)
    rpc ResolveImage(ResolveImageRequest) returns (ResolveImageResponse);

    // Resolve multiple images in a batch (more efficient for multimodal messages)
    rpc ResolveImages(ResolveImagesRequest) returns (ResolveImagesResponse);

    // Persist and read image artifacts for tool-side image generation/editing.
    rpc CreateImageArtifact(CreateImageArtifactRequest) returns (CreateImageArtifactResponse);
    rpc GetImageArtifact(GetImageArtifactRequest) returns (GetImageArtifactResponse);
    rpc GetImageArtifactInfo(GetImageArtifactInfoRequest) returns (GetImageArtifactInfoResponse);

    // Resolve default provider credentials for tool-side API clients.
    rpc GetDefaultProviderCredentials(GetDefaultProviderCredentialsRequest) returns (GetDefaultProviderCredentialsResponse);

    // === MCP server operations ===
    // Get MCP server info by name prefix (for tool execution)
    rpc GetMcpServerByPrefix(GetMcpServerByPrefixRequest) returns (GetMcpServerByPrefixResponse);

    // === User connection token resolution ===
    // Resolve user connection tokens (e.g. GitHub, Daytona) lazily at tool execution time
    // Server-side decrypts stored tokens or mints fresh GitHub App tokens
    rpc GetConnectionToken(GetConnectionTokenRequest) returns (GetConnectionTokenResponse);
    rpc GetConnectionUser(GetConnectionUserRequest) returns (GetConnectionUserResponse);
    rpc GetConnectionTokenForUser(GetConnectionTokenForUserRequest) returns (GetConnectionTokenForUserResponse);

    // === Leased resource operations ===
    // Generic resource leases for provider-owned remote state that needs cleanup.
    rpc UpsertLeasedResource(UpsertLeasedResourceRequest) returns (UpsertLeasedResourceResponse);
    rpc ReleaseLeasedResource(ReleaseLeasedResourceRequest) returns (ReleaseLeasedResourceResponse);
    rpc ListSessionLeasedResources(ListSessionLeasedResourcesRequest) returns (ListSessionLeasedResourcesResponse);
    rpc ClaimDueLeasedResources(ClaimDueLeasedResourcesRequest) returns (ClaimDueLeasedResourcesResponse);
    rpc MarkLeasedResourceReleased(MarkLeasedResourceReleasedRequest) returns (MarkLeasedResourceReleasedResponse);
    rpc MarkLeasedResourceCleanupFailed(MarkLeasedResourceCleanupFailedRequest) returns (MarkLeasedResourceCleanupFailedResponse);

    // === Session resource registry ===
    // Generic registry of active resources (sandboxes, subagents, etc.)
    rpc RegisterSessionResource(RegisterSessionResourceRequest) returns (RegisterSessionResourceResponse);
    rpc UpdateSessionResourceStatus(UpdateSessionResourceStatusRequest) returns (UpdateSessionResourceStatusResponse);
    rpc ListSessionResources(ListSessionResourcesRequest) returns (ListSessionResourcesResponse);
    rpc DeregisterSessionResource(DeregisterSessionResourceRequest) returns (DeregisterSessionResourceResponse);

    // === Session task registry ===
    // Background work owned by a session (knowledge/runtime-resources/session-tasks.md).
    // Task and message payloads travel as native protobuf messages (EVE-642):
    // serialized once by protobuf framing, consumed directly on the worker.
    // Lifecycle invariants stay defined in one place (everruns-core).
    rpc CreateSessionTask(CreateSessionTaskRequest) returns (SessionTaskResponse);
    rpc UpdateSessionTask(UpdateSessionTaskRequest) returns (OptionalSessionTaskResponse);
    rpc GetSessionTask(GetSessionTaskRequest) returns (OptionalSessionTaskResponse);
    rpc ListSessionTasks(ListSessionTasksRequest) returns (ListSessionTasksResponse);
    rpc RequestCancelSessionTask(RequestCancelSessionTaskRequest) returns (OptionalSessionTaskResponse);
    rpc RecordSessionTaskMessage(RecordSessionTaskMessageRequest) returns (SessionTaskMessageResponse);
    rpc ListSessionTaskMessages(ListSessionTaskMessagesRequest) returns (ListSessionTaskMessagesResponse);

    // List (session_id, task_id) pairs for tasks with a stale heartbeat, so
    // gRPC workers can run the session_task_reaper durable activity.
    rpc ListOrphanedSessionTasks(ListOrphanedSessionTasksRequest) returns (ListOrphanedSessionTasksResponse);

    // Prune a bounded batch of terminal session tasks older than the TTL,
    // deleting their rows, messages, and result_path artifacts server-side
    // (where the storage backend / blob store lives), so gRPC workers can run
    // the retention pass of the session_task_reaper activity (EVE-580).
    rpc PruneTerminalSessionTasks(PruneTerminalSessionTasksRequest) returns (PruneTerminalSessionTasksResponse);

    // === Session schedule operations ===
    // CRUD for session-scoped scheduled tasks (one-shot and recurring cron)
    rpc CreateSessionSchedule(CreateSessionScheduleRequest) returns (CreateSessionScheduleResponse);
    rpc CancelSessionSchedule(CancelSessionScheduleRequest) returns (CancelSessionScheduleResponse);
    rpc ListSessionSchedules(ListSessionSchedulesRequest) returns (ListSessionSchedulesResponse);
    rpc CountActiveSessionSchedules(CountActiveSessionSchedulesRequest) returns (CountActiveSessionSchedulesResponse);
    rpc CountActiveOrgSchedules(CountActiveOrgSchedulesRequest) returns (CountActiveOrgSchedulesResponse);

    // === Session storage operations ===
    // Key/value and secret storage for session-scoped data

    // Set a key/value pair (creates or updates)
    rpc SessionStorageSetValue(SessionStorageSetValueRequest) returns (SessionStorageSetValueResponse);

    // Get a value by key
    rpc SessionStorageGetValue(SessionStorageGetValueRequest) returns (SessionStorageGetValueResponse);

    // Delete a key/value pair
    rpc SessionStorageDeleteValue(SessionStorageDeleteValueRequest) returns (SessionStorageDeleteValueResponse);

    // List all keys in a session
    rpc SessionStorageListKeys(SessionStorageListKeysRequest) returns (SessionStorageListKeysResponse);

    // Set a secret (encrypted at rest)
    rpc SessionStorageSetSecret(SessionStorageSetSecretRequest) returns (SessionStorageSetSecretResponse);

    // Get a secret by name (decrypted)
    rpc SessionStorageGetSecret(SessionStorageGetSecretRequest) returns (SessionStorageGetSecretResponse);

    // Delete a secret
    rpc SessionStorageDeleteSecret(SessionStorageDeleteSecretRequest) returns (SessionStorageDeleteSecretResponse);

    // List all secret names in a session (without values)
    rpc SessionStorageListSecrets(SessionStorageListSecretsRequest) returns (SessionStorageListSecretsResponse);

    // === Session SQL database operations ===
    // Session-scoped SQL databases (SQLite over PostgreSQL VFS)

    // Create a named database in a session
    rpc SessionSqlDbCreateDatabase(SessionSqlDbCreateDatabaseRequest) returns (SessionSqlDbCreateDatabaseResponse);

    // List all databases for a session
    rpc SessionSqlDbListDatabases(SessionSqlDbListDatabasesRequest) returns (SessionSqlDbListDatabasesResponse);

    // Get metadata for a specific database
    rpc SessionSqlDbGetDatabase(SessionSqlDbGetDatabaseRequest) returns (SessionSqlDbGetDatabaseResponse);

    // Delete a database and all its pages
    rpc SessionSqlDbDeleteDatabase(SessionSqlDbDeleteDatabaseRequest) returns (SessionSqlDbDeleteDatabaseResponse);

    // Execute DDL/DML SQL (auto-creates database if needed)
    rpc SessionSqlDbExecute(SessionSqlDbExecuteRequest) returns (SessionSqlDbExecuteResponse);

    // Execute read-only SQL query
    rpc SessionSqlDbQuery(SessionSqlDbQueryRequest) returns (SessionSqlDbQueryResponse);

    // Get schema for tables in a database
    rpc SessionSqlDbSchema(SessionSqlDbSchemaRequest) returns (SessionSqlDbSchemaResponse);

    // === Platform management operations ===
    // Used by the platform_management capability tools to manage org-wide entities
    // via gRPC workers (mirrors PlatformStore trait in core)

    // Generic domain command transport for inventory-registered CRUD.
    rpc ExecuteCommand(ExecuteCommandRequest) returns (ExecuteCommandResponse);
    rpc ListCommands(ListCommandsRequest) returns (ListCommandsResponse);
    rpc InvokePlatformCommandSurface(InvokePlatformCommandSurfaceRequest) returns (InvokePlatformCommandSurfaceResponse);

    // Harness operations
    rpc PlatformListHarnesses(PlatformListHarnessesRequest) returns (PlatformListHarnessesResponse);
    rpc PlatformCreateHarness(PlatformCreateHarnessRequest) returns (PlatformCreateHarnessResponse);
    rpc PlatformUpdateHarness(PlatformUpdateHarnessRequest) returns (PlatformUpdateHarnessResponse);
    rpc PlatformDeleteHarness(PlatformDeleteHarnessRequest) returns (PlatformDeleteHarnessResponse);
    rpc PlatformCopyHarness(PlatformCopyHarnessRequest) returns (PlatformCopyHarnessResponse);

    // Agent operations
    rpc PlatformListAgents(PlatformListAgentsRequest) returns (PlatformListAgentsResponse);
    rpc PlatformCreateAgent(PlatformCreateAgentRequest) returns (PlatformCreateAgentResponse);
    rpc PlatformUpdateAgent(PlatformUpdateAgentRequest) returns (PlatformUpdateAgentResponse);
    rpc PlatformDeleteAgent(PlatformDeleteAgentRequest) returns (PlatformDeleteAgentResponse);

    // Session operations
    rpc PlatformListSessions(PlatformListSessionsRequest) returns (PlatformListSessionsResponse);
    rpc PlatformCreateSession(PlatformCreateSessionRequest) returns (PlatformCreateSessionResponse);
    rpc PlatformDeleteSession(PlatformDeleteSessionRequest) returns (PlatformDeleteSessionResponse);

    // Messaging operations
    rpc PlatformSendMessage(PlatformSendMessageRequest) returns (PlatformSendMessageResponse);
    rpc PlatformGetMessages(PlatformGetMessagesRequest) returns (PlatformGetMessagesResponse);
    rpc InvokeScheduledAppChannel(InvokeScheduledAppChannelRequest) returns (InvokeScheduledAppChannelResponse);
    rpc InvokeAgentTrigger(InvokeAgentTriggerRequest) returns (InvokeAgentTriggerResponse);

    // Turn management
    rpc PlatformWaitForIdle(PlatformWaitForIdleRequest) returns (PlatformWaitForIdleResponse);

    // Capability discovery
    rpc PlatformListCapabilities(PlatformListCapabilitiesRequest) returns (PlatformListCapabilitiesResponse);

    // Base URL for UI links
    rpc PlatformGetBaseUrl(PlatformGetBaseUrlRequest) returns (PlatformGetBaseUrlResponse);

    // === Budget and rate-limit operations ===
    // Check budget status for a session (used by check_budget tool)
    rpc CheckBudgetsForSession(CheckBudgetsForSessionRequest) returns (CheckBudgetsForSessionResponse);

    // Gate outbound tool calls through the control-plane org rate limiter.
    rpc CheckOutboundToolRateLimit(CheckOutboundToolRateLimitRequest) returns (CheckOutboundToolRateLimitResponse);

    // === Machine payment operations ===
    // Execute a paid capability request through the control-plane payment authority.
    rpc ExecuteMachinePayment(ExecuteMachinePaymentRequest) returns (ExecuteMachinePaymentResponse);

    // Authorize detached peer-session creation as the current session owner.
    rpc AuthorizeSessionCreation(AuthorizeSessionCreationRequest) returns (AuthorizeSessionCreationResponse);
}

// ============================================================================
// Common types
// ============================================================================

message Uuid {
    string value = 1;
}

message Timestamp {
    int64 seconds = 1;
    int32 nanos = 2;
}

// ============================================================================
// Batched context request/response
// ============================================================================

message GetTurnContextRequest {
    Uuid session_id = 1;
    // Organization ID for resource validation
    int64 org_id = 2;
    // Max messages to return (most recent N). 0 = use server default.
    optional int32 message_limit = 3;
}

message GetTurnContextResponse {
    Agent agent = 1;
    Session session = 2;
    repeated Message messages = 3;
    ResolvedModel model = 4;
    // MCP tool definitions from agent's MCP capabilities
    // These are pre-resolved to avoid MCP capability lookup in worker
    repeated McpToolDef mcp_tool_definitions = 5;
    // Harness for this session (always present)
    optional Harness harness = 6;
    // True when older messages were truncated to stay within limit
    bool messages_truncated = 7;
}

// MCP tool definition for passing to worker
// Contains the prefixed name and schema ready for LLM
message McpToolDef {
    string name = 1;  // Prefixed: mcp_{server_name}_{tool_name}
    string description = 2;
    google.protobuf.Struct parameters = 3;  // JSON Schema
    string capability_id = 4;  // Virtual capability that contributed this tool
    string capability_name = 5;
}

// ============================================================================
// Agent types
// ============================================================================

message Agent {
    Uuid id = 1;
    string name = 2;
    string description = 3;
    string system_prompt = 4;
    optional Uuid default_model_id = 5;
    optional float temperature = 6;
    optional uint32 max_tokens = 7;
    string status = 8;
    Timestamp created_at = 9;
    Timestamp updated_at = 10;
    repeated string capability_ids = 11;
    optional string display_name = 12;
    optional bool parallel_tool_calls = 13;
    optional Uuid harness_id = 14;
    // Full JSON-encoded AgentCapabilityConfig values. Workers prefer this
    // field; capability_ids remains for compatibility with older workers.
    repeated string capabilities = 15;
}

message GetAgentRequest {
    Uuid agent_id = 1;
    // Organization ID for resource validation
    int64 org_id = 2;
}

message GetAgentResponse {
    optional Agent agent = 1;
}

// ============================================================================
// Harness types
// ============================================================================

message Harness {
    Uuid id = 1;
    string name = 2;
    string description = 3;
    string system_prompt = 4;
    optional Uuid default_model_id = 5;
    string status = 6;
    Timestamp created_at = 7;
    Timestamp updated_at = 8;
    repeated string capability_ids = 9;
    repeated string tags = 10;
    optional Uuid parent_harness_id = 11;
    bool is_built_in = 12;
    optional string display_name = 13;
    // Full JSON-encoded AgentCapabilityConfig values. Workers prefer this
    // field; capability_ids remains for compatibility with older workers.
    repeated string capabilities = 14;
}

message GetHarnessRequest {
    Uuid harness_id = 1;
    int64 org_id = 2;
}

message GetHarnessResponse {
    optional Harness harness = 1;
}

// ============================================================================
// Session types
// ============================================================================

message Session {
    Uuid id = 1;
    optional Uuid agent_id = 2;
    string title = 3;
    string status = 4;
    Timestamp created_at = 5;
    Timestamp updated_at = 6;
    optional Uuid default_model_id = 7;
    // Organization public ID (format: org_{32-hex})
    string organization_id = 8;
    // Session-level capabilities (JSON-encoded AgentCapabilityConfig)
    repeated string capabilities = 9;
    // Harness ID (required for sessions)
    optional Uuid harness_id = 10;
    // Session locale (BCP 47, e.g. "uk-UA")
    string locale = 11;
    // Session tags (used for routing and channel-specific behavior)
    repeated string tags = 12;
    // Session-level client hints (JSON-encoded HashMap<String, Value>)
    optional google.protobuf.Struct hints = 13;
    // Session-level system prompt override (prepended to agent prompt)
    optional string system_prompt = 14;
    // Session-level initial files (JSON-encoded Vec<InitialFile>)
    string initial_files_json = 15;
    // Principal that owns the session for authorization and attribution
    optional Uuid owner_principal_id = 16;
    // Resolved user owner, when the principal ultimately maps to a user
    optional Uuid resolved_owner_user_id = 17;
    // Captured immutable agent version for runtime provenance
    optional Uuid agent_version_id = 18;
    // Parent session ID for subagent and agent handoff sessions (depth tracking).
    optional Uuid parent_session_id = 19;
    optional string blueprint_id = 23;
    optional string blueprint_config_json = 24;
    optional bool parallel_tool_calls = 25;
    optional string goal = 26;
}

message GetSessionRequest {
    Uuid session_id = 1;
    // Organization ID for resource validation
    int64 org_id = 2;
}

message GetSessionResponse {
    optional Session session = 1;
}

message SetSessionStatusRequest {
    Uuid session_id = 1;
    string status = 2;  // "started", "active", "idle"
    // Organization ID for resource validation
    int64 org_id = 3;
}

message SetSessionStatusResponse {
    Session session = 1;
}

message SetSessionTitleRequest {
    Uuid session_id = 1;
    string title = 2;
    // Organization ID for resource validation
    int64 org_id = 3;
}

message SetSessionTitleResponse {
    Session session = 1;
}

// ============================================================================
// Message types
// ============================================================================

message Message {
    Uuid id = 1;
    string role = 2;
    google.protobuf.ListValue content = 3;  // `Vec<ContentPart>`
    optional google.protobuf.Struct controls = 4;  // Controls object
    optional google.protobuf.Struct metadata = 5;  // metadata object
    Timestamp created_at = 6;
    // 7, 8: retired flat `thinking` / `thinking_signature`. Reasoning is now an
    // ordered `reasoning` content part inside `content`, so each artifact keeps
    // its own signature, id and position.
    reserved 7, 8;
    reserved "thinking", "thinking_signature";
    // External actor identity (for messages from external channels like Slack)
    optional google.protobuf.Struct external_actor = 9;
    // Execution phase: "commentary" or "final_answer". Carried across the
    // worker boundary so the classification survives to the API.
    optional string phase = 10;
    // Where `phase` came from: "provider" or "derived". Travels with the phase
    // for the same reason — a derived phase is only `has_tool_calls`, and a
    // consumer cannot tell that from the value alone.
    optional string phase_source = 11;
}

message GetMessageRequest {
    Uuid session_id = 1;
    Uuid message_id = 2;
}

message GetMessageResponse {
    optional Message message = 1;
}

message LoadMessagesRequest {
    Uuid session_id = 1;
    optional int32 message_limit = 2;
    optional int64 after_sequence = 3;
}

message LoadMessagesResponse {
    repeated Message messages = 1;
    int32 total_count = 2;
    optional int64 source_sequence = 3;
}

message CompactionCheckpoint {
    Uuid id = 1;
    Uuid session_id = 2;
    int64 source_sequence = 3;
    string provider_type = 4;
    string model = 5;
    uint32 format_version = 6;
    bytes payload_json = 7;
}

message GetCompactionCheckpointRequest {
    Uuid session_id = 1;
    string provider_type = 2;
    string model = 3;
}

message GetCompactionCheckpointResponse {
    optional CompactionCheckpoint checkpoint = 1;
}

message InstallCompactionCheckpointRequest {
    CompactionCheckpoint checkpoint = 1;
}

message InstallCompactionCheckpointResponse {
    bool installed = 1;
}

message AddMessageRequest {
    Uuid session_id = 1;
    string role = 2;
    google.protobuf.ListValue content = 3;
    optional google.protobuf.Struct controls = 4;
    optional google.protobuf.Struct metadata = 5;
    repeated string tags = 6;
}

message AddMessageResponse {
    Message message = 1;
}

// ============================================================================
// Event types
// ============================================================================

// EventRequest - input type for event ingestion (no id or sequence)
// Data is untyped Struct - deserialized based on event_type field
message EventRequest {
    string event_type = 1;
    Timestamp ts = 2;
    EventContext context = 3;
    google.protobuf.Struct data = 4;  // Event-specific payload (deserialized based on event_type)
    optional google.protobuf.Struct metadata = 5;  // Optional metadata object
    repeated string tags = 6;  // Optional tags
}

// Event - stored event with id and sequence assigned by storage
message Event {
    Uuid id = 1;
    string event_type = 2;
    Timestamp ts = 3;
    EventContext context = 4;
    google.protobuf.Struct data = 5;  // Event-specific payload (deserialized based on event_type)
    optional google.protobuf.Struct metadata = 6;  // Optional metadata object
    repeated string tags = 7;  // Optional tags
    int32 sequence = 8;  // Sequence number within session (always set for stored events)
}

message EventContext {
    Uuid session_id = 1;
    optional Uuid turn_id = 2;
    optional Uuid input_message_id = 3;
    optional Uuid exec_id = 4;  // For idempotency
    // OTel-style trace/span fields for observability
    optional string trace_id = 5;
    optional string span_id = 6;
    optional string parent_span_id = 7;
}

message EmitEventRequest {
    EventRequest event = 1;
}

message EmitEventResponse {
    Event event = 1;  // The stored event with id and sequence
}

message EmitEventStreamResponse {
    int32 events_processed = 1;
}

// Commit an execution ID to prevent duplicate processing on retry
message CommitExecRequest {
    Uuid session_id = 1;
    Uuid exec_id = 2;
}

message CommitExecResponse {
    bool committed = 1;  // true if this was a new commit, false if already committed
}

// ============================================================================
// LLM Provider types
// ============================================================================

message ResolvedModel {
    string model = 1;
    string provider_id = 2;
    reserved 3, 4;
    string provider_type = 5;
}

message GetResolvedModelRequest {
    Uuid model_id = 1;
    // Organization ID for resource validation
    int64 org_id = 2;
}

message GetResolvedModelResponse {
    optional ResolvedModel model = 1;
}

message GetDefaultModelRequest {
    // Organization ID for resource scoping
    int64 org_id = 1;
}

message GetDefaultModelResponse {
    optional ResolvedModel model = 1;
}

// ============================================================================
// Session file types (virtual filesystem)
// ============================================================================

message SessionFile {
    Uuid id = 1;
    Uuid session_id = 2;
    string path = 3;
    string name = 4;
    optional string content = 5;
    string encoding = 6;
    bool is_directory = 7;
    bool is_readonly = 8;
    int64 size_bytes = 9;
    Timestamp created_at = 10;
    Timestamp updated_at = 11;
}

message FileInfo {
    Uuid id = 1;
    Uuid session_id = 2;
    string path = 3;
    string name = 4;
    bool is_directory = 5;
    bool is_readonly = 6;
    int64 size_bytes = 7;
    Timestamp created_at = 8;
    Timestamp updated_at = 9;
}

message FileStat {
    string path = 1;
    string name = 2;
    bool is_directory = 3;
    bool is_readonly = 4;
    int64 size_bytes = 5;
    Timestamp created_at = 6;
    Timestamp updated_at = 7;
}

message GrepMatch {
    string path = 1;
    uint64 line_number = 2;
    string line = 3;
}

message GrepContextLine {
    uint64 line_number = 1;
    string line = 2;
    bool is_match = 3;
}

message GrepContextBlock {
    string path = 1;
    uint64 start_line = 2;
    uint64 end_line = 3;
    repeated uint64 match_line_numbers = 4;
    repeated GrepContextLine lines = 5;
}

message SessionReadFileRequest {
    Uuid session_id = 1;
    string path = 2;
}

message SessionReadFileResponse {
    optional SessionFile file = 1;
}

message SessionWriteFileRequest {
    Uuid session_id = 1;
    string path = 2;
    string content = 3;
    string encoding = 4;
}

message SessionWriteFileResponse {
    SessionFile file = 1;
}

message SessionWriteFileIfContentMatchesRequest {
    Uuid session_id = 1;
    string path = 2;
    string expected_content = 3;
    string expected_encoding = 4;
    string content = 5;
    string encoding = 6;
}

message SessionWriteFileIfContentMatchesResponse {
    optional SessionFile file = 1;
}

message SessionDeleteFileRequest {
    Uuid session_id = 1;
    string path = 2;
    bool recursive = 3;
}

message SessionDeleteFileResponse {
    bool deleted = 1;
}

message SessionListDirectoryRequest {
    Uuid session_id = 1;
    string path = 2;
}

message SessionListDirectoryResponse {
    repeated FileInfo files = 1;
}

message SessionStatFileRequest {
    Uuid session_id = 1;
    string path = 2;
}

message SessionStatFileResponse {
    optional FileStat stat = 1;
}

message SessionGrepFilesRequest {
    Uuid session_id = 1;
