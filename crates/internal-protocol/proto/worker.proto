}

// ============================================================================
// Durable execution types
// ============================================================================

// Workflow status enum (mirrors everruns_durable::WorkflowStatus)
enum DurableWorkflowStatus {
    DURABLE_WORKFLOW_STATUS_UNSPECIFIED = 0;
    DURABLE_WORKFLOW_STATUS_PENDING = 1;
    DURABLE_WORKFLOW_STATUS_RUNNING = 2;
    DURABLE_WORKFLOW_STATUS_COMPLETED = 3;
    DURABLE_WORKFLOW_STATUS_FAILED = 4;
    DURABLE_WORKFLOW_STATUS_CANCELLED = 5;
    DURABLE_WORKFLOW_STATUS_CONTINUED_AS_NEW = 6;
}

// Task status enum
enum DurableTaskStatus {
    DURABLE_TASK_STATUS_UNSPECIFIED = 0;
    DURABLE_TASK_STATUS_PENDING = 1;
    DURABLE_TASK_STATUS_CLAIMED = 2;
    DURABLE_TASK_STATUS_COMPLETED = 3;
    DURABLE_TASK_STATUS_FAILED = 4;
}

// Activity options for task scheduling
message DurableActivityOptions {
    optional int32 max_retries = 1;
    optional int64 retry_delay_ms = 2;
    optional int64 timeout_ms = 3;
}

// Task definition for enqueueing
message DurableTaskDefinition {
    Uuid workflow_id = 1;
    string activity_id = 2;
    string activity_type = 3;
    google.protobuf.Struct input = 4;
    optional DurableActivityOptions options = 5;
}

// Claimed task returned from claim operation
message DurableClaimedTask {
    Uuid id = 1;
    Uuid workflow_id = 2;
    string activity_id = 3;
    string activity_type = 4;
    google.protobuf.Struct input = 5;
    int32 attempt = 6;
    int32 max_attempts = 7;
}

// === Create workflow ===

message CreateDurableWorkflowRequest {
    string workflow_type = 1;
    google.protobuf.Struct input = 2;
    optional Uuid workflow_id = 3;  // Optional, will generate if not provided
}

message CreateDurableWorkflowResponse {
    Uuid workflow_id = 1;
}

// === Get workflow status ===

message GetDurableWorkflowStatusRequest {
    Uuid workflow_id = 1;
}

message GetDurableWorkflowStatusResponse {
    DurableWorkflowStatus status = 1;
    optional google.protobuf.Struct output = 2;
    optional string error = 3;
}

// === Update workflow status ===

message UpdateDurableWorkflowStatusRequest {
    Uuid workflow_id = 1;
    DurableWorkflowStatus status = 2;
    optional google.protobuf.Struct output = 3;
    optional string error = 4;
}

message UpdateDurableWorkflowStatusResponse {
    bool updated = 1;
}

// === Enqueue task ===

message EnqueueDurableTaskRequest {
    DurableTaskDefinition task = 1;
}

message EnqueueDurableTaskResponse {
    Uuid task_id = 1;
}

// === Claim tasks ===

message ClaimDurableTasksRequest {
    string worker_id = 1;
    repeated string activity_types = 2;
    int32 max_tasks = 3;
}

message ClaimDurableTasksResponse {
    repeated DurableClaimedTask tasks = 1;
}

// === Complete task ===

message CompleteDurableTaskRequest {
    Uuid task_id = 1;
    string worker_id = 2;  // Required: prevents duplicate completion when task is reclaimed
    google.protobuf.Struct output = 3;
}

message CompleteDurableTaskResponse {
    // Whether the task was successfully completed
    // False if task was reclaimed by another worker or already completed
    bool success = 1;
}

// === Fail task ===

message FailDurableTaskRequest {
    Uuid task_id = 1;
    string error = 2;
    // Omitted by older workers: preserve normal retry behavior.
    optional bool retryable = 3;
}

message FailDurableTaskResponse {
    bool failed = 1;
    bool will_retry = 2;
    // True only for the worker elected to run terminal turn/session effects.
    bool terminal_failure_owner = 3;
}

// === Heartbeat task ===

message HeartbeatDurableTaskRequest {
    Uuid task_id = 1;
    string worker_id = 2;
    optional google.protobuf.Struct details = 3;  // Optional progress/status details
}

message HeartbeatDurableTaskResponse {
    bool acknowledged = 1;
    bool should_cancel = 2;
}

// === Count active workflows ===

message CountActiveDurableWorkflowsRequest {}

message CountActiveDurableWorkflowsResponse {
    int64 count = 1;
}

// === Workflow signals ===

message DurableWorkflowSignal {
    string signal_type = 1;
    google.protobuf.Value payload = 2;
    string sent_at = 3;  // ISO 8601 timestamp
}

message SendDurableWorkflowSignalRequest {
    string workflow_id = 1;
    DurableWorkflowSignal signal = 2;
}

message SendDurableWorkflowSignalResponse {}

message GetAndConsumeDurableWorkflowSignalsRequest {
    string workflow_id = 1;
    string signal_type = 2;
}

message GetAndConsumeDurableWorkflowSignalsResponse {
    repeated DurableWorkflowSignal signals = 1;
}

// === Register worker ===

message RegisterDurableWorkerRequest {
    string worker_id = 1;
    optional string worker_group = 2;
    repeated string activity_types = 3;
    int32 max_concurrency = 4;
}

message RegisterDurableWorkerResponse {
    bool registered = 1;
}

// === Heartbeat worker ===

message HeartbeatDurableWorkerRequest {
    string worker_id = 1;
    int32 current_load = 2;
    bool accepting_tasks = 3;
}

message HeartbeatDurableWorkerResponse {
    bool acknowledged = 1;
}

// === Deregister worker ===

message DeregisterDurableWorkerRequest {
    string worker_id = 1;
}

message DeregisterDurableWorkerResponse {
    bool deregistered = 1;
    // Number of tasks that were reclaimed (set back to pending) during deregistration
    int32 tasks_reclaimed = 2;
}

// ============================================================================
// Circuit breaker types
// ============================================================================

// Circuit breaker state enum
enum CircuitBreakerState {
    CIRCUIT_BREAKER_STATE_UNSPECIFIED = 0;
    CIRCUIT_BREAKER_STATE_CLOSED = 1;
    CIRCUIT_BREAKER_STATE_OPEN = 2;
    CIRCUIT_BREAKER_STATE_HALF_OPEN = 3;
}

// === Check circuit breaker ===

message CheckCircuitBreakerRequest {
    // Key identifying the circuit breaker (e.g., "llm:openai", "llm:anthropic")
    string key = 1;
}

message CheckCircuitBreakerResponse {
    // Whether the call is allowed
    bool allowed = 1;
    // Current state of the circuit breaker
    CircuitBreakerState state = 2;
}

// ============================================================================
// Image resolution types
// ============================================================================

// Request to resolve an image by ID
message ResolveImageRequest {
    Uuid image_id = 1;
    // Organization ID for scoped image access
    int64 org_id = 2;
}

// Response with resolved image data
// Returns either a presigned URL or base64-encoded image data for LLM consumption.
// When `url` is present, workers should fetch image data via HTTP instead of using `base64`.
message ResolveImageResponse {
    // True if image was found
    bool found = 1;
    // Base64-encoded image data (without data URL prefix)
    // Empty when url is provided or when found=false
    string base64 = 2;
    // MIME type (e.g., "image/png", "image/jpeg")
    // Empty string when found=false
    string media_type = 3;
    // Presigned URL to fetch the image binary via HTTP GET
    // When present, workers should use this instead of the base64 field
    string url = 4;
}

// Batch request to resolve multiple images
message ResolveImagesRequest {
    repeated Uuid image_ids = 1;
    // Organization ID for scoped image access
    int64 org_id = 2;
}

// Batch response with resolved images
message ResolveImagesResponse {
    // Map from image_id string to resolved image
    // Only contains entries for found images
    map<string, ResolvedImageData> images = 1;
}

message StoredImageInfo {
    Uuid id = 1;
    string filename = 2;
    string content_type = 3;
    int64 size_bytes = 4;
    optional google.protobuf.Struct metadata = 5;
    optional Timestamp created_at = 6;
}

message StoredImage {
    StoredImageInfo info = 1;
    bytes data = 2;
}

message CreateImageArtifactRequest {
    int64 org_id = 1;
    string filename = 2;
    string content_type = 3;
    bytes data = 4;
    optional google.protobuf.Struct metadata = 5;
}

message CreateImageArtifactResponse {
    StoredImageInfo image = 1;
}

message GetImageArtifactRequest {
    int64 org_id = 1;
    Uuid image_id = 2;
}

message GetImageArtifactResponse {
    optional StoredImage image = 1;
}

message GetImageArtifactInfoRequest {
    int64 org_id = 1;
    Uuid image_id = 2;
}

message GetImageArtifactInfoResponse {
    optional StoredImageInfo image = 1;
}

message GetDefaultProviderCredentialsRequest {
    int64 org_id = 1;
    string provider_type = 2;
    // Exact provider identity for model execution. Empty preserves the legacy
    // tool-side lookup by provider type.
    string provider_id = 3;
}

message GetDefaultProviderCredentialsResponse {
    bool found = 1;
    string api_key = 2;
    string base_url = 3;
    string provider_type = 4;
    // Connection-level request options (extra headers, diagnostics opt-in) as
    // the JSON of ProviderRequestOptions. Empty when the connection configures
    // none, so an older worker simply sends no options.
    string request_options_json = 5;
}


// Resolved image data for batch response
message ResolvedImageData {
    // Base64-encoded image data (without data URL prefix)
    // Empty when url is provided
    string base64 = 1;
    // MIME type (e.g., "image/png", "image/jpeg")
    string media_type = 2;
    // Presigned URL to fetch the image binary via HTTP GET
    // When present, workers should use this instead of the base64 field
    string url = 3;
}

// === Record success ===

message RecordCircuitBreakerSuccessRequest {
    string key = 1;
}

message RecordCircuitBreakerSuccessResponse {
    // New state after recording success
    CircuitBreakerState state = 1;
}

// === Record failure ===

message RecordCircuitBreakerFailureRequest {
    string key = 1;
}

message RecordCircuitBreakerFailureResponse {
    // New state after recording failure
    CircuitBreakerState state = 1;
    // Whether the circuit is now open (tripped)
    bool circuit_opened = 2;
}

// === Subscribe to task notifications ===

message SubscribeTaskNotificationsRequest {
    string worker_id = 1;
    repeated string activity_types = 2;  // Activity types this worker handles
}

// Task notification types
enum TaskNotificationType {
    TASK_NOTIFICATION_TYPE_UNSPECIFIED = 0;
    // A new task is available matching the subscribed activity types
    TASK_NOTIFICATION_TYPE_TASK_AVAILABLE = 1;
    // Heartbeat to keep the stream alive and detect disconnections
    TASK_NOTIFICATION_TYPE_HEARTBEAT = 2;
}

message TaskNotification {
    TaskNotificationType notification_type = 1;
    // The activity type of the available task
    // Empty string for HEARTBEAT notifications
    string activity_type = 2;
    // Approximate number of pending tasks for this activity type (hint for batch claiming)
    // Zero for HEARTBEAT notifications
    int32 pending_count = 3;
    // Server timestamp when notification was generated
    Timestamp timestamp = 4;
}

// ============================================================================
// MCP server types
// ============================================================================

// MCP server info needed for tool execution
message McpServerInfo {
    Uuid id = 1;
    string name = 2;
    string url = 3;
    optional string api_key = 4;  // Decrypted by control plane
    map<string, string> headers = 5;
    string auth_mode = 6;
    optional string oauth_provider_id = 7;
    // Protocol-era adoption policy: "auto" (default) or a pinned version date
    // ("2025-03-26", "2025-06-18", "2026-07-28"). The pre-release names
    // "legacy"/"stable"/"rc" are still parsed for older workers.
    string protocol_mode = 8;
    repeated McpSecretBinding secret_bindings = 9;
}

message McpSecretBinding {
    string tool_name = 1;
    string parameter_name = 2;
    optional string value = 3;
    string setup_url = 4;
    string label = 5;
}

// Request to get MCP server by name prefix (e.g., "microsoft_learn" from tool name "mcp_microsoft_learn__search")
message GetMcpServerByPrefixRequest {
    string server_prefix = 1;
    // Organization ID for resource validation
    int64 org_id = 2;
    // Optional session scope for resolving harness/agent/session MCP servers.
    Uuid session_id = 3;
}

message GetMcpServerByPrefixResponse {
    optional McpServerInfo server = 1;
}

