    uint64 after_context = 5;
    uint64 offset = 6;
    uint64 limit = 7;
    uint64 max_bytes = 8;
}

message SessionGrepFilesResponse {
    repeated GrepMatch matches = 1;
    repeated GrepContextBlock blocks = 2;
    uint64 total_matches = 3;
    uint64 returned_matches = 4;
    uint64 bytes_returned = 5;
    uint64 bytes_total = 6;
    optional uint64 next_offset = 7;
    bool byte_truncated = 8;
}

message SessionCreateDirectoryRequest {
