// Metadata for a stored key
message StorageKeyInfo {
    string key = 1;
    Timestamp created_at = 2;
    Timestamp updated_at = 3;
}

// Metadata for a stored secret (without value)
message StorageSecretInfo {
    string name = 1;
    Timestamp created_at = 2;
    Timestamp updated_at = 3;
}

// === Key/Value operations ===

