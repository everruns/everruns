# TypeSafe System One client: a judgment driver.
# Decision: Filed beside the LLM wire-protocol drivers because it is the same
#   shape — a vendor client below the platform layer, reachable from host and
#   above without a dependency cycle. It is NOT registered in `DriverRegistry`:
#   that registry is for chat completions, and this returns typed decisions.
# Decision: Vendor SDK with no Everruns dependency at all (its neighbours take
#   `everruns-provider`), so it is publishable and usable on its own. The
#   package name stays vendor-neutral; per the workspace manifest the drivers
#   directory is a repository organization boundary, not a naming rule.
# Decision: The Everruns capability wraps it from `integrations/typesafe`, and
#   `everruns-host` uses it directly to back the neutral `JudgmentService`.

[package]
name = "typesafe-systemone"
version = "0.1.0"
# Not published yet: first crates.io publish failed with 403 (token lacks
# permission for this new name; Publish Crate run 35184069849). Keep private
# until the registry token allows it, then remove this line.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/typesafe-systemone"
description = "Rust client for TypeSafe's System One API: typed judgments (noul, choice, score) with calibrated probabilities"
readme = "README.md"
keywords = ["typesafe", "classification", "llm", "ai", "judgment"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
# Gate real-API tests; CI passes --features integration with TYPESAFE_API_KEY.
integration = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
