# AWS Bedrock Provider Implementation
# Decision: Implements LlmDriver using the AWS Bedrock Runtime ConverseStream API.
# Uses aws-sdk-bedrockruntime for event stream handling; credentials are carried
# as JSON in the ProviderConfig.api_key field.

[package]
name = "everruns-bedrock"
readme = "README.md"
keywords = ["agent", "llm", "ai", "bedrock", "aws"]
categories = ["api-bindings", "asynchronous"]
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-bedrock"
description = "AWS Bedrock provider for Everruns agents"

[dependencies]
# Core dependencies
async-trait.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true
tokio-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Tracing
tracing.workspace = true

# Internal dependencies
base64.workspace = true
# Provider SPI only (EVE-874): wire-protocol crates never depend on
# everruns-core. Intentional optional features of everruns-provider (`openapi`
# schema derives, `sqlx` TypedId codecs) stay off; default features are empty.
everruns-provider = { path = "../../provider", version = "0.18.0" }

# AWS SDK for Bedrock Runtime
# Default features include the legacy `rustls` connector (rustls 0.21 +
# rustls-webpki 0.101, flagged by GHSA-82j2-j2ch-gfr8). BehaviorVersion::latest()
# uses the modern `default-https-client` (rustls 0.23), so the legacy stack is
# excluded.
aws-sdk-bedrockruntime = { version = "1", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
