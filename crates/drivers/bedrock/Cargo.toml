# Deprecated shim: AWS Bedrock moved into everruns-drivers (feature `bedrock`).
#
# Decision: the driver crates were folded into everruns-drivers. crates.io has
# no "moved" flag and shows the newest version's README and description, and
# docs.rs shows its crate docs, so this crate publishes one last release that
# says where it went on each of those surfaces and re-exports the new module.
# It leaves the workspace and the publish set in the release after.

[package]
name = "everruns-bedrock"
readme = "README.md"
keywords = ["deprecated", "everruns", "llm", "bedrock"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-bedrock"
description = "Moved to everruns-drivers (feature `bedrock`). Deprecated shim, no longer updated."

[features]
default-credentials = ["everruns-drivers/bedrock-default-credentials"]

[dependencies]
everruns-drivers = { workspace = true, features = ["bedrock"] }
everruns-provider.workspace = true

[lints]
workspace = true
