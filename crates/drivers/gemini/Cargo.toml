# Deprecated shim: Google Gemini moved into everruns-drivers (feature `gemini`).
#
# Decision: the driver crates were folded into everruns-drivers. crates.io has
# no "moved" flag and shows the newest version's README and description, and
# docs.rs shows its crate docs, so this crate publishes one last release that
# says where it went on each of those surfaces and re-exports the new module.
# It leaves the workspace and the publish set in the release after.

[package]
name = "everruns-gemini"
readme = "README.md"
keywords = ["deprecated", "everruns", "llm", "gemini"]
categories = ["api-bindings", "asynchronous"]
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Moved to everruns-drivers (feature `gemini`). Deprecated shim, no longer updated."
documentation = "https://docs.rs/everruns-gemini"

[dependencies]
everruns-drivers = { workspace = true, features = ["gemini"] }
everruns-provider.workspace = true

[lints]
workspace = true
