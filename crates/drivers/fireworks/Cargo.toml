# Deprecated shim: Fireworks AI moved into everruns-drivers (feature `fireworks`).
#
# Decision: the driver crates were folded into everruns-drivers. crates.io has
# no "moved" flag and shows the newest version's README and description, and
# docs.rs shows its crate docs, so this crate publishes one last release that
# says where it went on each of those surfaces and re-exports the new module.
# It leaves the workspace and the publish set in the release after.

[package]
name = "everruns-fireworks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-fireworks"
description = "Moved to everruns-drivers (feature `fireworks`). Deprecated shim, no longer updated."
readme = "README.md"

keywords = ["deprecated", "everruns", "llm", "fireworks"]

[dependencies]
everruns-drivers = { workspace = true, features = ["fireworks"] }
everruns-contracts = { workspace = true, default-features = false }

[lints]
workspace = true
