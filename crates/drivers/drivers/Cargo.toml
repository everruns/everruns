# Everruns model vendor drivers, one module and one feature per vendor.
#
# Decision: every vendor driver lives here. A package costs a workspace member,
# an entry in four isolation guards, a CI `-p` shard, a publish pin, and a
# crates.io name; a module costs none of those. Vendors with their own wire
# types (anthropic, gemini, bedrock) keep them in their module, and heavy
# dependencies (bedrock's AWS SDK) sit behind that vendor's feature, so a
# consumer still compiles only the vendors it names. The former vendor packages
# shipped deprecated compatibility shims in 0.35 and then retired.
#
# everruns-llmsim stays its own crate: its `host` feature depends on
# everruns-host, which depends on the openrouter driver here, so folding it in
# would make the two crates depend on each other.

[package]
name = "everruns-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-drivers"
description = "Model vendor drivers for Everruns: Anthropic, OpenAI, Gemini, Bedrock, OpenRouter and more"
keywords = ["agent", "llm", "ai", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

# docs.rs otherwise builds the empty default feature set and hides every vendor.
[package.metadata.docs.rs]
all-features = true

[features]
# No vendor is on by default: a consumer names the ones it serves, so nothing
# ships a driver it never constructs.
default = []
anthropic = ["dep:tokio", "dep:futures", "dep:eventsource-stream", "dep:tracing"]
bedrock = [
    "dep:tokio",
    "dep:futures",
    "dep:tokio-stream",
    "dep:tracing",
    "dep:base64",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-smithy-types",
]
# Resolve Bedrock credentials from the AWS default chain (env, profile, SSO,
# credential process). Off by default because aws-config is heavy.
bedrock-default-credentials = ["bedrock", "dep:aws-config", "dep:aws-credential-types"]
chatgpt = ["dep:tokio", "dep:tracing", "dep:futures", "dep:anyhow", "dep:rand", "dep:sha2", "dep:base64", "dep:jsonwebtoken"]
codex = ["chatgpt"]
cloudflare = []
fireworks = ["dep:tokio", "dep:uuid"]
groq = ["dep:tokio"]
gemini = ["dep:tokio", "dep:futures", "dep:eventsource-stream", "dep:tracing"]
mai = ["dep:tokio", "dep:tracing"]
meta = []
mistral = ["dep:tokio"]
openai = ["dep:futures", "dep:tokio", "dep:tracing", "dep:tokio-tungstenite", "dep:base64", "reqwest/multipart", "everruns-contracts/responses-websocket"]
openrouter = ["dep:tokio", "dep:tracing"]
typesafe = ["dep:tokio", "dep:tracing"]
vercel = []

[dependencies]
async-trait.workspace = true

# Serialization (model-discovery responses). Cloudflare's model properties are
# a name/value list whose value is a string for flags and an array for pricing,
# so the value stays untyped and each reader interprets its own.
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, optional = true }
thiserror.workspace = true

# Date/time (model `created` timestamps)
chrono.workspace = true
web-time = "1"

# Per-vendor dependencies, each pulled in only by the features that need it.
anyhow = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
# OpenAI Realtime voice control connection (`openai::realtime`).
aws-sdk-bedrockruntime = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = { version = "1", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sso",
    "credentials-process",
] }
aws-credential-types = { version = "1", optional = true }

# Internal dependencies
# Provider SPI only (EVE-874): wire-protocol crates never depend on
# everruns-core. Intentional optional features of everruns-contracts (`openapi`
# schema derives, `sqlx` TypedId codecs) stay off.
everruns-contracts = { path = "../../contracts", version = "0.49.0", default-features = false, features = ["http"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, optional = true }
# Native HTTP (model discovery and non-chat services).
reqwest.workspace = true
tokio-tungstenite = { workspace = true, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.50", default-features = false, features = ["sync", "rt", "time", "macros"], optional = true }

[dev-dependencies]
# tokio powers `#[tokio::test]`; wiremock captures the wire; futures drains the
# chat stream.
tokio = { workspace = true, features = ["full", "test-util"] }
futures.workspace = true
wiremock = "0.6"
serde_json.workspace = true
thiserror.workspace = true
# Encodes AWS event-stream frames so Bedrock ConverseStream wire tests can
# replay a real stream (already in the tree through the AWS SDK).
aws-smithy-eventstream = "0.61"

[[test]]
name = "anthropic_chat_wire"
required-features = ["anthropic"]

[[test]]
name = "anthropic_computer_toolset_wire"
required-features = ["anthropic"]

[[test]]
name = "anthropic_browser_toolset_wire"
required-features = ["anthropic"]

[[test]]
name = "gemini_chat_wire"
required-features = ["gemini"]

[[test]]
name = "openrouter_request_wire"
required-features = ["openrouter"]

[[test]]
name = "anthropic_web_search_wire"
required-features = ["anthropic"]

[[test]]
name = "web_citations_wire"
required-features = ["openai", "openrouter"]

[[test]]
name = "native_web_search_live"
required-features = ["openai", "openrouter", "anthropic", "gemini"]

[[test]]
name = "mai_chat_wire"
required-features = ["mai"]

[[example]]
name = "chatgpt-login"
required-features = ["chatgpt"]

[[example]]
name = "openai-chat"
required-features = ["openai"]

[[example]]
name = "anthropic-chat"
required-features = ["anthropic"]

[[example]]
name = "registry-chat"
required-features = ["openai"]

[[test]]
name = "chatgpt_wire"
required-features = ["chatgpt", "codex"]

[[test]]
name = "codex_builder_wire"
required-features = ["codex"]

[lints]
workspace = true
