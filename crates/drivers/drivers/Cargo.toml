# Everruns model vendor drivers, one module and one feature per vendor.
#
# Decision: every vendor driver lives here. A package costs a workspace member,
# an entry in four isolation guards, a CI `-p` shard, a publish pin, and a
# crates.io name; a module costs none of those. Vendors with their own wire
# types (anthropic, gemini, bedrock) keep them in their module, and heavy
# dependencies (bedrock's AWS SDK) sit behind that vendor's feature, so a
# consumer still compiles only the vendors it names. The former vendor packages
# shipped deprecated compatibility shims in 0.35 and then retired.
#
# everruns-llmsim stays its own crate: its `host` feature depends on
# everruns-host, which depends on the openrouter driver here, so folding it in
# would make the two crates depend on each other.

[package]
name = "everruns-drivers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-drivers"
description = "Model vendor drivers for Everruns: Anthropic, OpenAI, Gemini, Bedrock, OpenRouter and more"
keywords = ["agent", "llm", "ai", "anthropic", "openai"]
categories = ["api-bindings", "asynchronous"]
readme = "README.md"

[features]
# No vendor is on by default: a consumer names the ones it serves, so nothing
# ships a driver it never constructs.
default = []
anthropic = ["dep:tokio", "dep:futures", "dep:eventsource-stream", "dep:tracing"]
bedrock = [
    "dep:tokio",
    "dep:futures",
    "dep:tokio-stream",
    "dep:tracing",
    "dep:base64",
    "dep:aws-sdk-bedrockruntime",
    "dep:aws-smithy-types",
]
# Resolve Bedrock credentials from the AWS default chain (env, profile, SSO,
# credential process). Off by default because aws-config is heavy.
bedrock-default-credentials = ["bedrock", "dep:aws-config", "dep:aws-credential-types"]
cloudflare = []
fireworks = []
gemini = ["dep:tokio", "dep:futures", "dep:eventsource-stream", "dep:tracing"]
mai = ["dep:tokio", "dep:tracing"]
meta = []
openai = ["dep:tokio", "dep:tracing", "everruns-contracts/responses-websocket"]
openrouter = []
vercel = []

[dependencies]
async-trait.workspace = true

# HTTP client (model discovery)
reqwest.workspace = true

# Serialization (model-discovery responses). Cloudflare's model properties are
# a name/value list whose value is a string for flags and an array for pricing,
# so the value stays untyped and each reader interprets its own.
serde.workspace = true
serde_json.workspace = true

# Date/time (model `created` timestamps)
chrono.workspace = true

# Per-vendor dependencies, each pulled in only by the features that need it.
tokio = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio-stream = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
aws-smithy-types = { version = "1", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "sso",
    "credentials-process",
] }
aws-credential-types = { version = "1", optional = true }

# Internal dependencies
# Provider SPI only (EVE-874): wire-protocol crates never depend on
# everruns-core. Intentional optional features of everruns-contracts (`openapi`
# schema derives, `sqlx` TypedId codecs) stay off.
everruns-contracts = { path = "../../contracts", version = "0.37.0", default-features = false, features = ["http"] }

[dev-dependencies]
# tokio powers `#[tokio::test]`; wiremock captures the wire; futures drains the
# chat stream.
tokio = { workspace = true, features = ["full", "test-util"] }
futures.workspace = true
wiremock = "0.6"
serde_json.workspace = true

[[test]]
name = "anthropic_chat_wire"
required-features = ["anthropic"]

[[test]]
name = "anthropic_computer_toolset_wire"
required-features = ["anthropic"]

[[test]]
name = "anthropic_parallel_tool_calls_live"
required-features = ["anthropic"]

[[test]]
name = "openai_astra_compaction_live"
required-features = ["openai"]

[[test]]
name = "openai_completions_max_tokens_live"
required-features = ["openai"]

[[test]]
name = "openai_hosted_tools_live"
required-features = ["openai"]

[[test]]
name = "openai_parallel_tool_calls_live"
required-features = ["openai"]

[[test]]
name = "gemini_chat_wire"
required-features = ["gemini"]

[[test]]
name = "openrouter_chat_live"
required-features = ["openrouter"]

[[test]]
name = "openrouter_discovery_live"
required-features = ["openrouter"]

[[test]]
name = "openrouter_request_wire"
required-features = ["openrouter"]

[[test]]
name = "fireworks_chat_live"
required-features = ["fireworks"]

[[test]]
name = "mai_chat_wire"
required-features = ["mai"]

[[test]]
name = "meta_model_api_live"
required-features = ["meta"]

[lints]
workspace = true
