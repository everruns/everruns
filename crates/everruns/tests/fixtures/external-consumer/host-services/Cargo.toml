[package]
name = "external-host-services"
version = "0.0.0"
edition = "2024"
publish = false

# A downstream embedding host (EVE-1296) that composes its own capability with
# a pre-tool guard and a model view into an Engine Session through the public
# `everruns::hosting::services` SPI ALONE: no everruns-core, no
# everruns-contracts, no runtime builder.
[dependencies]
everruns = { path = "../../../../../../crates/everruns" }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
