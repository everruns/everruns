[workspace]
resolver = "2"
members = [
    "app",
    "builtin-pack",
    "capability-pack",
    "event-log",
    "execution-contracts",
    "provider-pack",
    "platform-store",
    "workspace-backend",
]

# Match root profiles so standalone host proofs reuse CI's dependency artifacts.
[profile.dev]
debug = 0

[profile.test]
debug = 0
