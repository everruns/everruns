# The application-facing `everruns` library: a thin, publishable facade over the
# canonical in-process host.
#
# Decision (EVE-830): the first public `everruns` crate is a compatibility facade
# over `everruns-core` and `everruns-host`. It moves no engine code and only
# re-exports the minimum needed to construct and run the in-process runtime.
# Default features stay offline — the contained session filesystem is included,
# while provider, shell, web, Lua, MCP, SQLx, server, and worker integrations
# remain opt-in. The `everruns::runtime` module
# remains only as a deprecated 0.17 alias for canonical host re-exports;
# advanced hosts should depend on `everruns-host` directly.

[package]
name = "everruns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns"
description = "Build and run durable AI agents in Rust — the application-facing entrypoint to the Everruns agentic framework"
readme = "README.md"
keywords = ["agent", "agentic", "coding-agent", "llm", "ai"]
categories = ["development-tools", "asynchronous"]

[[example]]
name = "lifecycle_hooks"
required-features = ["macros", "openai"]

[features]
# Default features stay offline: the facade includes the contained session
# filesystem but activates no provider, shell, web, Lua, MCP, SQLx, server, or
# worker integrations. The `macros` surface is the
# default surfaces beyond the bare re-exports — macros and typed capabilities —
# pull in no network or I/O edge, only async adaptation and schema generation.
default = ["macros", "capabilities", "filesystem"]
# Re-export `#[everruns::tool]` (EVE-829) and the hidden `__macro_support`
# runtime helpers it expands into. Pulls in `everruns-macros`, `schemars` (JSON
# Schema generation), and `serde` (derive). Kept out of `everruns-core`.
macros = ["dep:everruns-macros", "dep:schemars", "dep:serde"]
# Curated service-provider interface for code-defined capabilities. The
# authoring types live in the neutral `everruns-capability` contract crate
# (EVE-873); this feature turns on its `definition` surface plus the runtime
# adapters here. It shares serde/schemars with `macros` but remains
# independently gateable so the bare facade still compiles with
# `--no-default-features`.
capabilities = ["everruns-capability/definition", "dep:schemars", "dep:serde"]
# 0.17 feature-name compatibility. Writable message JSONL was retired in favor
# of canonical event logs; retaining the no-op name keeps dependent feature
# lists compiling without exposing a writable message store.
jsonl = []
filesystem = ["everruns-host/filesystem"]
# Environment-backed execution integrations. Filesystem is default and stays
# inside the host-provided session filesystem; the others are explicit opt-ins.
bashkit = ["everruns-host/bashkit"]
web-fetch = ["everruns-host/web-fetch"]
lua = ["everruns-host/lua"]
mcp = ["everruns-host/mcp"]
# Enable local-process (stdio) MCP servers, mirroring `everruns-host/mcp-stdio`.
mcp-stdio = ["mcp", "everruns-host/mcp-stdio"]
# Enable a crash-durable canonical event log, SQLite-backed session catalog and
# task/schedule state, and real workspaces through `LocalConfig`. Conversation
# history is derived from canonical events rather than selecting a writable
# message store here.
local = ["dep:everruns-local"]
# Configure real OpenAI-backed models via `everruns::providers::openai`. Off by
# default so the standard facade build pulls in no provider or Reqwest edge; the
# `OpenAI` config type and its driver wiring compile only with this feature.
openai = ["dep:everruns-openai"]

[dependencies]
# Neutral capability contract (EVE-873): `CapabilityId`/`CapabilityRef`,
# `CapabilitySpec`/`IntoCapability`, and (behind `capabilities`) the
# code-defined authoring surface. The facade re-exports this contract as its
# application capability API.
everruns-capability.workspace = true
everruns-core.workspace = true
everruns-builtins.workspace = true
everruns-host.workspace = true
# Deterministic in-process simulator backing `Model::simulated` (EVE-875).
# `sim` only: the facade never links the demo fixture capabilities, so
# applications cannot accidentally register them.
everruns-test-support = { workspace = true, default-features = false, features = ["sim"] }
everruns-local = { workspace = true, optional = true }
# Optional real-provider edge, activated by the `openai` feature. Referenced via
# workspace inheritance; the workspace pin is a compatible lower bound, so this
# is intentionally absent from the publish version-sync lists (unlike
# everruns-core/everruns-host, which track the workspace version exactly).
everruns-openai = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
# Session event streaming (broadcast channel) and cancellation (select). Only
# the `sync` surface of tokio is needed on the non-dev build.
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
# `CancellationToken` backs the facade's public cancellation handle without
# leaking the tokio-util type onto the public surface. Matches the pin used by
# everruns-core.
tokio-util = { version = "0.7", default-features = false }
# Activated by `macros` and/or `capabilities`. `everruns-macros` provides the
# `#[everruns::tool]` attribute; `schemars` and `serde` back generated and
# advanced typed protocol schemas.
everruns-macros = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "time"] }
serde = { workspace = true }
trybuild = { workspace = true }
# Temporary workspaces and plugin fixtures used by facade acceptance tests.
tempfile = { workspace = true }

[[example]]
name = "workspace_policy"

