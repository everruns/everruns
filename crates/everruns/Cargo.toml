# The application-facing `everruns` library: a thin, publishable facade over the
# existing in-process runtime.
#
# Decision (EVE-830): the first public `everruns` crate is a compatibility facade
# over `everruns-core` and `everruns-runtime`. It moves no engine code and only
# re-exports the minimum needed to construct and run the in-process runtime.
# Default features stay offline — no provider, MCP, filesystem, SQLx, server, or
# worker integrations are activated by default. The escape-hatch `everruns::core`
# and `everruns::runtime` modules expose the underlying crates for APIs not yet
# promoted onto the facade.

[package]
name = "everruns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns"
description = "Build and run durable AI agents in Rust — the application-facing entrypoint to the Everruns agentic framework"
readme = "README.md"
keywords = ["agent", "agentic", "coding-agent", "llm", "ai"]
categories = ["development-tools", "asynchronous"]

[features]
# Default features stay offline: the facade activates no provider, MCP,
# filesystem, SQLx, server, or worker integrations. The `macros` surface is the
# one default beyond the bare re-exports — it pulls in no network or I/O edge,
# only the proc-macro and schema-generation toolchain.
default = ["macros"]
# Re-export `#[everruns::tool]` (EVE-829) and the hidden `__macro_support`
# runtime helpers it expands into. Pulls in `everruns-macros`, `schemars` (JSON
# Schema generation), and `serde` (derive). Kept out of `everruns-core`.
macros = ["dep:everruns-macros", "dep:schemars", "dep:serde"]
# Compile the experimental sandboxed Lua execution engine into the runtime.
# Mirrors `everruns-runtime/lua`; off by default so the standard facade build
# pulls in no interpreter.
lua = ["everruns-runtime/lua"]
# Enable local-process (stdio) MCP servers, mirroring `everruns-runtime/mcp-stdio`.
mcp-stdio = ["everruns-runtime/mcp-stdio"]
# Configure real OpenAI-backed models via `everruns::providers::openai`. Off by
# default so the standard facade build pulls in no provider or Reqwest edge; the
# `OpenAI` config type and its driver wiring compile only with this feature.
openai = ["dep:everruns-openai"]

[dependencies]
everruns-core.workspace = true
everruns-runtime.workspace = true
# Optional real-provider edge, activated by the `openai` feature. Referenced via
# workspace inheritance; the workspace pin is a compatible lower bound, so this
# is intentionally absent from the publish version-sync lists (unlike
# everruns-core/everruns-runtime, which track the workspace version exactly).
everruns-openai = { workspace = true, optional = true }
async-trait.workspace = true
serde_json.workspace = true
# Session event streaming (broadcast channel) and cancellation (select). Only
# the `sync` surface of tokio is needed on the non-dev build.
tokio = { workspace = true, features = ["sync", "macros"] }
# `CancellationToken` backs the facade's public cancellation handle without
# leaking the tokio-util type onto the public surface. Matches the pin used by
# everruns-core.
tokio-util = { version = "0.7", default-features = false }
# Activated by the `macros` feature. `everruns-macros` provides the
# `#[everruns::tool]` attribute; `schemars` and `serde` back the code it emits.
everruns-macros = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
serde = { workspace = true }
trybuild = { workspace = true }
