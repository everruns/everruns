# Kernel containment for host command execution.
#
# Decision: this is its own small package rather than a module of
# `everruns-host`. `knowledge/harnesses/execution-environments.md` leaves the
# location as an open question; the deciding constraint is that Yolop must be
# able to pin the containment layer on its own release train, the way it pins
# Tuika. A package whose only dependencies are the OS primitives can be pinned
# without dragging the runtime along, and `everruns-host` depends on it rather
# than the reverse.

[package]
name = "everruns-containment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-containment"
description = "Kernel containment (Landlock, seccomp, Seatbelt) for agent shell commands"
readme = "README.md"
keywords = ["everruns", "sandbox", "landlock", "seccomp", "agents"]
categories = ["development-tools", "os"]

[dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["process"] }
# `policy` parses the script instead of matching substrings, so `echo kill` is
# an ordinary command. A leaf grammar with no ecosystem coupling, which is what
# keeps this package pinnable on its own.
tree-sitter = "0.27"
tree-sitter-bash = "0.25"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
libc = "0.2"
seccompiler = "0.5.0"

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

# The helper process that applies Linux kernel restrictions and then execs the
# shell. Embedders that already own a binary can re-exec it instead; see
# `SandboxLauncher`.
[[bin]]
name = "everruns-sandbox-exec"
path = "src/bin/sandbox_exec.rs"

[lints]
workspace = true
