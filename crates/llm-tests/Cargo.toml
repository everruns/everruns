# Provider-backed LLM integration tests.
# Decision: Keep this crate unpublished so everruns-core can publish before provider crates.

[package]
name = "everruns-llm-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Provider-backed integration tests and examples for Everruns LLM drivers"

[features]
default = ["llm-tests"]
llm-tests = []

[dependencies]
everruns-integrations = { workspace = true, features = ["filesystem", "bashkit"] }

everruns-contracts = { workspace = true, default-features = false }
everruns-test-support = { path = "../test-support" }
everruns-capabilities = { path = "../capabilities" }
# Host + local wiring for the live subagent end-to-end test.
everruns = { path = "../everruns", features = ["local"] }
everruns-drivers = { path = "../drivers/drivers", features = [
    "anthropic",
    "bedrock",
    "cloudflare",
    "fireworks",
    "gemini",
    "meta",
    "mistral",
    "openai",
    "openrouter",
    "vercel",
] }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

everruns-core = { path = "../core", default-features = false, features = ["builtins", "engine", "host"] }
[lints]
workspace = true
