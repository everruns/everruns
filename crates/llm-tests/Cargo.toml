# Provider-backed LLM integration tests.
# Decision: Keep this crate unpublished so everruns-core can publish before provider crates.

[package]
name = "everruns-llm-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Provider-backed integration tests and examples for Everruns LLM drivers"

[features]
default = ["llm-tests"]
llm-tests = []

[dependencies]
everruns-core = { path = "../core" }
everruns-engine.workspace = true
everruns-provider.workspace = true
everruns-builtins = { path = "../builtins" }
everruns-test-support = { path = "../test-support" }
everruns-platform = { path = "../platform" }
# Host + local wiring for the live subagent end-to-end test.
everruns-host = { path = "../host" }
everruns = { path = "../everruns", features = ["local"] }
everruns-openai = { path = "../openai" }
everruns-openrouter = { path = "../openrouter" }
everruns-fireworks = { path = "../fireworks" }
everruns-anthropic = { path = "../anthropic" }
everruns-gemini = { path = "../gemini" }
everruns-bedrock = { path = "../bedrock" }
everruns-meta = { path = "../meta" }
everruns-integrations-filesystem = { path = "../../integrations/filesystem" }
everruns-integrations-bashkit = { path = "../../integrations/bashkit" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
