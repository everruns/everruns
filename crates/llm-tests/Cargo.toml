# Provider-backed LLM integration tests.
# Decision: Keep this crate unpublished so everruns-core can publish before provider crates.

[package]
name = "everruns-llm-tests"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Provider-backed integration tests and examples for Everruns LLM drivers"

[features]
default = ["llm-tests"]
llm-tests = []

[dependencies]
everruns-core = { path = "../core" }
everruns-openai = { path = "../openai" }
everruns-anthropic = { path = "../anthropic" }
everruns-gemini = { path = "../gemini" }
everruns-bedrock = { path = "../bedrock" }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
rstest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
