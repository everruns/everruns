[package]
name = "everruns-local"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-local"
description = "Local workspace plus SQLite-backed task and schedule state for Everruns hosts"
readme = "README.md"
keywords = ["everruns", "agent", "sqlite", "embedded", "storage"]
categories = ["development-tools", "database"]

[dependencies]
# SQLite
rusqlite = { version = "0.39", features = ["bundled"] }

# Filesystem locations / ownership checks
dirs.workspace = true
libc = "0.2"

# Everruns crates
# NOTE: core defaults are intentionally NOT disabled here. everruns-local is a
# full host integration rather than a thin provider crate, so it uses the same
# core feature surface as everruns-host.
everruns-core.workspace = true
everruns-builtins.workspace = true
everruns-host.workspace = true
everruns-platform.workspace = true

# Async
tokio = { workspace = true, features = ["rt", "time", "sync"] }
async-trait.workspace = true
futures.workspace = true

# Sync
parking_lot.workspace = true

# Serialization
serde_json.workspace = true

# Types
chrono.workspace = true
chrono-tz = "0.10"
cron = "0.17"
uuid.workspace = true

# Error handling
thiserror.workspace = true

# Logging
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
# Deterministic simulator + fixtures for local runtime tests. Version-less
# path dependency: stripped on publish.
everruns-test-support = { path = "../test-support" }
