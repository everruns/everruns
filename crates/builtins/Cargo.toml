[package]
name = "everruns-builtins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-builtins"
description = "Portable, backend-neutral built-in capabilities for Everruns"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "capabilities", "everruns"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# The bundle consumes only the neutral capability contract and provider-neutral
# execution values. It owns no host, platform, database, network, process, or
# interpreter implementation edge.
everruns-capability.workspace = true
everruns-core = { path = "../core", version = "0.17.26", default-features = false }

async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
