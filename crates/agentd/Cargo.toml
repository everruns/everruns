[package]
name = "everruns-agentd"
description = "Shards: Raft-replicated session authorities for Everruns Engine (data plane v2)."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

# Decision: unpublished. Shards are the data plane v2 storage engine, ported
# from funout 0a0c0ec (knowledge/execution/data-plane-v2/design.md, step 5);
# nothing outside this repository depends on them until they are proven.

[lints]
workspace = true

[dependencies]
libc = "0.2"
everruns = { workspace = true, features = ["macros", "capabilities", "builtins", "filesystem", "agent-package-fs", "mcp", "sql-database"] }
everruns-core = { workspace = true, features = ["host", "direct-egress", "session-token"] }
everruns-contracts = { workspace = true, features = ["dataplane-seal"] }
# Managed sandboxes (step 11.3): the `session_sandbox` capability and the
# same providers as the worker, so an agent's sandbox runs the same way on an
# executor. The hosted catalog (step 11.6b): the capabilities the v1 worker
# registers, with the worker's features.
everruns-capabilities = { workspace = true, features = ["embedded-platform-docs", "environment-capabilities", "hosted-integration-catalog", "portable-builtins", "a2a", "ag-ui", "container-sandbox"] }
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-integrations = { workspace = true, features = ["daytona", "e2b", "boxd", "modal", "kubernetes-sandbox"] }
openraft = { version = "=0.9.26", features = ["serde", "storage-v2"] }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync"] }
futures.workspace = true
axum.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
chrono-tz = "0.10"
uuid.workspace = true
crc32fast = "1.4"
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
rand.workspace = true
object_store.workspace = true
url = "2"
bytes.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
zstd.workspace = true
base64.workspace = true
jsonwebtoken.workspace = true
regex.workspace = true
mime_guess = "2"
tower.workspace = true
# TLS and client certificates on an install's public port (`install_tls.rs`).
rustls = { workspace = true, features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
hyper.workspace = true
hyper-util.workspace = true
# Agent files `agentd push` reads (`push.rs`).
serde_yaml.workspace = true
# The same drivers as the worker, so an org's provider runs the same way on
# an executor (and the workspace builds them once).
everruns-drivers = { workspace = true, features = [
    "chatgpt",
    "anthropic",
    "bedrock",
    "cloudflare",
    "fireworks",
    "gemini",
    "mai",
    "meta",
    "mistral",
    "openai",
    "openrouter",
    "vercel",
] }
# The production-safe deterministic `llmsim` driver the worker registers too,
# so an org's LlmSim provider runs on a shard as it does on a worker.
everruns-llmsim.workspace = true
# The `agentd` binary's allocator (see `main.rs`).
tikv-jemallocator.workspace = true

[[bin]]
name = "agentd"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
everruns = { workspace = true, features = ["hosting-conformance"] }
tokio = { workspace = true, features = ["test-util"] }
