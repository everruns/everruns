# Core Agent Abstractions
# Decision: Keep the loop logic DB-agnostic via traits (EventEmitter, MessageStore, ToolExecutor)
# Decision: Use async_trait for trait definitions to support async operations
# Decision: Tool types and domain entities are defined here (runtime types)
# Decision: Domain entities (Agent, Session, LlmProvider, etc.) are in core for shared use by API and worker
# Decision: Use OpenAI Protocol as the base for LLM Provider abstractions

[package]
name = "everruns-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-core"
description = "Core agent abstractions for Everruns - agent loop, events, tools, LLM providers"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "framework"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# Provider/LLM abstraction foundation (typed IDs, credential schema, user-facing
# error taxonomy, OpenResponses wire types, URL validation). core re-exports its
# modules at their original paths.
everruns-provider = { workspace = true }

# Neutral capability contract (EVE-873): capability identity, references, and
# registry index. Only the identity surface — the code-defined authoring
# surface (`definition` feature) is consumed by `everruns`, not core.
everruns-capability = { workspace = true }

# Core dependencies
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Async runtime
# Note: "rt" is needed for tokio::spawn (background tools, parallel act atom)
tokio = { workspace = true, features = ["sync", "rt", "process", "time", "net"] }
# `CancellationToken` for cooperative tool-call cancellation (ToolContext).
tokio-util = { version = "0.7", default-features = false }
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.49.2", default-features = false }
serde_yaml.workspace = true
toml = "1.1"

# UUID and time
uuid.workspace = true
chrono.workspace = true
rand.workspace = true

# Cron parsing for session-schedule minimum-interval enforcement
cron = "0.17"

# Tracing. Plain `tracing` instrumentation is unconditional. OpenTelemetry
# initialization (SDK, OTLP exporter, tracing-subscriber layers) lives in
# `everruns-observability` (EVE-876); core carries no exporter dependencies.
# Guard: scripts/lib/check-observability-isolation.sh.
tracing.workspace = true

# Encoding
base64.workspace = true
sha2.workspace = true
hex.workspace = true

# Pattern matching
regex.workspace = true
globset.workspace = true

# Text diff rendering for edit_file previews
similar = "3"

# URL parsing
url = "2"

# Web fetching (optional; behind the `web-fetch` feature). fetchkit + the
# ed25519 bot-auth key derivation pull a sizable HTTP/crypto subtree.
bytes = "1"
fetchkit = { version = "=0.5.0", features = ["bot-auth", "render-rakers"], optional = true }

# Ed25519 key derivation (bot-auth public key registration)
ed25519-dalek = { version = "3", features = ["rand_core"], optional = true }

# Bash interpreter backing the bashkit_shell capability
bashkit = { version = "0.16.0", features = ["jq", "http_client", "bot-auth"] }

# Sandboxed Lua interpreter for the experimental `lua` capability (vendored Lua
# 5.4, never LuaJIT). Optional + behind the `lua` cargo feature so the default
# build does not compile the C sources. See knowledge/execution/lua-execution.md.
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "send", "serialize"], optional = true }

# Tree-sitter for structural outlines (EVE-248)
tree-sitter = { version = "0.26", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }

# TLS crypto provider (must be installed before any rustls usage)
rustls.workspace = true

# OpenAPI schema generation (optional, enabled by everruns-server)
utoipa = { workspace = true, optional = true }

# Database (optional, for TypedId sqlx support)
sqlx = { workspace = true, optional = true }

# Note: This crate has NO dependency on storage/contracts - it's purely runtime abstractions
# Tool types are defined locally in this crate

# HTTP client backing the egress boundary (DirectEgressService) and the
# bashkit/model-scout transports. "default" features keep system proxy
# detection from environment variables. OAuth token exchange and the system
# email senders moved out of core in EVE-879 (everruns-mcp, everruns-platform).
reqwest = { workspace = true, features = ["json", "stream", "rustls", "blocking"] }

# Plugin system for external integrations
inventory.workspace = true

# Note: LLM simulation (`llmsim`) moved to the `everruns-test-support` crate
# (EVE-875). Core carries no llmsim dependency or feature; the architecture
# guard in scripts/lib/check-test-support-isolation.sh enforces it.

# OpenUI component definitions and prompt generator
everruns-openui = { path = "../openui", version = "0.17.26", optional = true }

# A2UI component catalog and prompt generator
everruns-a2ui = { path = "../a2ui", version = "0.17.26", optional = true }

# A2A outbound agent delegation (optional; behind the `a2a` feature). Pulls the
# tonic/prost gRPC stack and a second reqwest major, so it is the largest single
# subtree a provider-only consumer can shed.
a2a = { workspace = true, optional = true }
a2a-client = { workspace = true, optional = true }

# Compile-time directory embedding for virtual mounts (platform docs)
include_dir = { version = "0.7", optional = true }

[features]
# Heavy subtrees stay ON by default so the application crates (server, worker,
# cli, runtime) and core's own test suite are unchanged. Provider crates depend
# on core with `default-features = false` to shed them — see crates/openrouter.
# Note: OTLP telemetry moved to `everruns-observability` (EVE-876); no core
# build — default or otherwise — carries exporter dependencies.
default = ["llm-tests", "a2a", "web-fetch"]
# Outbound A2A agent delegation (tonic/prost gRPC stack).
a2a = ["dep:a2a", "dep:a2a-client"]
# WebFetch capability (fetchkit HTTP pipeline + ed25519 bot-auth).
web-fetch = ["dep:fetchkit", "dep:ed25519-dalek"]
embedded-platform-docs = ["dep:include_dir"]
# Experimental sandboxed Lua execution capability (mlua, vendored Lua 5.4).
# Off by default; enabling compiles the C sources. See knowledge/execution/lua-execution.md.
lua = ["dep:mlua"]
openapi = ["utoipa", "everruns-provider/openapi"]
sqlx = ["dep:sqlx", "everruns-provider/sqlx"]
tree-sitter-outlines = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python"]
ui-capabilities = ["dep:everruns-openui", "dep:everruns-a2ui"]
llm-tests = []  # LLM integration tests (requires API keys)

[dev-dependencies]
http = "1"
tokio = { workspace = true, features = ["full", "test-util"] }
tracing-subscriber.workspace = true
wiremock = "0.6"
# Snapshot testing for contract tests
insta = { version = "1.40", features = ["json", "redactions"] }
a2a-server.workspace = true
axum.workspace = true
tempfile.workspace = true
