# Core Agent Abstractions
# Decision: Keep the loop logic DB-agnostic via traits (EventEmitter, MessageStore, ToolExecutor)
# Decision: Use async_trait for trait definitions to support async operations
# Decision: Core owns transport- and persistence-neutral execution contracts.
# Decision: Provider identity, typed IDs, LLM wire types, and driver contracts
# are imported privately from everruns-contracts, never re-exported by core.

[package]
name = "everruns-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-core"
description = "Transport-neutral agent execution contracts for Everruns"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "framework"]
categories = ["development-tools", "asynchronous"]
# Plugin marketplace fixtures are test-only and must never inflate the
# published package.
exclude = ["testdata/", "src/ag_ui/spec/1.0/fixtures", "src/ag_ui/spec/1.0/conformance"]

[dependencies]
# Provider/LLM abstraction foundation (typed IDs, credential schema, user-facing
# error taxonomy, capability identity, compact contracts, URL validation). Core
# enables no concrete provider transport or provider-owned module re-exports.
everruns-contracts = { workspace = true, default-features = false }

# Core dependencies
anyhow.workspace = true
thiserror.workspace = true
async-trait.workspace = true

# Async runtime
# `sync` backs channels/locks, `rt` backs parallel turn tasks, and `time` backs
# bounded retry and stream-liveness timers. Default core performs no networking.
tokio = { version = "1.50", default-features = false, features = ["sync", "rt", "time", "macros"] }
# `CancellationToken` for cooperative tool-call cancellation (ToolContext).
tokio-util = { version = "0.7", default-features = false }
futures.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
jsonschema = { version = "0.58.1", default-features = false }
serde_yaml.workspace = true
toml = "1.1"
# Portable archive support is selected independently of core defaults.
zip = { version = "8", default-features = false, features = ["deflate"], optional = true }

# UUID and time
uuid.workspace = true
chrono.workspace = true
rand.workspace = true

# Cron parsing for session-schedule minimum-interval enforcement
cron = "0.17"

# Tracing. Plain `tracing` instrumentation is unconditional. OpenTelemetry
# initialization (SDK, OTLP exporter, tracing-subscriber layers) lives in
# `host::observability` behind explicit exporter features. Default core carries no exporter dependencies.
# Guard: scripts/lib/check-observability-isolation.sh.
tracing.workspace = true
# std time on native, the host clock on wasm32-unknown-unknown.
web-time = "1"

# Encoding
base64.workspace = true
sha2.workspace = true

# Pattern matching
regex.workspace = true
globset.workspace = true

# URL parsing
url = "2"

# Tree-sitter for structural outlines (EVE-248)
tree-sitter = { version = "0.27", optional = true }
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.25", optional = true }

# OpenAPI schema generation (optional, enabled by everruns-server)
utoipa = { workspace = true, optional = true }

# Default core is a portable kernel over everruns-contracts, with no database
# driver or concrete provider transport.

# Plugin system for external integrations
inventory.workspace = true

# Note: LLM simulation (`llmsim`) lives in `everruns-llmsim`; testing/demo
# helpers live in `everruns-test-support` (EVE-875). Core carries neither
# dependency or feature; the architecture
# guard in scripts/lib/check-test-support-isolation.sh enforces it.

# Runtime modules are selectable; default core retains the portable kernel only.
chrono-tz = { version = "0.10", optional = true }
fs2 = { workspace = true, optional = true }
ignore = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["json", "stream", "rustls"] }
eventsource-stream = { workspace = true, optional = true }
serde_urlencoded = { version = "0.7", optional = true }
futures-util = { workspace = true, optional = true }
tree-sitter-bash = { version = "0.25", optional = true }
a2a-wire = { package = "a2a-lf", version = "0.4", optional = true }
a2a-client = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true, features = ["testing"] }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[features]
# Core's default feature set is intentionally empty. Portable structural
# outlines and OpenAPI derives are explicit opt-ins.
# OTLP telemetry lives behind the explicit `otel` host feature.
default = []
engine = []
builtins = ["dep:chrono-tz"]
ui-capabilities = ["builtins"]
host = ["engine", "dep:fs2", "dep:ignore", "dep:libc", "tokio/fs", "tokio/io-util"]
direct-egress = ["host", "dep:reqwest", "reqwest/blocking"]
openai-agents-api = ["direct-egress", "dep:eventsource-stream"]
process = ["host", "tokio/process", "tokio/time"]
native-containment = ["process", "dep:tree-sitter", "dep:tree-sitter-bash", "dep:landlock", "dep:libc", "dep:seccompiler"]
host-shell = ["native-containment"]
mcp = ["dep:serde_urlencoded"]
mcp-stdio = ["mcp", "process"]
ag-ui = []
ag-ui-projection = ["ag-ui"]
ag-ui-client = ["ag-ui", "dep:reqwest", "dep:futures-util"]
a2a = ["dep:a2a-wire", "dep:a2a-client", "dep:reqwest"]
otel = ["host", "tokio/time", "everruns-contracts/tls-aws-lc-rs", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry", "dep:tracing-subscriber"]
braintrust = ["direct-egress", "tokio/time"]
observability = ["otel", "braintrust"]

# Authored agent formats, archive/virtual-folder materialization and semantic diffs.
agent-package = ["dep:zip"]
# Native filesystem effects are a separate opt-in; codec-only hosts use entries.
agent-package-fs = ["agent-package"]
openapi = ["dep:utoipa", "everruns-contracts/openapi"]
tree-sitter-outlines = ["dep:tree-sitter", "dep:tree-sitter-rust", "dep:tree-sitter-typescript", "dep:tree-sitter-python"]

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["full", "test-util"] }
tempfile.workspace = true
insta = { version = "1.40", features = ["json", "redactions"] }

[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { version = "0.4.4", optional = true }
seccompiler = { version = "0.5.0", optional = true }

[[bin]]
name = "everruns-sandbox-exec"
path = "src/host/bin/sandbox_exec.rs"
required-features = ["native-containment"]

[[bin]]
name = "mcp_stdio_echo"
path = "src/mcp/bin/mcp_stdio_echo.rs"
required-features = ["mcp-stdio"]

[[test]]
name = "consolidated"
path = "tests/consolidated/main.rs"

[[test]]
name = "agent_package"
required-features = ["agent-package-fs"]

[package.metadata.docs.rs]
features = ["agent-package-fs"]
