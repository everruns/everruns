# Everruns Provider Abstraction
# Decision: Foundation crate that holds the driver-facing types the LLM provider
# interface is built on (typed IDs, credential form schema, user-facing error
# taxonomy, OpenResponses wire types, URL validation). Extracted from
# everruns-core so provider crates can depend on this instead of core. Core
# consumes a narrow subset privately; callers use this crate's canonical API
# instead of compatibility exports from core.

[package]
name = "everruns-provider"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-provider"
description = "Provider/LLM abstraction foundation shared by Everruns core and provider crates"
readme = "README.md"
keywords = ["everruns", "llm", "provider", "ai", "agents"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# Serialization
serde.workspace = true
serde_json.workspace = true

# IDs / time / text
uuid.workspace = true
regex.workspace = true
url = "2"
chrono.workspace = true

# Async contracts. HTTP transport is isolated behind the default `http`
# feature so contract-only consumers such as everruns-core stay transport-free.
async-trait.workspace = true
futures.workspace = true
tokio = { version = "1.50", default-features = false, features = ["sync", "rt", "time"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls", "blocking"], optional = true }
eventsource-stream = { version = "0.2", optional = true }
http = { version = "1", optional = true }
bytes = { version = "1", optional = true }

# Encoding / hashing / rng
base64.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true

# Errors / tracing
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Optional integrations, mirroring everruns-core's feature gating.
utoipa = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[features]
default = ["http"]
# Shared protocol drivers, request helpers, and streaming reconnect support.
http = ["dep:reqwest", "dep:eventsource-stream", "dep:http", "dep:bytes", "tokio/net", "tls-ring"]
# Process-wide ring selection for products that link multiple rustls providers.
tls-ring = ["dep:rustls"]

# OpenAPI schema derives (utoipa::ToSchema).
openapi = ["dep:utoipa"]
# sqlx Postgres encode/decode for TypedId.
sqlx = ["dep:sqlx"]

[[test]]
name = "tls_startup"
required-features = ["http", "tls-ring"]

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
