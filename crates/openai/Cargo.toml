# OpenAI Provider Implementation
# Decision: Implements the core LlmProvider trait for OpenAI API
# Decision: Uses OpenAI's chat completion API with streaming support

[package]
name = "everruns-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-openai"
description = "OpenAI provider implementation for Everruns"

[dependencies]
# Core dependencies
anyhow.workspace = true
async-trait.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# HTTP client
reqwest = { workspace = true, features = ["multipart"] }
eventsource-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time
chrono.workspace = true
base64.workspace = true

# Tracing
tracing.workspace = true
inventory.workspace = true

# Internal dependencies
everruns-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
