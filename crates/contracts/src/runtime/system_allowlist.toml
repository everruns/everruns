# System-wide outbound allowlist ("green list").
#
# Curated, internal list of well-known public resources that the global egress
# boundary permits when the allowlist is enabled
# (EVERRUNS_EGRESS_POLICY=curated-writes or curated-all). This is NOT end-user configuration —
# it ships with the binary and is reviewed by maintainers.
#
# Organized into named groups so it stays manageable. Pattern format matches the
# NetworkAccessList rules (see knowledge/operations/network-access.md):
#   - example.com            exact domain (any port/path)
#   - *.example.com          domain and all subdomains (apex included)
#   - https://example.com/x/ URL prefix (scheme + host + path)
#
# What gets in. In `curated-writes` this list decides where an agent may send
# data, so an entry is a judgement about the receiver, not the content:
#   - A reputable vendor whose subdomains it runs itself, or that hosts its
#     customers' authenticated instances (*.atlassian.net, *.sharepoint.com).
#     Someone can still sign up for that vendor and receive data with their
#     own credentials; the threat model accepts that (TM-AGENT-035).
#   - Registries restricted to governments and treaty organizations (*.gov,
#     *.gov.ua, *.europa.eu, *.int).
# What stays out, even under a listed vendor: anything that runs or serves a
# customer's own code or pages (static hosting, functions, app platforms,
# sandboxes with public ports, workflow webhooks that relay onward), services
# that fetch or act on arbitrary URLs for the caller (hosted browsers, crawlers
# with page actions, code sandboxes), dedicated anonymous form, paste, and
# URL-shortener services, and storage buckets. List the
# vendor's API hosts exactly instead of a wildcard when its domain mixes the
# two (Google, Microsoft, Zoho, HubSpot, AWS). The tests in
# `system_allowlist.rs` pin examples of both sides. Matching is a hash lookup
# per host label, so the list can grow without slowing requests down.

[groups.package_registries]
description = "Language and package manager registries (npm, crates, pypi, ...)."
