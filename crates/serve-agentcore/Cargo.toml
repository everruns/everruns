# Amazon Bedrock AgentCore Runtime hosting target for the experimental `serve`
# agent framework.
#
# Decisions:
# - A crate of its own on serve's public hosting seam (`serve::Server`), not a
#   serve feature: the platform contract (`/ping`, `/invocations`, port 8080)
#   stays out of serve, and the next target is another sibling crate.
# - No AWS SDK in the hosting path: AgentCore Runtime talks plain HTTP to the
#   container, and authentication happens in front of it. The AWS SDK arrives
#   only through serve's default-on `bedrock` feature, for model calls: an
#   AgentCore app names `bedrock/<model-id>` and runs on the execution role.
# - Experimental (Alpha): published as `everruns-serve-agentcore` at the
#   platform version, with no compatibility promise.

[package]
name = "everruns-serve-agentcore"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-serve-agentcore"
description = "Run a serve app (experimental) on Amazon Bedrock AgentCore Runtime: /ping, /invocations, port 8080"
readme = "README.md"
keywords = ["agent", "agentcore", "aws", "bedrock", "ag-ui"]
categories = ["development-tools", "web-programming::http-server"]

[lib]
name = "serve_agentcore"

[features]
# `bedrock/<model-id>` models on the runtime's execution role (serve's
# `bedrock` feature). Default because AgentCore always runs with an AWS role
# and region; disable default features to drop the AWS SDK.
default = ["bedrock"]
bedrock = ["everruns-serve/bedrock"]

[dependencies]
everruns-serve = { workspace = true, features = ["ag-ui"] }
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
# `HostShell` for `[sandbox] kind = "microvm"`: the session's microVM is the boundary.
everruns = { workspace = true, features = ["host-shell"] }
futures-util.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true
uuid.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
