# Throwaway PostgreSQL for DEV_MODE and tests.
#
# Decision: dev runs and tests use a real PostgreSQL started on demand rather
# than a second, in-memory implementation of every repository. Binaries come
# from Zonky's builds on Maven Central through postgresql_embedded. The library
# owns installation and cluster lifecycle; this crate adds process-wide sharing,
# owner-exit cleanup, and template database operations. Not published.

[package]
name = "everruns-pg-embedded"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
description = "Per-process temporary PostgreSQL for everruns dev mode and tests"

[dependencies]
anyhow.workspace = true
libc = "0.2"
postgresql_embedded = { version = "0.21", default-features = false, features = ["tokio", "zonky", "tls-rustls-aws-lc-rs"] }
sqlx.workspace = true
tempfile.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[lints]
workspace = true
