[package]
name = "everruns-ag-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-ag-ui"
description = "Deprecated shim: use everruns-core ag_ui module"
readme = "README.md"
keywords = ["agent", "ag-ui", "protocol", "llm", "sse"]
categories = ["api-bindings", "web-programming"]
# The fixture and conformance corpora and their tests are repo-only; the
# schema ships because it is embedded.
exclude = ["spec/1.0/fixtures", "spec/1.0/conformance", "tests"]


[dependencies]
everruns-core = { workspace = true, default-features = false, features = ["ag-ui"] }

[features]
default = []
core = ["everruns-core/ag-ui-projection"]
client = ["everruns-core/ag-ui-client"]

[lints]
workspace = true
