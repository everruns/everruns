[package]
name = "everruns-agentd-testkit"
description = "Test-only cell node binary (simulated models) and the chaos and load drivers."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true

# Old crate name kept until the follow-up identifier rename (see agentd's
# Cargo.toml).
[lib]
name = "everruns_cell_testkit"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
everruns-agentd = { path = "../agentd" }
everruns = { workspace = true, features = ["macros", "capabilities", "builtins", "filesystem", "agent-package-fs"] }
everruns-core = { workspace = true, features = ["host"] }
everruns-contracts = { workspace = true, features = ["dataplane-seal", "session-sandbox", "runtime"] }
inventory = { workspace = true }
everruns-llmsim = { workspace = true, features = ["host"] }
async-trait.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
reqwest.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
rand.workspace = true
uuid.workspace = true
tikv-jemallocator.workspace = true
axum.workspace = true
parking_lot.workspace = true
chrono.workspace = true
jsonwebtoken.workspace = true
aws-lc-rs = "1"
base64.workspace = true

[dev-dependencies]
tempfile.workspace = true
tar.workspace = true
zstd.workspace = true

[[bin]]
name = "cell-testnode"
path = "src/bin/testnode.rs"

[[bin]]
name = "cell-drive"
path = "src/bin/drive.rs"

[[bin]]
name = "cell-baseline"
path = "src/bin/baseline.rs"
