# Durable turn backend for Everruns.
#
# Runs agent turns as queued, checkpointed steps on `everruns-durable`, behind
# core's `TurnBackend` seam. Published so an application can choose durable
# execution; it therefore carries no transport and nothing private to the
# platform (the worker owns the gRPC stores). Enforced by
# `scripts/lib/check-durable-isolation.sh`.

[package]
name = "everruns-durable-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-durable-engine"
description = "Durable turn backend for Everruns: agent turns as queued, checkpointed steps on everruns-durable behind core's TurnBackend"
readme = "README.md"
keywords = ["agent", "durable", "workflow", "llm", "postgres"]
categories = ["asynchronous", "development-tools"]

[dependencies]
everruns-contracts = { workspace = true, default-features = false }
everruns-core = { workspace = true, default-features = false, features = ["engine", "host"] }
everruns-durable.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
# Deterministic provider for the driver's end-to-end test over the in-process
# runtime host (`turn_driver_tests`).
everruns-llmsim = { workspace = true, features = ["host"] }

[lints]
workspace = true
