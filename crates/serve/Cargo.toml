# serve: an experimental agent framework on top of `everruns`.
#
# Decisions:
# - Topcoat's application shape (`serve::start(App::builder().discover().build())`,
#   attribute macros, one `&Cx` context) over eve's hosting model (file layout
#   as convention, a build-time manifest as the host contract).
# - The wire API is a subset of the everruns server's `/v1` API, so the
#   everruns SDK, CLI and UI drive a serve app unchanged.
# - Registration is link-time (`inventory`), because Rust cannot scan the
#   filesystem at runtime; `serve-build` embeds `agent/**` at build time.
# - A thin layer over `everruns::Engine`: the durable event log, approvals
#   and ask_user are the runtime's. serve's SQLite holds only its session
#   catalog and channel threads. No new runtime.
# - Experimental (Alpha): published at the platform version, but with no
#   compatibility promise and outside the everruns stability policy.
# - Published as `everruns-serve` (crates.io `serve` is taken). The library
#   keeps the name `serve`, because the macros expand to `::serve::…` paths
#   and apps write `serve::start(...)`.

[package]
name = "everruns-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-serve"
description = "Experimental agent framework over everruns: attribute macros, a build-time manifest, and a /v1 wire API"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "framework"]
categories = ["development-tools", "web-programming::http-server"]

[lib]
name = "serve"

[features]
# `POST /v1/e/{agent}/ag-ui`: serve every top-level agent to AG-UI 1.0 clients
# (CopilotKit, `@ag-ui/client`) through `everruns::ag_ui`.
ag-ui = ["everruns/ag-ui-axum"]
# `POST /v1/e/{agent}/a2a`: serve every top-level agent to A2A 1.0 callers
# (JSON-RPC, with an Agent Card) through the A2A Rust SDK's server.
a2a = ["dep:a2a", "dep:a2a-server"]
# `bedrock/<model-id>` models: Amazon Bedrock on the AWS default credential
# chain (an IAM role, ECS/AgentCore container credentials, instance profile,
# SSO/profile, env), routed when AWS_REGION or AWS_DEFAULT_REGION is set. Off by
# default because it pulls in the AWS SDK; serve-agentcore turns it on.
bedrock = ["everruns/bedrock"]

[dependencies]
everruns = { workspace = true, default-features = true, features = ["local", "openai", "openrouter", "mcp", "bashkit"] }
everruns-serve-macros.workspace = true
a2a = { workspace = true, optional = true }
a2a-server = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
axum-extra.workspace = true
chrono.workspace = true
clap.workspace = true
cron = "0.17"
futures.workspace = true
hex.workspace = true
hmac.workspace = true
inventory.workspace = true
reqwest.workspace = true
everruns-durable = { workspace = true, features = ["sqlite"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["full"] }
toml = "1"
uuid.workspace = true

[dev-dependencies]
everruns-sdk.workspace = true
tempfile.workspace = true

[lints]
workspace = true
