# The shared turn engine for the Everruns agentic runtime.
#
# Decision (EVE-840, Sans-IO Turn State epic): the authoritative turn-planning
# brain and portable Input/Reason/Act algorithms live here. Planning remains
# pure; execution effects cross injected contracts owned by core/provider.
#
# Dependency direction is strictly `engine -> core/provider/capability`. The engine never
# depends on host/server/worker/platform/durable/scale (enforced by
# crates/engine/tests/dependency_direction.rs).

[package]
name = "everruns-engine"
version = "0.18.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-engine"
description = "Shared Input/Reason/Act execution and sans-IO turn planning for Everruns hosts"
readme = "README.md"
keywords = ["agent", "agentic", "llm", "ai", "state-machine"]
categories = ["development-tools", "asynchronous"]

[dependencies]
# Neutral contracts and domain value types used by the portable execution
# algorithms and planner. Direction is engine -> core/provider/capability.
everruns-core = { workspace = true }
everruns-capability = { workspace = true }
everruns-provider.workspace = true

async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
