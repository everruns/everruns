[package]
name = "everruns-worker"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Experimental sandboxed Lua execution capability (knowledge/execution/lua-execution.md).
# Off by default; `lua` compiles the mlua engine into core. Also runtime-gated
# by FEATURE_LUA.
lua = ["everruns-capabilities/lua", "everruns/lua"]

[dependencies]
everruns-integrations = { workspace = true, features = ["bashkit", "daytona", "browserless", "e2b", "typesafe", "openai-decisions"] }
everruns-integrations-experimental = { workspace = true, features = ["deno", "sprites"] }


mimalloc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true

everruns-contracts = { workspace = true, default-features = false }
# Private turn/workflow entry, including optional backends and telemetry wiring.
everruns-durable-engine.workspace = true
# Feature selection only: worker-only core surface (MCP, OpenAI Agents API,
# telemetry exporters, tree-sitter outlines). Source still reaches core through
# durable-engine's `core` re-export; see scripts/lib/check-durable-isolation.sh.
everruns-core = { workspace = true, default-features = false, features = ["mcp", "observability", "openai-agents-api", "tree-sitter-outlines"] }
# Production-safe deterministic `llmsim` provider (seeded LlmSim models and
# LLMSIM_DEMO scenarios). Testing/demo helpers stay out of the worker tree.
everruns-llmsim.workspace = true
clap = { workspace = true, features = ["string"] }
everruns-cli-contract.workspace = true
everruns-capabilities = { path = "../capabilities", features = ["embedded-platform-docs", "environment-capabilities", "hosted-integration-catalog", "portable-builtins", "a2a", "ag-ui", "container-sandbox"] }
everruns-drivers = { workspace = true, features = [
    "chatgpt",
    "anthropic",
    "bedrock",
    "cloudflare",
    "fireworks",
    "gemini",
    "mai",
    "meta",
    "mistral",
    "openai",
    "openrouter",
    "vercel",
] }
everruns-internal-protocol = { path = "../internal-protocol" }

chrono.workspace = true
async-trait.workspace = true
reqwest.workspace = true
base64.workspace = true

# gRPC dependencies
tonic.workspace = true
prost-types.workspace = true

everruns = { workspace = true, default-features = false, features = ["bashkit", "utility-llm"] }
[dev-dependencies]
# Deterministic network simulator. Used by tests/network_reliability_test.rs to
# exercise worker↔control-plane transport faults (partitions, latency, reorder)
# with a simulated clock. See knowledge/runtime-resources/agent-reliability-tests.md scenario 3.
turmoil.workspace = true
tokio = { workspace = true }

[lints]
workspace = true
