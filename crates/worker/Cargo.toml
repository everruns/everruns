[package]
name = "everruns-worker"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Experimental sandboxed Lua execution capability (knowledge/execution/lua-execution.md).
# Off by default; `lua` compiles the mlua engine into core. Also runtime-gated
# by FEATURE_LUA.
lua = ["everruns-platform/lua", "everruns-host/lua"]

[dependencies]
mimalloc.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true

everruns-capability = { workspace = true }
everruns-core = { path = "../core", features = ["tree-sitter-outlines"] }
everruns-engine.workspace = true
everruns-provider.workspace = true
# Telemetry init (OTLP exporter + tracing-subscriber layers) — installed
# explicitly by the worker binary; core no longer ships it (EVE-876).
everruns-observability = { workspace = true }
# Deterministic `llmsim` provider (seeded LlmSim models, LLMSIM_DEMO
# scenarios). `sim` only — the worker never links the demo fixture
# capabilities; scripts/lib/check-test-support-isolation.sh guards this.
everruns-test-support = { workspace = true, features = ["sim"] }
everruns-platform = { path = "../platform", features = ["embedded-platform-docs", "environment-capabilities", "portable-builtins", "a2a"] }
everruns-integrations-docker = { path = "../../integrations/docker" }
everruns-integrations-brave-search = { path = "../../integrations/brave-search" }
everruns-integrations-openai-image = { path = "../../integrations/openai-image" }
everruns-integrations-parallel = { path = "../../integrations/parallel" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }
everruns-integrations-github = { path = "../../integrations/github" }
everruns-integrations-cursor = { path = "../../integrations/cursor" }
everruns-integrations-daytona = { path = "../../integrations/daytona" }
everruns-integrations-deno = { path = "../../integrations/deno" }
everruns-integrations-browserless = { path = "../../integrations/browserless" }
everruns-integrations-e2b = { path = "../../integrations/e2b" }
everruns-integrations-sprites = { path = "../../integrations/sprites" }
everruns-container-sandbox = { path = "../container-sandbox" }
everruns-openai = { path = "../openai" }
everruns-openrouter = { path = "../openrouter" }
everruns-mai = { path = "../mai" }
everruns-fireworks = { path = "../fireworks" }
everruns-meta = { path = "../meta" }
everruns-anthropic = { path = "../anthropic" }
everruns-gemini = { path = "../gemini" }
everruns-bedrock = { path = "../bedrock" }
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-mcp.workspace = true
everruns-http.workspace = true
everruns-ard.workspace = true
everruns-host = { workspace = true, features = ["bashkit", "mcp", "utility-openai"] }
# Note: Workers don't need direct DB access - all DB operations go through gRPC
# The durable module is used for control-plane direct DB mode (avoids circular gRPC dependency)
everruns-durable = { path = "../durable" }
sqlx.workspace = true

chrono.workspace = true
async-trait.workspace = true
reqwest.workspace = true
base64.workspace = true

# gRPC dependencies
tonic.workspace = true
prost-types.workspace = true

[dev-dependencies]
# Deterministic network simulator. Used by tests/network_reliability_test.rs to
# exercise worker↔control-plane transport faults (partitions, latency, reorder)
# with a simulated clock. See knowledge/runtime-resources/agent-reliability-tests.md scenario 3.
turmoil.workspace = true
tokio = { workspace = true }
