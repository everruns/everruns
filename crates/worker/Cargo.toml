[package]
name = "everruns-worker"
publish = false
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Experimental sandboxed Lua execution capability (specs/lua-execution.md).
# Off by default; `lua` compiles the mlua engine into core. Also runtime-gated
# by FEATURE_LUA.
lua = ["everruns-core/lua"]

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true

everruns-config = { path = "../config" }
everruns-core = { path = "../core", features = ["embedded-platform-docs", "tree-sitter-outlines", "ui-capabilities"] }
everruns-integrations-docker = { path = "../../integrations/docker" }
everruns-integrations-brave-search = { path = "../../integrations/brave-search" }
everruns-integrations-parallel = { path = "../../integrations/parallel" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }
everruns-integrations-github = { path = "../../integrations/github" }
everruns-integrations-cursor = { path = "../../integrations/cursor" }
everruns-integrations-daytona = { path = "../../integrations/daytona" }
everruns-integrations-deno = { path = "../../integrations/deno" }
everruns-integrations-browserless = { path = "../../integrations/browserless" }
everruns-integrations-e2b = { path = "../../integrations/e2b" }
everruns-integrations-sprites = { path = "../../integrations/sprites" }
everruns-container-sandbox = { path = "../container-sandbox" }
everruns-openai = { path = "../openai" }
everruns-anthropic = { path = "../anthropic" }
everruns-gemini = { path = "../gemini" }
everruns-bedrock = { path = "../bedrock" }
everruns-internal-protocol = { path = "../internal-protocol" }
everruns-mcp.workspace = true
everruns-runtime = { path = "../runtime" }
# Note: Workers don't need direct DB access - all DB operations go through gRPC
# The durable module is used for control-plane direct DB mode (avoids circular gRPC dependency)
everruns-durable = { path = "../durable" }
sqlx.workspace = true

chrono.workspace = true
async-trait.workspace = true
reqwest.workspace = true
base64.workspace = true

# gRPC dependencies
tonic.workspace = true
prost-types.workspace = true

[dev-dependencies]
# Deterministic network simulator. Used by tests/network_reliability_test.rs to
# exercise worker↔control-plane transport faults (partitions, latency, reorder)
# with a simulated clock. See specs/agent-reliability-tests.md scenario 3.
turmoil.workspace = true
tokio = { workspace = true }
