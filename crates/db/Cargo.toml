# Database utilities shared by Everruns crates.
#
# Decision: this crate owns embedded database construction (the `sqlite`
# wrapper) and the storage-neutral `UpdateField` type, so crates that only need
# SQLite (the facade's `local` feature, serve hosts) or the update type (server
# storage) do not depend on the durable engine for them. It is a leaf: no
# `everruns-*` dependency, so `everruns-durable` may depend on it and stay
# generic. It is an owner in `scripts/lib/check-database-driver-isolation.py`.

[package]
name = "everruns-db"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-db"
description = "Database utilities for Everruns: embedded SQLite connections and the UpdateField update type"
readme = "README.md"
keywords = ["database", "sqlite", "everruns"]
categories = ["database"]

[dependencies]
rusqlite = { version = "0.39", features = ["bundled", "backup"], optional = true }

[features]
# Off by default: `UpdateField` alone compiles no database driver.
sqlite = ["dep:rusqlite"]

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
