# Agentic Resource Discovery (ARD) client capability
# Decision: Platform capability crate (like MCP / A2A), auto-registered via the
#   inventory plugin system. Not an external-service integration.
# Decision: Client/consumer side only — discover + attach external MCP servers and
#   A2A agents via ARD registries. Publishing (ARD-as-a-server) is tracked separately.
# Decision: Connection-backed — registry auth header via a connection provider,
#   with a fallback session-secret/env var for operator/test use.

[package]
name = "everruns-ard"
readme = "README.md"
version = "0.18.2"
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Agentic Resource Discovery (ARD) client capability for Everruns agents"
keywords = ["everruns", "ard", "discovery", "mcp", "agents"]
categories = ["api-bindings", "development-tools"]
documentation = "https://docs.rs/everruns-ard"

[dependencies]
everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): the ARD connector registers into the hosted
# connector plugin system, which lives in the platform crate.
everruns-platform.workspace = true
inventory.workspace = true

# HTTP client for ARD registry REST API
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
url = "2"

[features]
# Gate live registry tests against the public ARD reference registry.
# CI live jobs pass --features ard-live-tests.
ard-live-tests = []

[dev-dependencies]
everruns-host = { version = "0.20.0", path = "../host", features = ["direct-egress"] }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
