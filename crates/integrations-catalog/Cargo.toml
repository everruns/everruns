# Hosted Integration Catalog
# Decision: the one place that names every integration crate composed into the
# hosted product. Sits above everruns-capabilities because integration crates
# depend on platform for the connector and sandbox contracts.

[package]
name = "everruns-integrations-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-catalog"
description = "The catalog of integrations composed into the hosted Everruns product"
keywords = ["everruns", "integrations", "agents"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[dependencies]
everruns-integrations = { workspace = true, features = ["brave-search", "brave-search-hosted", "browserless", "cursor", "daytona", "docker", "duckduckgo", "e2b", "github", "modal", "openai-image", "parallel", "typesafe", "typesafe-hosted"] }
everruns-integrations-experimental = { workspace = true, features = ["agentid", "deno", "sprites"] }

everruns-contracts.workspace = true
everruns-core.workspace = true
everruns-capabilities.workspace = true

everruns-ard.workspace = true
# Feature-module integrations (one crate, one feature per vendor).

[lints]
workspace = true
