# Hosted Integration Catalog
# Decision: the one place that names every integration crate composed into the
# hosted product. Sits above everruns-platform because integration crates
# depend on platform for the connector and sandbox contracts.

[package]
name = "everruns-integrations-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-catalog"
description = "The catalog of integrations composed into the hosted Everruns product"
keywords = ["everruns", "integrations", "agents"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[dependencies]
everruns-core.workspace = true
everruns-platform.workspace = true

everruns-ard.workspace = true
everruns-integrations-brave-search = { path = "../../integrations/brave-search", version = "0.32.0", features = ["hosted"] }
everruns-integrations-browserless = { path = "../../integrations/browserless", version = "0.32.0" }
everruns-integrations-cursor = { path = "../../integrations/cursor", version = "0.32.0" }
everruns-integrations-daytona = { path = "../../integrations/daytona", version = "0.32.0" }
everruns-integrations-deno = { path = "../../integrations/deno", version = "0.32.0" }
everruns-integrations-docker = { path = "../../integrations/docker", version = "0.32.0" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo", version = "0.32.0" }
everruns-integrations-e2b = { path = "../../integrations/e2b", version = "0.32.0" }
everruns-integrations-github = { path = "../../integrations/github", version = "0.32.0" }
everruns-integrations-openai-image = { path = "../../integrations/openai-image", version = "0.32.0" }
everruns-integrations-parallel = { path = "../../integrations/parallel", version = "0.32.0" }
everruns-integrations-sprites = { path = "../../integrations/sprites", version = "0.32.0" }
everruns-integrations-typesafe = { path = "../../integrations/typesafe", version = "0.32.0", features = ["hosted"] }

[lints]
workspace = true
