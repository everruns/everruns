[package]
name = "everruns-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-platform"
description = "Moved to everruns-capabilities. Deprecated shim, no longer updated."
readme = "README.md"
keywords = ["deprecated", "everruns", "agents"]
categories = ["asynchronous"]

[dependencies]
everruns-capabilities = { workspace = true, default-features = false }

[features]
default = []
openapi = ["everruns-capabilities/openapi"]
embedded-platform-docs = ["everruns-capabilities/embedded-platform-docs"]
portable-builtins = ["everruns-capabilities/portable-builtins"]
environment-capabilities = ["everruns-capabilities/environment-capabilities"]
lua = ["everruns-capabilities/lua"]
a2a = ["everruns-capabilities/a2a"]
ag-ui = ["everruns-capabilities/ag-ui"]
email-resend = []
container-sandbox = ["everruns-capabilities/container-sandbox"]
container-sandbox-live-tests = ["everruns-capabilities/container-sandbox-live-tests"]

[lints]
workspace = true
