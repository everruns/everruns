# Backend platform/identity domain entities for Everruns.
#
# Decision (EVE-837): the platform crate owns the durable backend identity
# aggregates that were historically defined in `everruns-core` — starting with
# the `Organization` and `Principal` entity structs. EVE-838 extended it with
# the payment accounting, reporting, and audit records. EVE-845 added the
# auth-facing identity values no core code names (OrgMembership, ANONYMOUS_USER_*,
# generate_org_public_id/validate_org_public_id, PrincipalStatus). Cross-cutting
# value types that core's runtime, permissions, and domain models embed (OrgRole,
# PrincipalKind, PrincipalSummary, the DEFAULT_ORG_* constants, and the payment
# execution contract PaymentRail/PaymentMethod/MachinePaymentRequest/
# MachinePaymentResponse) remain in `everruns-core` and are re-exported here.
#
# Dependency direction is strictly `platform -> core`. Core never depends on
# platform (enforced by crates/core/tests/no_platform_dependency.rs).

[package]
name = "everruns-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-platform"
description = "Backend control-plane entities and store contracts for the Everruns Platform"
readme = "README.md"
keywords = ["agent", "agentic", "multitenancy", "identity", "everruns"]
categories = ["development-tools", "asynchronous"]

[features]
# Default build stays free of OpenAPI/SQLx subtrees, matching how provider-only
# consumers depend on core.
default = []
# OpenAPI schema generation (utoipa ToSchema derives). Mirrors the server build,
# which activates `everruns-core/openapi`.
openapi = ["dep:utoipa", "everruns-core/openapi"]
# Embed the workspace `docs/` tree into the platform-management docs tools,
# mirroring core's former build. Off by default; the build script gates the
# actual embedding on the docs directory existing (EVE-839).
embedded-platform-docs = ["dep:include_dir", "everruns-core/embedded-platform-docs"]
# SQLx support for the typed IDs embedded in these entities. Passthrough to core,
# kept for parity with server builds that enable `everruns-core/sqlx`.
sqlx = ["everruns-core/sqlx"]

[dependencies]
# Cross-cutting value types (OrgRole, PrincipalKind/PrincipalSummary, Caller, the
# payment execution contract), typed IDs, domain aggregates
# (Harness/Agent/Session), and the DEFAULT_ORG_* constants live in core; the
# platform aggregates embed and re-export them. Direction is platform -> core.
everruns-core = { workspace = true }

serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Async traits for the reporting/audit contracts, plus their error and runtime
# support (reporting/audit returns, audit fire-and-forget emit).
async-trait.workspace = true
anyhow.workspace = true
tokio.workspace = true
tracing.workspace = true

# Connector plugin registration (EVE-879): integration crates submit
# `ConnectorPlugin` entries the server discovers at startup.
inventory.workspace = true

# System email senders (EVE-879): typed EmailError plus the direct Resend HTTP
# client. System email intentionally uses its own provider client outside the
# runtime egress boundary — it is operator-owned deployment traffic.
thiserror.workspace = true
reqwest = { workspace = true, features = ["json", "rustls"] }

# OpenAPI schema generation (optional, enabled by everruns-server).
utoipa = { workspace = true, optional = true }

# Embeds the workspace docs tree for the platform-management docs tools when the
# `embedded-platform-docs` feature is on (EVE-839; moved with the capability).
include_dir = { version = "0.7", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
serde_json.workspace = true
