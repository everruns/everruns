# Testing and demo helpers for Everruns agents.
#
# This crate carries the in-memory agentic loop, mock/echo/failing test
# doubles, writable stores, and the fake
# demo capabilities (AWS/CRM/financial/warehouse, test math/weather,
# sample-data and noop fixtures). The simulator itself lives in the
# production-safe `everruns-llmsim` crate. Production compositions must never
# depend on this crate or register the `fixtures` surface; the architecture guard in
# scripts/lib/check-test-support-isolation.sh enforces that server/worker
# code cannot import the demo capabilities and that core and the provider
# crates carry no llmsim edge at all.

[package]
name = "everruns-test-support"
version = "0.18.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-test-support"
readme = "README.md"
description = "In-memory loops, test doubles, writable fixtures, and demo capabilities for testing Everruns agents"
keywords = ["agent", "agentic", "llm", "testing", "simulation"]
categories = ["development-tools", "asynchronous"]

[features]
# Everything on by default: test crates want the whole kit.
default = ["sim", "fixtures", "host"]
# Enables the simulator-backed in-memory loop and the deliberate 0.18
# compatibility re-exports for the 0.17 simulator paths. The implementation
# and stable production dependency live in `everruns-llmsim`.
sim = ["dep:everruns-llmsim"]
# Fake demo capabilities: fake AWS/CRM/financial/warehouse, test math and
# weather, the sample-data mount demo, and the noop fixture. The fake AWS
# connector registers into the hosted connector plugin system, which lives in
# the platform crate (EVE-879) — only this fixture surface links it, so the
# `sim`-only consumers (the `everruns` facade, the worker) stay platform-free
# through this crate.
fixtures = ["dep:everruns-platform"]
# Host-backed in-memory loop, store helpers, and the transitional
# `.llm_sim(...)` / `.llm_sim_as_default(...)` extension re-export.
host = ["dep:everruns-host", "sim", "everruns-llmsim/host"]

[dependencies]
everruns-core = { path = "../core", version = "0.18.0", default-features = false }
everruns-engine.workspace = true
everruns-capability.workspace = true
everruns-provider.workspace = true
everruns-llmsim = { workspace = true, optional = true }
everruns-host = { workspace = true, optional = true }
everruns-platform = { workspace = true, optional = true }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
inventory.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
uuid.workspace = true

[dev-dependencies]
everruns-builtins.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
