# Anthropic Provider Implementation
# Decision: Implements the core LlmProvider trait for Claude API
# Decision: Uses Anthropic's messages API with streaming support

[package]
name = "everruns-anthropic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-anthropic"
description = "Anthropic (Claude) provider for Everruns agents"
readme = "README.md"
keywords = ["agent", "llm", "ai", "anthropic", "claude"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
# Core dependencies
async-trait.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# HTTP client
reqwest.workspace = true
eventsource-stream.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Date/time
chrono.workspace = true

# Tracing
tracing.workspace = true

# Internal dependencies
everruns-core.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
