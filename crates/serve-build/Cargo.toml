# Build-script helper for the experimental `serve` agent framework.
#
# Decision: kept separate from `serve` so an application's build.rs compiles
# this dependency-free crate instead of a second copy of the whole runtime.
# Experimental (Alpha): published as `everruns-serve-build` at the platform
# version, with no compatibility promise.

[package]
name = "everruns-serve-build"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-serve-build"
description = "build.rs helper for serve (experimental): embeds agent/**/*.md and serve.toml"
readme = "README.md"

keywords = ["agent", "agentic", "llm", "ai", "build"]
categories = ["development-tools::build-utils"]

[lib]
name = "serve_build"

[dependencies]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
