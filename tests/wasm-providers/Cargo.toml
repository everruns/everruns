[package]
name = "wasm-provider-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
everruns-contracts = { path = "../../crates/contracts", default-features = false, features = ["http"] }
everruns-drivers = { path = "../../crates/drivers/drivers", features = ["openai", "openrouter"] }
futures = "0.3"
js-sys = "0.3"
serde_json = "1"
worker = "0.8.7"
