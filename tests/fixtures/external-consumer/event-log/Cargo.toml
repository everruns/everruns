[package]
name = "external-event-log"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
everruns-core = { path = "../../../../crates/core" }
everruns-capability = { path = "../../../../crates/capability" }
everruns-provider = { path = "../../../../crates/provider", default-features = false }
everruns-host = { path = "../../../../crates/host" }
everruns-session-services = { path = "../../../../crates/session-services" }

[dev-dependencies]
everruns-test-support = { path = "../../../../crates/test-support" }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
