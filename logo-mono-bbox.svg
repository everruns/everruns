<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 512 512">

  <!--
    Bounding-box (optically) centered variant. Same equilateral ring
    arrangement as logo-mono.svg (true 3-fold symmetry, side d = 125.34,
    r = 120), translated so the artwork's visual bounding box is centered
    in the canvas. Centroid of the ring centers sits at (256, 274.09).
  -->

  <!-- Rings -->
  <g fill="none"
     stroke="#0A0A0A"
     stroke-width="18"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Top -->
    <circle cx="256" cy="201.73" r="120"/>

    <!-- Bottom-left -->
    <circle cx="193.33" cy="310.27" r="120"/>

    <!-- Bottom-right -->
    <circle cx="318.67" cy="310.27" r="120"/>

  </g>
</svg>
