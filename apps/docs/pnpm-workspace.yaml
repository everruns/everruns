packages: []
overrides:
  dompurify: 3.4.17
  http-cache-semantics: 4.3.0
  vite: 8.3.3
  katex: 0.18.2
  '@astrojs/mdx': 6.0.2
  esbuild: 0.28.1
  fast-uri: 3.1.9
  form-data: 4.0.6
  lodash: 4.17.23
  nanoid: 3.3.18
  postcss: 8.5.23
  smol-toml: 1.9.0
  source-map-js: 1.2.2
  postcss-selector-parser: 7.1.6
  yaml: 2.8.4
