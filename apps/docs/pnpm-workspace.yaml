  starlight-openapi@0.27.0: patches/starlight-openapi@0.27.0.patch
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# Security patches remain pinned to exact versions via the overrides above:
# form-data 4.0.6 (GHSA-hmw2-7cc7-3qxx), esbuild 0.28.1 (GHSA-g7r4-m6w7-qqqr),
# fast-uri 3.1.8 (supersedes the 3.1.6 pin for GHSA-v2hh-gcrm-f6hx; GHSA-5jgf-p345-68v8,
# GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc and GHSA-fph4-wmhf-6fwf cover every 3.x
# through 3.1.5, and GHSA-58mr-gqgx-xq4g, GHSA-qw65-cvwx-89v3 and GHSA-hrr3-gc8f-f4qj
# cover 3.1.6 — host confusion, authority injection, and case normalization —
# reached via @astrojs/check > @astrojs/language-server > volar-service-json.
# 3.1.9 also fixes encoded schemes, unchecked WHATWG host canonicalization,
# relative-path equivalence and suffix scheme injection (GHSA-w74x-v6f9-j3xg,
# GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h, GHSA-333x-w4r6-6crp)),
# nanoid 3.3.18 (custom generators loop indefinitely at size 0; reached via
# postcss). GHSA-2v37-7h3g-55p8
# was widened to `<3.3.18` on 2026-08-13 after 3.3.17 proved an incomplete fix, so
# the previous 3.3.17 pin — recorded here as the patched release — was still inside
# the advisory. 3.3.18 is the actual fix. Exact-pinned via overrides.
# smol-toml 1.8.0 (GHSA-7w5x-hrqm-74c2 — DoS via malformed TOML in every release
# through 1.7.0, reached via @astrojs/markdown-satteri > @astrojs/internal-helpers)
# unifies the tree because sibling copies already resolve to 1.8.0. 1.9.0
# supersedes it for GHSA-r4xh-jqrq-34v2, which covers every release through 1.8.0.
# source-map-js 1.2.2 (GHSA-68fv-2mgg-jv7q) and postcss-selector-parser 7.1.6
# (GHSA-rj75-hqrm-r3gf) are reached via expressive-code; 6.x has no patched
# release, so the override lifts postcss-nested's copy onto the 7.x line.
# undici 8.12.2 fixes TLS validation, cross-origin cache disclosure and parser
# DoS advisories in Astro's unifont dependency. Scope the override to 8.x so
# other consumers retain their declared major version.
allowBuilds:
  esbuild: true
