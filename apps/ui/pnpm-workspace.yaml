packages: []
overrides:
  zod: 4.6.7
  source-map-js: 1.2.2
  katex: 0.18.2
  # The app's own @ag-ui/core is 1.0 (the server speaks AG-UI 1.0, EVE-1135).
  # @openuidev/react-headless still declares a 0.0.x range, so it alone stays
  # on the 0.0.x line it was tested against.
  '@openuidev/react-headless>@ag-ui/core': 0.0.59
  '@babel/core': 7.29.6
  brace-expansion@1: 1.1.21
  brace-expansion@2: 2.1.7
  dompurify: 3.4.17
  fast-uri: 3.1.9
  body-parser: 2.4.0
  # CopilotKit uses the stable Map/Marker/Popup API; force the sanitizer fix
  # across its optional map peer as well as the shared renderer dependency.
  maplibre-gl: 6.4.1
  js-yaml: 4.3.2
  mermaid: 11.16.1
  nanoid: 3.3.18
  postcss: 8.5.23
  prismjs: 1.30.0
  sharp: 0.35.5
  uuid: 11.1.1
  ws: ^8.21.0
onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - sharp
  - unrs-resolver
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
# The explicitly selected compiler migration is pinned, including native binaries.
minimumReleaseAgeExclude:
  # Exact security fixes for the shared renderer dependency graph.
  - "maplibre-gl@6.4.1"
  - "body-parser@2.4.0"
  - "fast-uri@3.1.9"
  # A2UI 1.0 standard catalog selected for shared chat rendering.
  - "@copilotkit/a2ui-renderer@1.83.0"
  - "@copilotkit/core@1.83.0"
  - "@copilotkit/learning@1.83.0"
  - "@copilotkit/mcp-apps-renderer@1.83.0"
  - "@copilotkit/react-core@1.83.0"
  - "@copilotkit/runtime-client-gql@1.83.0"
  - "@copilotkit/shared@1.83.0"
  - "@copilotkit/web-components@1.83.0"
  - "@copilotkit/web-inspector@1.83.0"
  - 'tsrs@0.20.1-ts7.1.0-beta'
  - '@tsrs/win32-x64@0.20.1-ts7.1.0-beta'
  - '@tsrs/darwin-x64@0.20.1-ts7.1.0-beta'
  - '@tsrs/darwin-arm64@0.20.1-ts7.1.0-beta'
  - '@tsrs/linux-x64-gnu@0.20.1-ts7.1.0-beta'
  - '@tsrs/linux-x64-musl@0.20.1-ts7.1.0-beta'
  - '@tsrs/linux-arm64-gnu@0.20.1-ts7.1.0-beta'
  - '@tsrs/linux-arm64-musl@0.20.1-ts7.1.0-beta'
# Security fixes for GHSA advisories remain pinned to exact patched versions via
# the overrides above: postcss 8.5.23 (GHSA-r28c-9q8g-f849), sharp 0.35.5
# (GHSA-wq5f-xc86-pv6w, superseding the 0.35.4 pin for GHSA-rgj7-g3m4-5g8c — libheif GHSA-g89c-p67h-r497 and GHSA-2jg2-4ch7-h545,
# reached through next's optional image pipeline; supersedes the earlier 0.35.3
# pin, which the advisory covers), js-yaml 4.3.2 (GHSA-2883-xcg3-v3hh —
# maxTotalMergeKeys does not bound CPU for empty merge sources, so 4.3.1, pinned
# here for CVE-2026-59870, is still inside the advisory; transitive dev-dep via
# jest).
# fast-uri 3.1.9 fixes the 3.1.8 scheme/host normalization advisories while
# remaining on the declared 3.x line. body-parser 2.4.0 fixes compressed-body
# trailing-byte DoS in the optional MCP renderer's server dependency graph.
# maplibre-gl 6.4.1 fixes the DOM.sanitize NamedNodeMap-removal XSS bypass;
# the shared renderer's Map/Marker/Popup API is verified in browser tests.
# brace-expansion 1.1.21 / 2.1.7 (GHSA-q2hr-2g5m-vwhr
# — quadratic-time expansion of the `{a},b}` rewrite causing CPU DoS,
# transitive dev-dep via jest/openapi-typescript),
# dompurify 3.4.13 (IN_PLACE hook removal leaves a detached executable subtree —
# XSS, via @streamdown/mermaid > mermaid), mermaid 11.16.1 (prototype pollution
# in the config APIs and in architecture diagrams, CSS injection into sibling
# elements, and XY-chart/radar DoS), and nanoid 3.3.18 (custom generators loop
# indefinitely at size 0, via @tailwindcss/postcss > postcss) are also patched.
# GHSA-2v37-7h3g-55p8 was widened to
# `<3.3.18` on 2026-08-13 after 3.3.17 proved an incomplete fix, so 3.3.17 —
# pinned here as the patched release — was still inside the advisory. 3.3.18 is
# the actual fix.
allowBuilds:
  sharp: true
  unrs-resolver: true
