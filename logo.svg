<svg xmlns="http://www.w3.org/2000/svg"
     width="1024"
     height="1024"
     viewBox="0 0 512 512">

  <defs>
    <!--
      Three rings on the vertices of an equilateral triangle (true 3-fold
      symmetry), translated so the artwork's visual bounding box is
      centered in the canvas (optically centered).
        r = 120, side d = 125.34, circumradius R = d/sqrt(3) = 72.36
      Centroid of the ring centers (and the GOLD convergence point) is at
      (256, 274.09).
    -->

    <!-- Top ring -->
    <linearGradient id="gTop" gradientUnits="userSpaceOnUse"
      x1="256" y1="81.73"
      x2="256" y2="274.09">
      <stop offset="0.00" stop-color="#0A1636"/>
      <stop offset="0.70" stop-color="#0A1636"/>
      <stop offset="1.00" stop-color="#D4A43A"/>
    </linearGradient>

    <!-- Bottom-left ring -->
    <linearGradient id="gLeft" gradientUnits="userSpaceOnUse"
      x1="89.41" y1="370.27"
      x2="256" y2="274.09">
      <stop offset="0.00" stop-color="#081C3F"/>
      <stop offset="0.70" stop-color="#081C3F"/>
      <stop offset="1.00" stop-color="#D4A43A"/>
    </linearGradient>

    <!-- Bottom-right ring -->
    <linearGradient id="gRight" gradientUnits="userSpaceOnUse"
      x1="422.59" y1="370.27"
      x2="256" y2="274.09">
      <stop offset="0.00" stop-color="#0B1233"/>
      <stop offset="0.70" stop-color="#0B1233"/>
      <stop offset="1.00" stop-color="#D4A43A"/>
    </linearGradient>
  </defs>

  <!-- Rings -->
  <g fill="none"
     stroke-width="18"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Top -->
    <circle cx="256" cy="201.73" r="120" stroke="url(#gTop)"/>

    <!-- Bottom-left -->
    <circle cx="193.33" cy="310.27" r="120" stroke="url(#gLeft)"/>

    <!-- Bottom-right -->
    <circle cx="318.67" cy="310.27" r="120" stroke="url(#gRight)"/>

  </g>
</svg>
