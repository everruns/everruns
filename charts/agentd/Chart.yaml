apiVersion: v2
name: agentd
description: agentd on its own - a whole install (shard, executor and API) in one pod, for running agents from your own app.
type: application
# The release publishes the chart with --version and --app-version set to the
# release, so the published chart runs that release's image. From a checkout
# it runs `latest`.
version: 0.0.0-dev
appVersion: latest
home: https://everruns.com
icon: https://everruns.com/favicon.svg
sources:
  - https://github.com/everruns/everruns
keywords:
  - ai-agents
  - agents
  - durable-execution
maintainers:
  - name: Everruns
    url: https://github.com/everruns
