{{- if and (not .Values.apiKeys.existingSecret) .Values.apiKeys.keys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agentd.keysSecret" . }}
  labels:
    {{- include "agentd.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: |
    {{- range .Values.apiKeys.keys }}
    {{ . }}
    {{- end }}
{{- end }}
