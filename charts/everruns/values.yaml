# Everruns Helm chart values. The server runs as one replica by design; scale
# workers instead. Docs: https://everruns.com/docs/getting-started/kubernetes/

image:
  registry: ghcr.io/everruns
  # Defaults to the release this chart was published with (v<appVersion>).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public origin people use to reach Everruns, such as https://everruns.example.com.
# Used for sign-in callbacks and links. Leave empty for a cluster-internal try.
publicUrl: ""

# "prod" or "dev". dev turns on experimental features and is required for
# auth.mode none.
deploymentGrade: prod

auth:
  # admin: one admin account with a password. full: people sign up and sign in.
  # none: no sign-in, every request is admin (requires deploymentGrade dev).
  mode: admin
  # Required for admin and full.
  adminEmail: ""
  # Generated once and kept when empty. Read it back with the command in NOTES.
  adminPassword: ""

secrets:
  # Name of a Secret you manage instead of the generated one. It must hold
  # SECRETS_ENCRYPTION_KEY, AUTH_JWT_SECRET, WORKER_GRPC_AUTH_TOKEN and
  # AUTH_ADMIN_PASSWORD (and POSTGRES_PASSWORD with the bundled PostgreSQL).
  # The encryption key protects stored provider keys and secrets: never change it.
  existingSecret: ""

# Server-wide provider keys. With seedDefaultProviderKeys they become the
# default organization's keys; refused by the server when auth.mode is full.
providerKeys:
  openai: ""
  anthropic: ""
  gemini: ""
  # Or a Secret holding DEFAULT_OPENAI_API_KEY / DEFAULT_ANTHROPIC_API_KEY /
  # DEFAULT_GEMINI_API_KEY.
  existingSecret: ""
seedDefaultProviderKeys: false

database:
  # External PostgreSQL 15+ (recommended): a postgres:// URL, or a Secret key.
  url: ""
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# A single PostgreSQL pod for trying the chart out. Use a managed database or
# an operator such as CloudNativePG for anything you keep: this one has no
# backups, failover or upgrades of its own.
postgresql:
  enabled: false
  image: postgres:17-alpine
  storage:
    size: 8Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }

nats:
  # Bundled NATS with JetStream for live event delivery. Set url to use your own.
  enabled: true
  url: ""
  image: nats:2-alpine
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }

valkey:
  # Optional. Without it rate limits are kept in the server's memory, which is
  # enough for the single server replica.
  enabled: false
  url: ""
  image: valkey/valkey:8-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }

server:
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  # The worker finishes or hands back its work on SIGTERM.
  terminationGracePeriodSeconds: 60
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Scale on queue depth with KEDA (installed separately). Replaces replicas.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    # Queued plus running tasks per worker.
    tasksPerWorker: 15

ui:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Caddy routes /api, /mcp, OAuth and agent-readable documents to the server and
# everything else to the UI, the same routes as the Docker Compose setup.
proxy:
  image: caddy:2-alpine
  service:
    type: ClusterIP
    port: 9300
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
    # - secretName: everruns-tls
    #   hosts: [everruns.example.com]

otel:
  # OTLP endpoint for traces and metrics, such as http://otel-collector:4317.
  endpoint: ""
