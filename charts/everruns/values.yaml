# Everruns Helm chart values. Docs: https://everruns.com/docs/getting-started/kubernetes/

image:
  registry: ghcr.io/everruns
  # Defaults to the release this chart was published with (v<appVersion>).
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Public origin people use to reach Everruns, such as https://everruns.example.com.
# Used for sign-in callbacks and links. Leave empty for a cluster-internal try.
publicUrl: ""

# "prod" or "dev". dev turns on experimental features and is required for
# auth.mode none.
deploymentGrade: prod

auth:
  # admin: one admin account with a password. full: people sign up and sign in.
  # none: no sign-in, every request is admin (requires deploymentGrade dev).
  mode: admin
  # Required for admin and full.
  adminEmail: ""
  # Generated once and kept when empty. Read it back with the command in NOTES.
  adminPassword: ""

secrets:
  # Name of a Secret you manage instead of the generated one. It must hold
  # SECRETS_ENCRYPTION_KEY, AUTH_JWT_SECRET, WORKER_GRPC_AUTH_TOKEN and
  # AUTH_ADMIN_PASSWORD (and POSTGRES_PASSWORD with the bundled PostgreSQL).
  # The encryption key protects stored provider keys and secrets: never change it.
  existingSecret: ""

# Server-wide provider keys. With seedDefaultProviderKeys they become the
# default organization's keys; refused by the server when auth.mode is full.
providerKeys:
  openai: ""
  anthropic: ""
  gemini: ""
  # Or a Secret holding DEFAULT_OPENAI_API_KEY / DEFAULT_ANTHROPIC_API_KEY /
  # DEFAULT_GEMINI_API_KEY.
  existingSecret: ""
seedDefaultProviderKeys: false

database:
  # External PostgreSQL 15+ (recommended): a postgres:// URL, or a Secret key.
  url: ""
  existingSecret: ""
  existingSecretKey: DATABASE_URL

# A single PostgreSQL pod for trying the chart out. Use a managed database or
# an operator such as CloudNativePG for anything you keep: this one has no
# backups, failover or upgrades of its own.
postgresql:
  enabled: false
  image: postgres:17-alpine
  storage:
    size: 8Gi
    storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }

nats:
  # Bundled NATS with JetStream for live event delivery, with a generated
  # password. Set url to use your own. Required with more than one server.
  enabled: true
  url: ""
  image: nats:2-alpine
  storage:
    size: 2Gi
    storageClass: ""
  resources:
    requests: { cpu: 50m, memory: 64Mi }

valkey:
  # Shared rate limits, with a generated password. Optional with one server
  # (it keeps them in memory); required with more, or each server would allow
  # the full limit.
  enabled: false
  url: ""
  image: valkey/valkey:8-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }

server:
  # 1 replaces the server with Recreate on upgrade (a short outage). 2 or more
  # roll one at a time with no outage, and need NATS and Valkey.
  replicas: 1
  # Default with more than one replica: a soft spread over nodes.
  topologySpreadConstraints: []
  # The server drains on SIGTERM: 5 s linger, up to 20 s for requests (SSE
  # streams end with a shutdown event), up to 5 s for worker gRPC calls.
  # SERVER_SHUTDOWN_DELAY_SECS / SERVER_SHUTDOWN_GRACE_SECS change the first
  # two; keep this above their sum plus 5.
  terminationGracePeriodSeconds: 45
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    limits: { memory: 2Gi }
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}

worker:
  replicas: 1
  resources:
    requests: { cpu: 250m, memory: 512Mi }
    # The memory limit sets how many turns a worker admits (it reads its
    # cgroup limit; about 2 MiB per turn).
    limits: { memory: 2Gi }
  # On SIGTERM a worker hands running turns off at their next step and gives
  # other tasks this long to finish (WORKER_SHUTDOWN_GRACE_SECS).
  shutdownGraceSeconds: 120
  # Keep above shutdownGraceSeconds.
  terminationGracePeriodSeconds: 150
  # Background tasks per worker (MAX_CONCURRENT_TASKS); empty keeps the
  # worker's default.
  maxConcurrentTasks: ""
  # Voluntary disruptions (node drains, consolidation) stop at most one worker
  # at a time.
  podDisruptionBudget:
    enabled: true
    maxUnavailable: 1
  extraEnv: []
  extraEnvFrom: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
  podAnnotations: {}
  # Scale on queue depth with KEDA (installed separately). Replaces replicas.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    # Demand per worker: claimable and running background tasks, waiting
    # chat turns, and running chat turns at 1/25 each.
    tasksPerWorker: 15

ui:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 1Gi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Caddy routes /api, /mcp, OAuth and agent-readable documents to the server and
# everything else to the UI, the same routes as the Docker Compose setup.
proxy:
  replicas: 1
  image: caddy:2-alpine
  service:
    type: ClusterIP
    port: 9300
    annotations: {}
  resources:
    requests: { cpu: 50m, memory: 64Mi }
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
    # - secretName: everruns-tls
    #   hosts: [everruns.example.com]

otel:
  # OTLP endpoint for traces and metrics, such as http://otel-collector:4317.
  endpoint: ""

# Prometheus metrics on their own server port instead of the API's /metrics.
metrics:
  enabled: false
  port: 9090
  # A Prometheus Operator ServiceMonitor for the server.
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

# Where session files and other blobs are kept. PostgreSQL by default; S3 or
# an S3-compatible store (MinIO, R2) keeps large files out of the database.
storage:
  s3:
    enabled: false
    bucket: ""
    region: ""
    prefix: ""
    # For S3-compatible stores.
    endpoint: ""
    forcePathStyle: false
    # A Secret with STORAGE_S3_ACCESS_KEY_ID and STORAGE_S3_SECRET_ACCESS_KEY.
    # Leave empty to use the pod's cloud identity (serviceAccount below).
    existingSecret: ""

# The server's ServiceAccount, for cloud identity such as EKS IRSA or GKE
# Workload Identity (S3 access without keys).
serviceAccount:
  create: false
  # With create, defaults to <release>-everruns-server. Without, an existing
  # ServiceAccount to use; empty uses the namespace default.
  name: ""
  annotations: {}

# NetworkPolicies: each component accepts traffic only from the components
# that call it. Needs a network plugin that enforces them.
networkPolicy:
  enabled: false
  # Namespace KEDA runs in, allowed to read queue depth from the bundled
  # PostgreSQL when worker autoscaling is on.
  kedaNamespace: keda
  # Extra ingress rules for the server, such as an in-cluster client.
  extraServerIngress: []

# Tenant egress proxy: agent tool, integration and MCP traffic leaves through
# it, so it can get its own address (schedule it on nodes with their own NAT)
# and per-org caps. Platform calls still go direct.
egressProxy:
  enabled: false
  replicas: 2
  # Per-org caps, unset means no cap.
  orgLimits:
    requestsPerMinute: ""
    requestsPerMinutePerHost: ""
    concurrency: ""
    bytesPerDay: ""
  globalRequestsPerMinutePerHost: ""
  resources:
    requests: { cpu: 100m, memory: 64Mi }
    limits: { memory: 512Mi }
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  affinity: {}
