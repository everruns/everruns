{{- include "everruns.validate" . -}}
{{- /*
Decision: secrets are generated on the first install and then read back with
`lookup` on every upgrade, and the Secret is kept when the release is
uninstalled. Regenerating SECRETS_ENCRYPTION_KEY would make every stored
provider key and secret unreadable, so nothing here ever replaces a value.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "everruns.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keep := dict }}
{{- range $k, $v := $old }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end }}
{{- $pg := get $keep "POSTGRES_PASSWORD" | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "everruns.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  SECRETS_ENCRYPTION_KEY: {{ get $keep "SECRETS_ENCRYPTION_KEY" | default (printf "kek-v1:%s" (randBytes 32)) | quote }}
  AUTH_JWT_SECRET: {{ get $keep "AUTH_JWT_SECRET" | default (randAlphaNum 64) | quote }}
  WORKER_GRPC_AUTH_TOKEN: {{ get $keep "WORKER_GRPC_AUTH_TOKEN" | default (randAlphaNum 48) | quote }}
  AUTH_ADMIN_PASSWORD: {{ .Values.auth.adminPassword | default (get $keep "AUTH_ADMIN_PASSWORD") | default (randAlphaNum 24) | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pg | quote }}
  DATABASE_URL: {{ printf "postgres://everruns:%s@%s:5432/everruns" $pg (include "everruns.name" (list . "postgresql")) | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "everruns.configSecretName" . }}
  labels: {{- include "everruns.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and .Values.database.url (not .Values.postgresql.enabled) }}
  DATABASE_URL: {{ .Values.database.url | quote }}
  {{- end }}
  {{- with .Values.providerKeys }}
  {{- if .openai }}
  DEFAULT_OPENAI_API_KEY: {{ .openai | quote }}
  {{- end }}
  {{- if .anthropic }}
  DEFAULT_ANTHROPIC_API_KEY: {{ .anthropic | quote }}
  {{- end }}
  {{- if .gemini }}
  DEFAULT_GEMINI_API_KEY: {{ .gemini | quote }}
  {{- end }}
  {{- end }}
