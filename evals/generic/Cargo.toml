# Standalone workspace: this crate is intentionally detached from the everruns
# workspace so it does not pull mira-eval into the main build. It path-depends
# on the local Framework/provider crates so a run always evaluates the working
# tree (regression testing), not a published snapshot. Build it in place
# (`cargo build`) or run it via the `mira` host CLI.
[workspace]

[package]
name = "everruns-generic-evals"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Mira eval study: generic agent cases run through the Everruns Framework (no server)"
publish = false

[[bin]]
name = "generic_evals"
path = "src/main.rs"

[dependencies]
mira-eval = "0.4"
everruns = { path = "../../crates/everruns", features = ["bashkit"] }
everruns-anthropic = { path = "../../crates/drivers/anthropic" }
everruns-openai = { path = "../../crates/drivers/openai" }
everruns-openrouter = { path = "../../crates/drivers/openrouter" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
regex = "1"
async-trait = "0.1"
tempfile = "3"

[dev-dependencies]
everruns-llmsim = { path = "../../crates/drivers/llmsim" }
