# Standalone workspace: this crate is intentionally detached from the everruns
# workspace so it does not pull mira-eval / reqwest into the main build. Build it
# in place (`cargo build`) or run it via the `mira` host CLI.
[workspace]

[package]
name = "everruns-platform-capability"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Mira eval study: evaluates the everruns platform capability"
publish = false

[[bin]]
name = "platform_capability"
path = "src/main.rs"

[dependencies]
mira-eval = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# The real contract, so an offline run parses a command line with the same
# clap::Command the server builds rather than an approximation of it.
everruns-cli-contract = { path = "../../crates/cli-contract" }
async-trait = "0.1"
