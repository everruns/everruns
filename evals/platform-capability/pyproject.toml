[project]
name = "everruns-platform-capability"
version = "0.1.0"
description = "Platform-capability evaluation harness for Everruns (platform_management capability)"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.scripts]
platform-capability-load = "platform_capability.loader:main"
platform-capability-run = "platform_capability.runner:main"

[tool.setuptools]
packages = ["platform_capability"]

[tool.setuptools.package-data]
platform_capability = ["dataset.yaml"]
