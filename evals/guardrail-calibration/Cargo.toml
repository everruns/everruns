# Standalone workspace: detached from the everruns workspace so it does not pull
# mira-eval into the main build. It path-depends on the local crates so a run
# measures the working tree's guardrail code, not a published snapshot.
[workspace]

[package]
name = "everruns-guardrail-calibration"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
description = "Mira eval study: calibration of the model-backed guardrail engines"
publish = false

[[bin]]
name = "guardrail_calibration"
path = "src/main.rs"

[dependencies]
mira-eval = "0.4"
# The real guardrail capability and its hooks — this study grades the shipped
# decision path, not a reimplementation of it.
everruns-builtins = { path = "../../crates/builtins" }
everruns-core = { path = "../../crates/core" }
everruns-provider = { path = "../../crates/provider" }
# Both engines' concrete services live here.
everruns-host = { path = "../../crates/host", features = ["utility-llm"] }
# The classifier moved here with the vendor client it uses.
everruns-integrations-typesafe = { path = "../../integrations/typesafe", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
async-trait = "0.1"
