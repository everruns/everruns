# Standalone Mira study. Path dependencies make this evaluate the current
# Framework working tree while keeping the main workspace's default build small.
[workspace]

[package]
name = "everruns-mcp-scale-evals"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.0"
publish = false
default-run = "mcp_scale"

[[bin]]
name = "mcp_scale"
path = "src/main.rs"

[dependencies]
mira-eval = "0.4"
everruns = { path = "../../crates/everruns", features = ["mcp-stdio", "bashkit"] }
everruns-core = { path = "../../crates/core", default-features = false, features = ["direct-egress"] }
everruns-drivers = { path = "../../crates/drivers/drivers", features = ["openrouter", "openai", "anthropic"] }
everruns-contracts = { path = "../../crates/contracts" }
reqwest = { version = "0.13.2", default-features = false, features = ["system-proxy"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
serde_json = "1"
async-trait = "0.1"

[profile.dev]
debug = "line-tables-only"

[patch.crates-io]

# Published Bashkit 0.19.0 pins vulnerable Wasmtime 48.0.6.
# Use the reviewed upstream 48.0.7 fix at an immutable revision.
bashkit = { git = "https://github.com/everruns/bashkit", rev = "05c6e01c99f513775e0afd89ca1d7938aa9956c2" }
bashkit-scripted-tool = { git = "https://github.com/everruns/bashkit", rev = "05c6e01c99f513775e0afd89ca1d7938aa9956c2" }
bashkit-cpython-wasm = { git = "https://github.com/everruns/bashkit", rev = "05c6e01c99f513775e0afd89ca1d7938aa9956c2" }
