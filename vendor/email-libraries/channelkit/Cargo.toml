[package]
name = "channelkit"
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/everruns/channelkit"
authors = ["Mykhailo Chalyi <mike@chaliy.name>"]
documentation = "https://docs.rs/channelkit/0.1.0-alpha.6"
readme = "README.md"
keywords = ["agents", "chat", "messaging", "async"]
categories = ["asynchronous", "api-bindings"]
description = "Async messaging channel coordination for application-owned agents"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
http = ["dep:reqwest", "dep:url", "dep:hmac", "dep:sha2", "dep:hex"]

[dependencies]
async-trait = {"version" = "0.1"}
serde = {"version" = "1", "features" = ["derive"]}
serde_json = {"version" = "1"}
thiserror = {"version" = "2"}
tokio = {"version" = "1", "features" = ["sync", "rt", "macros", "time"]}
tokio-util = {"version" = "0.7", "features" = ["rt"]}
futures-util = {"version" = "0.3"}
reqwest = {"version" = "0.13", "default-features" = false, "features" = ["json", "rustls", "stream", "multipart"], "optional" = true}
url = {"version" = "2", "optional" = true}
hmac = {"version" = "0.12", "optional" = true}
sha2 = {"version" = "0.10", "optional" = true}
hex = {"version" = "0.4", "optional" = true}

[dev-dependencies]
tokio = {"version" = "1", "features" = ["sync", "rt", "macros", "time", "test-util"]}

[workspace]
