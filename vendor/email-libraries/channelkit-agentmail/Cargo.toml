[package]
name = "channelkit-agentmail"
version = "0.1.0-alpha.6"
edition = "2024"
rust-version = "1.95"
authors = ["Mykhailo Chalyi <mike@chaliy.name>"]
readme = "README.md"
exclude = ["tests/**"]
license = "MIT"
repository = "https://github.com/everruns/channelkit"
description = "Bounded AgentMail email transport and verified webhook normalization"

[dependencies]
channelkit = {"version" = "0.1.0-alpha.6", "path" = "../channelkit", "features" = ["http"]}
serde = {"version" = "1", "features" = ["derive"]}
serde_json = {"version" = "1"}
hmac = {"version" = "0.12"}
sha2 = {"version" = "0.10"}
base64 = {"version" = "0.23"}
url = {"version" = "2"}

[dev-dependencies]
tokio = {"version" = "1", "features" = ["sync", "rt", "macros", "time"]}
async-trait = {"version" = "0.1"}

[workspace]
