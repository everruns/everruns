<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 490" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="490" fill="#FFFFFF"/>

  <!-- Feature PR -->
  <text x="120" y="50" text-anchor="middle" class="header-text">ANY PRODUCT REPO</text>
  <rect x="20" y="60" width="200" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="120" y="88" text-anchor="middle" class="label">Feature PR</text>
  <text x="120" y="106" text-anchor="middle" class="sublabel">completes the feature</text>
  <text x="120" y="124" text-anchor="middle" class="mono">Changelog: &lt;entry&gt;</text>

  <!-- Step in a program -->
  <line x1="120" y1="140" x2="120" y2="155" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <rect x="20" y="155" width="200" height="60" fill="#FFFFFF" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="120" y="174" text-anchor="middle" class="sublabel" font-weight="500">Step in a program: no entry yet</text>
  <text x="120" y="192" text-anchor="middle" class="mono">Changelog: part of EVE-...</text>
  <text x="120" y="206" text-anchor="middle" class="mono">the last PR owes the entry</text>

  <!-- Maintenance -->
  <text x="120" y="237" text-anchor="middle" class="header-text">MAINTENANCE</text>
  <rect x="20" y="245" width="200" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="120" y="272" text-anchor="middle" class="label">Maintenance sweep</text>
  <text x="120" y="290" text-anchor="middle" class="sublabel">missed and stale entries</text>
  <text x="120" y="305" text-anchor="middle" class="mono">Update / supersededBy</text>

  <!-- Changelog entry -->
  <text x="400" y="50" text-anchor="middle" class="header-text">EVERRUNS/EVERRUNS</text>
  <rect x="300" y="60" width="200" height="255" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="150" text-anchor="middle" class="label">Changelog entry</text>
  <text x="400" y="170" text-anchor="middle" class="mono">docs/changelog/</text>
  <text x="400" y="184" text-anchor="middle" class="mono">&lt;date&gt;-&lt;slug&gt;.md</text>
  <text x="400" y="206" text-anchor="middle" class="sublabel">kind, significance</text>
  <text x="400" y="222" text-anchor="middle" class="sublabel">products, surfaces</text>
  <text x="400" y="238" text-anchor="middle" class="sublabel">links, optional visual</text>

  <!-- prepare-release -->
  <text x="680" y="50" text-anchor="middle" class="header-text">RELEASES</text>
  <rect x="580" y="60" width="200" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680" y="88" text-anchor="middle" class="label">/prepare-release</text>
  <text x="680" y="106" text-anchor="middle" class="sublabel">release entry and card</text>
  <text x="680" y="124" text-anchor="middle" class="mono">CHANGELOG.md links entries</text>

  <!-- release-to-saas -->
  <text x="680" y="237" text-anchor="middle" class="header-text">CLOUD</text>
  <rect x="580" y="245" width="200" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680" y="272" text-anchor="middle" class="label">/release-to-saas</text>
  <text x="680" y="290" text-anchor="middle" class="sublabel">Cloud-only entries</text>
  <text x="680" y="305" text-anchor="middle" class="mono">live on Cloud date</text>

  <!-- 1: PR -> entry -->
  <line x1="220" y1="100" x2="290" y2="100" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="290,95 300,100 290,105" fill="#0A1636"/>
  <rect x="228" y="76" width="18" height="18" fill="#0A1636"/>
  <text x="237" y="89" text-anchor="middle" class="step-num">1</text>
  <text x="228" y="118" class="arrow-label">complete</text>

  <!-- 2: prepare-release -> entry -->
  <line x1="580" y1="100" x2="510" y2="100" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="510,95 500,100 510,105" fill="#0A1636"/>
  <rect x="554" y="76" width="18" height="18" fill="#0A1636"/>
  <text x="563" y="89" text-anchor="middle" class="step-num">2</text>
  <text x="572" y="118" text-anchor="end" class="arrow-label">release:</text>

  <!-- 3: release-to-saas -> entry -->
  <line x1="580" y1="280" x2="510" y2="280" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="510,275 500,280 510,285" fill="#0A1636"/>
  <rect x="554" y="256" width="18" height="18" fill="#0A1636"/>
  <text x="563" y="269" text-anchor="middle" class="step-num">3</text>
  <text x="572" y="298" text-anchor="end" class="arrow-label">cloud:</text>

  <!-- 4: maintenance -> entry -->
  <line x1="220" y1="280" x2="290" y2="280" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="290,275 300,280 290,285" fill="#0A1636"/>
  <rect x="228" y="256" width="18" height="18" fill="#0A1636"/>
  <text x="237" y="269" text-anchor="middle" class="step-num">4</text>
  <text x="228" y="298" class="arrow-label">fixes</text>

  <!-- 5: entry -> site -->
  <line x1="400" y1="315" x2="400" y2="385" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="395,385 400,395 405,385" fill="#0A1636"/>
  <rect x="410" y="341" width="18" height="18" fill="#0A1636"/>
  <text x="419" y="354" text-anchor="middle" class="step-num">5</text>
  <text x="434" y="354" class="arrow-label">docs build</text>

  <!-- Site -->
  <rect x="20" y="395" width="760" height="75" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="420" text-anchor="middle" class="label">everruns.com/docs/changelog</text>
  <text x="400" y="439" text-anchor="middle" class="sublabel">HTML, Markdown, RSS per product, search, llms.txt</text>
  <text x="400" y="456" text-anchor="middle" class="mono">filters: product · surface · significance · kind · since version</text>
</svg>
