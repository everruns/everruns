<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860" font-family="Geist, Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A1636"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="600" fill="#0A0A0A">One API, one control plane, two data planes</text><text x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#404040">Clients see one URL. The edge router sends management to the control plane and session traffic to the org&#x27;s data plane.</text><g transform="translate(0,40)"><rect x="40" y="190" width="170" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="125.0" y="225.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">UI</text><rect x="40" y="330" width="170" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="125.0" y="365.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">CLI / API clients</text><rect x="260" y="120" width="220" height="320" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="276" y="148" font-size="17" font-weight="600" fill="#0A0A0A">API edge</text><text x="276" y="172" font-size="14" fill="#404040">api.everruns.com/v1</text><text x="276" y="192" font-size="14" fill="#404040">one URL, one token</text><text x="276" y="212" font-size="14" fill="#404040"></text><text x="276" y="232" font-size="14" fill="#404040">stateless router:</text><text x="276" y="252" font-size="14" fill="#404040">verifies the org token,</text><text x="276" y="272" font-size="14" fill="#404040">/v1/sessions/* → org&#x27;s</text><text x="276" y="292" font-size="14" fill="#404040">data plane gateway,</text><text x="276" y="312" font-size="14" fill="#404040">everything else →</text><text x="276" y="332" font-size="14" fill="#404040">control plane</text><polyline points="212,220 258,220" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="212,360 258,360" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="540" y="120" width="380" height="300" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="556" y="148" font-size="17" font-weight="600" fill="#0A0A0A">Control plane  (management)</text><rect x="565" y="180" width="330" height="64" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="730.0" y="208.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Server</text><text x="730.0" y="227.0" text-anchor="middle" font-size="12.5" fill="#404040">orgs, agents, secrets, billing, directory</text><rect x="565" y="280" width="330" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="581" y="308" font-size="15" font-weight="600" fill="#0A0A0A">RDS</text><text x="581" y="332" font-size="14" fill="#404040">orgs, users, agents, secrets,</text><text x="581" y="352" font-size="14" fill="#404040">connections, billing roll-ups</text><text x="581" y="372" font-size="14" fill="#404040">v1 sessions (as today)</text><polyline points="730,246 730,278" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="482,212 563,212" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1120" y="100" width="440" height="360" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1136" y="128" font-size="17" font-weight="600" fill="#0A0A0A">Data plane v2  (cells, new deployment)</text><rect x="1145" y="160" width="390" height="52" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1340.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Cell gateways</text><text x="1340.0" y="201.0" text-anchor="middle" font-size="12.5" fill="#404040">sessions API + SSE, verify org token</text><rect x="1145" y="235" width="185" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1161" y="263" font-size="15" font-weight="600" fill="#0A0A0A">Cells</text><text x="1161" y="287" font-size="14" fill="#404040">Raft state:</text><text x="1161" y="307" font-size="14" fill="#404040">sessions, agents,</text><text x="1161" y="327" font-size="14" fill="#404040">usage counters</text><rect x="1350" y="235" width="185" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1366" y="263" font-size="15" font-weight="600" fill="#0A0A0A">Executors</text><text x="1366" y="287" font-size="14" fill="#404040">run turns</text><text x="1366" y="307" font-size="14" fill="#404040">one shared pool</text><text x="1366" y="327" font-size="14" fill="#404040">KEDA-scaled</text><rect x="1145" y="378" width="390" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1340.0" y="402.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">S3</text><text x="1340.0" y="421.0" text-anchor="middle" font-size="12.5" fill="#404040">session history, snapshots, files</text><rect x="1120" y="520" width="440" height="250" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1136" y="548" font-size="17" font-weight="600" fill="#0A0A0A">Data plane v1  (today)</text><rect x="1145" y="580" width="390" height="52" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1340.0" y="602.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Server as gateway</text><text x="1340.0" y="621.0" text-anchor="middle" font-size="12.5" fill="#404040">sessions in RDS, as today</text><rect x="1145" y="660" width="390" height="70" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1340.0" y="691.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Workers</text><text x="1340.0" y="710.0" text-anchor="middle" font-size="12.5" fill="#404040">lease from RDS, gRPC to server</text><polyline points="922,150 1118,150" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="932" y="140" text-anchor="start" font-size="13" fill="#0A1636">agent definitions</text><polyline points="1118,330 922,330" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="932" y="320" text-anchor="start" font-size="13" fill="#0A1636">usage, summaries (async)</text><polyline points="922,400 1000,400 1000,545 1118,545" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="1008" y="480" text-anchor="start" font-size="13" fill="#0A1636">same RDS</text><polyline points="400,118 400,70 1530,70 1530,158" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="560" y="62" text-anchor="start" font-size="13" font-weight="400" fill="#0A1636">sessions of v2 orgs: edge → cell gateway (the control plane is not on this path)</text><polyline points="330,442 330,560 800,560 800,606 1143,606" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="350" y="580" text-anchor="start" font-size="13" font-weight="400" fill="#0A1636">sessions of v1 orgs: edge → server, as today</text></g></svg>