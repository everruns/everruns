<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="930" viewBox="0 0 1700 930" font-family="Geist, Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A1636"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="600" fill="#0A0A0A">Data plane v2 file system: workspaces as versioned trees</text><text x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#404040">The cell holds each workspace&#x27;s root and recent changes; contents are immutable objects in S3, read through a shared cache.</text><rect x="40" y="120" width="300" height="190" fill="#ffffff" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="6 5"/><text x="56" y="148" font-size="17" font-weight="600" fill="#0A0A0A">External volume  (optional)</text><text x="56" y="172" font-size="14" fill="#404040">Archil disk or S3 bucket</text><text x="56" y="192" font-size="14" fill="#404040">connected by the org</text><text x="56" y="212" font-size="14" fill="#404040">shared datasets, repos</text><text x="56" y="232" font-size="14" fill="#404040">/workspace/roots/&lt;name&gt;</text><rect x="400" y="110" width="600" height="210" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="416" y="138" font-size="17" font-weight="600" fill="#0A0A0A">Cell  (Raft)</text><text x="416" y="162" font-size="14" fill="#404040">workspace roots and versions</text><text x="416" y="182" font-size="14" fill="#404040">delta: recent changes per workspace (path → entry)</text><text x="416" y="202" font-size="14" fill="#404040">commit = one Raft entry: base version, ops, sizes</text><text x="416" y="222" font-size="14" fill="#404040">checks: claim, conflicts on the same path, quota</text><text x="416" y="242" font-size="14" fill="#404040">compaction writes tree nodes, records the new root</text><text x="416" y="262" font-size="14" fill="#404040">Memories: shared volumes, placed like sessions</text><text x="40" y="375" text-anchor="start" font-size="12" font-weight="600" fill="#A0A0A0">WAYS IN</text><rect x="40" y="390" width="300" height="140" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="56" y="418" font-size="17" font-weight="600" fill="#0A0A0A">Executor tools</text><text x="56" y="442" font-size="14" fill="#404040">file tools, bashkit, MountFs</text><text x="56" y="462" font-size="14" fill="#404040">SessionFileSystem over the cell</text><text x="56" y="482" font-size="14" fill="#404040">local cache: memory, NVMe</text><rect x="370" y="390" width="330" height="140" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="386" y="418" font-size="17" font-weight="600" fill="#0A0A0A">Sandbox + everruns-fs</text><text x="386" y="442" font-size="14" fill="#404040">owns /workspace</text><text x="386" y="462" font-size="14" fill="#404040">mount (FUSE) or sync mode</text><text x="386" y="482" font-size="14" fill="#404040">commits at the end of a tool call</text><text x="386" y="502" font-size="14" fill="#404040">local-only: node_modules, target</text><rect x="730" y="390" width="270" height="140" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="746" y="418" font-size="17" font-weight="600" fill="#0A0A0A">Gateway</text><text x="746" y="442" font-size="14" fill="#404040">/v1/workspaces/{id}/fs/*</text><text x="746" y="462" font-size="14" fill="#404040">uploads, downloads</text><text x="746" y="482" font-size="14" fill="#404040">UI file browser</text><rect x="40" y="610" width="960" height="100" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="56" y="638" font-size="17" font-weight="600" fill="#0A0A0A">Chunk cache  (one per data plane)</text><text x="56" y="662" font-size="14" fill="#404040">NVMe StatefulSet, keys spread by content hash; read-through, write-through to S3</text><text x="56" y="682" font-size="14" fill="#404040">contents never change, so nothing is ever invalidated</text><rect x="1100" y="110" width="560" height="300" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1116" y="138" font-size="17" font-weight="600" fill="#0A0A0A">S3</text><text x="1120" y="170" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#0A0A0A">orgs/{org}/fs/nodes/{hash}</text><text x="1120" y="194" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#404040">    tree nodes: one directory listing,</text><text x="1120" y="218" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#404040">    files ≤ 4 KiB inline</text><text x="1120" y="242" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#0A0A0A">orgs/{org}/blobs/{sha256}</text><text x="1120" y="266" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#404040">    file contents, 4 MiB chunks</text><text x="1120" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" fill="#404040">    shared by every fork and copy</text><rect x="1100" y="460" width="560" height="250" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="1116" y="488" font-size="17" font-weight="600" fill="#0A0A0A">Fork and snapshots</text><rect x="1130" y="520" width="150" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1205.0" y="538.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">root A</text><text x="1205.0" y="557.0" text-anchor="middle" font-size="12.5" fill="#404040">session</text><rect x="1310" y="520" width="150" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1385.0" y="538.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">root B</text><text x="1385.0" y="557.0" text-anchor="middle" font-size="12.5" fill="#404040">fork of A</text><rect x="1490" y="520" width="140" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1560.0" y="538.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">turn 12</text><text x="1560.0" y="557.0" text-anchor="middle" font-size="12.5" fill="#404040">snapshot</text><rect x="1220" y="620" width="320" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1380.0" y="647.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">shared tree nodes and contents</text><polyline points="1205,566 1205,592 1300,592 1300,618" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="1385,566 1385,618" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="1560,566 1560,592 1470,592 1470,618" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="1130" y="694" text-anchor="start" font-size="13" font-weight="400" fill="#404040">A fork or snapshot is a new root pointer: one Raft entry, no copy.</text><polyline points="190,312 190,388" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><rect x="202" y="340" width="20" height="20" fill="#0A1636"/><text x="212" y="354.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><polyline points="300,388 300,350 470,350 470,322" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="375" y="340" width="20" height="20" fill="#0A1636"/><text x="385" y="354.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><polyline points="535,388 535,322" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="547" y="345" width="20" height="20" fill="#0A1636"/><text x="557" y="359.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><polyline points="865,388 865,322" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="877" y="345" width="20" height="20" fill="#0A1636"/><text x="887" y="359.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><polyline points="190,532 190,608" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="535,532 535,608" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/><polyline points="865,532 865,608" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="202" y="560" width="20" height="20" fill="#0A1636"/><text x="212" y="574.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><rect x="547" y="560" width="20" height="20" fill="#0A1636"/><text x="557" y="574.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><rect x="877" y="560" width="20" height="20" fill="#0A1636"/><text x="887" y="574.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><polyline points="1002,660 1050,660 1050,380 1098,380" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#ah)"/><rect x="1040" y="510" width="20" height="20" fill="#0A1636"/><text x="1050" y="524.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><polyline points="1002,200 1098,200" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="1040" y="190" width="20" height="20" fill="#0A1636"/><text x="1050" y="204.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><rect x="40" y="766" width="20" height="20" fill="#0A1636"/><text x="50" y="780.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">1</text><text x="70" y="780" text-anchor="start" font-size="13.5" font-weight="400" fill="#0A1636">Commit: metadata and files ≤ 32 KiB inline, one Raft entry, durable on a quorum</text><rect x="40" y="792" width="20" height="20" fill="#0A1636"/><text x="50" y="806.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">2</text><text x="70" y="806" text-anchor="start" font-size="13.5" font-weight="400" fill="#0A1636">Read and write contents by hash through the cache (larger files go here first)</text><rect x="40" y="818" width="20" height="20" fill="#0A1636"/><text x="50" y="832.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">3</text><text x="70" y="832" text-anchor="start" font-size="13.5" font-weight="400" fill="#0A1636">Cache writes through to S3 and fills from it on a miss</text><rect x="40" y="844" width="20" height="20" fill="#0A1636"/><text x="50" y="858.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">4</text><text x="70" y="858" text-anchor="start" font-size="13.5" font-weight="400" fill="#0A1636">Compaction: the cell writes new tree nodes and records the new root</text><rect x="40" y="870" width="20" height="20" fill="#0A1636"/><text x="50" y="884.5" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">5</text><text x="70" y="884" text-anchor="start" font-size="13.5" font-weight="400" fill="#0A1636">Optional external volume: mounted with Archil&#x27;s client, or read over S3</text></svg>