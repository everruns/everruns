<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" font-family="Geist, Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A1636"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="600" fill="#0A0A0A">Life of a message in data plane v2</text><text x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#404040">No server or RDS call between the message and the answer.</text><rect x="20" y="90" width="180" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="110.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Client</text><line x1="110" y1="134" x2="110" y2="630" stroke="#A0A0A0" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="240" y="90" width="180" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="330.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Cell gateway</text><line x1="330" y1="134" x2="330" y2="630" stroke="#A0A0A0" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="460" y="90" width="180" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="550.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Cell leader</text><line x1="550" y1="134" x2="550" y2="630" stroke="#A0A0A0" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="680" y="90" width="180" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="770.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Followers</text><line x1="770" y1="134" x2="770" y2="630" stroke="#A0A0A0" stroke-width="1.3" stroke-dasharray="4 4"/><rect x="900" y="90" width="180" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="990.0" y="117.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Executor</text><line x1="990" y1="134" x2="990" y2="630" stroke="#A0A0A0" stroke-width="1.3" stroke-dasharray="4 4"/><polyline points="110,170 324,170" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="220.0" y="163" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">POST message (org token)</text><rect x="190" y="194" width="280" height="30" fill="#ffffff" stroke="#404040" stroke-dasharray="4 3"/><text x="330.0" y="214" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">verify token, check spend allowance</text><polyline points="330,258 544,258" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="440.0" y="251" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">Admit (idempotent by message id)</text><polyline points="550,302 764,302" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="660.0" y="295" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">replicate, fsync majority</text><polyline points="330,346 116,346" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="220.0" y="339" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">200: durable receipt</text><polyline points="550,390 984,390" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="770.0" y="383" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">claim, assign turn</text><rect x="560" y="414" width="530" height="30" fill="#ffffff" stroke="#404040" stroke-dasharray="4 3"/><text x="825.0" y="434" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">model and tool calls; agent definition and secrets from the cell</text><polyline points="990,478 556,478" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="770.0" y="471" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">Append events under the claim</text><polyline points="330,522 116,522" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="220.0" y="515" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">SSE: committed events + token deltas</text><polyline points="990,566 556,566" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="770.0" y="559" text-anchor="middle" font-size="13" font-weight="400" fill="#0A1636">Finish; usage counters updated in the same entry</text></svg>