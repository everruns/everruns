<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" font-family="Geist, Inter, system-ui, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0A1636"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="44" text-anchor="start" font-size="22" font-weight="600" fill="#0A0A0A">Inside data plane v2</text><text x="40" y="68" text-anchor="start" font-size="14" font-weight="400" fill="#404040">A turn touches only its cell, its executors, the model provider and the tool&#x27;s own backend.</text><rect x="40" y="140" width="200" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="140.0" y="164.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Clients</text><text x="140.0" y="183.0" text-anchor="middle" font-size="12.5" fill="#404040">UI, CLI, API, Slack</text><rect x="300" y="100" width="620" height="460" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="316" y="128" font-size="17" font-weight="600" fill="#0A0A0A">Cell  (one of N; hosts sessions of any org)</text><rect x="325" y="160" width="570" height="52" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="610.0" y="182.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Gateway (every node)</text><text x="610.0" y="201.0" text-anchor="middle" font-size="12.5" fill="#404040">auth by org token, /v1 sessions, SSE from the cell</text><rect x="325" y="250" width="180" height="62" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="415.0" y="277.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Leader</text><text x="415.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#404040">scheduler, claims</text><rect x="520" y="250" width="180" height="62" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="610.0" y="277.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Follower</text><text x="610.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#404040">replica</text><rect x="715" y="250" width="180" height="62" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="805.0" y="277.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Follower</text><text x="805.0" y="296.0" text-anchor="middle" font-size="12.5" fill="#404040">replica</text><rect x="325" y="340" width="570" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="341" y="368" font-size="15" font-weight="600" fill="#0A0A0A">Replicated state (in memory, WAL on disk)</text><text x="341" y="392" font-size="14" fill="#404040">sessions: log, inbox, claim, checkpoints, file manifests</text><text x="341" y="412" font-size="14" fill="#404040">agent definitions, sealed secrets, tenant policy, spend allowances</text><text x="341" y="432" font-size="14" fill="#404040">usage counters, schedules and timers</text><text x="325" y="500" text-anchor="start" font-size="13" font-weight="400" fill="#404040">Only hot write: the Raft WAL, group-committed across sessions.</text><text x="325" y="522" text-anchor="start" font-size="13" font-weight="400" fill="#404040">Idle sessions keep ~20 KB of metadata; history pages in from S3.</text><rect x="980" y="100" width="280" height="300" fill="#ffffff" stroke="#0A0A0A" stroke-width="1"/><text x="996" y="128" font-size="17" font-weight="600" fill="#0A0A0A">Executor pool</text><text x="996" y="152" font-size="14" fill="#404040">one shared pool, stateless, KEDA</text><text x="996" y="172" font-size="14" fill="#404040">platform turn code</text><text x="996" y="192" font-size="14" fill="#404040">cell-local adapters</text><rect x="1000" y="210" width="240" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="1120.0" y="234.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">Egress proxy</text><text x="1120.0" y="253.0" text-anchor="middle" font-size="12.5" fill="#404040">tenant egress policy</text><polyline points="1120,268 1120,300" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="1120" y="322" text-anchor="middle" font-size="12.5" font-weight="400" fill="#404040">model providers, MCP,</text><text x="1120" y="342" text-anchor="middle" font-size="12.5" font-weight="400" fill="#404040">web, sandboxes</text><rect x="300" y="600" width="620" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="610.0" y="624.0" text-anchor="middle" font-size="14" font-weight="600" fill="#0A0A0A">S3</text><text x="610.0" y="643.0" text-anchor="middle" font-size="12.5" fill="#404040">history segments, snapshots, file and memory bytes, prompts</text><polyline points="242,168 323,180" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><polyline points="920,265 978,265" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="930" y="255" text-anchor="start" font-size="13" fill="#0A1636">claim</text><polyline points="978,300 898,300" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><text x="905" y="326" text-anchor="start" font-size="13" fill="#0A1636">Append</text><polyline points="610,562 610,598" fill="none" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ah)"/><rect x="980" y="440" width="280" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/><text x="996" y="468" font-size="15" font-weight="600" fill="#0A0A0A">Control plane</text><text x="996" y="492" font-size="14" fill="#404040">pushes agent definitions</text><text x="996" y="512" font-size="14" fill="#404040">receives usage roll-ups</text><text x="996" y="532" font-size="14" fill="#404040">never on a turn&#x27;s path</text><polyline points="978,480 898,420" fill="none" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah)"/></svg>