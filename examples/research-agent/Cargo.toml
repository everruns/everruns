[package]
name = "everruns-research-agent"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false

[dependencies]
everruns = { path = "../../crates/everruns", features = ["web-fetch"] }
everruns-example-demo = { path = "../demo-support" }
everruns-drivers = { path = "../../crates/drivers/drivers", features = ["openrouter"] }
everruns-integrations-brave-search = { path = "../../integrations/brave-search", default-features = false }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
