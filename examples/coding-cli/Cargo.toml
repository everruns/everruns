# A minimal coding agent that depends only on the public `everruns` library
# (EVE-835): the executable acceptance test for the OSS library surface. It must
# never depend on `everruns-core` or `everruns-runtime` directly — a dependency
# and a source scan in `tests/` enforce that.

[package]
name = "everruns-coding-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A minimal terminal coding agent built on the everruns public library"

[lib]
name = "everruns_coding_cli"
path = "src/lib.rs"

[[bin]]
name = "ercode"
path = "src/main.rs"

[dependencies]
# The only Everruns dependency: the public facade, with the real-provider edge.
everruns = { path = "../../crates/everruns", features = ["openai"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "fs", "io-std", "io-util"] }

[dev-dependencies]
# Exercise opt-in application profiles without pulling SQLite or local-process
# MCP support into the shipped coding CLI binary.
everruns = { path = "../../crates/everruns", features = ["local", "mcp-stdio"] }
tempfile = "3"
