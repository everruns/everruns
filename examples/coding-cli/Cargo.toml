[package]
name = "everruns-coding-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A minimal terminal coding agent built on everruns-runtime"

[[bin]]
name = "ercode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
ratatui-textarea = "0.9.1"
serde_json = "1.0"
similar = "3"
textwrap = "0.16"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

everruns-anthropic = { path = "../../crates/anthropic" }
everruns-core = { path = "../../crates/core" }
everruns-openai = { path = "../../crates/openai" }
# `mcp-stdio` lets the CLI talk to local-process MCP servers; the hosted
# server/worker never enable it (specs/runtime-mcp.md D2).
everruns-runtime = { path = "../../crates/runtime", features = ["mcp-stdio"] }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }

[dev-dependencies]
tempfile = "3"
