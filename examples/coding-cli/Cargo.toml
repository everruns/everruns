[package]
name = "everruns-coding-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A minimal terminal coding agent built on everruns-runtime"

[[bin]]
name = "ercode"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
serde_json = "1.0"
similar = "2"
textwrap = "0.16"
tokio = { version = "1.50", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

everruns-anthropic = { path = "../../crates/anthropic" }
everruns-core = { path = "../../crates/core" }
everruns-openai = { path = "../../crates/openai" }
everruns-runtime = { path = "../../crates/runtime" }
everruns-integrations-duckduckgo = { path = "../../integrations/duckduckgo" }
