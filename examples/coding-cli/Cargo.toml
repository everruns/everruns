# A minimal coding agent that depends only on the public `everruns` library
# (EVE-835): the executable acceptance test for the OSS library surface. It must
# never depend on `everruns-core` or `everruns-host` directly — a dependency
# and a source scan in `tests/` enforce that.

[package]
name = "everruns-coding-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A minimal terminal coding agent built on the everruns public library"

[lib]
name = "everruns_coding_cli"
path = "src/lib.rs"

[[bin]]
name = "ercode"
path = "src/main.rs"

[dependencies]
# Application behavior, including the OpenAI provider, comes from the public
# facade. The example intentionally has one Framework dependency.
everruns = { path = "../../crates/everruns", features = ["local", "openai", "bashkit", "web-fetch", "duckduckgo"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.30"
ratatui-textarea = "0.9.1"
similar = "3"
textwrap = "0.16"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"
