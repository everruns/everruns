# A minimal coding agent that depends only on the public `everruns` library
# (EVE-835): the executable acceptance test for the OSS library surface. It must
# never depend on `everruns-core` or `everruns-host` directly — a dependency
# and a source scan in `tests/` enforce that.

[package]
name = "everruns-coding-cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A minimal terminal coding agent built on the everruns public library"

[lib]
name = "everruns_coding_cli"
path = "src/lib.rs"

[[bin]]
name = "ercode"
path = "src/main.rs"

[dependencies]
# Application behavior comes from the public facade. Provider crates supply
# open wire drivers without importing core, host, worker, or server internals.
everruns = { path = "../../crates/everruns", features = ["local", "bashkit", "web-fetch", "duckduckgo", "mcp-stdio"] }
everruns-anthropic = { path = "../../crates/anthropic" }
everruns-openai.workspace = true
everruns-openrouter = { path = "../../crates/openrouter" }
anyhow = "1.0"
async-trait.workspace = true
chrono.workspace = true
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dirs.workspace = true
ratatui = "0.30"
ratatui-textarea = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "3"
textwrap = "0.16"
tokio = { version = "1.50", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Add local-process MCP support only for the existing application-parity fixture.
everruns = { path = "../../crates/everruns", features = ["local", "mcp-stdio"] }
tempfile = "3"
