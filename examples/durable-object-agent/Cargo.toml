[package]
name = "everruns-object-agent"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
async-trait = "0.1"
everruns-contracts = { path = "../../crates/contracts", default-features = false, features = ["runtime"] }
everruns-core = { path = "../../crates/core", default-features = false, features = ["actor-runtime"] }
everruns-durable-object = { path = "../../crates/durable-object", default-features = false, features = ["wasm"] }
futures = "0.3"
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
