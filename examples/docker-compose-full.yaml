# Everruns Full Stack Docker Compose
#
# This configuration deploys the complete Everruns platform:
# - PostgreSQL database
# - Valkey (distributed rate limiting)
# - Server (control plane): HTTP API + gRPC server
# - 3 Worker instances for parallel processing
# - UI (Next.js dashboard)
# - Caddy reverse proxy (unified entry point)
# - VictoriaMetrics (scrapes Prometheus /metrics from server)
# - OpenTelemetry tracing (configure OTEL_EXPORTER_OTLP_ENDPOINT for external collector)
#
# Quick Start:
#   1. Generate encryption key:
#      python3 -c "import os, base64; print('kek-v1:' + base64.b64encode(os.urandom(32)).decode())"
#
#   2. Create .env file with:
#      SECRETS_ENCRYPTION_KEY=kek-v1:<your-generated-key>
#      WORKER_GRPC_AUTH_TOKEN=<your-token>  # Required: worker gRPC auth token
#      DEFAULT_OPENAI_API_KEY=sk-...        # Optional: OpenAI API key
#      DEFAULT_ANTHROPIC_API_KEY=sk-ant-... # Optional: Anthropic API key
#      DEFAULT_GEMINI_API_KEY=...           # Optional: Google Gemini API key
#
#   3. Start everything:
#      docker compose -f docker-compose-full.yaml up -d
#
#   4. Open UI at: http://localhost:9300
#   5. VictoriaMetrics UI: http://localhost:8428/vmui
#      Try query: everruns_http_request_duration_seconds_count
#
# Ports:
#   - 9300: Web UI (Caddy)
#   - 8428: VictoriaMetrics UI & API
#
# Note: Images are from ghcr.io/everruns - ensure you have access or build locally

services:
  # ==========================================================================
  # Database
  # ==========================================================================
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: everruns
      POSTGRES_PASSWORD: everruns
      POSTGRES_DB: everruns
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everruns"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================================
  # Valkey (distributed rate limiting)
  # ==========================================================================
  valkey:
    image: valkey/valkey:8-alpine
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ==========================================================================
  # Server (Control Plane) - HTTP API + gRPC server
  # Note: Migrations are auto-applied on startup
  # ==========================================================================
  server:
    image: ghcr.io/everruns/everruns-server:${EVERRUNS_TAG:-latest}
    environment:
      DATABASE_URL: postgres://everruns:everruns@postgres:5432/everruns
      VALKEY_URL: redis://valkey:6379
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY}
      DEFAULT_OPENAI_API_KEY: ${DEFAULT_OPENAI_API_KEY:-}
      DEFAULT_ANTHROPIC_API_KEY: ${DEFAULT_ANTHROPIC_API_KEY:-}
      DEFAULT_GEMINI_API_KEY: ${DEFAULT_GEMINI_API_KEY:-}
      WORKER_GRPC_AUTH_TOKEN: ${WORKER_GRPC_AUTH_TOKEN:-}
      ADDR: "0.0.0.0:9301"
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/everruns-server", "--version"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================================================
  # Workers (3 instances for parallel execution)
  # ==========================================================================
  worker-1:
    image: ghcr.io/everruns/everruns-worker:${EVERRUNS_TAG:-latest}
    environment:
      WORKER_GRPC_ADDRESS: server:9001
      WORKER_GRPC_AUTH_TOKEN: ${WORKER_GRPC_AUTH_TOKEN:-}
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  worker-2:
    image: ghcr.io/everruns/everruns-worker:${EVERRUNS_TAG:-latest}
    environment:
      WORKER_GRPC_ADDRESS: server:9001
      WORKER_GRPC_AUTH_TOKEN: ${WORKER_GRPC_AUTH_TOKEN:-}
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  worker-3:
    image: ghcr.io/everruns/everruns-worker:${EVERRUNS_TAG:-latest}
    environment:
      WORKER_GRPC_ADDRESS: server:9001
      WORKER_GRPC_AUTH_TOKEN: ${WORKER_GRPC_AUTH_TOKEN:-}
      RUST_LOG: info
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

  # ==========================================================================
  # UI (Next.js dashboard)
  # ==========================================================================
  ui:
    image: ghcr.io/everruns/everruns-ui:${EVERRUNS_TAG:-latest}
    environment:
      PORT: "9305"
      HOSTNAME: 0.0.0.0
    depends_on:
      server:
        condition: service_started

  # ==========================================================================
  # Caddy Reverse Proxy (unified entry point)
  # ==========================================================================
  caddy:
    image: caddy:2-alpine
    ports:
      - "${EXAMPLE_PROXY_PORT:-9300}:9300"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - server
      - ui
    restart: unless-stopped

  # ==========================================================================
  # VictoriaMetrics (single-node time-series database)
  #
  # Scrapes Prometheus metrics from the server's /metrics endpoint.
  # UI available at http://localhost:8428/vmui
  #
  # Key queries to try:
  #   - everruns_workflows_running
  #   - everruns_workers_active
  #   - rate(everruns_http_request_duration_seconds_count[5m])
  #   - histogram_quantile(0.95, rate(everruns_http_request_duration_seconds_bucket[5m]))
  # ==========================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.108.1
    ports:
      - "${VICTORIAMETRICS_PORT:-8428}:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    configs:
      - source: prometheus_scrape_config
        target: /etc/prometheus/prometheus.yml
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=30d"
    depends_on:
      server:
        condition: service_started
    restart: unless-stopped

# ==========================================================================
# Configs (inline configuration files)
# ==========================================================================
configs:
  caddyfile:
    content: |
      # Reverse proxy routes:
      #   /api/*     -> API (strips prefix)
      #   /api-doc/* -> API
      #   /health    -> API
      #   /*         -> UI
      #
      # SSE: flush_interval -1 disables response buffering for SSE.
      # Server handles 5-min connection cycling with disconnecting events;
      # SDK reconnects transparently (no retry budget cost).
      :9300 {
        handle_path /api/* {
          reverse_proxy server:9301 {
            # Disable response buffering for SSE streaming
            flush_interval -1
          }
        }
        handle /api-doc/* {
          reverse_proxy server:9301
        }
        handle /health {
          reverse_proxy server:9301
        }
        handle {
          reverse_proxy ui:9305
        }
      }

  prometheus_scrape_config:
    content: |
      global:
        scrape_interval: 15s
        scrape_timeout: 10s

      scrape_configs:
        - job_name: everruns-server
          metrics_path: /metrics
          static_configs:
            - targets: ["server:9301"]
              labels:
                service: everruns-server

volumes:
  postgres_data:
  valkey_data:
  victoriametrics_data:
