# The credential-free walkthrough of the example beside it.
#
# A separate crate on purpose: `everruns-foreman-agent` is then a real example,
# with nothing in it that exists only to make a recording. Everything simulated
# lives here — the scripted worker, the classifier service that answers from a
# table, and the fixture repository they work on — and it drives the same
# runtime the real binary does.

[package]
name = "everruns-foreman-demo"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A credential-free walkthrough of the foreman example"

[[bin]]
name = "foreman-demo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
everruns = { path = "../../../crates/everruns", features = ["bashkit", "typesafe"] }
everruns-example-demo = { path = "../../demo-support" }
everruns-foreman-agent = { path = ".." }
serde_json = "1.0"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true

[dev-dependencies]
# The same crate, with the fixtures its tests borrow.
everruns-foreman-agent = { path = "..", features = ["testing"] }
