# Concurrent supervision: nine probabilities, deterministic Rust policy.

[package]
name = "everruns-foreman-agent"
version = "0.1.0"
edition = "2024"
license.workspace = true
publish = false
description = "A decision service supervising a coding agent it does not have to stop"

[lib]
# The runtime, so `tests/` can drive the same loop with a scripted worker.
name = "everruns_foreman_agent"
path = "src/lib.rs"

[[bin]]
# Started the way Foreman is: `foreman run --repo … --job …`.
name = "foreman"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.5", features = ["derive"] }
everruns = { path = "../../crates/everruns", features = ["bashkit", "typesafe", "openrouter"] }
everruns-example-demo = { path = "../demo-support" }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
