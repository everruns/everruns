[package]
name = "everruns-cloudflare-durable-chat"
version = "0.1.0"
edition = "2024"
publish = false
description = "Framework Engine multiplayer chat inside Cloudflare Durable Objects"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
everruns = { path = "../../crates/everruns", default-features = false }
everruns-contracts = { path = "../../crates/contracts", default-features = false, features = ["runtime", "http"] }
everruns-drivers = { path = "../../crates/drivers/drivers", default-features = false, features = ["openrouter"] }
everruns-durable-object = { path = "../../crates/durable-object", default-features = false, features = ["wasm"] }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["AbortController", "AbortSignal", "Response", "Headers", "ReadableStream", "ReadableStreamDefaultReader"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "debuginfo"
