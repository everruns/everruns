[package]
name = "weekend-concierge-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
# Only for turning terminal echo off while a credential is typed.
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }

everruns = { path = "../../crates/everruns" }
