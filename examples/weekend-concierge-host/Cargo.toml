[package]
name = "weekend-concierge-host"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

everruns-core = { path = "../../crates/core" }
everruns-runtime = { path = "../../crates/runtime" }
