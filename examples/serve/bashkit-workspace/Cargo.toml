[package]
name = "serve-example-bashkit-workspace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bashkit-workspace"
path = "src/main.rs"

[dependencies]
