# A serve app packaged for Amazon Bedrock AgentCore Runtime. Runs offline.
[package]
name = "serve-example-agentcore"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agentcore"
path = "src/main.rs"

[dependencies]
everruns-serve.workspace = true
# Serves AgentCore's `/ping` and `/invocations` on :8080 around the app.
everruns-serve-agentcore.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
everruns-serve-build.workspace = true

[lints]
workspace = true
