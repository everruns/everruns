# A serve agent with a real shell and files in its AgentCore microVM, an
# approval-gated tool, and session storage. Runs offline.
[package]
name = "serve-example-agentcore-workspace"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "agentcore-workspace"
path = "src/main.rs"

[dependencies]
everruns-serve.workspace = true
everruns-serve-agentcore.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
everruns-serve-build.workspace = true

[lints]
workspace = true
