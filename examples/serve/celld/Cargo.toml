# A serve app packaged as a celld container. Runs on a real model (`OPENAI_API_KEY`).
[package]
name = "serve-example-celld"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "celld-agent"
path = "src/main.rs"

[dependencies]
everruns-serve.workspace = true
# Serves ordinary /v1 and authenticated /execute using the same Framework Engine.
everruns-serve-celld.workspace = true
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[build-dependencies]
everruns-serve-build.workspace = true

[lints]
workspace = true
