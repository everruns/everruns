# A serve app people can call from the browser. Runs offline.
[package]
name = "serve-example-voice"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "voice"
path = "src/main.rs"

[dependencies]
# The `voice` feature serves `/v1/channels/{agent}/voice` for every top-level agent.
everruns-serve = { workspace = true, features = ["voice"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
everruns-serve-build.workspace = true

[lints]
workspace = true
