# The smallest serve app: one agent, one tool, one eval. Runs offline.
[package]
name = "serve-example-hello"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "hello"
path = "src/main.rs"

[dependencies]
everruns-serve.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[build-dependencies]
everruns-serve-build.workspace = true

[lints]
workspace = true
