[package]
name = "everruns-framework-cli-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { workspace = true, features = ["string", "color"] }
everruns-contracts = { path = "../../crates/contracts", default-features = false, features = ["http"] }
everruns-integrations-bashkit = { path = "../../integrations/bashkit" }
everruns-integrations-filesystem = { path = "../../integrations/filesystem" }
everruns-llmsim = { path = "../../crates/drivers/llmsim", features = ["host"] }
everruns-drivers = { path = "../../crates/drivers/drivers", features = ["anthropic", "openai"] }
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

everruns-core = { path = "../../crates/core", default-features = false, features = ["host"] }
everruns = { path = "../../crates/everruns", default-features = false, features = ["bashkit", "filesystem"] }
[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
