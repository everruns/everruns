[package]
name = "everruns-lua-bash-eval"
version = "0.1.0"
edition = "2024"
publish = false
description = "Research A/B eval harness: lua vs virtual_bash execution capability"

[[bin]]
name = "lua-vs-bash"
path = "src/main.rs"

[dependencies]
everruns-core = { path = "../../crates/core" }
everruns-provider = { path = "../../crates/provider", default-features = false }
everruns-test-support = { path = "../../crates/test-support" }
everruns-host = { path = "../../crates/host", features = ["lua"] }
everruns-integrations-bashkit = { path = "../../integrations/bashkit" }
everruns-integrations-lua = { path = "../../integrations/lua" }
everruns-anthropic = { path = "../../crates/anthropic" }
everruns-openai = { path = "../../crates/openai" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
anyhow = "1"
