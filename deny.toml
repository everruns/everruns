# cargo-deny configuration for dependency license and security checking

[advisories]
# RustSec advisory database (https://github.com/rustsec/advisory-db).
# Security vulnerabilities always fail `cargo deny check advisories`; this is the
# supply-chain gate that was previously missing (EVE-624). Yanked crates are
# denied too. Unmaintained advisories are surfaced but do not fail the build yet
# — tighten to "workspace"/"all" once the dependency tree is triaged.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "none"
# Advisory IDs to ignore, each with a justification comment. Prefer upgrading the
# affected crate over ignoring; only ignore when no upstream fix path exists and
# the advisory is not reachable in our usage.
ignore = [
    # Empty: the PostgreSQL archive compatibility patch selects ZIP9, so the
    # ZIP advisories need no exceptions. Fix new advisories rather than ignore.
]

[licenses]
# Allow these license types
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# We don't explicitly deny licenses, instead we use an allowlist approach
# Any license not in the 'allow' list will be denied automatically

# Review unclear/dual licenses
confidence-threshold = 0.8

# Allow specific exceptions (add as needed)
exceptions = [
    # PostgreSQL License: OSI-approved, permissive (BSD/MIT-like). Covers the
    # dev/test-only embedded cluster in crates/pg-embedded.
    { allow = ["PostgreSQL"], crate = "postgresql_archive" },
    { allow = ["PostgreSQL"], crate = "postgresql_commands" },
    { allow = ["PostgreSQL"], crate = "postgresql_embedded" },
    # Python-2.0: OSI-approved, permissive (BSD-like) historical CPython
    # license. Covers the embedded CPython 3.14 interpreter payload shipped
    # inside bashkit-cpython-wasm for the bash `python3` builtin.
    { allow = ["Python-2.0"], crate = "bashkit-cpython-wasm" },
    # Unicode-DFS-2016: the standard Unicode Data Files license. Covers
    # unicode_names2 (pulled in by Monty, the scripted-tools Python
    # interpreter): character name tables.
    { allow = ["Unicode-DFS-2016"], crate = "unicode_names2" },
    # Apache-2.0 WITH LLVM-exception: Apache-2.0 plus LLVM's patent/attribution
    # exception (same terms the LLVM, Swift, and rustc-llvm projects ship
    # under). Covers the wasmtime 48 execution engine and its cranelift codegen
    # family that powers the bash `python3` WASM sandbox.
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "asmlinkage" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cobs" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-assembler-x64" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-assembler-x64-meta" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-bforest" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-bitset" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-codegen" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-codegen-meta" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-codegen-shared" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-control" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-entity" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-frontend" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-isle" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-native" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-srcgen" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "cranelift-wasm" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "ittapi-sys" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "pulley-interpreter" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "pulley-macros" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "regalloc2" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "target-lexicon" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasi-common" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-environ" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-component-util" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-core" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-cranelift" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-fiber" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-jit-icache-coherence" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-unwinder" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-versioned-export-macros" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wasmtime-internal-wit-parser" },
    { allow = ["Apache-2.0 WITH LLVM-exception"], crate = "wat" },
]

# Clarify specific dependencies if needed
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Deny specific crates (security or legal issues)
deny = []

[sources]
# Ensure all dependencies come from crates.io or known Git repos
unknown-registry = "deny"
unknown-git = "deny"
