# cargo-deny configuration for dependency license and security checking

[advisories]
# RustSec advisory database (https://github.com/rustsec/advisory-db).
# Security vulnerabilities always fail `cargo deny check advisories`; this is the
# supply-chain gate that was previously missing (EVE-624). Yanked crates are
# denied too. Unmaintained advisories are surfaced but do not fail the build yet
# — tighten to "workspace"/"all" once the dependency tree is triaged.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "none"
# Advisory IDs to ignore, each with a justification comment. Prefer upgrading the
# affected crate over ignoring; only ignore when no upstream fix path exists and
# the advisory is not reachable in our usage.
ignore = [
    # RUSTSEC-2026-0194 / RUSTSEC-2026-0195: quick-xml <0.41 DoS (quadratic attr
    # duplicate check / unbounded namespace-declaration allocation) via NsReader
    # on UNTRUSTED XML. Reaches us only transitively through object_store 0.14
    # (its S3 XML response parser). object_store 0.14.0 is the latest release and
    # pins quick-xml ^0.40, so there is no upstream upgrade path yet (a [patch] to
    # 0.41 cannot satisfy ^0.40). Our sole object_store use is the blob store
    # against an operator-configured S3 endpoint (blob_store_from_env), i.e. a
    # trusted backend — not attacker-controlled XML — so neither DoS is reachable.
    # Remove once object_store ships a release depending on quick-xml >=0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
# Allow these license types
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT-0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]

# We don't explicitly deny licenses, instead we use an allowlist approach
# Any license not in the 'allow' list will be denied automatically

# Review unclear/dual licenses
confidence-threshold = 0.8

# Allow specific exceptions (add as needed)
exceptions = []

# Clarify specific dependencies if needed
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
# Deny specific crates (security or legal issues)
deny = []

[sources]
# Ensure all dependencies come from crates.io or known Git repos
unknown-registry = "deny"
unknown-git = "deny"
