# The 38 verification points. Weights add up to 115 and are scaled to 100.
#
# direction: at_least (m = value / target), at_most (m = target / value),
#            pass (value is true or false). A zero target at_most is pass/fail.
# target:    an expression over goal.*, layout.* and g.* (derived from the goal:
#            g.agents, g.turns_per_sec, g.peak_turns_per_sec, g.ramp_per_sec,
#            g.shards, g.coding_agents). Milestones re-evaluate it with fewer agents.
# scales:    per_shard points count from any run at goal density; shared points
#            only from a run of the goal's (or milestone's) full size, or at
#            the levels below L3, from a check aimed at full-size traffic.
# gate:      a failing newest result caps the score at 25.
# validity:  decides whether a run counts (D7 also carries weight).
# watches:   code the evidence depends on; a change since halves freshness.

# A. Nothing lost or doubled (20)
[[point]]
id = "A1"
title = "Every accepted message handled exactly once"
weight = 5
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "fleet test durability, many_sessions.py, the 75k drive check"
watches = ["crates/agentd/src/sm.rs", "crates/agentd/src/state_session.rs", "crates/agentd/src/wal.rs", "crates/agentd/src/node.rs"]

[[point]]
id = "A2"
title = "Every tool ran at most once, also across failures"
weight = 5
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "fleet test recovery (tool ledger)"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/ship.rs", "crates/agentd/src/catchup.rs"]

[[point]]
id = "A3"
title = "Replicas agree, journals have no holes"
weight = 4
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "agentd raft_simulation"
watches = ["crates/agentd/src/cluster.rs", "crates/agentd/src/wal.rs", "crates/agentd/src/catchup.rs"]

[[point]]
id = "A4"
title = "No out-of-memory kills"
weight = 6
gate = true
direction = "at_most"
target = "goal.limits.oom_kills"
unit = "kills"
cheapest = "L2"
scales = "per_shard"
built_from = "shard_soak.py, 75k workflow restarts"
watches = ["crates/agentd/src/memwatch.rs", "crates/agentd/src/state.rs", "crates/agentd/src/sm.rs", "crates/agentd/src/session_storage.rs"]

# B. Throughput and speed (18)
[[point]]
id = "B1"
title = "Steady turns a second, with headroom"
weight = 5
direction = "at_least"
target = "g.turns_per_sec * (1 + goal.limits.headroom)"
unit = "turns/s capacity"
cheapest = "L0"
scales = "shared"
built_from = "model from measured CPU per turn, scale.py, 75k workflow"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/node.rs", "crates/agentd/src/dispatch.rs"]

[[point]]
id = "B2"
title = "Busy peak served, under 0.1% shed, all retried"
weight = 3
direction = "at_least"
target = "g.peak_turns_per_sec"
unit = "turns/s"
cheapest = "L2"
scales = "shared"
built_from = "agentd-drive --rate (peak profile, new)"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/gateway_input.rs"]

[[point]]
id = "B3"
title = "Ramp: creating sessions"
weight = 3
direction = "at_least"
target = "g.ramp_per_sec"
unit = "sessions/s"
cheapest = "L2"
scales = "shared"
built_from = "agentd-drive open loop (new)"
watches = ["crates/agentd/src/edge.rs", "crates/agentd/src/api_session.rs"]

[[point]]
id = "B4"
title = "Platform overhead per turn (p50 and p99, model time excluded)"
weight = 4
direction = "at_most"
target = "1"
unit = "share of the p50/p99 budget, worst of the two"
cheapest = "L2"
scales = "per_shard"
built_from = "drive reports with model time split out (new)"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/gateway.rs"]

[[point]]
id = "B5"
title = "Streams get every event fast"
weight = 3
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "fleet test stream"
watches = ["crates/agentd/src/stream.rs", "crates/agentd/src/gateway_sse.rs"]

# C. Cost per agent (18)
[[point]]
id = "C1"
title = "Shard node memory per 1,000 sessions"
weight = 4
direction = "at_most"
target = "layout.node_memory_limit_mb * (1 - goal.limits.headroom) / goal.density.sessions_per_shard * 1000"
unit = "MB per 1k sessions"
cheapest = "L2"
scales = "per_shard"
built_from = "memory_bench.py, 75k peak node memory"
watches = ["crates/agentd/src/state.rs", "crates/agentd/src/state_session.rs", "crates/agentd/src/session_storage.rs", "crates/agentd/src/sm.rs", "crates/agentd/src/wal.rs"]

[[point]]
id = "C2"
title = "Executor memory per running turn"
weight = 3
direction = "at_most"
target = "layout.executor_memory_limit_mb * (1 - goal.limits.headroom) / layout.executor_turns_max"
unit = "MB per running turn"
cheapest = "L2"
scales = "per_shard"
built_from = "75k executor memory / peak running turns"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/exec_api.rs"]

[[point]]
id = "C3"
title = "Memory the node does not account for"
weight = 3
direction = "at_most"
target = "goal.limits.unaccounted_memory_share"
unit = "share of resident memory"
cheapest = "L2"
scales = "per_shard"
built_from = "shard_soak.py peak_unaccounted_mb"
watches = ["crates/agentd/src/heap.rs", "crates/agentd/src/memwatch.rs"]

[[point]]
id = "C4"
title = "Shard CPU per turn (all three nodes) within the 1M peak budget"
weight = 4
direction = "at_most"
target = "g.shards * layout.nodes_per_shard * layout.node_cpu_cores * 1000 / g.peak_turns_per_sec"
unit = "core-ms per turn"
cheapest = "L2"
scales = "per_shard"
built_from = "bench.py, 75k cell CPU"
watches = ["crates/agentd/src/node.rs", "crates/agentd/src/wal.rs", "crates/agentd/src/sm.rs", "crates/agentd/src/cluster.rs"]

[[point]]
id = "C5"
title = "Object store writes per turn"
weight = 2
direction = "at_most"
target = "goal.limits.store_puts_per_turn_max"
unit = "writes per turn"
cheapest = "L2"
scales = "per_shard"
built_from = "memory_bench.py puts_per_turn, 75k store_puts"
watches = ["crates/agentd/src/ship.rs", "crates/agentd/src/store.rs", "crates/agentd/src/session_storage.rs"]

[[point]]
id = "C6"
title = "Compute and store writes per agent-hour"
weight = 2
direction = "at_most"
target = "goal.cost.usd_per_agent_hour_max"
unit = "USD per agent-hour"
cheapest = "L0"
scales = "per_shard"
built_from = "model, 75k compute estimate + store writes"
watches = ["crates/agentd/src/ship.rs", "crates/agentd/src/executor.rs", "crates/agentd/src/node.rs"]

