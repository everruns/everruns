# The 23 verification points. Weights add up to 80 and are scaled to 100.
#
# What this verifier scores (owner, 2026-11-24): extreme horizontal scale,
# whether 40 shards (and later hundreds) behave as one system at 1M
# sessions. Per-agent efficiency (memory, CPU, store writes and cost per
# agent, long and coding sessions) is agents-75k's goal. Its measurements
# feed this verifier's model and cluster simulation as inputs
# (checks/model.py) and score nothing here.
#
# direction: at_least (m = value / target), at_most (m = target / value),
#            pass (value is true or false). A zero target at_most is pass/fail.
# target:    an expression over goal.*, layout.* and g.* (derived from the goal:
#            g.agents, g.turns_per_sec, g.peak_turns_per_sec, g.ramp_per_sec,
#            g.shards, g.coding_agents). Milestones re-evaluate it with fewer agents.
#            The X targets are literal until measured (owner fixes them in goal.toml).
# scales:    per_shard points count from any run at goal density; shared points
#            only from a run of the goal's (or milestone's) full size, or at
#            the levels below L3, from a check aimed at full-size traffic.
# gate:      a failing newest result caps the score at 25.
# validity:  decides whether a run counts (D7 also carries weight).
# watches:   code the evidence depends on; a change since halves freshness.
#
# Ids are kept from before the split so a point's history reads on; the X
# points are new.

# A. Nothing lost or doubled (20)
[[point]]
id = "A1"
title = "Every accepted message handled exactly once"
weight = 5
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "fleet test durability, many_sessions.py, the 75k drive check"
watches = ["crates/agentd/src/sm.rs", "crates/agentd/src/state_session.rs", "crates/agentd/src/wal.rs", "crates/agentd/src/node.rs"]

[[point]]
id = "A2"
title = "Every tool ran at most once, also across failures"
weight = 5
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "fleet test recovery (tool ledger)"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/ship.rs", "crates/agentd/src/catchup.rs"]

[[point]]
id = "A3"
title = "Replicas agree, journals have no holes"
weight = 4
gate = true
direction = "pass"
cheapest = "L1"
scales = "per_shard"
built_from = "agentd raft_simulation"
watches = ["crates/agentd/src/cluster.rs", "crates/agentd/src/wal.rs", "crates/agentd/src/catchup.rs"]

[[point]]
id = "A4"
title = "No out-of-memory kills"
weight = 6
gate = true
direction = "at_most"
target = "goal.limits.oom_kills"
unit = "kills"
cheapest = "L2"
scales = "per_shard"
built_from = "shard_soak.py, 75k workflow restarts"
watches = ["crates/agentd/src/memwatch.rs", "crates/agentd/src/state.rs", "crates/agentd/src/sm.rs", "crates/agentd/src/session_storage.rs"]

# B. Scaling out (13)
[[point]]
id = "B1"
title = "Steady turns a second, with headroom"
weight = 5
direction = "at_least"
target = "g.turns_per_sec * (1 + goal.limits.headroom)"
unit = "turns/s capacity"
cheapest = "L0"
scales = "shared"
built_from = "model from measured CPU per turn, scale.py, 75k workflow"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/node.rs", "crates/agentd/src/dispatch.rs"]

[[point]]
id = "B2"
title = "Busy peak served across the fleet, under 0.1% shed, all retried"
weight = 3
direction = "at_least"
target = "g.peak_turns_per_sec"
unit = "turns/s"
cheapest = "L2"
scales = "shared"
built_from = "agentd-drive --rate (peak profile, new)"
watches = ["crates/agentd/src/executor.rs", "crates/agentd/src/gateway_input.rs"]

[[point]]
id = "D1"
title = "Scaling curve over 1, 2, 4, 8 shards still rising at the 1M load"
weight = 5
direction = "at_least"
target = "1"
unit = "fitted peak / goal shards"
cheapest = "L2"
scales = "shared"
built_from = "scale.py plus a Universal Scalability Law fit"
watches = ["crates/agentd/src/edge.rs", "crates/agentd/src/dp.rs", "crates/agentd/src/dispatch.rs"]

# X. Cells working together (25)
[[point]]
id = "D4"
title = "Directory and edge router hold 1M sessions (lookup p99 under 5 ms)"
weight = 3
direction = "at_most"
target = "5"
unit = "lookup p99 ms"
cheapest = "L1"
scales = "shared"
built_from = "in-process 1M-session directory test (new)"
watches = ["crates/agentd/src/edge.rs", "crates/agentd/src/edge_commands.rs"]

[[point]]
id = "X2"
title = "Routing a turn to its session's cell adds under 2 ms (p99)"
weight = 3
direction = "at_most"
target = "2"
unit = "ms added p99"
cheapest = "L1"
scales = "shared"
built_from = "edge router forwarding at the 1M turn rate, in process (new)"
watches = ["crates/agentd/src/edge.rs", "crates/agentd/src/edge_commands.rs", "crates/agentd/src/gateway.rs"]

[[point]]
id = "X3"
title = "Sessions move between cells under load: 0 lost or repeated messages, p99 under 1 s"
weight = 5
direction = "at_most"
target = "1000"
unit = "ms move p99 (a lost or repeated message fails it)"
cheapest = "L2"
scales = "shared"
built_from = "moves under drive load across shards (new)"
watches = ["crates/agentd/src/moves.rs", "crates/agentd/src/state_session.rs", "crates/agentd/src/gateway.rs", "crates/agentd/src/edge.rs"]

[[point]]
id = "X4"
title = "The rebalancer evens out a hot shard among many, with no turn errors"
weight = 3
direction = "pass"
cheapest = "L2"
scales = "shared"
built_from = "one hot shard among many, rebalancer on, drive load (new)"
watches = ["crates/agentd/src/api.rs", "crates/agentd/src/gateway.rs", "crates/agentd/src/moves.rs"]

[[point]]
id = "D6"
title = "Hundreds of shards and ~700 pods register, place, spread, roll out"
weight = 2
direction = "pass"
cheapest = "L1"
scales = "shared"
built_from = "KWOK fake cluster (new)"
watches = ["crates/agentd/src/cluster.rs"]

[[point]]
id = "X6"
title = "The directory stays right while shards join, leave and fail"
weight = 3
direction = "pass"
cheapest = "L1"
scales = "shared"
built_from = "directory and edge router under shard churn, in process (new)"
watches = ["crates/agentd/src/edge.rs", "crates/agentd/src/edge_commands.rs", "crates/agentd/src/cluster.rs"]

[[point]]
id = "X7"
title = "A subagent on another cell returns to its parent: 0 lost, p99 under 1 s"
weight = 5
direction = "at_most"
target = "1000"
unit = "ms child result to parent p99 (a lost result fails it)"
cheapest = "L2"
scales = "shared"
built_from = "parents and subagents placed on different shards under load (new)"
watches = ["crates/agentd/src/subagents.rs", "crates/agentd/src/gateway.rs", "crates/agentd/src/gateway_wait.rs"]

# L. The control plane link at 1M (7)
[[point]]
id = "D2"
title = "agentd streams 1M agents' records out to its controller (p99 lag)"
weight = 3
direction = "at_most"
target = "5"
unit = "s stream lag p99"
cheapest = "L2"
scales = "shared"
built_from = "stream consumer at the 1M record rate (new)"
watches = ["crates/agentd/src/install_stream.rs", "crates/agentd/src/stream.rs"]

[[point]]
id = "D3"
title = "Spend allowances issued at 1M rate"
weight = 2
direction = "pass"
cheapest = "L2"
scales = "shared"
built_from = "synthetic generator (new)"
watches = ["crates/agentd/src/allowance.rs", "crates/agentd/src/group.rs"]

[[point]]
id = "E5"
title = "Control plane down for 10 minutes: turns continue or wait"
weight = 2
direction = "pass"
cheapest = "L1"
scales = "shared"
built_from = "fleet test control_plane"
watches = ["crates/agentd/src/control.rs", "crates/agentd/src/host.rs"]

# F. Fleet failures (8)
[[point]]
id = "E1"
title = "A node in every shard group killed mid-run: catches up, 0 errors"
weight = 3
direction = "pass"
cheapest = "L2"
scales = "per_shard"
built_from = "prove_rejoin_under_load.py, 75k chaos"
watches = ["crates/agentd/src/catchup.rs", "crates/agentd/src/cluster.rs", "crates/agentd/src/node.rs"]

[[point]]
id = "E3"
title = "A zone lost for 5 minutes: sessions keep going, 0 lost work"
weight = 3
direction = "pass"
cheapest = "L2"
scales = "per_shard"
built_from = "Chaos Mesh on the local cluster (new)"
watches = ["crates/agentd/src/cluster.rs", "crates/agentd/src/ship.rs"]

[[point]]
id = "E6"
title = "Rolling upgrade during the run: 0 sessions suspended"
weight = 2
direction = "pass"
cheapest = "L2"
scales = "per_shard"
built_from = "upgrade test (new)"
watches = ["crates/agentd/src/node_control.rs"]

# P. The fleet fits (8)
[[point]]
id = "D5"
title = "Object store request rate under the per-prefix limit"
weight = 2
direction = "at_least"
target = "goal.limits.store_prefix_margin"
unit = "limit / peak rate per prefix"
cheapest = "L0"
scales = "shared"
built_from = "model from C5"
watches = ["crates/agentd/src/ship.rs", "crates/agentd/src/store.rs"]

[[point]]
id = "D7"
title = "The load generator is not the bottleneck"
weight = 3
validity = true
direction = "at_most"
target = "goal.limits.driver_cpu_max"
unit = "driver CPU share of its limit"
cheapest = "L2"
scales = "per_shard"
built_from = "driver pod CPU against its limit"
watches = ["crates/agentd-testkit/src/bin/drive.rs"]

[[point]]
id = "D8"
title = "The 1M fleet fits on real machines (cluster simulation)"
weight = 3
direction = "at_most"
target = "1"
unit = "worst of peak/70% and zone-loss/85% utilization"
cheapest = "L1"
scales = "shared"
built_from = "cluster simulation fed by measured per-agent costs"
watches = ["verifiers/agents-1m/layout.toml"]
