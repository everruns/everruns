# The 75k agents goal: the 75k gate as a verifier, with the reliability,
# durability and recoverability it must also prove.
#
# Owned by the project owner (CODEOWNERS). Changing a number here changes what
# the score means, so every report prints this file's fingerprint, and results
# recorded under another fingerprint earn nothing. A climbing agent never
# edits this file. Everything outside the [approval] table is fingerprinted.
#
# Scope (owner, 2026-11-23): agentd only, meaning data plane v2 (shard nodes,
# executors, edge router). The Everruns server is outside the goal: tests
# stand in for it with the testkit's fake control plane, and its points are
# about agentd's side of the link (E5 controller down, D2 stream out, D3
# allowances).
#
# The numbers are the 75k gate's (EKS run 45197793040, 2026-11-23: 72,537
# agents, 725,370 turns, 218.7 turns/s, 0 errors, 0 out-of-memory kills).

[meta]                       # not fingerprinted
title = "75k agents verifier"

[agents]
total = 75_000
full_run_min_share = 0.95    # the gate holds ~72.5k sessions; a run at 95% counts as full
coding_share = 0.25          # long-running coding agents, shaped by workload/coding-profile.json (D7)
streaming_share = 0.2        # sessions holding a live stream, as in the 75k gate

[pace]
turn_every_s = 360           # one turn every 6 minutes per agent, as in the 75k gate (D1)
peak_multiplier = 3          # a busy peak at 3x the pace...
peak_minutes = 10            # ...for 10 minutes
ramp_minutes = 30            # all sessions created within 30 minutes
steady_minutes = 60          # then an hour at the steady pace

[orgs]
big_org_agents = 10_000      # one org this big, the rest in small orgs (D3)
small_org_agents = 50

[density]
sessions_per_shard = 25_000  # per-shard load; per-shard points count only at this density

[failures]                   # during the run (D2)
node_per_shard_group = true
executor_share_killed = 0.25
zone_loss_minutes = 5
control_plane_down_minutes = 10

[limits]
headroom = 0.30                       # capacity kept free at the steady pace
errors_share_max = 0.001              # only "busy, retry" refusals, all retried
oom_kills = 0                         # gate A4
overhead_p50_ms = 150                 # platform time per turn, model time excluded
overhead_p99_ms = 2000
stream_p99_ms = 1000
model_call_overhead_p99_ms = 300      # coding turns with many model calls (G2)
memory_creep_share_per_hour = 0.05    # F1
unaccounted_memory_share = 0.15       # C3
store_puts_per_turn_max = 1.5         # C5: the 75k gate wrote 1.34 object store writes a turn
store_prefix_margin = 2.0             # D5: object store request rate under its per-prefix limit, 2x
ship_lag_p99_s = 15                   # F3: log segments ship every ~10 s by design (all-replica ack)
fleet_peak_util = 0.70                # D8: memory and CPU at the peak
fleet_zone_loss_util = 0.85           # D8: after losing a zone
idle_reload_s = 1.0                   # G3
blob_threshold_kb = 256               # G4
realism_tolerance = 0.10              # G6: generated coding load within 10% of the profile
driver_cpu_max = 0.70                 # D7: the load generator is not the bottleneck
rebuild_s = 60                        # U7: drill rebuilt a 37k-session shard in 3.7 s (2026-11-12)
kill_to_leader_s = 15                 # U8: drill measured 7.4 s
ship_first_p99_s = 0.25               # U9: 100 ms batching plus the store write (owner, 2026-11-25); step 9 drill measured p99 at or under 100 ms unbatched
loss_window_share = 0.01              # U10: drill resent 18 of 3,000 (0.6%)
gate_streak = 3                       # R10: the gate passes three runs in a row

[cost]
# D5: compute plus object store writes per agent-hour, no higher than the 75k
# gate's (run 45197793040: compute $3.3e-05, writes $7.0e-05).
usd_per_agent_hour_max = 1.03e-4

[milestones]
agents = [25_000, 50_000, 75_000]

[approval]
# Not fingerprinted. The owner records approval of a full (L4) run here, e.g.
# full_run = "2026-12-01 one full run approved"
full_run = ""
# Earlier goal fingerprints whose results still count, scored against today's
# targets. 2026-11-25: U9 moved from 0.1 s to 0.25 s for 100 ms batching.
carry_from = ["edc6e32781fa635d"]
