# GitHub Integration
# Decision: External integration crate, named in crates/integrations-catalog
# Decision: Provides blueprint-only GitHub Scout; host-facing GitHub tools stay empty
# Decision: GitHub token resolved via the existing "github" user connection

[package]
name = "everruns-integrations-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-github"
readme = "README.md"
keywords = ["everruns", "github", "agents", "blueprints"]
categories = ["api-bindings", "development-tools"]
description = "GitHub-backed agent blueprints for Everruns"

[dependencies]
everruns-core.workspace = true
# `definition` supplies `json_schema_for` + schemars so the blueprint config
# schema is derived from `GitHubScoutConfig` instead of hand-written JSON.
everruns-capability = { workspace = true, features = ["definition"] }
everruns-provider.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tracing.workspace = true
base64.workspace = true

[features]
github-live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
chrono.workspace = true

[lints]
workspace = true
