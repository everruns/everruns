[package]
name = "everruns-integrations-bashkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-bashkit"
description = "Sandboxed Bashkit shell capability integration for Everruns agents"
readme = "README.md"
keywords = ["everruns", "bash", "sandbox", "agents"]
categories = ["development-tools", "asynchronous"]

[features]
default = []

[dependencies]
everruns-capability.workspace = true
everruns-core.workspace = true
everruns-provider.workspace = true
async-trait.workspace = true
# `default-features = false` drops bashkit's default `ring`; the rest of its
# default set is restored explicitly so only the crypto backend changes (EVE-924).
bashkit = { version = "0.18.1", default-features = false, features = ["jq", "http_client", "bot-auth", "bash_tool", "tzdata", "aws-lc-rs"] }
# A command source hands the tree a `clap::Command` and gets back the
# `ArgMatches` clap produced, so clap types are in this crate's public API.
# `string` because a tree assembled from runtime data owns its names and cannot
# hand clap `&'static str`.
clap = { workspace = true, features = ["string"] }
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
uuid.workspace = true

[lints]
workspace = true
