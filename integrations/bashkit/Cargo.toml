[package]
name = "everruns-integrations-bashkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-bashkit"
description = "Sandboxed Bashkit shell capability integration for Everruns agents"
readme = "README.md"
keywords = ["everruns", "bash", "sandbox", "agents"]
categories = ["development-tools", "asynchronous"]

[features]
default = []

[dependencies]
everruns-core.workspace = true
async-trait.workspace = true
bashkit = { version = "0.16.0", features = ["jq", "http_client", "bot-auth"] }
serde_json.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true
url = "2"

[dev-dependencies]
anyhow.workspace = true
chrono.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
uuid.workspace = true
