# TypeSafe hosted capability, Framework helper and connector.
# The credential-free System One protocol lives in everruns-drivers. This crate
# retains the application client convenience over provider-owned authentication.

[package]
name = "everruns-integrations-typesafe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-typesafe"
description = "TypeSafe typed-judgment capability for Everruns agents"
readme = "README.md"
keywords = ["everruns", "typesafe", "agents", "classification", "llm"]
categories = ["api-bindings", "development-tools"]

[dependencies]
everruns-contracts = { workspace = true, default-features = false, features = ["runtime", "definition"] }
everruns-drivers = { workspace = true, features = ["typesafe", "openrouter"] }
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
inventory = { workspace = true, optional = true }

async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
default = ["hosted"]
hosted = ["dep:inventory"]
# Gate real-API tests; CI passes these with the matching credential set.
integration = []
live-tests = []

[dev-dependencies]
everruns = { path = "../../crates/everruns" }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
