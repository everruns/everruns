# TypeSafe Integration
# Decision: The vendor client lives in the standalone `typesafe-systemone` crate
#   so it is publishable and usable outside Everruns; this crate is only the
#   capability, its tool, and the connector catalog entry.
# Decision: API key resolved via user connections (connection_resolver), with a
#   session-secret fallback, same contract as brave-search.

[package]
name = "everruns-integrations-typesafe"
version = "0.1.0"
# Not published yet: depends on typesafe-systemone, which is currently private
# (crates.io 403 for the new name). Keep private until that is resolved.
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-typesafe"
description = "TypeSafe typed-judgment capability for Everruns agents"
readme = "README.md"
keywords = ["everruns", "typesafe", "agents", "classification", "llm"]
categories = ["api-bindings", "development-tools"]

[dependencies]
typesafe-systemone.workspace = true

everruns-capability = { workspace = true, features = ["definition"] }
everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[features]
default = ["hosted"]
hosted = ["dep:everruns-platform", "dep:inventory"]

[dev-dependencies]
everruns = { path = "../../crates/everruns" }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
