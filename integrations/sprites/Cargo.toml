# Sprites Integration
# Decision: External integration crate, auto-registered via inventory plugin system
# Decision: Embrace persistent VMs — sprites survive across sessions, expose HTTP endpoints

[package]
name = "everruns-integrations-sprites"
readme = "README.md"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Sprites cloud sandbox integration for Everruns agents"
keywords = ["everruns", "sprites", "sandbox", "agents"]
categories = ["api-bindings", "development-tools"]
documentation = "https://docs.rs/everruns-integrations-sprites"

[dependencies]
everruns-core.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform.workspace = true
inventory.workspace = true

# HTTP client for Sprites API
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true

[features]
sprites-live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
