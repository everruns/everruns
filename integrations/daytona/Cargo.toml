# Daytona Integration
# Decision: External integration crate, auto-registered via inventory plugin system

[package]
name = "everruns-integrations-daytona"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-daytona"
readme = "README.md"
keywords = ["everruns", "daytona", "sandbox", "agents"]
categories = ["api-bindings", "development-tools"]
description = "Daytona cloud sandbox integration for Everruns"

[dependencies]
everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform.workspace = true
inventory.workspace = true

# HTTP client for Daytona API
reqwest = { workspace = true, features = ["multipart"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true

[features]
daytona-live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
urlencoding = "2"
