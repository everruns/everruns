# Daytona Integration
# Decision: External integration crate, named in crates/integrations-catalog

[package]
name = "everruns-integrations-daytona"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-daytona"
readme = "README.md"
keywords = ["everruns", "daytona", "sandbox", "agents"]
categories = ["api-bindings", "development-tools"]
description = "Daytona cloud sandbox integration for Everruns"

[dependencies]
everruns-core.workspace = true
everruns-contracts = { workspace = true, features = ["session-sandbox"] }
inventory.workspace = true

# HTTP client for Daytona API
reqwest = { workspace = true, features = ["multipart"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true

[features]
daytona-live-tests = []
# Test-only: lets tests point DaytonaApiCallTool at a mock server via
# ToolContext. Never enabled in shipped builds, so no runtime path can
# redirect the API key elsewhere.
test-util = []

[dev-dependencies]
# Verify the host reserves provider state from agent-visible secret storage.
everruns-host.workspace = true
# Enables `test-util` for this crate's own integration tests.
everruns-integrations-daytona = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
urlencoding = "2"
tempfile.workspace = true

[lints]
workspace = true
