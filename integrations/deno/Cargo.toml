# Deno Sandbox Integration
# Decision: External integration crate, auto-registered via inventory plugin system.

[package]
name = "everruns-integrations-deno"
readme = "README.md"
version.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Deno Sandbox integration for Everruns"
documentation = "https://docs.rs/everruns-integrations-deno"

[dependencies]
everruns-core.workspace = true
inventory.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
chrono.workspace = true
tracing.workspace = true
futures-util.workspace = true
tokio-tungstenite.workspace = true
hickory-resolver = "0.26"

# TLS: custom rustls config to force http/1.1 ALPN for WebSocket
rustls.workspace = true
rustls-native-certs = "0.8"

base64.workspace = true
http = "1"
urlencoding = "2.1"

[features]
deno-live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
