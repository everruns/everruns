[package]
name = "everruns-integrations-lua"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-lua"
description = "Sandboxed Lua and code-mode capability integration for Everruns agents"
readme = "README.md"
keywords = ["everruns", "lua", "sandbox", "agents"]
categories = ["development-tools", "asynchronous"]

[features]
default = []

[dependencies]
everruns-core.workspace = true
async-trait.workspace = true
base64.workspace = true
mlua = { version = "0.12", features = ["lua54", "vendored", "async", "send", "serialize"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }

[dev-dependencies]
chrono.workspace = true
everruns-http.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
uuid.workspace = true
