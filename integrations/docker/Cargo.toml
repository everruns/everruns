# Docker Container Integration
# Decision: External integration crate, auto-registered via inventory plugin system
# Decision: Experimental-only (gated behind DeploymentGrade::Dev)

[package]
name = "everruns-integrations-docker"
readme = "README.md"
version = "0.18.2"
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Docker container integration for Everruns agents"
keywords = ["everruns", "docker", "sandbox", "agents"]
categories = ["api-bindings", "development-tools"]
documentation = "https://docs.rs/everruns-integrations-docker"

[dependencies]
everruns-core.workspace = true
everruns-provider.workspace = true
inventory.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

# Base64 encoding for file writes
base64 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
uuid = { workspace = true }
