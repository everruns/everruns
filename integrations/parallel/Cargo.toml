# Parallel MCP Integration
# Decision: Capability contributes a remote MCP server rather than reimplementing search tools.
# Decision: Free by default; optional user connection supplies a Parallel API key as bearer auth.

[package]
name = "everruns-integrations-parallel"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-parallel"
description = "Parallel web search MCP integration for Everruns"
readme = "README.md"
keywords = ["everruns", "parallel", "search", "agents"]
categories = ["api-bindings", "development-tools"]

[dependencies]
everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform.workspace = true
inventory.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[features]
integration = []

[dev-dependencies]
everruns-capability.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }
