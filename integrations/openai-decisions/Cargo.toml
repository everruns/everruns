# Unpublished application helper for the opt-in OpenAI Decisions preview.
# Protocol implementation lives in everruns-drivers/openai/decisions.

[package]
name = "everruns-integrations-openai-decisions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "OpenAI Decisions API as an Everruns decision driver (preview)"
publish = false

[dependencies]
everruns-core.workspace = true
everruns-drivers = { workspace = true, features = ["openai"] }
everruns-contracts = { workspace = true, default-features = false }

async-trait.workspace = true
futures.workspace = true
reqwest = { workspace = true, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true

[features]
# Real-API smoke test; needs an account with Decisions API access.
live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"

[lints]
workspace = true
