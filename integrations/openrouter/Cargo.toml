[package]
name = "everruns-integrations-openrouter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-openrouter"
description = "OpenRouter workspace, model-scout, and server-tool capabilities for Everruns agents"
readme = "README.md"
keywords = ["everruns", "openrouter", "models", "agents"]
categories = ["api-bindings", "development-tools"]

[features]
default = []

[dependencies]
everruns-core.workspace = true
# `definition` supplies `json_schema_for` + schemars so the blueprint config
# schema is derived from `ScoutConfig` instead of hand-written JSON.
everruns-capability = { workspace = true, features = ["definition"] }
everruns-provider.workspace = true
everruns-openrouter = { version = "0.29.0", path = "../../crates/drivers/openrouter" }
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
