# DuckDuckGo Integration
# Decision: External integration crate, auto-registered via inventory plugin system
# Decision: Experimental-only (gated behind DeploymentGrade::Dev)
# Decision: No API key required (DuckDuckGo Instant Answer API is free)

[package]
name = "everruns-integrations-duckduckgo"
version = "0.18.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-duckduckgo"
description = "DuckDuckGo Instant Answer search integration for Everruns agents"
keywords = ["everruns", "duckduckgo", "search", "agents"]
categories = ["api-bindings", "development-tools"]
readme = "README.md"

[dependencies]
everruns-capability.workspace = true
everruns-core.workspace = true
everruns-provider.workspace = true
inventory.workspace = true

# HTTP client for DuckDuckGo API
reqwest.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Async
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
integration = [] # Gate real-API tests; CI passes --features integration

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
