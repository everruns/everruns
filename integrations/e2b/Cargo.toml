[package]
name = "everruns-integrations-e2b"
version = "0.18.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-e2b"
readme = "README.md"
keywords = ["everruns", "e2b", "sandbox", "agents"]
categories = ["api-bindings", "development-tools"]
description = "E2B cloud sandbox integration for Everruns"
build = "build.rs"

[dependencies]
async-trait.workspace = true
chrono.workspace = true
inventory.workspace = true
reqwest = { workspace = true, features = ["multipart"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
urlencoding = "2"
http = "1"
http-body = "1"
futures.workspace = true
connectrpc = { version = "0.8.1", features = ["client", "client-tls"] }
buffa = "0.8.1"
rustls.workspace = true
rustls-native-certs = "0.8"

everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform.workspace = true

[package.metadata.cargo-machete]
ignored = ["connectrpc-build", "futures", "http-body", "prost", "protox"]

[build-dependencies]
connectrpc-build = "0.8.0"
protox = "0.9"
prost.workspace = true

[dev-dependencies]
wiremock = "0.6"
tokio.workspace = true

[features]
e2b-live-tests = []
