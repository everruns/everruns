# Cursor Integration
# Decision: Direct REST client for Cursor Background/Cloud Agents API.

[package]
name = "everruns-integrations-cursor"
readme = "README.md"
version = "0.18.1"
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Cursor Cloud Agents integration for Everruns"
keywords = ["everruns", "cursor", "agents", "ai"]
categories = ["api-bindings", "development-tools"]
documentation = "https://docs.rs/everruns-integrations-cursor"

[dependencies]
everruns-core.workspace = true
everruns-provider.workspace = true
# Connector catalog (EVE-879): connectors register into the hosted connector
# plugin system, which lives in the platform crate.
everruns-platform.workspace = true
inventory.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
cursor-live-tests = []

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }
wiremock = "0.6"
