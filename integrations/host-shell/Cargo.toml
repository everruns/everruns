# Host Shell Integration
#
# The `bash` tool over real host processes, ported from Yolop. Containment
# itself lives in `everruns-containment`, which this crate configures but does
# not reimplement.

[package]
name = "everruns-integrations-host-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation = "https://docs.rs/everruns-integrations-host-shell"
description = "Contained host shell capability for Everruns agents"
readme = "README.md"
keywords = ["everruns", "bash", "shell", "sandbox", "agents"]
categories = ["development-tools", "asynchronous"]

[dependencies]
everruns-capability.workspace = true
everruns-containment.workspace = true
everruns-core.workspace = true
everruns-provider.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "time"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full", "test-util"] }

[lints]
workspace = true
