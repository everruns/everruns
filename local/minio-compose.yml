# Local MinIO (S3-compatible object storage) for exercising the optional
# object-storage blob backend (specs/object-storage.md).
#
# This is NOT part of `just start-all` — the core local stack (PostgreSQL,
# Valkey, NATS) runs as local processes. MinIO is an opt-in dev convenience
# started via `just minio`.
#
# API:     http://127.0.0.1:9000
# Console: http://127.0.0.1:9090  (login minioadmin / minioadmin)
#
# Point the server at it with:
#   STORAGE_BLOB_BACKEND=s3
#   STORAGE_S3_BUCKET=everruns-dev
#   STORAGE_S3_ENDPOINT=http://127.0.0.1:9000
#   STORAGE_S3_ACCESS_KEY_ID=minioadmin
#   STORAGE_S3_SECRET_ACCESS_KEY=minioadmin
#   STORAGE_S3_ALLOW_HTTP=true

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9090"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9090:9090"
    volumes:
      - everruns-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the dev bucket, then exit.
  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'waiting for minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/everruns-dev;
      echo 'bucket everruns-dev ready';
      "

volumes:
  everruns-minio-data:
