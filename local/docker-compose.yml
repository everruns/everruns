services:
  postgres:
    image: postgres:17-alpine
    container_name: everruns-postgres
    environment:
      POSTGRES_USER: everruns
      POSTGRES_PASSWORD: everruns
      POSTGRES_DB: everruns
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everruns"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Jaeger - default tracing backend
  jaeger:
    image: jaegertracing/jaeger:2.4.0
    container_name: everruns-jaeger
    profiles:
      - default
      - jaeger
    ports:
      # OTLP gRPC receiver
      - "4317:4317"
      # OTLP HTTP receiver
      - "4318:4318"
      # Jaeger UI
      - "16686:16686"

  # Arize Phoenix - LLM observability platform
  # Use with: docker compose --profile phoenix up -d
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: everruns-phoenix
    profiles:
      - phoenix
    ports:
      # Phoenix UI
      - "6006:6006"
      # OTLP gRPC receiver (same as Jaeger for easy switching)
      - "4317:4317"
      # OTLP HTTP receiver
      - "4318:4318"
    environment:
      # Enable OpenInference semantic conventions
      PHOENIX_ENABLE_PROMETHEUS: "false"
      PHOENIX_WORKING_DIR: /phoenix_data
    volumes:
      - phoenix_data:/phoenix_data

volumes:
  postgres_data:
  phoenix_data:
