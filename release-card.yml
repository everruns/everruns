version: 0.31.0
date: 2026-09-24
headline:
  - Ask User,
  - everywhere.
summary:
  - Ask User reaches agents over MCP and A2A,
  - always-thinking models stay reliable,
  - and the server holds up under load.
highlights:
  - title: Ask User over MCP and A2A
    description: The Ask User capability now reaches agents over MCP form-mode elicitation and inbound A2A.
    source: "#3781"
