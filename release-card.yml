version: 0.28.0
date: 2026-09-16
headline:
  - One home for
  - agent exposure.
summary:
  - Endpoints and triggers gain a single home,
  - sessions and budgets attribute to endpoints,
  - and channels re-parent from App to Agent.
highlights:
  - title: Agent exposure management
    description: An agent's endpoints and triggers get one home, with a cross-agent Exposures view.
    source: "#3624"
  - title: Endpoint-attributed budgets
    description: Sessions and budgets attribute to endpoints; Slack and FCP endpoint budgets enforce.
    source: "#3623"
  - title: Channels re-parent to Agent
    description: Channels move from the retired App abstraction to the agent.
    source: "#3618"
