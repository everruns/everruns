version: 0.30.0
date: 2026-09-23
headline:
  - Agents that
  - ask, and run.
summary:
  - Agents can pause to ask a person a question,
  - a host_shell tool runs bash under a policy,
  - and Slack installs in one click.
highlights:
  - title: Ask User
    description: Agents pause mid-run to ask a person, keeping credentials out of the log.
    source: "#3735"
  - title: Host Shell
    description: A host_shell capability runs the bash tool as real child processes under a kernel policy.
    source: "#3719"
  - title: Slack one-click install
    description: Install the Slack app in one click, taking its credentials straight from OAuth.
    source: "#3724"
