[workspace]
resolver = "2"

members = [
    "crates/server",
    "crates/worker",
    "crates/everruns",
    "crates/macros",
    "crates/capability",
    "crates/builtins",
    "crates/core",
    "crates/engine",
    "crates/host",
    "crates/test-support",
    "crates/platform",
    "crates/provider",
    "crates/mcp",
    "crates/llm-tests",
    # LLM wire-protocol drivers. Package names stay independently versioned;
    # the directory is only a repository organization boundary.
    "crates/drivers/anthropic",
    "crates/drivers/bedrock",
    "crates/drivers/fireworks",
    "crates/drivers/gemini",
    "crates/drivers/llmsim",
    "crates/drivers/mai",
    "crates/drivers/meta",
    "crates/drivers/openai",
    "crates/drivers/openrouter",
    "crates/turbopuffer",
    "crates/internal-protocol",
    "crates/cli",
    "crates/durable",
    "crates/ard",
    "integrations/docker",
    "integrations/filesystem",
    "integrations/bashkit",
    "integrations/web-fetch",
    "integrations/lua",
    "integrations/openrouter-workspace",
    "integrations/daytona",
    "integrations/deno",
    "integrations/brave-search",
    "integrations/openai-image",
    "integrations/parallel",
    "integrations/duckduckgo",
    "integrations/github",
    "integrations/cursor",
    "integrations/browserless",
    "integrations/e2b",
    "integrations/sprites",
    "examples/coding-cli",
]

exclude = [
    "research/infinity_context",
    "research/lua-vs-bash",
    "examples/weekend-concierge-host",
    "evals/platform-capability",
    "evals/generic",
]

[workspace.package]
version = "0.20.0"
edition = "2024"
# Published crate MSRV: Rust 2024 plus current published dependency floors.
rust-version = "1.94.0"
license = "MIT"
authors = ["Everruns Contributors"]
homepage = "https://everruns.com"
repository = "https://github.com/everruns/everruns"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Global allocator for binaries (sharded, low-fragmentation; MIT-licensed)
mimalloc = "0.1"

# HTTP framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "multipart", "query"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# JSON Schema generation for the `#[everruns::tool]` argument structs (EVE-829).
schemars = "1.0"

# Procedural-macro toolchain (backs `everruns-macros`).
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3.0", features = ["full"] }
# Compile-pass / compile-fail fixtures for the proc-macro crate.
trybuild = "1.0"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "uuid", "chrono", "macros"] }

# UUID and time
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Environment
dotenvy = "0.15"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry (exporter deps are activated only by everruns-host's
# observability feature; scripts/lib/check-observability-isolation.sh enforces it)
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.33"

# OpenAPI documentation (used by export-openapi binary for spec generation)
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }

# Encryption
aes-gcm = "0.11"
rand = "0.10"
base64 = "0.23"

# Object storage (optional S3-compatible blob backend, knowledge/runtime-resources/object-storage.md)
object_store = { version = "0.14", features = ["aws"] }

# Rate limiting
governor = "0.10"

# Valkey/Redis (distributed rate limiting)
fred = { version = "10", features = ["enable-rustls-ring", "i-scripts"] }

# NATS (event delivery, task queue)
async-nats = "0.50"

# Authentication
argon2 = "0.5"
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
git2 = { version = "0.21", features = ["https", "vendored-openssl"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls", "blocking", "form"] }
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
eventsource-stream = "0.2"
regex = "1.11"
globset = "0.4"
time = "0.3"
parking_lot = "0.12"
dialoguer = "0.12"
webbrowser = "1"
dirs = "6"

# WebSocket (CDP sessions)
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Everruns SDK
everruns-sdk = "0.2.0"
everruns-capability = { path = "crates/capability", version = "0.18.0", default-features = false }
everruns-builtins = { path = "crates/builtins", version = "0.18.1" }
everruns-core = { path = "crates/core", version = "0.18.0" }
everruns-engine = { path = "crates/engine", version = "0.18.0" }
everruns-host = { path = "crates/host", version = "0.20.0" }
everruns-llmsim = { path = "crates/drivers/llmsim", version = "0.18.2", default-features = false }
everruns-test-support = { path = "crates/test-support", version = "0.18.2", default-features = false }
everruns-platform = { path = "crates/platform", version = "0.18.2" }
everruns-provider = { path = "crates/provider", version = "0.18.0", default-features = false }
everruns-mcp = { path = "crates/mcp", version = "0.19.0" }
everruns-ard = { path = "crates/ard", version = "0.18.0" }
everruns-openai = { path = "crates/drivers/openai", version = "0.18.0" }
everruns = { path = "crates/everruns", version = "0.18.0" }
everruns-macros = { path = "crates/macros", version = "0.18.0" }
everruns-integrations-filesystem = { path = "integrations/filesystem", version = "0.18.0" }
everruns-integrations-bashkit = { path = "integrations/bashkit", version = "0.18.0" }
everruns-integrations-web-fetch = { path = "integrations/web-fetch", version = "0.18.0" }
everruns-integrations-duckduckgo = { path = "integrations/duckduckgo", version = "0.18.0" }
everruns-integrations-lua = { path = "integrations/lua", version = "0.18.0" }
everruns-integrations-openrouter-workspace = { path = "integrations/openrouter-workspace", version = "0.18.0" }

# A2A protocol
a2a = { package = "a2a-lf", version = "0.3" }
a2a-client = { package = "a2a-client-lf", version = "0.1" }
a2a-server = { package = "a2a-server-lf", version = "0.3" }

# gRPC (tonic)
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# Protocol Buffers (used by tonic/gRPC)
prost = "0.14"

# Deterministic network simulation (dev-only). Used to test worker↔control-plane
# transport reliability (drops, partitions, latency, reorder) with a simulated
# clock. See knowledge/runtime-resources/agent-reliability-tests.md scenario 3.
turmoil = "0.7"
prost-build = "0.14"
prost-types = "0.14"

# Image processing (for thumbnail generation)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# In-process caching
moka = { version = "0.12", features = ["future", "sync"] }

# Fault injection testing
fail = "0.5"
rstest = "0.26"
tempfile = "3"

# File watching and gitignore
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { version = "0.7", default-features = false }
ignore = "0.4"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Plugin system for external integrations
inventory = "0.3"

# Compression and archive (plugin tarball extraction)
flate2 = "1.1"
tar = "0.4"

[profile.dev]
opt-level = 0
# Local iteration does not consume debugger metadata. Keeping it out also lets
# dev and test reuse compatible dependency artifacts instead of storing both.
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
# Drop the symbol table from shipped artifacts: ~19% off every binary (CLI
# 18.1MB -> 14.6MB, server 200.5MB -> 163.9MB, worker 94.9MB -> 76.9MB), which
# is user-visible in the CLI release tarballs and the distroless image layers.
# No deployment consumes symbolized backtraces: production sets no
# RUST_BACKTRACE, and the server's only panic boundary (supervised_task.rs)
# discards the payload and reports a metric. CI keeps its symbols because
# release-ci overrides this back to false for RUST_BACKTRACE=1 jobs.
# Accepted cost: a user running the CLI with RUST_BACKTRACE=1 now gets
# `<unknown>` frames. Bug reports should quote the anyhow error message, which
# is unaffected; reproduce with a release-ci build when frames are needed.
strip = true
# Use thin LTO for faster builds while retaining most optimization benefits
# Full LTO (`lto = true`) provides ~5-10% smaller binaries but 2-5x slower link times
lto = "thin"
codegen-units = 16

# CI binary profile: builds the server/worker/cli binaries that only feed the
# e2e/workflow/openapi CI jobs, where runtime performance is irrelevant. Trades
# optimization for compile speed — opt-level=1 keeps codegen cheap, no LTO drops
# the thin-LTO link step entirely, and codegen-units=256 maximizes parallelism.
# Roughly ~2x faster to build than `release`. NOT for published artifacts:
# release images/binaries use `release` (see docker/Dockerfile.unified).
[profile.release-ci]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 256
# Keep cheap line-number debug info and don't strip: these binaries are executed
# by CI jobs (workflow/e2e/openapi) under RUST_BACKTRACE=1, so panic backtraces
# must stay actionable. line-tables-only keeps that signal at modest cost.
debug = "line-tables-only"
strip = false
