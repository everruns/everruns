[workspace]
resolver = "2"

members = [
    "crates/server",
    "crates/worker",
    "crates/core",
    "crates/openai",
    "crates/anthropic",
    "crates/internal-protocol",
    "crates/cli",
    "crates/durable",
    "crates/session-sqldb",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
authors = ["Everruns Contributors"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["cookie", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "sqlite", "migrate", "uuid", "chrono", "macros"] }

# UUID and time
uuid = { version = "1.11", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Environment
dotenvy = "0.15"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
opentelemetry = "0.28"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.29"

# OpenAPI documentation
utoipa = { version = "5.2", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "8.0", features = ["axum"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"

# Authentication
argon2 = "0.5"
jsonwebtoken = "9.3"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls-native-certs", "blocking", "form"] }
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
eventsource-stream = "0.2"
regex = "1.11"
time = "0.3"
parking_lot = "0.12"

# Everruns SDK
everruns-sdk = "0.1"

# gRPC (tonic)
tonic = "0.14"
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# Protocol Buffers (used by tonic/gRPC)
prost = "0.14"
prost-build = "0.14"
prost-types = "0.14"

# Image processing (for thumbnail generation)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Fault injection testing
fail = "0.5"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
# Use thin LTO for faster builds while retaining most optimization benefits
# Full LTO (`lto = true`) provides ~5-10% smaller binaries but 2-5x slower link times
lto = "thin"
codegen-units = 16

# CI-optimized profile: faster builds, still optimized
[profile.release-ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = true
