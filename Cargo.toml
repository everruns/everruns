[workspace]
resolver = "2"

members = [
    "crates/server",
    "crates/worker",
    "crates/core",
    "crates/mcp",
    "crates/llm-tests",
    "crates/runtime",
    "crates/macros",
    "crates/openai",
    "crates/anthropic",
    "crates/gemini",
    "crates/internal-protocol",
    "crates/cli",
    "crates/durable",
    "crates/config",
    "crates/openui",
    "crates/a2ui",
    "crates/session-sqldb",
    "crates/container-sandbox",
    "integrations/docker",
    "integrations/daytona",
    "integrations/deno",
    "integrations/brave-search",
    "integrations/parallel",
    "integrations/duckduckgo",
    "integrations/github",
    "integrations/cursor",
    "integrations/browserless",
    "integrations/e2b",
    "integrations/sprites",
    "examples/coding-cli",
    "crates/agent-evals",
]

exclude = [
    "research/infinity_context",
    "examples/weekend-concierge-host",
]

[workspace.package]
version = "0.8.38"
edition = "2024"
# Published crate MSRV: Rust 2024 plus current published dependency floors.
rust-version = "1.94.0"
license = "MIT"
authors = ["Everruns Contributors"]
homepage = "https://everruns.com"
repository = "https://github.com/everruns/everruns"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.50", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie", "multipart", "query"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "set-header"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "uuid", "chrono", "macros"] }

# UUID and time
uuid = { version = "1.11", features = ["v4", "v5", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Async traits
async-trait = "0.1"

# Environment
dotenvy = "0.15"

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenTelemetry
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.33"

# OpenAPI documentation (used by export-openapi binary for spec generation)
utoipa = { version = "5.4", features = ["axum_extras", "chrono", "uuid"] }

# Encryption
aes-gcm = "0.10"
rand = "0.9"
base64 = "0.22"

# Rate limiting
governor = "0.10"

# Valkey/Redis (distributed rate limiting)
fred = { version = "10", features = ["enable-rustls-ring", "i-scripts"] }

# NATS (event delivery, task queue)
async-nats = "0.49"

# Authentication
argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["aws_lc_rs"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
git2 = "0.20"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls", "blocking", "form"] }
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0.9"
eventsource-stream = "0.2"
regex = "1.11"
time = "0.3"
parking_lot = "0.12"
dialoguer = "0.12"
webbrowser = "1"
dirs = "6"

# WebSocket (CDP sessions)
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# Everruns SDK
everruns-sdk = "0.1.9"
everruns-core = { path = "crates/core", version = "0.8.38" }
everruns-mcp = { path = "crates/mcp", version = "0.8.38" }

# A2A protocol
a2a = { package = "a2a-lf", version = "0.3" }
a2a-client = { package = "a2a-client-lf", version = "0.1" }
a2a-server = { package = "a2a-server-lf", version = "0.3" }

# gRPC (tonic)
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tonic-build = "0.14"
tonic-prost-build = "0.14"

# Protocol Buffers (used by tonic/gRPC)
prost = "0.14"

# Deterministic network simulation (dev-only). Used to test worker↔control-plane
# transport reliability (drops, partitions, latency, reorder) with a simulated
# clock. See specs/agent-reliability-tests.md scenario 3.
turmoil = "0.7"
prost-build = "0.14"
prost-types = "0.14"

# Image processing (for thumbnail generation)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Prometheus metrics
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# In-process caching
moka = { version = "0.12", features = ["future", "sync"] }

# Fault injection testing
fail = "0.5"
rstest = "0.26"
tempfile = "3"

# File watching and gitignore
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
notify-debouncer-mini = { version = "0.7", default-features = false }
ignore = "0.4"

# TLS
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Plugin system for external integrations
inventory = "0.3"

[profile.dev]
opt-level = 0
# line-tables-only: file:line in backtraces, drops full DWARF type/variable info
# Saves ~5-6 GB across all binaries. Override locally: CARGO_PROFILE_DEV_DEBUG=2
debug = "line-tables-only"

[profile.release]
opt-level = 3
# Use thin LTO for faster builds while retaining most optimization benefits
# Full LTO (`lto = true`) provides ~5-10% smaller binaries but 2-5x slower link times
lto = "thin"
codegen-units = 16

# CI-optimized profile: faster builds, still optimized
[profile.release-ci]
inherits = "release"
lto = "thin"
codegen-units = 16
debug = false
strip = true
