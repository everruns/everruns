<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 404" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Durable approval continuation</title><desc id="desc">Checkpoint the interpreter, check policy, pause for a decision, claim the effect and store its result. Resume with recorded results. Unknown effects stop for reconciliation.</desc>
<style>text{font-family:Geist,Inter,system-ui,sans-serif}.title{font-size:16px;font-weight:600;fill:#0A0A0A}.sub{font-size:12px;fill:#404040}.head{font-size:11px;letter-spacing:1px;fill:#404040}.small{font-size:11px;fill:#404040}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0A1636"/></marker></defs>
<rect width="800" height="404" fill="#fff"/><text x="24" y="24" class="head" text-anchor="start">A PYTHON TOOL CALL · FROM SUSPENSION TO RESUME</text><rect x="24" y="58" width="170" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="58" width="4" height="98" fill="#B45309"/><text x="42" y="86" class="title" text-anchor="start">1  Checkpoint</text><text x="42" y="108" class="sub" text-anchor="start">Suspend before effect</text><text x="42" y="127" class="sub" text-anchor="start">Private program state</text><path d="M194 107H214" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="218" y="58" width="170" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="218" y="58" width="4" height="98" fill="#0A1636"/><text x="236" y="86" class="title" text-anchor="start">2  Authorize</text><text x="236" y="108" class="sub" text-anchor="start">Current permissions</text><text x="236" y="127" class="sub" text-anchor="start">Exact arguments</text><path d="M388 107H408" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="412" y="58" width="170" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="412" y="58" width="4" height="98" fill="#0A1636"/><text x="430" y="86" class="title" text-anchor="start">3  Execute</text><text x="430" y="108" class="sub" text-anchor="start">Claim the effect first</text><text x="430" y="127" class="sub" text-anchor="start">One recorded outcome</text><path d="M582 107H602" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="606" y="58" width="170" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="606" y="58" width="4" height="98" fill="#0A1636"/><text x="624" y="86" class="title" text-anchor="start">4  Record</text><text x="624" y="108" class="sub" text-anchor="start">Save the result</text><text x="624" y="127" class="sub" text-anchor="start">Resume Python</text><path d="M303 156V230" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="310" y="196" class="small" text-anchor="start">Needs approval</text><rect x="218" y="232" width="240" height="105" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="218" y="232" width="4" height="105" fill="#B45309"/><text x="236" y="260" class="title" text-anchor="start">Pause the turn</text><text x="236" y="282" class="sub" text-anchor="start">Return resume token</text><text x="236" y="301" class="sub" text-anchor="start">Person answers; agent resumes</text><path d="M218 286H195V128H218" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="52" y="271" class="small" text-anchor="start">Recheck on resume</text><path d="M497 156V201H646V230" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="536" y="192" class="small" text-anchor="start">Outcome unknown</text><rect x="512" y="232" width="264" height="105" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="512" y="232" width="4" height="105" fill="#B45309"/><text x="530" y="260" class="title" text-anchor="start">Stop for reconciliation</text><text x="530" y="282" class="sub" text-anchor="start">A claim without a recorded result</text><text x="530" y="301" class="sub" text-anchor="start">must not repeat the effect</text><text x="24" y="380" class="sub" text-anchor="start">Replay returns recorded results. Approval resumes the saved program, without rerunning its source.</text></svg>