<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 415" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Python code mode trust boundaries</title><desc id="desc">Framework, Server and agentd share a host bridge. An isolated Monty worker requests authorized operations. Private journals preserve checkpoints and results.</desc>
<style>text{font-family:Geist,Inter,system-ui,sans-serif}.title{font-size:16px;font-weight:600;fill:#0A0A0A}.sub{font-size:12px;fill:#404040}.head{font-size:11px;letter-spacing:1px;fill:#404040}.small{font-size:11px;fill:#404040}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0A1636"/></marker></defs>
<rect width="800" height="415" fill="#fff"/><text x="24" y="24" class="head" text-anchor="start">ONE CAPABILITY · THREE HOST PLACEMENTS</text><rect x="24" y="42" width="240" height="52" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="42" width="4" height="52" fill="#0A1636"/><text x="42" y="70" class="title" text-anchor="start">Framework host</text><path d="M144 94V135" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="280" y="42" width="240" height="52" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="280" y="42" width="4" height="52" fill="#0A1636"/><text x="298" y="70" class="title" text-anchor="start">Server worker</text><path d="M400 94V135" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="536" y="42" width="240" height="52" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="536" y="42" width="4" height="52" fill="#0A1636"/><text x="554" y="70" class="title" text-anchor="start">agentd executor</text><path d="M656 94V135" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="24" y="137" width="752" height="82" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="137" width="4" height="82" fill="#0A1636"/><text x="42" y="165" class="title" text-anchor="start">Python tool bridge</text><text x="42" y="187" class="sub" text-anchor="start">Turn allowlist · approval policies · workspace tools · egress and credential controls</text><path d="M144 219V291" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="52" y="248" class="small" text-anchor="start">Execute / resume</text><path d="M274 291V219" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="280" y="267" class="small" text-anchor="start">Tool suspension</text><path d="M612 219V291" stroke="#0A1636" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="630" y="246" class="small" text-anchor="start">Checkpoints</text><text x="630" y="264" class="small" text-anchor="start">Effect outcomes</text><rect x="24" y="293" width="352" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="293" width="4" height="98" fill="#0A1636"/><text x="42" y="321" class="title" text-anchor="start">Disposable Monty worker</text><text x="42" y="343" class="sub" text-anchor="start">Kernel restrictions + interpreter limits</text><text x="42" y="362" class="sub" text-anchor="start">No ambient files, sockets or processes</text><rect x="424" y="293" width="352" height="98" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="424" y="293" width="4" height="98" fill="#B45309"/><text x="442" y="321" class="title" text-anchor="start">Private journal</text><text x="442" y="343" class="sub" text-anchor="start">Platform store · session Raft records</text><text x="442" y="362" class="sub" text-anchor="start">or a private Framework directory</text></svg>