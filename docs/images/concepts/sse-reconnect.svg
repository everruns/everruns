<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="580" fill="#FFFFFF"/>

  <!-- Participants -->
  <rect x="40" y="20" width="180" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="130" y="40" text-anchor="middle" class="label">Client</text>
  <text x="130" y="57" text-anchor="middle" class="sublabel">SDK, browser, curl</text>

  <rect x="330" y="20" width="200" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="430" y="40" text-anchor="middle" class="label">Everruns server</text>
  <text x="430" y="57" text-anchor="middle" class="mono">/v1/sessions/{id}/sse</text>

  <rect x="600" y="20" width="180" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="40" text-anchor="middle" class="label">Session events</text>
  <text x="690" y="57" text-anchor="middle" class="sublabel">PostgreSQL, by sequence</text>

  <!-- Lifelines -->
  <line x1="130" y1="68" x2="130" y2="540" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="430" y1="68" x2="430" y2="540" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="690" y1="68" x2="690" y2="540" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 1. Subscribe -->
  <rect x="104" y="86" width="18" height="18" fill="#0A1636"/>
  <text x="113" y="99" text-anchor="middle" class="step-num">1</text>
  <text x="280" y="96" text-anchor="middle" class="mono">GET …/sse</text>
  <line x1="130" y1="104" x2="422" y2="104" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="422,100 430,104 422,108" fill="#0A1636"/>

  <text x="280" y="126" text-anchor="middle" class="mono">event: connected</text>
  <line x1="138" y1="134" x2="430" y2="134" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,130 130,134 138,138" fill="#0A1636"/>

  <text x="280" y="156" text-anchor="middle" class="mono">id: event_A  turn.started</text>
  <line x1="138" y1="164" x2="430" y2="164" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,160 130,164 138,168" fill="#0A1636"/>

  <text x="280" y="186" text-anchor="middle" class="mono">id: event_B  output.message.delta</text>
  <line x1="138" y1="194" x2="430" y2="194" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,190 130,194 138,198" fill="#0A1636"/>

  <text x="280" y="216" text-anchor="middle" class="mono">: heartbeat  (every 30s)</text>
  <line x1="138" y1="224" x2="430" y2="224" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="138,220 130,224 138,228" fill="#A0A0A0"/>

  <text x="280" y="246" text-anchor="middle" class="mono">event: disconnecting  (every 5 min)</text>
  <line x1="138" y1="254" x2="430" y2="254" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,250 130,254 138,258" fill="#0A1636"/>

  <!-- Disconnect band -->
  <rect x="40" y="270" width="740" height="30" fill="#F5F5F5" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="410" y="290" text-anchor="middle" class="sublabel">Stream closed: connection cycle, network drop, or 45s with no data</text>

  <!-- Events keep arriving while the client is away -->
  <rect x="600" y="314" width="180" height="40" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="331" text-anchor="middle" class="mono">event_C, event_D</text>
  <text x="690" y="346" text-anchor="middle" class="sublabel">written meanwhile</text>

  <!-- 2. Reconnect with since_id -->
  <rect x="104" y="368" width="18" height="18" fill="#0A1636"/>
  <text x="113" y="381" text-anchor="middle" class="step-num">2</text>
  <text x="280" y="378" text-anchor="middle" class="mono">GET …/sse?since_id=event_B</text>
  <line x1="130" y1="386" x2="422" y2="386" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="422,382 430,386 422,390" fill="#0A1636"/>

  <text x="280" y="408" text-anchor="middle" class="mono">event: connected</text>
  <line x1="138" y1="416" x2="430" y2="416" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,412 130,416 138,420" fill="#0A1636"/>

  <!-- 3. Replay from the event log -->
  <rect x="438" y="428" width="18" height="18" fill="#0A1636"/>
  <text x="447" y="441" text-anchor="middle" class="step-num">3</text>
  <text x="560" y="438" text-anchor="middle" class="arrow-label">events after event_B</text>
  <line x1="430" y1="446" x2="682" y2="446" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="682,442 690,446 682,450" fill="#0A1636"/>

  <text x="560" y="468" text-anchor="middle" class="mono">event_C, event_D</text>
  <line x1="438" y1="476" x2="690" y2="476" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="438,472 430,476 438,480" fill="#0A1636"/>

  <text x="280" y="498" text-anchor="middle" class="mono">id: event_C … id: event_D …</text>
  <line x1="138" y1="506" x2="430" y2="506" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="138,502 130,506 138,510" fill="#0A1636"/>

  <text x="280" y="528" text-anchor="middle" class="arrow-label">then live events, no gaps, no duplicates</text>
  <line x1="138" y1="536" x2="430" y2="536" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="138,532 130,536 138,540" fill="#A0A0A0"/>

  <!-- Footnote -->
  <text x="400" y="566" text-anchor="middle" class="sublabel">Only durable events carry an id:, so since_id always names an event stored in PostgreSQL.</text>
</svg>
