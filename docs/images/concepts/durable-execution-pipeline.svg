<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="200" fill="#FFFFFF"/>

  <!-- Section header -->
  <text x="400" y="25" text-anchor="middle" class="header-text">DURABLE EXECUTION PIPELINE</text>

  <!-- Box 1: SetupStep -->
  <rect x="20" y="50" width="120" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="80" y="73" text-anchor="middle" class="label">SetupStep</text>
  <text x="80" y="90" text-anchor="middle" class="sublabel">Initialize turn</text>

  <!-- Arrow 1: Setup → LLM1 -->
  <line x1="140" y1="77" x2="170" y2="77" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="170,73 180,77 170,81" fill="#0A1636"/>
  <!-- Step badge 1 -->
  <rect x="146" y="58" width="18" height="18" fill="#0A1636"/>
  <text x="155" y="71" text-anchor="middle" class="step-num">1</text>

  <!-- Box 2: ExecuteLlmStep -->
  <rect x="182" y="50" width="120" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="242" y="73" text-anchor="middle" class="label">ExecuteLlmStep</text>
  <text x="242" y="90" text-anchor="middle" class="sublabel">Call LLM</text>

  <!-- Arrow 2: LLM1 → Tool -->
  <line x1="302" y1="77" x2="332" y2="77" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="332,73 342,77 332,81" fill="#0A1636"/>
  <!-- Step badge 2 -->
  <rect x="308" y="58" width="18" height="18" fill="#0A1636"/>
  <text x="317" y="71" text-anchor="middle" class="step-num">2</text>

  <!-- Box 3: ExecuteToolStep(s) -->
  <rect x="344" y="50" width="140" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="414" y="73" text-anchor="middle" class="label">ExecuteToolStep(s)</text>
  <text x="414" y="90" text-anchor="middle" class="sublabel">Run tools in parallel</text>

  <!-- Arrow 3: Tool → LLM2 -->
  <line x1="484" y1="77" x2="514" y2="77" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="514,73 524,77 514,81" fill="#0A1636"/>
  <!-- Step badge 3 -->
  <rect x="490" y="58" width="18" height="18" fill="#0A1636"/>
  <text x="499" y="71" text-anchor="middle" class="step-num">3</text>

  <!-- Box 4: ExecuteLlmStep (again) -->
  <rect x="526" y="50" width="120" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="586" y="73" text-anchor="middle" class="label">ExecuteLlmStep</text>
  <text x="586" y="90" text-anchor="middle" class="sublabel">Call LLM again</text>

  <!-- Arrow 4: LLM2 → Finalize -->
  <line x1="646" y1="77" x2="676" y2="77" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="676,73 686,77 676,81" fill="#0A1636"/>
  <!-- Step badge 4 -->
  <rect x="652" y="58" width="18" height="18" fill="#0A1636"/>
  <text x="661" y="71" text-anchor="middle" class="step-num">4</text>

  <!-- Box 5: FinalizeStep -->
  <rect x="688" y="50" width="100" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="738" y="73" text-anchor="middle" class="label">FinalizeStep</text>
  <text x="738" y="90" text-anchor="middle" class="sublabel">Complete turn</text>

  <!-- Loop-back arrow: LLM2 (box4) back to Tool (box3) -->
  <!-- Dashed connector going down from LLM2, left under Tool, then up into Tool -->
  <path d="M 586,105 L 586,155 L 414,155 L 414,105"
        stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <polygon points="410,109 414,100 418,109" fill="#A0A0A0"/>

  <!-- Loop annotation -->
  <text x="500" y="170" text-anchor="middle" class="arrow-label">Repeat until no tool calls</text>
</svg>
