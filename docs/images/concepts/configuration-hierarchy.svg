<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <rect width="800" height="330" fill="#FFFFFF"/>

  <!-- Column headers -->
  <text x="105" y="25" text-anchor="middle" class="header-text">DEPLOYMENT</text>
  <text x="340" y="25" text-anchor="middle" class="header-text">CONFIGURATION</text>
  <text x="645" y="25" text-anchor="middle" class="header-text">RUNTIME</text>

  <!-- App -->
  <rect x="40" y="105" width="130" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="105" y="128" text-anchor="middle" class="label">App</text>
  <text x="105" y="145" text-anchor="middle" class="sublabel">Distribution channel</text>

  <!-- Harness -->
  <rect x="260" y="45" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="340" y="67" text-anchor="middle" class="label">Harness</text>
  <text x="340" y="83" text-anchor="middle" class="sublabel">Environment template</text>

  <!-- Agent -->
  <rect x="260" y="135" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="340" y="157" text-anchor="middle" class="label">Agent</text>
  <text x="340" y="173" text-anchor="middle" class="sublabel">Prompt + model</text>

  <!-- Capability -->
  <rect x="260" y="225" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="340" y="247" text-anchor="middle" class="label">Capability</text>
  <text x="340" y="263" text-anchor="middle" class="sublabel">Tools + prompt additions</text>

  <!-- RuntimeAgent -->
  <rect x="560" y="95" width="170" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="645" y="117" text-anchor="middle" class="label">RuntimeAgent</text>
  <text x="645" y="133" text-anchor="middle" class="sublabel">Merged configuration</text>

  <!-- Session -->
  <rect x="560" y="210" width="170" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="645" y="232" text-anchor="middle" class="label">Session</text>
  <text x="645" y="248" text-anchor="middle" class="sublabel">Execution instance</text>

  <!-- App → Harness: uses (L-shape: right then up) -->
  <line x1="170" y1="118" x2="220" y2="118" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="220" y1="118" x2="220" y2="70" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="220" y1="70" x2="255" y2="70" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="255,65 265,70 255,75" fill="#0A1636"/>
  <text x="238" y="63" text-anchor="middle" class="arrow-label">uses</text>

  <!-- App → Agent: uses (horizontal) -->
  <line x1="170" y1="145" x2="255" y2="160" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="255,155 265,160 255,165" fill="#0A1636"/>
  <text x="212" y="145" text-anchor="middle" class="arrow-label">uses</text>

  <!-- Harness → Agent: has (center vertical) -->
  <line x1="340" y1="95" x2="340" y2="130" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="335,130 340,140 345,130" fill="#0A1636"/>
  <text x="355" y="118" class="arrow-label">has</text>

  <!-- Agent → Capability: has (center vertical) -->
  <line x1="340" y1="185" x2="340" y2="220" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="335,220 340,230 345,220" fill="#0A1636"/>
  <text x="355" y="210" class="arrow-label">has</text>

  <!-- Harness → Capability: has (left side path, avoids Agent) -->
  <line x1="260" y1="80" x2="245" y2="80" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="245" y1="80" x2="245" y2="250" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="245" y1="250" x2="255" y2="250" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="255,245 265,250 255,255" fill="#0A1636"/>
  <text x="237" y="170" text-anchor="end" class="arrow-label">has</text>

  <!-- Dashed: config → RuntimeAgent (assembles) -->
  <line x1="420" y1="70" x2="555" y2="110" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="420" y1="160" x2="555" y2="120" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="420" y1="250" x2="555" y2="135" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="490" y="100" text-anchor="middle" class="sublabel" font-style="italic">assembles</text>

  <!-- Dashed: RuntimeAgent → Session (executes in) -->
  <line x1="645" y1="145" x2="645" y2="205" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="640,205 645,215 650,205" fill="#A0A0A0"/>
  <text x="665" y="182" class="arrow-label" fill="#A0A0A0">executes in</text>

  <!-- Dashed: App → Session (creates, routed below) -->
  <line x1="105" y1="160" x2="105" y2="305" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="105" y1="305" x2="645" y2="305" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="645" y1="305" x2="645" y2="265" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="640,265 645,255 650,265" fill="#A0A0A0"/>
  <text x="375" y="298" text-anchor="middle" class="arrow-label" fill="#A0A0A0">creates</text>
</svg>
