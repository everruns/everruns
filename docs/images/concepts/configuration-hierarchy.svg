<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- Column headers -->
  <text x="80" y="30" class="header-text">DEPLOYMENT</text>
  <text x="310" y="30" class="header-text">CONFIGURATION</text>
  <text x="600" y="30" class="header-text">RUNTIME</text>

  <!-- DEPLOYMENT column: App -->
  <rect x="40" y="50" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="110" y="72" class="label" text-anchor="middle">App</text>
  <text x="110" y="88" class="sublabel" text-anchor="middle">Distribution channel</text>

  <!-- CONFIGURATION column: Harness -->
  <rect x="280" y="50" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="72" class="label" text-anchor="middle">Harness</text>
  <text x="360" y="88" class="sublabel" text-anchor="middle">Environment template</text>

  <!-- CONFIGURATION column: Agent -->
  <rect x="280" y="140" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="162" class="label" text-anchor="middle">Agent</text>
  <text x="360" y="178" class="sublabel" text-anchor="middle">Prompt + model</text>

  <!-- CONFIGURATION column: Capability -->
  <rect x="280" y="230" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="252" class="label" text-anchor="middle">Capability</text>
  <text x="360" y="268" class="sublabel" text-anchor="middle">Tools + prompt additions</text>

  <!-- RUNTIME column: RuntimeAgent -->
  <rect x="540" y="120" width="180" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="630" y="142" class="label" text-anchor="middle">RuntimeAgent</text>
  <text x="630" y="158" class="sublabel" text-anchor="middle">Merged configuration</text>

  <!-- RUNTIME column: Session -->
  <rect x="540" y="230" width="180" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="630" y="252" class="label" text-anchor="middle">Session</text>
  <text x="630" y="268" class="sublabel" text-anchor="middle">Execution instance</text>

  <!-- Solid arrows (Navy #0A1636, 1.5px) -->

  <!-- App → Harness: "uses" -->
  <line x1="180" y1="65" x2="276" y2="65" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="280,65 273,61 273,69" fill="#0A1636"/>
  <text x="228" y="58" class="arrow-label" text-anchor="middle">uses</text>

  <!-- App → Agent: "uses" -->
  <line x1="180" y1="85" x2="200" y2="85" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="200" y1="85" x2="200" y2="165" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="200" y1="165" x2="276" y2="165" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="280,165 273,161 273,169" fill="#0A1636"/>
  <text x="238" y="158" class="arrow-label" text-anchor="middle">uses</text>

  <!-- Harness → Agent: "has" (vertical) -->
  <line x1="340" y1="100" x2="340" y2="136" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="340,140 336,133 344,133" fill="#0A1636"/>
  <text x="352" y="124" class="arrow-label">has</text>

  <!-- Harness → Capability: "has" -->
  <line x1="380" y1="100" x2="380" y2="226" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="380,230 376,223 384,223" fill="#0A1636"/>
  <text x="392" y="180" class="arrow-label">has</text>

  <!-- Agent → Capability: "has" -->
  <line x1="340" y1="190" x2="340" y2="226" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="340,230 336,223 344,223" fill="#0A1636"/>
  <text x="352" y="214" class="arrow-label">has</text>

  <!-- Dashed connectors (Silver #A0A0A0, 1px) -->

  <!-- Harness → RuntimeAgent: "assembles" -->
  <line x1="440" y1="75" x2="490" y2="75" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="75" x2="490" y2="135" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="490" y1="135" x2="536" y2="135" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="540,135 533,131 533,139" fill="#A0A0A0"/>

  <!-- Agent → RuntimeAgent: "assembles" -->
  <line x1="440" y1="160" x2="500" y2="160" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="160" x2="500" y2="145" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="500" y1="145" x2="536" y2="145" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="540,145 533,141 533,149" fill="#A0A0A0"/>

  <!-- Capability → RuntimeAgent: "assembles" -->
  <line x1="440" y1="255" x2="510" y2="255" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="255" x2="510" y2="155" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="155" x2="536" y2="155" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="540,155 533,151 533,159" fill="#A0A0A0"/>

  <!-- "assembles" label -->
  <text x="500" y="118" class="arrow-label" fill="#A0A0A0" text-anchor="middle">assembles</text>

  <!-- RuntimeAgent → Session: "executes in" -->
  <line x1="630" y1="170" x2="630" y2="226" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="630,230 626,223 634,223" fill="#A0A0A0"/>
  <text x="660" y="204" class="arrow-label" fill="#A0A0A0">executes in</text>

  <!-- App → Session: "creates" -->
  <line x1="110" y1="100" x2="110" y2="340" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="110" y1="340" x2="630" y2="340" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="630" y1="340" x2="630" y2="284" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="630,280 626,287 634,287" fill="#A0A0A0"/>
  <text x="370" y="333" class="arrow-label" fill="#A0A0A0" text-anchor="middle">creates</text>
</svg>