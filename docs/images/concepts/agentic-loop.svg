<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <!-- Message received (terminal) -->
  <rect x="280" y="15" width="240" height="36" fill="#F5F5F5" stroke="#0A1636" stroke-width="2"/>
  <text x="400" y="38" text-anchor="middle" class="label">Message received</text>

  <!-- Arrow: Message received -> InputAtom -->
  <line x1="400" y1="51" x2="400" y2="73" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="400,81 396,73 404,73" fill="#0A1636"/>
  <!-- Step badge 1 -->
  <rect x="406" y="57" width="18" height="18" fill="#0A1636"/>
  <text x="415" y="70" text-anchor="middle" class="step-num">1</text>

  <!-- InputAtom box -->
  <rect x="280" y="81" width="240" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="101" text-anchor="middle" class="label">InputAtom</text>
  <text x="400" y="116" text-anchor="middle" class="sublabel">Load user message</text>

  <!-- Arrow: InputAtom -> ReasonAtom -->
  <line x1="400" y1="125" x2="400" y2="147" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="400,155 396,147 404,147" fill="#0A1636"/>

  <!-- ReasonAtom box -->
  <rect x="280" y="155" width="240" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="175" text-anchor="middle" class="label">ReasonAtom</text>
  <text x="400" y="190" text-anchor="middle" class="sublabel">Call LLM with context</text>

  <!-- Arrow: ReasonAtom -> Decision -->
  <line x1="400" y1="199" x2="400" y2="208" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="400,215 396,208 404,208" fill="#0A1636"/>
  <!-- Step badge 2 -->
  <rect x="406" y="200" width="18" height="18" fill="#0A1636"/>
  <text x="415" y="213" text-anchor="middle" class="step-num">2</text>

  <!-- Decision diamond -->
  <polygon points="400,215 475,240 400,265 325,240" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="237" text-anchor="middle" class="label" font-size="11">Tool calls?</text>
  <text x="400" y="249" text-anchor="middle" class="label" font-size="11"></text>

  <!-- No path: Decision -> Turn complete (straight down) -->
  <line x1="400" y1="265" x2="400" y2="317" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="400,325 396,317 404,317" fill="#0A1636"/>
  <text x="388" y="297" text-anchor="end" class="arrow-label">No</text>

  <!-- Turn complete (terminal) -->
  <rect x="280" y="325" width="240" height="36" fill="#F5F5F5" stroke="#0A1636" stroke-width="2"/>
  <text x="400" y="348" text-anchor="middle" class="label">Turn complete</text>

  <!-- Yes path: Decision -> ActAtom (horizontal right) -->
  <line x1="475" y1="240" x2="552" y2="240" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="560,240 552,236 552,244" fill="#0A1636"/>
  <text x="517" y="233" text-anchor="middle" class="arrow-label">Yes</text>
  <!-- Step badge 3 -->
  <rect x="500" y="246" width="18" height="18" fill="#0A1636"/>
  <text x="509" y="259" text-anchor="middle" class="step-num">3</text>

  <!-- ActAtom box -->
  <rect x="560" y="218" width="190" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="655" y="238" text-anchor="middle" class="label">ActAtom</text>
  <text x="655" y="253" text-anchor="middle" class="sublabel">Execute tools in parallel</text>

  <!-- Loop-back: ActAtom top -> up -> left -> ReasonAtom right edge -->
  <!-- Vertical segment: ActAtom top center (655,218) up to y=145 -->
  <line x1="655" y1="218" x2="655" y2="177" stroke="#0A1636" stroke-width="1.5"/>
  <!-- Horizontal segment: (655,177) left to ReasonAtom right edge -->
  <line x1="655" y1="177" x2="528" y2="177" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="520,177 528,173 528,181" fill="#0A1636"/>
  <!-- Step badge 4 on vertical portion -->
  <rect x="661" y="188" width="18" height="18" fill="#0A1636"/>
  <text x="670" y="201" text-anchor="middle" class="step-num">4</text>
</svg>
