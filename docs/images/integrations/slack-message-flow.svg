<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" width="800" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="800" height="580" fill="#FFFFFF"/>

  <!-- Participant boxes -->
  <!-- Slack -->
  <rect x="30" y="20" width="100" height="36" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="80" y="43" text-anchor="middle" class="label">Slack</text>

  <!-- Webhook -->
  <rect x="180" y="20" width="100" height="36" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="230" y="43" text-anchor="middle" class="label">Webhook</text>

  <!-- App -->
  <rect x="330" y="20" width="100" height="36" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="380" y="43" text-anchor="middle" class="label">App</text>

  <!-- Runtime Agent -->
  <rect x="480" y="20" width="100" height="36" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="530" y="43" text-anchor="middle" class="label">Runtime Agent</text>

  <!-- Dispatcher -->
  <rect x="630" y="20" width="100" height="36" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680" y="43" text-anchor="middle" class="label">Dispatcher</text>

  <!-- Lifelines -->
  <line x1="80" y1="56" x2="80" y2="560" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="230" y1="56" x2="230" y2="560" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="380" y1="56" x2="380" y2="560" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="530" y1="56" x2="530" y2="560" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="680" y1="56" x2="680" y2="560" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#0A1636"/>
    </marker>
    <marker id="arrowDashRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
  </defs>

  <!-- Step 1: Slack -> Webhook: POST /slack/events -->
  <rect x="86" y="76" width="18" height="18" fill="#0A1636"/>
  <text x="95" y="89" text-anchor="middle" class="step-num">1</text>
  <line x1="80" y1="85" x2="222" y2="85" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="150" y="79" text-anchor="middle" class="arrow-label">POST /slack/events</text>

  <!-- Step 2: Webhook -> Webhook (self): Verify HMAC-SHA256 -->
  <rect x="236" y="111" width="18" height="18" fill="#0A1636"/>
  <text x="245" y="124" text-anchor="middle" class="step-num">2</text>
  <polyline points="230,120 265,120 265,132 230,132" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowLeft)"/>
  <text x="270" y="124" text-anchor="start" class="arrow-label">Verify HMAC-SHA256</text>

  <!-- Step 3: Webhook -> Webhook (self): Dedup check -->
  <rect x="236" y="146" width="18" height="18" fill="#0A1636"/>
  <text x="245" y="159" text-anchor="middle" class="step-num">3</text>
  <polyline points="230,155 265,155 265,167 230,167" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowLeft)"/>
  <text x="270" y="159" text-anchor="start" class="arrow-label">Dedup check</text>

  <!-- Step 4: Webhook -> Slack: 200 OK (< 3s) (arrow going left) -->
  <rect x="86" y="181" width="18" height="18" fill="#0A1636"/>
  <text x="95" y="194" text-anchor="middle" class="step-num">4</text>
  <line x1="230" y1="190" x2="88" y2="190" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <text x="155" y="184" text-anchor="middle" class="arrow-label">200 OK (&lt; 3s)</text>

  <!-- Step 5: Webhook -> App: Route to App -->
  <rect x="236" y="216" width="18" height="18" fill="#0A1636"/>
  <text x="245" y="229" text-anchor="middle" class="step-num">5</text>
  <line x1="230" y1="225" x2="372" y2="225" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="300" y="219" text-anchor="middle" class="arrow-label">Route to App</text>

  <!-- Step 6: App -> App (self): Find/create Session -->
  <rect x="386" y="251" width="18" height="18" fill="#0A1636"/>
  <text x="395" y="264" text-anchor="middle" class="step-num">6</text>
  <polyline points="380,260 415,260 415,272 380,272" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowLeft)"/>
  <text x="420" y="264" text-anchor="start" class="arrow-label">Find/create Session</text>

  <!-- Step 7: App -> Runtime Agent: Trigger agent turn -->
  <rect x="386" y="286" width="18" height="18" fill="#0A1636"/>
  <text x="395" y="299" text-anchor="middle" class="step-num">7</text>
  <line x1="380" y1="295" x2="522" y2="295" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="450" y="289" text-anchor="middle" class="arrow-label">Trigger agent turn</text>

  <!-- Step 8: App -> Dispatcher: Register delivery -->
  <rect x="386" y="321" width="18" height="18" fill="#0A1636"/>
  <text x="395" y="334" text-anchor="middle" class="step-num">8</text>
  <line x1="380" y1="330" x2="672" y2="330" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="525" y="324" text-anchor="middle" class="arrow-label">Register delivery</text>

  <!-- Step 9: Runtime Agent -> Runtime Agent (self): Process (tools, LLM) -->
  <rect x="536" y="356" width="18" height="18" fill="#0A1636"/>
  <text x="545" y="369" text-anchor="middle" class="step-num">9</text>
  <polyline points="530,365 565,365 565,377 530,377" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowLeft)"/>
  <text x="570" y="369" text-anchor="start" class="arrow-label">Process (tools, LLM)</text>

  <!-- Step 10: Runtime Agent -> Dispatcher: output.message.completed (dashed) -->
  <rect x="536" y="391" width="18" height="18" fill="#0A1636"/>
  <text x="545" y="404" text-anchor="middle" class="step-num">10</text>
  <line x1="530" y1="400" x2="672" y2="400" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRight)"/>
  <text x="600" y="394" text-anchor="middle" class="arrow-label">output.message.completed</text>

  <!-- Step 11: Dispatcher -> Slack: chat.postMessage (long arrow going left) -->
  <rect x="86" y="426" width="18" height="18" fill="#0A1636"/>
  <text x="95" y="439" text-anchor="middle" class="step-num">11</text>
  <line x1="680" y1="435" x2="88" y2="435" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <text x="380" y="429" text-anchor="middle" class="arrow-label">chat.postMessage</text>

  <!-- Step 12: Runtime Agent -> Dispatcher: turn.completed (dashed) -->
  <rect x="536" y="461" width="18" height="18" fill="#0A1636"/>
  <text x="545" y="474" text-anchor="middle" class="step-num">12</text>
  <line x1="530" y1="470" x2="672" y2="470" stroke="#0A1636" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowRight)"/>
  <text x="600" y="464" text-anchor="middle" class="arrow-label">turn.completed</text>
</svg>
