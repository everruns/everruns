<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="340" fill="#FFFFFF"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- COLUMN HEADERS                                  -->
  <!-- ═══════════════════════════════════════════════ -->
  <text x="75" y="45" class="header-text" text-anchor="middle">SLACK</text>
  <text x="255" y="45" class="header-text" text-anchor="middle">INGESTION</text>
  <text x="430" y="45" class="header-text" text-anchor="middle">APP</text>
  <text x="625" y="45" class="header-text" text-anchor="middle">RUNTIME</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- MAIN HORIZONTAL FLOW (y=55)                     -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Slack Bot -->
  <rect x="20" y="55" width="110" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="75" y="78" class="label" text-anchor="middle">Slack Bot</text>
  <text x="75" y="96" class="sublabel" text-anchor="middle">Bot identity</text>

  <!-- Webhook -->
  <rect x="190" y="55" width="130" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="255" y="78" class="label" text-anchor="middle">Webhook</text>
  <text x="255" y="96" class="sublabel" text-anchor="middle">Verify HMAC-SHA256</text>

  <!-- App -->
  <rect x="380" y="55" width="100" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="430" y="78" class="label" text-anchor="middle">App</text>
  <text x="430" y="96" class="sublabel" text-anchor="middle">Route + config</text>

  <!-- Session -->
  <rect x="560" y="55" width="130" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="625" y="78" class="label" text-anchor="middle">Session</text>
  <text x="625" y="96" class="sublabel" text-anchor="middle">Conversation instance</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- RUNTIME COLUMN — below Session (x=560)          -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- RuntimeAgent -->
  <rect x="560" y="155" width="130" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="625" y="176" class="label" text-anchor="middle">RuntimeAgent</text>
  <text x="625" y="192" class="sublabel" text-anchor="middle">Merged config</text>

  <!-- Dispatcher -->
  <rect x="560" y="245" width="130" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="625" y="266" class="label" text-anchor="middle">Dispatcher</text>
  <text x="625" y="282" class="sublabel" text-anchor="middle">chat.postMessage</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CONFIG — below App (x=350)                      -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Harness -->
  <rect x="350" y="160" width="90" height="42" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="395" y="178" class="label" text-anchor="middle">Harness</text>
  <text x="395" y="193" class="sublabel" text-anchor="middle">Environment</text>

  <!-- Agent -->
  <rect x="350" y="215" width="90" height="42" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="395" y="233" class="label" text-anchor="middle">Agent</text>
  <text x="395" y="248" class="sublabel" text-anchor="middle">Prompt + tools</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ANNOTATION BOX — Slack Config (below Webhook)   -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="175" y="165" width="140" height="70" fill="#FFFFFF" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="245" y="183" class="sublabel" text-anchor="middle" font-weight="500">Slack Config</text>
  <text x="245" y="199" class="mono" text-anchor="middle">signing_secret</text>
  <text x="245" y="213" class="mono" text-anchor="middle">bot_token</text>
  <text x="245" y="227" class="mono" text-anchor="middle">session_strategy</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 1: Slack Bot → Webhook                     -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="130" y1="82" x2="182" y2="82" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="182,77 192,82 182,87" fill="#0A1636"/>
  <rect x="147" y="62" width="18" height="18" fill="#0A1636"/>
  <text x="156" y="75" class="step-num" text-anchor="middle">1</text>
  <text x="156" y="56" class="arrow-label" text-anchor="middle">POST /slack/events</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 2: Webhook → App                           -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="320" y1="82" x2="372" y2="82" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="372,77 382,82 372,87" fill="#0A1636"/>
  <rect x="337" y="62" width="18" height="18" fill="#0A1636"/>
  <text x="346" y="75" class="step-num" text-anchor="middle">2</text>
  <text x="346" y="56" class="arrow-label" text-anchor="middle">verified request</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 3: App → Session                           -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="480" y1="82" x2="552" y2="82" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="552,77 562,82 552,87" fill="#0A1636"/>
  <rect x="507" y="62" width="18" height="18" fill="#0A1636"/>
  <text x="516" y="75" class="step-num" text-anchor="middle">3</text>
  <text x="516" y="56" class="arrow-label" text-anchor="middle">find/create by tag</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 4: Session → RuntimeAgent (vertical down)  -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="625" y1="110" x2="625" y2="147" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="620,147 625,157 630,147" fill="#0A1636"/>
  <rect x="636" y="121" width="18" height="18" fill="#0A1636"/>
  <text x="645" y="134" class="step-num" text-anchor="middle">4</text>
  <text x="662" y="134" class="arrow-label">runs</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 5: RuntimeAgent → Dispatcher (vert down)   -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="625" y1="205" x2="625" y2="237" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="620,237 625,247 630,237" fill="#0A1636"/>
  <rect x="636" y="213" width="18" height="18" fill="#0A1636"/>
  <text x="645" y="226" class="step-num" text-anchor="middle">5</text>
  <text x="662" y="226" class="arrow-label">emits events</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- STEP 6: Dispatcher → Slack Bot (loop back)      -->
  <!-- Dispatcher bottom → down to y=315 → left to     -->
  <!-- x=75 → up to Slack Bot bottom                   -->
  <!-- ═══════════════════════════════════════════════ -->
  <path d="M 625 295 L 625 315 L 75 315 L 75 110" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="70,118 75,108 80,118" fill="#0A1636"/>
  <rect x="341" y="306" width="18" height="18" fill="#0A1636"/>
  <text x="350" y="319" class="step-num" text-anchor="middle">6</text>
  <text x="375" y="319" class="arrow-label">chat.postMessage</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DASHED: App → Harness ("references")            -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="415" y1="110" x2="400" y2="152" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="395,150 400,160 405,150" fill="#A0A0A0"/>
  <text x="420" y="140" class="arrow-label">references</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DASHED: App → Agent ("references")              -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="430" y1="110" x2="410" y2="207" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="405,205 410,215 415,205" fill="#A0A0A0"/>
  <text x="435" y="175" class="arrow-label">references</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- DASHED: App → Slack Config annotation           -->
  <!-- ═══════════════════════════════════════════════ -->
  <line x1="400" y1="110" x2="300" y2="165" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

</svg>
