<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" fill="none">
  <defs>
    <marker id="arrowSolid" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
    <marker id="arrowDashed" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- SLACK column header -->
  <text x="65" y="35" class="header-text" text-anchor="middle">SLACK</text>

  <!-- Slack Thread box -->
  <rect x="15" y="50" width="100" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="65" y="71" class="label" text-anchor="middle">Slack Thread</text>
  <text x="65" y="87" class="sublabel" text-anchor="middle">User messages</text>

  <!-- Slack Bot box -->
  <rect x="15" y="130" width="100" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="65" y="151" class="label" text-anchor="middle">Slack Bot</text>
  <text x="65" y="167" class="sublabel" text-anchor="middle">Bot identity</text>

  <!-- INGESTION column header -->
  <text x="210" y="35" class="header-text" text-anchor="middle">INGESTION</text>

  <!-- Webhook Endpoint box -->
  <rect x="140" y="130" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="210" y="148" class="label" text-anchor="middle">Webhook Endpoint</text>
  <text x="210" y="164" class="sublabel" text-anchor="middle">Verify HMAC-SHA256</text>

  <!-- APP column header -->
  <text x="375" y="35" class="header-text" text-anchor="middle">APP</text>

  <!-- App box -->
  <rect x="315" y="130" width="120" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="375" y="151" class="label" text-anchor="middle">App</text>
  <text x="375" y="167" class="sublabel" text-anchor="middle">Route + config</text>

  <!-- Annotation box: Slack Config -->
  <rect x="305" y="210" width="140" height="75" fill="#FFFFFF" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="375" y="230" class="label" text-anchor="middle" style="font-size: 11px;">Slack Config</text>
  <text x="375" y="247" class="mono" text-anchor="middle">signing_secret</text>
  <text x="375" y="261" class="mono" text-anchor="middle">bot_token</text>
  <text x="375" y="275" class="mono" text-anchor="middle">session_strategy</text>

  <!-- CONFIGURATION column header -->
  <text x="530" y="35" class="header-text" text-anchor="middle">CONFIGURATION</text>

  <!-- Harness box -->
  <rect x="480" y="50" width="100" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="530" y="70" class="label" text-anchor="middle">Harness</text>
  <text x="530" y="84" class="sublabel" text-anchor="middle">Environment</text>

  <!-- Agent box -->
  <rect x="480" y="110" width="100" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="530" y="130" class="label" text-anchor="middle">Agent</text>
  <text x="530" y="144" class="sublabel" text-anchor="middle">Prompt + tools</text>

  <!-- RUNTIME column header -->
  <text x="690" y="35" class="header-text" text-anchor="middle">RUNTIME</text>

  <!-- Session box -->
  <rect x="625" y="50" width="130" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="70" class="label" text-anchor="middle">Session</text>
  <text x="690" y="84" class="sublabel" text-anchor="middle">Conversation instance</text>

  <!-- RuntimeAgent box -->
  <rect x="625" y="130" width="130" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="150" class="label" text-anchor="middle">RuntimeAgent</text>
  <text x="690" y="164" class="sublabel" text-anchor="middle">Merged config</text>

  <!-- Slack Dispatcher box -->
  <rect x="625" y="210" width="130" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="228" class="label" text-anchor="middle">Slack Dispatcher</text>
  <text x="690" y="244" class="sublabel" text-anchor="middle">chat.postMessage</text>

  <!-- Step 1: Slack Thread <-> Slack Bot (bidirectional, two parallel arrows) -->
  <rect x="47" y="106" width="18" height="18" fill="#0A1636"/>
  <text x="56" y="119" class="step-num" text-anchor="middle">1</text>
  <line x1="55" y1="100" x2="55" y2="122" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <line x1="75" y1="130" x2="75" y2="108" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>

  <!-- Step 2: Slack Bot -> Webhook: "POST /slack/events" -->
  <rect x="119" y="146" width="18" height="18" fill="#0A1636"/>
  <text x="128" y="159" class="step-num" text-anchor="middle">2</text>
  <line x1="115" y1="155" x2="132" y2="155" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="168" y="123" class="arrow-label" text-anchor="middle">POST /slack/events</text>

  <!-- Step 3: Webhook -> App: "verified request" -->
  <rect x="287" y="146" width="18" height="18" fill="#0A1636"/>
  <text x="296" y="159" class="step-num" text-anchor="middle">3</text>
  <line x1="280" y1="155" x2="307" y2="155" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="296" y="138" class="arrow-label" text-anchor="middle">verified request</text>

  <!-- Step 4: App -> Session: "find/create by tag" -->
  <rect x="588" y="60" width="18" height="18" fill="#0A1636"/>
  <text x="597" y="73" class="step-num" text-anchor="middle">4</text>
  <line x1="435" y1="145" x2="617" y2="72" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="540" y="92" class="arrow-label" text-anchor="middle">find/create by tag</text>

  <!-- Step 5: Session -> RuntimeAgent: "runs" -->
  <rect x="681" y="101" width="18" height="18" fill="#0A1636"/>
  <text x="690" y="114" class="step-num" text-anchor="middle">5</text>
  <line x1="690" y1="95" x2="690" y2="122" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="715" y="113" class="arrow-label">runs</text>

  <!-- Step 6: RuntimeAgent -> Dispatcher: "emits events" -->
  <rect x="681" y="181" width="18" height="18" fill="#0A1636"/>
  <text x="690" y="194" class="step-num" text-anchor="middle">6</text>
  <line x1="690" y1="175" x2="690" y2="202" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <text x="725" y="193" class="arrow-label">emits events</text>

  <!-- Step 7: Dispatcher -> Slack Bot: "chat.postMessage" (loops back along bottom) -->
  <rect x="345" y="350" width="18" height="18" fill="#0A1636"/>
  <text x="354" y="363" class="step-num" text-anchor="middle">7</text>
  <path d="M 690 255 L 690 360 L 65 360 L 65 180" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowSolid)"/>
  <text x="400" y="347" class="arrow-label" text-anchor="middle">chat.postMessage</text>

  <!-- Dashed: App -> Harness ("references") -->
  <line x1="420" y1="140" x2="472" y2="82" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowDashed)"/>
  <text x="430" y="100" class="arrow-label">references</text>

  <!-- Dashed: App -> Agent ("references") -->
  <line x1="435" y1="155" x2="472" y2="140" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowDashed)"/>
  <text x="448" y="155" class="arrow-label">references</text>
</svg>