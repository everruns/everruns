<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <!-- "create" label at top -->
  <text x="400" y="22" text-anchor="middle" class="arrow-label">create</text>

  <!-- Arrow from create to Active (top) -->
  <line x1="400" y1="28" x2="400" y2="42" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="395,42 400,52 405,42" fill="#0A1636"/>

  <!-- Active box (top) -->
  <rect x="320" y="52" width="160" height="40" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="77" text-anchor="middle" class="label">Active</text>

  <!-- Three downward arrows from Active -->

  <!-- Left arrow: Active -> Paused -->
  <line x1="360" y1="92" x2="200" y2="180" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="195,175 200,186 205,175" fill="#0A1636"/>
  <!-- Step badge 1 -->
  <rect x="271" y="127" width="18" height="18" fill="#0A1636"/>
  <text x="280" y="140" text-anchor="middle" class="step-num">1</text>
  <text x="248" y="155" text-anchor="middle" class="arrow-label">soft_limit exceeded</text>

  <!-- Center arrow: Active -> Exhausted -->
  <line x1="400" y1="92" x2="400" y2="180" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="395,180 400,190 405,180" fill="#0A1636"/>
  <!-- Step badge 2 -->
  <rect x="406" y="127" width="18" height="18" fill="#0A1636"/>
  <text x="415" y="140" text-anchor="middle" class="step-num">2</text>
  <text x="460" y="140" class="arrow-label">balance ≤ 0</text>

  <!-- Right arrow: Active -> Disabled -->
  <line x1="440" y1="92" x2="600" y2="180" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="595,175 600,186 605,175" fill="#0A1636"/>
  <!-- Step badge 3 -->
  <rect x="525" y="127" width="18" height="18" fill="#0A1636"/>
  <text x="534" y="140" text-anchor="middle" class="step-num">3</text>
  <text x="555" y="140" class="arrow-label">disabled</text>

  <!-- Paused box -->
  <rect x="120" y="190" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="200" y="213" text-anchor="middle" class="label">Paused</text>
  <text x="200" y="230" text-anchor="middle" class="sublabel">soft limit hit</text>

  <!-- Exhausted box -->
  <rect x="320" y="190" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="213" text-anchor="middle" class="label">Exhausted</text>
  <text x="400" y="230" text-anchor="middle" class="sublabel">balance depleted</text>

  <!-- Disabled box -->
  <rect x="520" y="190" width="160" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="600" y="213" text-anchor="middle" class="label">Disabled</text>
  <text x="600" y="230" text-anchor="middle" class="sublabel">deleted</text>

  <!-- Arrow from Paused down -->
  <line x1="200" y1="240" x2="200" y2="295" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="195,295 200,305 205,295" fill="#0A1636"/>

  <!-- Arrow from Exhausted down -->
  <line x1="400" y1="240" x2="400" y2="295" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="395,295 400,305 405,295" fill="#0A1636"/>

  <!-- Converging horizontal line -->
  <line x1="200" y1="305" x2="400" y2="305" stroke="#0A1636" stroke-width="1.5"/>

  <!-- Label: top-up / resume -->
  <!-- Step badge 4 -->
  <rect x="291" y="288" width="18" height="18" fill="#0A1636"/>
  <text x="300" y="301" text-anchor="middle" class="step-num">4</text>
  <text x="300" y="322" text-anchor="middle" class="arrow-label">top-up / resume</text>

  <!-- Arrow down from merge point to Active (bottom) -->
  <line x1="300" y1="305" x2="300" y2="340" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="300" y1="340" x2="400" y2="340" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="400" y1="340" x2="400" y2="360" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="395,360 400,370 405,360" fill="#0A1636"/>

  <!-- Active box (bottom) -->
  <rect x="320" y="370" width="160" height="40" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="395" text-anchor="middle" class="label">Active</text>
</svg>
