<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="300" fill="#FFFFFF"/>

  <!-- Outer Budget box -->
  <rect x="60" y="20" width="680" height="260" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>

  <!-- Budget title -->
  <text x="100" y="50" class="label">Budget</text>

  <!-- Field lines -->
  <text x="100" y="75" class="mono">subject: session | agent | user | org</text>
  <text x="100" y="92" class="mono">currency: usd | tokens | credits | custom</text>
  <text x="100" y="109" class="mono">limit: hard cap</text>
  <text x="100" y="126" class="mono">soft_limit: optional pause threshold</text>

  <!-- Progress bar track -->
  <rect x="100" y="148" width="560" height="28" fill="#E8E8E8" stroke="#0A0A0A" stroke-width="1"/>

  <!-- Filled portion (~60%) -->
  <rect x="101" y="149" width="333" height="26" fill="#0A1636"/>

  <!-- Markers below the bar -->
  <!-- $0 marker -->
  <line x1="100" y1="176" x2="100" y2="192" stroke="#0A0A0A" stroke-width="1"/>
  <text x="100" y="205" text-anchor="middle" class="mono">$0</text>

  <!-- soft_limit marker at ~60% -->
  <line x1="434" y1="176" x2="434" y2="192" stroke="#0A0A0A" stroke-width="1"/>
  <text x="434" y="205" text-anchor="middle" class="mono">soft_limit</text>
  <text x="434" y="218" text-anchor="middle" class="mono">(pauses)</text>

  <!-- limit marker at right end -->
  <line x1="660" y1="176" x2="660" y2="192" stroke="#0A0A0A" stroke-width="1"/>
  <text x="660" y="205" text-anchor="middle" class="mono">limit</text>
  <text x="660" y="218" text-anchor="middle" class="mono">(stops)</text>

  <!-- Ledger text -->
  <text x="100" y="252" class="mono">Ledger: append-only log of every debit/credit</text>
</svg>
