<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="420" fill="#FFFFFF"/>

  <!-- Section headers -->
  <text x="120" y="30" text-anchor="middle" class="header-text">AGENT</text>
  <text x="440" y="30" text-anchor="middle" class="header-text">TARGET SERVER</text>

  <!-- Agent box -->
  <rect x="30" y="42" width="180" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="120" y="68" text-anchor="middle" class="label">Everruns Agent</text>
  <text x="120" y="85" text-anchor="middle" class="sublabel">Signs outbound requests</text>
  <text x="120" y="102" text-anchor="middle" class="mono">Ed25519 · RFC 9421</text>

  <!-- Target Server box -->
  <rect x="350" y="42" width="180" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="440" y="68" text-anchor="middle" class="label">Target Server</text>
  <text x="440" y="88" text-anchor="middle" class="sublabel">Verifies bot identity</text>

  <!-- Key Directory header -->
  <text x="440" y="225" text-anchor="middle" class="header-text">KEY DIRECTORY</text>

  <!-- Key Directory box -->
  <rect x="350" y="237" width="180" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="440" y="263" text-anchor="middle" class="label">Bot's FQDN</text>
  <text x="440" y="280" text-anchor="middle" class="sublabel">/.well-known/http-message-</text>
  <text x="440" y="293" text-anchor="middle" class="sublabel">signatures-directory</text>
  <text x="440" y="308" text-anchor="middle" class="mono">JWKS · Ed25519 public key</text>

  <!-- Arrow 1: Agent -> Target Server (signed HTTP request) -->
  <line x1="210" y1="75" x2="345" y2="75" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="345,70 355,75 345,80" fill="#0A1636"/>
  <!-- Step badge 1 -->
  <rect x="265" y="56" width="18" height="18" fill="#0A1636"/>
  <text x="274" y="69" text-anchor="middle" class="step-num">1</text>
  <text x="274" y="50" text-anchor="middle" class="arrow-label">Signed HTTP request</text>

  <!-- Arrow 2: Target Server -> Key Directory (fetch public key) -->
  <line x1="475" y1="122" x2="475" y2="232" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="470,232 475,242 480,232" fill="#0A1636"/>
  <!-- Step badge 2 -->
  <rect x="480" y="167" width="18" height="18" fill="#0A1636"/>
  <text x="489" y="180" text-anchor="middle" class="step-num">2</text>
  <text x="510" y="180" class="arrow-label">Fetch public key</text>
  <text x="510" y="193" class="arrow-label">by keyid</text>

  <!-- Result badge on Target Server: Verify signature -->
  <rect x="550" y="62" width="128" height="30" fill="#FFFFFF" stroke="#0A1636" stroke-width="1.5"/>
  <rect x="550" y="62" width="18" height="30" fill="#0A1636"/>
  <text x="559" y="82" text-anchor="middle" class="step-num">3</text>
  <text x="622" y="81" text-anchor="middle" class="arrow-label">Verify signature</text>

  <!-- Dashed connector from result badge to Target Server box -->
  <line x1="550" y1="77" x2="530" y2="77" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Annotation box: Request headers -->
  <rect x="40" y="155" width="250" height="95" fill="#FFFFFF" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="165" y="177" text-anchor="middle" class="sublabel" font-weight="500">Request headers</text>
  <text x="165" y="197" text-anchor="middle" class="mono">Signature: sig1=:base64url:</text>
  <text x="165" y="214" text-anchor="middle" class="mono">Signature-Input: sig1=(...)</text>
  <text x="165" y="231" text-anchor="middle" class="mono">Signature-Agent: bot.example.com</text>

  <!-- Dashed connector from annotation box to arrow 1 -->
  <line x1="165" y1="155" x2="274" y2="85" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
