<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="260" fill="#FFFFFF"/>

  <!-- Header with arrow -->
  <text x="400" y="28" text-anchor="middle" class="header-text">MESSAGES (OLDEST → NEWEST)</text>
  <line x1="530" y1="24" x2="555" y2="24" stroke="#A0A0A0" stroke-width="1"/>
  <polygon points="555,20 565,24 555,28" fill="#A0A0A0"/>

  <!-- Three tier boxes side by side -->

  <!-- Cold Tier (~35% width = 252px) -->
  <rect x="40" y="44" width="230" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="155" y="70" text-anchor="middle" class="label">Cold Tier</text>
  <text x="155" y="90" text-anchor="middle" class="sublabel">Replaced with</text>
  <text x="155" y="106" text-anchor="middle" class="sublabel">[CONVERSATION_SUMMARY]</text>
  <text x="155" y="128" text-anchor="middle" class="mono">Queryable via query_history</text>

  <!-- Warm Tier (~35% width = 252px) -->
  <rect x="280" y="44" width="240" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="400" y="70" text-anchor="middle" class="label">Warm Tier</text>
  <text x="400" y="90" text-anchor="middle" class="sublabel">Tool outputs masked</text>
  <text x="400" y="106" text-anchor="middle" class="sublabel">with one-line summaries</text>
  <text x="400" y="128" text-anchor="middle" class="mono">Message structure preserved</text>

  <!-- Hot Tier (~30% width = 216px) -->
  <rect x="530" y="44" width="230" height="120" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="645" y="70" text-anchor="middle" class="label">Hot Tier</text>
  <text x="645" y="90" text-anchor="middle" class="sublabel">Full verbatim content</text>
  <text x="645" y="128" text-anchor="middle" class="mono">Always sent to the LLM</text>

  <!-- Bracket annotations below -->

  <!-- warm_messages bracket under Warm Tier -->
  <line x1="290" y1="180" x2="290" y2="190" stroke="#0A1636" stroke-width="1"/>
  <line x1="290" y1="190" x2="510" y2="190" stroke="#0A1636" stroke-width="1"/>
  <line x1="510" y1="180" x2="510" y2="190" stroke="#0A1636" stroke-width="1"/>
  <text x="400" y="208" text-anchor="middle" class="arrow-label">warm_messages</text>

  <!-- hot_messages bracket under Hot Tier -->
  <line x1="540" y1="180" x2="540" y2="190" stroke="#0A1636" stroke-width="1"/>
  <line x1="540" y1="190" x2="750" y2="190" stroke="#0A1636" stroke-width="1"/>
  <line x1="750" y1="180" x2="750" y2="190" stroke="#0A1636" stroke-width="1"/>
  <text x="645" y="208" text-anchor="middle" class="arrow-label">hot_messages</text>
</svg>
