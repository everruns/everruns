<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="240" fill="#FFFFFF"/>

  <!-- Section headers -->
  <text x="85" y="40" text-anchor="middle" class="header-text">CHANNEL</text>
  <text x="270" y="40" text-anchor="middle" class="header-text">APP</text>
  <text x="545" y="40" text-anchor="middle" class="header-text">RUNTIME</text>

  <!-- External Channel box -->
  <rect x="20" y="55" width="130" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="85" y="78" text-anchor="middle" class="label">External Channel</text>
  <text x="85" y="96" text-anchor="middle" class="sublabel">Slack, WhatsApp, etc.</text>

  <!-- App box -->
  <rect x="220" y="55" width="100" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="270" y="78" text-anchor="middle" class="label">App</text>
  <text x="270" y="96" text-anchor="middle" class="sublabel">Routes to agent</text>

  <!-- Session box -->
  <rect x="480" y="55" width="130" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="545" y="78" text-anchor="middle" class="label">Session</text>
  <text x="545" y="96" text-anchor="middle" class="sublabel">Conversation instance</text>

  <!-- RuntimeAgent box -->
  <rect x="480" y="155" width="130" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="545" y="177" text-anchor="middle" class="label">RuntimeAgent</text>
  <text x="545" y="193" text-anchor="middle" class="sublabel">Merged config</text>

  <!-- Harness box -->
  <rect x="195" y="165" width="100" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="245" y="185" text-anchor="middle" class="label">Harness</text>
  <text x="245" y="199" text-anchor="middle" class="sublabel">Environment</text>

  <!-- Agent box -->
  <rect x="315" y="165" width="100" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="365" y="185" text-anchor="middle" class="label">Agent</text>
  <text x="365" y="199" text-anchor="middle" class="sublabel">Prompt + tools</text>

  <!-- Arrow 1: External Channel -> App -->
  <line x1="150" y1="82" x2="212" y2="82" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="220,82 212,78 212,86" fill="#0A1636"/>
  <rect x="163" y="73" width="18" height="18" fill="#0A1636"/>
  <text x="172" y="86" text-anchor="middle" class="step-num">1</text>
  <text x="185" y="68" text-anchor="middle" class="arrow-label">webhook</text>

  <!-- Arrow 2: App -> Session -->
  <line x1="320" y1="82" x2="472" y2="82" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="480,82 472,78 472,86" fill="#0A1636"/>
  <rect x="380" y="73" width="18" height="18" fill="#0A1636"/>
  <text x="389" y="86" text-anchor="middle" class="step-num">2</text>
  <text x="400" y="68" text-anchor="middle" class="arrow-label">find/create</text>

  <!-- Arrow 3: Session -> RuntimeAgent (vertical down) -->
  <line x1="545" y1="110" x2="545" y2="147" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="545,155 541,147 549,147" fill="#0A1636"/>
  <rect x="551" y="122" width="18" height="18" fill="#0A1636"/>
  <text x="560" y="135" text-anchor="middle" class="step-num">3</text>
  <text x="575" y="140" class="arrow-label">runs</text>

  <!-- Dashed: App -> Harness (down-left) -->
  <line x1="250" y1="110" x2="245" y2="157" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="245,165 241,157 249,157" fill="#A0A0A0"/>
  <text x="228" y="140" class="arrow-label">references</text>

  <!-- Dashed: App -> Agent (down-right) -->
  <line x1="290" y1="110" x2="355" y2="157" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="358,160 349,155 353,163" fill="#A0A0A0"/>
  <text x="340" y="127" class="arrow-label">references</text>
</svg>
