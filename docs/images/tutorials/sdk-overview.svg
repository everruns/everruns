<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="800" height="320" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
    <marker id="arrowLeft" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#0A1636"/>
    </marker>
  </defs>

  <!-- Section headers -->
  <text x="100" y="38" text-anchor="middle" class="header-text">CLIENT</text>
  <text x="370" y="38" text-anchor="middle" class="header-text">SERVER</text>
  <text x="640" y="38" text-anchor="middle" class="header-text">PROVIDERS</text>

  <!-- Your Application box -->
  <rect x="30" y="50" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="100" y="72" text-anchor="middle" class="label">Your Application</text>
  <text x="100" y="88" text-anchor="middle" class="sublabel">everruns-sdk</text>

  <!-- Everruns Server box -->
  <rect x="300" y="50" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="370" y="72" text-anchor="middle" class="label">Everruns Server</text>
  <text x="370" y="88" text-anchor="middle" class="sublabel">Durable agentic engine</text>

  <!-- LLM Provider box -->
  <rect x="570" y="50" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="640" y="72" text-anchor="middle" class="label">LLM Provider</text>
  <text x="640" y="88" text-anchor="middle" class="sublabel">OpenAI / Anthropic</text>

  <!-- Tool Execution box (below Server) -->
  <text x="370" y="158" text-anchor="middle" class="header-text">EXECUTION</text>
  <rect x="300" y="168" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="370" y="190" text-anchor="middle" class="label">Tool Execution</text>
  <text x="370" y="206" text-anchor="middle" class="sublabel">Capabilities</text>

  <!-- Step 1: Your Application -> Everruns Server: SDK calls -->
  <rect x="176" y="60" width="18" height="18" fill="#0A1636"/>
  <text x="185" y="73" text-anchor="middle" class="step-num">1</text>
  <line x1="170" y1="69" x2="292" y2="69" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="230" y="63" text-anchor="middle" class="arrow-label">SDK calls</text>

  <!-- Step 2: Everruns Server -> LLM Provider: Reason -->
  <rect x="446" y="60" width="18" height="18" fill="#0A1636"/>
  <text x="455" y="73" text-anchor="middle" class="step-num">2</text>
  <line x1="440" y1="69" x2="562" y2="69" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="500" y="63" text-anchor="middle" class="arrow-label">Reason</text>

  <!-- Step 3: LLM Provider -> Everruns Server: Tool calls (return) -->
  <rect x="446" y="82" width="18" height="18" fill="#0A1636"/>
  <text x="455" y="95" text-anchor="middle" class="step-num">3</text>
  <line x1="570" y1="91" x2="448" y2="91" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowLeft)"/>
  <text x="510" y="85" text-anchor="middle" class="arrow-label">Tool calls</text>

  <!-- Step 4: Everruns Server -> Tool Execution: Act -->
  <rect x="376" y="122" width="18" height="18" fill="#0A1636"/>
  <text x="385" y="135" text-anchor="middle" class="step-num">4</text>
  <line x1="380" y1="100" x2="380" y2="160" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="396" y="135" text-anchor="start" class="arrow-label">Act</text>

  <!-- Step 5: Tool Execution -> Everruns Server: Results (return) -->
  <rect x="340" y="122" width="18" height="18" fill="#0A1636"/>
  <text x="349" y="135" text-anchor="middle" class="step-num">5</text>
  <line x1="355" y1="168" x2="355" y2="108" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="336" y="145" text-anchor="end" class="arrow-label">Results</text>

  <!-- SSE Events: Everruns Server -> Your Application (dashed, bottom return) -->
  <line x1="300" y1="270" x2="178" y2="270" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrowLeft)"/>
  <text x="238" y="264" text-anchor="middle" class="arrow-label">SSE Events</text>

  <!-- Dashed connector lines from Server box down to SSE path -->
  <line x1="370" y1="218" x2="370" y2="270" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="370" y1="270" x2="300" y2="270" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Dashed connector from Application box down -->
  <line x1="100" y1="100" x2="100" y2="270" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100" y1="270" x2="170" y2="270" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
