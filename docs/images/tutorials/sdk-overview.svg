<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <rect width="800" height="300" fill="#FFFFFF"/>

  <!-- Section headers -->
  <text x="100" y="30" text-anchor="middle" class="header-text">CLIENT</text>
  <text x="370" y="30" text-anchor="middle" class="header-text">SERVER</text>
  <text x="640" y="30" text-anchor="middle" class="header-text">PROVIDERS</text>

  <!-- Your Application -->
  <rect x="30" y="45" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="100" y="67" text-anchor="middle" class="label">Your Application</text>
  <text x="100" y="83" text-anchor="middle" class="sublabel">everruns-sdk</text>

  <!-- Everruns Server -->
  <rect x="300" y="45" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="370" y="67" text-anchor="middle" class="label">Everruns Server</text>
  <text x="370" y="83" text-anchor="middle" class="sublabel">Durable agentic engine</text>

  <!-- LLM Provider -->
  <rect x="570" y="45" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="640" y="67" text-anchor="middle" class="label">LLM Provider</text>
  <text x="640" y="83" text-anchor="middle" class="sublabel">OpenAI / Anthropic</text>

  <!-- Tool Execution -->
  <text x="370" y="155" text-anchor="middle" class="header-text">EXECUTION</text>
  <rect x="300" y="165" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="370" y="187" text-anchor="middle" class="label">Tool Execution</text>
  <text x="370" y="203" text-anchor="middle" class="sublabel">Capabilities</text>

  <!-- Step 1: App → Server -->
  <line x1="170" y1="65" x2="293" y2="65" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="293,60 303,65 293,70" fill="#0A1636"/>
  <rect x="218" y="53" width="18" height="18" fill="#0A1636"/>
  <text x="227" y="66" text-anchor="middle" class="step-num">1</text>
  <text x="227" y="48" text-anchor="middle" class="arrow-label">SDK calls</text>

  <!-- Step 2: Server → LLM (Reason) -->
  <line x1="440" y1="62" x2="563" y2="62" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="563,57 573,62 563,67" fill="#0A1636"/>
  <rect x="490" y="50" width="18" height="18" fill="#0A1636"/>
  <text x="499" y="63" text-anchor="middle" class="step-num">2</text>
  <text x="499" y="45" text-anchor="middle" class="arrow-label">Reason</text>

  <!-- Step 3: LLM → Server (Tool calls return) -->
  <line x1="570" y1="83" x2="447" y2="83" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="447,78 437,83 447,88" fill="#0A1636"/>
  <rect x="497" y="76" width="18" height="18" fill="#0A1636"/>
  <text x="506" y="89" text-anchor="middle" class="step-num">3</text>
  <text x="524" y="89" class="arrow-label">Tool calls</text>

  <!-- Step 4: Server → Tool Execution (Act) -->
  <line x1="390" y1="95" x2="390" y2="160" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="385,160 390,170 395,160" fill="#0A1636"/>
  <rect x="396" y="118" width="18" height="18" fill="#0A1636"/>
  <text x="405" y="131" text-anchor="middle" class="step-num">4</text>
  <text x="420" y="131" class="arrow-label">Act</text>

  <!-- Step 5: Tool Execution → Server (Results return) -->
  <line x1="350" y1="165" x2="350" y2="100" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="345,100 350,90 355,100" fill="#0A1636"/>
  <rect x="326" y="118" width="18" height="18" fill="#0A1636"/>
  <text x="335" y="131" text-anchor="middle" class="step-num">5</text>
  <text x="322" y="131" text-anchor="end" class="arrow-label">Results</text>

  <!-- SSE Events: Server → App (dashed return at bottom) -->
  <line x1="370" y1="215" x2="370" y2="260" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="370" y1="260" x2="107" y2="260" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="107" y1="260" x2="107" y2="100" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="102,100 107,90 112,100" fill="#A0A0A0"/>
  <text x="240" y="253" text-anchor="middle" class="arrow-label" fill="#A0A0A0">SSE Events</text>
</svg>
