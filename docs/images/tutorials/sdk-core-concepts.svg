<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- Background -->
  <rect width="800" height="380" fill="#FFFFFF"/>

  <defs>
    <marker id="arrowDown" markerWidth="8" markerHeight="6" refX="3" refY="6" orient="auto">
      <polygon points="0,0 6,0 3,6" fill="#0A1636"/>
    </marker>
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
  </defs>

  <!-- CONFIGURATION column header -->
  <text x="190" y="30" text-anchor="middle" class="header-text">CONFIGURATION</text>

  <!-- RUNTIME column header -->
  <text x="500" y="30" text-anchor="middle" class="header-text">RUNTIME</text>

  <!-- DATA column header -->
  <text x="680" y="30" text-anchor="middle" class="header-text">DATA</text>

  <!-- Harness box (top-left) -->
  <rect x="100" y="45" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="170" y="67" text-anchor="middle" class="label">Harness</text>
  <text x="170" y="83" text-anchor="middle" class="sublabel">Environment template</text>

  <!-- Agent box (below Harness) -->
  <rect x="100" y="145" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="170" y="167" text-anchor="middle" class="label">Agent</text>
  <text x="170" y="183" text-anchor="middle" class="sublabel">System prompt + capabilities</text>

  <!-- Capability box (right of Agent) -->
  <rect x="290" y="145" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="167" text-anchor="middle" class="label">Capability</text>
  <text x="360" y="183" text-anchor="middle" class="sublabel">Tools + prompt additions</text>

  <!-- Session box (center-right) -->
  <rect x="470" y="145" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="540" y="167" text-anchor="middle" class="label">Session</text>
  <text x="540" y="183" text-anchor="middle" class="sublabel">Conversation instance</text>

  <!-- Turn box (below Session) -->
  <rect x="470" y="245" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="540" y="267" text-anchor="middle" class="label">Turn</text>
  <text x="540" y="283" text-anchor="middle" class="sublabel">Reason → Act loop</text>

  <!-- Event box (bottom-right) -->
  <rect x="650" y="245" width="140" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="720" y="267" text-anchor="middle" class="label">Event</text>
  <text x="720" y="283" text-anchor="middle" class="sublabel">Immutable record</text>

  <!-- Arrow: Harness -> Agent: "configures" -->
  <line x1="170" y1="95" x2="170" y2="137" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="182" y="121" text-anchor="start" class="arrow-label">configures</text>

  <!-- Arrow: Agent -> Capability: "has" -->
  <line x1="240" y1="162" x2="282" y2="162" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="260" y="156" text-anchor="middle" class="arrow-label">has</text>

  <!-- Arrow: Agent -> Session: "runs in" (routed below Capability) -->
  <polyline points="240,178 450,178 450,170 462,170" stroke="#0A1636" stroke-width="1.5" fill="none" marker-end="url(#arrowRight)"/>
  <text x="345" y="172" text-anchor="middle" class="arrow-label">runs in</text>

  <!-- Arrow: Session -> Turn: "contains" -->
  <line x1="540" y1="195" x2="540" y2="237" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowDown)"/>
  <text x="552" y="221" text-anchor="start" class="arrow-label">contains</text>

  <!-- Arrow: Turn -> Event: "emits" -->
  <line x1="610" y1="270" x2="642" y2="270" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrowRight)"/>
  <text x="625" y="264" text-anchor="middle" class="arrow-label">emits</text>
</svg>
