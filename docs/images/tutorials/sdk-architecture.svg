<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="430" fill="#FFFFFF"/>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CLIENTS region (left, top)                      -->
  <!-- x=20 y=15 w=180 h=185                           -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="20" y="15" width="180" height="185" fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="32" y="35" class="header-text">CLIENTS</text>

  <!-- Your App -->
  <rect x="35" y="45" width="150" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="110" y="67" class="label" text-anchor="middle">Your App</text>
  <text x="110" y="83" class="sublabel" text-anchor="middle">everruns-sdk</text>

  <!-- Web UI -->
  <rect x="35" y="115" width="150" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="110" y="137" class="label" text-anchor="middle">Web UI</text>
  <text x="110" y="153" class="sublabel" text-anchor="middle">Management console</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- CONTROL PLANE region (center-right, top)        -->
  <!-- x=245 y=15 w=320 h=185                          -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="245" y="15" width="320" height="185" fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="257" y="35" class="header-text">CONTROL PLANE</text>

  <!-- REST API -->
  <rect x="265" y="45" width="130" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="330" y="67" class="label" text-anchor="middle">REST API</text>
  <text x="330" y="83" class="mono" text-anchor="middle">:9301</text>

  <!-- gRPC Server -->
  <rect x="415" y="45" width="130" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="480" y="67" class="label" text-anchor="middle">gRPC Server</text>
  <text x="480" y="83" class="mono" text-anchor="middle">:9001</text>

  <!-- Service Layer -->
  <rect x="310" y="120" width="190" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="405" y="142" class="label" text-anchor="middle">Service Layer</text>
  <text x="405" y="158" class="sublabel" text-anchor="middle">Business logic</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- WORKERS region (left, bottom)                   -->
  <!-- x=20 y=240 w=180 h=175                          -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="20" y="240" width="180" height="175" fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="32" y="260" class="header-text">WORKERS</text>

  <!-- Worker 1 -->
  <rect x="35" y="270" width="150" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="110" y="297" class="label" text-anchor="middle">Worker 1</text>

  <!-- Worker 2 -->
  <rect x="35" y="340" width="150" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="110" y="367" class="label" text-anchor="middle">Worker 2</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- PostgreSQL (standalone, center bottom)          -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="310" y="265" width="190" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="405" y="287" class="label" text-anchor="middle">PostgreSQL</text>
  <text x="405" y="303" class="sublabel" text-anchor="middle">State store</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- EXTERNAL region (right, bottom)                 -->
  <!-- x=600 y=240 w=180 h=175                         -->
  <!-- ═══════════════════════════════════════════════ -->
  <rect x="600" y="240" width="180" height="175" fill="none" stroke="#404040" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="612" y="260" class="header-text">EXTERNAL</text>

  <!-- OpenAI -->
  <rect x="620" y="270" width="140" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="297" class="label" text-anchor="middle">OpenAI</text>

  <!-- Anthropic -->
  <rect x="620" y="340" width="140" height="45" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="690" y="367" class="label" text-anchor="middle">Anthropic</text>

  <!-- ═══════════════════════════════════════════════ -->
  <!-- ARROWS                                          -->
  <!-- ═══════════════════════════════════════════════ -->

  <!-- Your App → REST API: HTTP (horizontal) -->
  <line x1="185" y1="70" x2="257" y2="70" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="257,65 267,70 257,75" fill="#0A1636"/>
  <text x="225" y="63" class="arrow-label" text-anchor="middle">HTTP</text>

  <!-- Web UI → REST API: HTTP -->
  <!-- Right-angle: horizontal right to x=225, then vertical up to y=82, then right to REST API -->
  <path d="M 185 140 L 225 140 L 225 82 L 257 82" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="257,77 267,82 257,87" fill="#0A1636"/>
  <text x="232" y="112" class="arrow-label">HTTP</text>

  <!-- REST API → Service Layer -->
  <line x1="345" y1="95" x2="375" y2="112" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="370,115 380,120 375,109" fill="#0A1636"/>

  <!-- gRPC Server → Service Layer -->
  <line x1="465" y1="95" x2="435" y2="112" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="440,109 430,120 436,115" fill="#0A1636"/>

  <!-- Service Layer → PostgreSQL (vertical down) -->
  <line x1="405" y1="170" x2="405" y2="257" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="400,257 405,267 410,257" fill="#0A1636"/>

  <!-- Worker 1 → gRPC Server -->
  <!-- L-shape: right from Worker 1 to x=222 (gap between regions), -->
  <!-- then up to y=82, then right to gRPC left edge                -->
  <path d="M 185 292 L 222 292 L 222 58 L 407 58" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="407,53 417,58 407,63" fill="#0A1636"/>
  <text x="229" y="180" class="arrow-label">gRPC</text>

  <!-- Worker 2 → gRPC Server -->
  <!-- L-shape: right from Worker 2 to x=215 (slightly offset), -->
  <!-- then up to y=82, then right to gRPC left edge             -->
  <path d="M 185 362 L 215 362 L 215 80 L 407 80" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="407,75 417,80 407,85" fill="#0A1636"/>
  <text x="208" y="225" class="arrow-label">gRPC</text>

  <!-- Worker 1 → OpenAI (dashed) -->
  <line x1="185" y1="297" x2="612" y2="297" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="612,292 622,297 612,302" fill="#A0A0A0"/>

  <!-- Worker 2 → Anthropic (dashed) -->
  <line x1="185" y1="362" x2="612" y2="362" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="612,357 622,362 612,367" fill="#A0A0A0"/>

</svg>
