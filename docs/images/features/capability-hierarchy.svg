<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="320" fill="#FFFFFF"/>

  <!-- Section header -->
  <text x="360" y="30" text-anchor="middle" class="header-text">SYSTEM PROMPT COMPOSITION</text>

  <!-- Bottom layer: Harness (widest) -->
  <rect x="160" y="230" width="400" height="65" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="253" text-anchor="middle" class="label">Harness Layer</text>
  <text x="360" y="268" text-anchor="middle" class="mono">Capabilities + System Prompt</text>
  <text x="360" y="283" text-anchor="middle" class="sublabel">Foundation</text>

  <!-- Middle layer: Agent -->
  <rect x="200" y="145" width="320" height="65" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="168" text-anchor="middle" class="label">Agent Layer</text>
  <text x="360" y="183" text-anchor="middle" class="mono">Capabilities + System Prompt</text>
  <text x="360" y="198" text-anchor="middle" class="sublabel">Domain-specific</text>

  <!-- Top layer: Session (narrowest) -->
  <rect x="240" y="60" width="240" height="65" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="360" y="83" text-anchor="middle" class="label">Session Layer</text>
  <text x="360" y="98" text-anchor="middle" class="mono">Capabilities</text>
  <text x="360" y="113" text-anchor="middle" class="sublabel">Additive, per-session</text>

  <!-- Right-side arrow: Harness → Agent (merges into) -->
  <line x1="590" y1="262" x2="590" y2="183" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="586,187 590,178 594,187" fill="#0A1636"/>
  <text x="600" y="228" class="arrow-label">merges into</text>

  <!-- Right-side arrow: Agent → Session (merges into) -->
  <line x1="590" y1="177" x2="590" y2="98" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="586,102 590,93 594,102" fill="#0A1636"/>
  <text x="600" y="148" class="arrow-label">merges into</text>
</svg>
