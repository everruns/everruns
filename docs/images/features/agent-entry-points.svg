<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="470" fill="#FFFFFF"/>

  <!-- ===== Endpoints: an external caller waits for a reply ===== -->
  <text x="30" y="44" class="header-text">ENDPOINTS</text>
  <text x="230" y="44" text-anchor="end" class="sublabel">caller gets a reply</text>

  <rect x="30" y="56" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="76" class="label">Slack</text>
  <text x="218" y="76" text-anchor="end" class="mono">slack</text>

  <rect x="30" y="96" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="116" class="label">AG-UI</text>
  <text x="218" y="116" text-anchor="end" class="mono">ag_ui</text>

  <rect x="30" y="136" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="156" class="label">A2A</text>
  <text x="218" y="156" text-anchor="end" class="mono">a2a</text>

  <rect x="30" y="176" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="196" class="label">FCP</text>
  <text x="218" y="196" text-anchor="end" class="mono">fcp</text>

  <rect x="30" y="216" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="236" class="label">Public Chat</text>
  <text x="218" y="236" text-anchor="end" class="mono">public_chat</text>

  <!-- Endpoint bus -->
  <line x1="230" y1="72" x2="270" y2="72" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="112" x2="270" y2="112" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="152" x2="270" y2="152" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="192" x2="270" y2="192" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="232" x2="270" y2="232" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="270" y1="72" x2="270" y2="232" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="270" y1="152" x2="312" y2="152" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="312,148 320,152 312,156" fill="#0A1636"/>

  <!-- Endpoint box -->
  <rect x="320" y="120" width="190" height="64" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="415" y="142" text-anchor="middle" class="label">Endpoint</text>
  <text x="415" y="159" text-anchor="middle" class="sublabel">auth, session routing</text>
  <text x="415" y="175" text-anchor="middle" class="mono">/v1/e/{endpoint_id}/…</text>

  <!-- ===== Triggers: work starts with no reply channel ===== -->
  <text x="30" y="286" class="header-text">TRIGGERS</text>
  <text x="230" y="286" text-anchor="end" class="sublabel">no reply channel</text>

  <rect x="30" y="298" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="318" class="label">Schedule</text>
  <text x="218" y="318" text-anchor="end" class="mono">schedule</text>

  <rect x="30" y="338" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="358" class="label">Webhook</text>
  <text x="218" y="358" text-anchor="end" class="mono">webhook</text>

  <rect x="30" y="378" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="398" class="label">GitHub</text>
  <text x="218" y="398" text-anchor="end" class="mono">github</text>

  <rect x="30" y="418" width="200" height="32" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="42" y="438" class="label">MCP events</text>
  <text x="218" y="438" text-anchor="end" class="mono">mcp_event</text>

  <!-- Trigger bus -->
  <line x1="230" y1="314" x2="270" y2="314" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="354" x2="270" y2="354" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="394" x2="270" y2="394" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="230" y1="434" x2="270" y2="434" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="270" y1="314" x2="270" y2="434" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="270" y1="374" x2="312" y2="374" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="312,370 320,374 312,378" fill="#0A1636"/>

  <!-- Trigger box -->
  <rect x="320" y="342" width="190" height="64" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="415" y="364" text-anchor="middle" class="label">Trigger</text>
  <text x="415" y="381" text-anchor="middle" class="sublabel">message, session mode</text>
  <text x="415" y="397" text-anchor="middle" class="mono">trigger_type</text>

  <!-- ===== Agent ===== -->
  <rect x="570" y="213" width="200" height="100" fill="#F5F5F5" stroke="#0A1636" stroke-width="2"/>
  <text x="670" y="250" text-anchor="middle" class="label">Agent</text>
  <text x="670" y="270" text-anchor="middle" class="sublabel">message lands in a session</text>
  <text x="670" y="288" text-anchor="middle" class="sublabel">turn runs on its Harness</text>

  <!-- Endpoint -> Agent -->
  <path d="M 510,168 L 540,168 L 540,240 L 562,240" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="562,236 570,240 562,244" fill="#0A1636"/>
  <text x="548" y="206" class="arrow-label">message</text>

  <!-- Agent -> Endpoint reply (dashed) -->
  <path d="M 700,213 L 700,136 L 518,136" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <polygon points="518,132 510,136 518,140" fill="#A0A0A0"/>
  <text x="610" y="128" text-anchor="middle" class="arrow-label">reply</text>

  <!-- Trigger -> Agent -->
  <path d="M 510,374 L 540,374 L 540,290 L 562,290" stroke="#0A1636" stroke-width="1.5" fill="none"/>
  <polygon points="562,286 570,290 562,294" fill="#0A1636"/>
  <text x="548" y="338" class="arrow-label">configured message</text>
</svg>
