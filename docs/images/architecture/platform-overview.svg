<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="220" fill="#FFFFFF"/>

  <!-- Section headers -->
  <text x="95" y="35" text-anchor="middle" class="header-text">CLIENT</text>
  <text x="385" y="35" text-anchor="middle" class="header-text">PLATFORM</text>
  <text x="730" y="35" text-anchor="middle" class="header-text">PROVIDERS</text>
  <text x="335" y="142" text-anchor="middle" class="header-text">OPTIONAL</text>

  <!-- Your Application box -->
  <rect x="30" y="50" width="130" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="95" y="75" text-anchor="middle" class="label">Your Application</text>
  <text x="95" y="93" text-anchor="middle" class="sublabel">REST API / SSE</text>

  <!-- Control Plane box -->
  <rect x="250" y="50" width="150" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="325" y="75" text-anchor="middle" class="label">Control Plane</text>
  <text x="325" y="93" text-anchor="middle" class="sublabel">State + coordination</text>

  <!-- Workers box -->
  <rect x="480" y="50" width="120" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="540" y="75" text-anchor="middle" class="label">Workers</text>
  <text x="540" y="93" text-anchor="middle" class="sublabel">Stateless executors</text>

  <!-- LLM Providers box -->
  <rect x="670" y="50" width="120" height="60" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="730" y="75" text-anchor="middle" class="label">LLM Providers</text>
  <text x="730" y="93" text-anchor="middle" class="sublabel">OpenAI / Anthropic</text>

  <!-- Management UI box -->
  <rect x="280" y="155" width="110" height="50" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="335" y="177" text-anchor="middle" class="label">Management UI</text>
  <text x="335" y="193" text-anchor="middle" class="sublabel">Admin console</text>

  <!-- Arrow 1: Your Application -> Control Plane -->
  <line x1="160" y1="80" x2="242" y2="80" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="250,80 242,76 242,84" fill="#0A1636"/>
  <rect x="173" y="71" width="18" height="18" fill="#0A1636"/>
  <text x="182" y="84" text-anchor="middle" class="step-num">1</text>
  <text x="208" y="68" text-anchor="middle" class="arrow-label">REST API / SSE</text>

  <!-- Arrow 2: Control Plane -> Workers -->
  <line x1="400" y1="80" x2="472" y2="80" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="480,80 472,76 472,84" fill="#0A1636"/>
  <rect x="420" y="71" width="18" height="18" fill="#0A1636"/>
  <text x="429" y="84" text-anchor="middle" class="step-num">2</text>
  <text x="440" y="68" text-anchor="middle" class="arrow-label">gRPC</text>

  <!-- Arrow 3: Workers -> LLM Providers -->
  <line x1="600" y1="80" x2="662" y2="80" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="670,80 662,76 662,84" fill="#0A1636"/>
  <rect x="613" y="71" width="18" height="18" fill="#0A1636"/>
  <text x="622" y="84" text-anchor="middle" class="step-num">3</text>
  <text x="640" y="68" text-anchor="middle" class="arrow-label">LLM calls</text>

  <!-- Dashed connector: Management UI -> Control Plane (vertical up) -->
  <line x1="335" y1="155" x2="335" y2="118" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="335,110 331,118 339,118" fill="#A0A0A0"/>
  <text x="350" y="140" class="arrow-label">Admin</text>
</svg>
