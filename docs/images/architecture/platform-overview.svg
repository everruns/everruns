<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="300" fill="#FFFFFF"/>

  <!-- Arrowhead markers -->
  <defs>
    <marker id="ar-r" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#0A1636"/>
    </marker>
    <marker id="ar-l" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8,0 0,3 8,6" fill="#0A1636"/>
    </marker>
    <marker id="ar-r-gray" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0,0 8,3 0,6" fill="#A0A0A0"/>
    </marker>
  </defs>

  <!-- Section headers -->
  <text x="75" y="30" text-anchor="middle" class="header-text">CLIENT</text>
  <text x="355" y="30" text-anchor="middle" class="header-text">PLATFORM</text>
  <text x="670" y="30" text-anchor="middle" class="header-text">PROVIDERS</text>
  <text x="355" y="210" text-anchor="middle" class="header-text">OPTIONAL</text>

  <!-- Your Application box -->
  <rect x="15" y="45" width="120" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="75" y="69" text-anchor="middle" class="label">Your Application</text>
  <text x="75" y="87" text-anchor="middle" class="sublabel">REST API / SSE</text>

  <!-- Control Plane box -->
  <rect x="240" y="45" width="140" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="310" y="69" text-anchor="middle" class="label">Control Plane</text>
  <text x="310" y="87" text-anchor="middle" class="sublabel">State + coordination</text>

  <!-- Workers box -->
  <rect x="400" y="45" width="140" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="470" y="69" text-anchor="middle" class="label">Workers</text>
  <text x="470" y="87" text-anchor="middle" class="sublabel">Stateless executors</text>

  <!-- LLM Providers box -->
  <rect x="610" y="45" width="140" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680" y="65" text-anchor="middle" class="label">LLM Providers</text>
  <text x="680" y="80" text-anchor="middle" class="sublabel">OpenAI / Anthropic / ...</text>
  <text x="680" y="93" text-anchor="middle" class="mono">Multi-provider</text>

  <!-- Management UI box -->
  <rect x="285" y="225" width="140" height="55" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="355" y="249" text-anchor="middle" class="label">Management UI</text>
  <text x="355" y="267" text-anchor="middle" class="sublabel">Admin console</text>

  <!-- Arrow 1: Your Application -> Control Plane -->
  <rect x="140" y="63" width="18" height="18" fill="#0A1636"/>
  <text x="149" y="77" text-anchor="middle" class="step-num">1</text>
  <line x1="161" y1="72" x2="232" y2="72" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="196" y="66" text-anchor="middle" class="arrow-label">REST API / SSE</text>

  <!-- Arrow 2: Control Plane <-> Workers (bidirectional) -->
  <rect x="381" y="55" width="18" height="18" fill="#0A1636"/>
  <text x="390" y="69" text-anchor="middle" class="step-num">2</text>
  <line x1="380" y1="65" x2="395" y2="65" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <line x1="400" y1="80" x2="385" y2="80" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ar-l)"/>
  <text x="390" y="50" text-anchor="middle" class="arrow-label">gRPC</text>

  <!-- Arrow 3: Workers -> LLM Providers -->
  <rect x="545" y="63" width="18" height="18" fill="#0A1636"/>
  <text x="554" y="77" text-anchor="middle" class="step-num">3</text>
  <line x1="566" y1="72" x2="602" y2="72" stroke="#0A1636" stroke-width="1.5" marker-end="url(#ar-r)"/>
  <text x="583" y="66" text-anchor="middle" class="arrow-label">LLM calls</text>

  <!-- Dashed: Management UI -> Control Plane -->
  <line x1="340" y1="225" x2="320" y2="108" stroke="#A0A0A0" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#ar-r-gray)"/>
  <text x="316" y="168" text-anchor="start" class="arrow-label">Admin</text>
</svg>
