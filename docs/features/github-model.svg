<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0A1636"/>
    </marker>
  </defs>
  <rect width="880" height="400" fill="#FFFFFF"/>

  <text x="130" y="40" text-anchor="middle" class="header-text">From GitHub</text>
  <text x="440" y="40" text-anchor="middle" class="header-text">GitHub identity</text>
  <text x="750" y="40" text-anchor="middle" class="header-text">Uses</text>

  <!-- Inbound -->
  <rect x="30" y="70" width="200" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="130" y="94" text-anchor="middle" class="label">Trigger</text>
  <text x="130" y="112" text-anchor="middle" class="sublabel">listen: PRs, issues, CI</text>

  <rect x="30" y="170" width="200" height="56" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1"/>
  <text x="130" y="194" text-anchor="middle" class="label">App webhook</text>
  <text x="130" y="212" text-anchor="middle" class="sublabel">one per App, signed</text>

  <rect x="30" y="270" width="200" height="56" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="130" y="294" text-anchor="middle" class="label">GitHub channel</text>
  <text x="130" y="312" text-anchor="middle" class="sublabel">talk: @bot in a thread</text>

  <line x1="130" y1="170" x2="130" y2="128" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="130" y1="226" x2="130" y2="268" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Identities -->
  <rect x="330" y="70" width="220" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="440" y="94" text-anchor="middle" class="label">Agent App</text>
  <text x="440" y="112" text-anchor="middle" class="mono">&lt;agent&gt;[bot], own name</text>

  <rect x="330" y="170" width="220" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="440" y="194" text-anchor="middle" class="label">Everruns app</text>
  <text x="440" y="212" text-anchor="middle" class="mono">everruns[bot], org opt-in</text>

  <rect x="330" y="270" width="220" height="56" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="440" y="294" text-anchor="middle" class="label">Person</text>
  <text x="440" y="312" text-anchor="middle" class="sublabel">the signed-in human</text>

  <line x1="330" y1="98" x2="232" y2="186" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="198" x2="232" y2="198" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="281" y="236" text-anchor="middle" class="arrow-label">events</text>

  <!-- Uses -->
  <rect x="660" y="60" width="190" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="755" y="89" text-anchor="middle" class="label">GitHub tools</text>
  <rect x="660" y="130" width="190" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="755" y="159" text-anchor="middle" class="label">GitHub MCP</text>
  <rect x="660" y="200" width="190" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="755" y="229" text-anchor="middle" class="label">Sandbox repositories</text>
  <rect x="660" y="270" width="190" height="48" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="755" y="299" text-anchor="middle" class="label">Repository sync</text>

  <line x1="605" y1="84" x2="605" y2="298" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="660" y1="84" x2="605" y2="84" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="660" y1="154" x2="605" y2="154" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="660" y1="224" x2="605" y2="224" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="660" y1="294" x2="605" y2="294" stroke="#0A1636" stroke-width="1.5"/>
  <line x1="605" y1="98" x2="552" y2="98" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="198" x2="552" y2="198" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="298" x2="552" y2="298" stroke="#0A1636" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="605" y="350" text-anchor="middle" class="arrow-label">each use says: acts as (service or user), repositories, permissions</text>
  <text x="605" y="368" text-anchor="middle" class="sublabel">and gets a short-lived token cut down to exactly that</text>
</svg>
