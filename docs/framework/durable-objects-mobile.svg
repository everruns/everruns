<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Durable Object authority</title>
  <desc id="desc">An authenticated application admits input to a Durable Object. Its alarm activates a native executor or Wasm host, which writes fenced journal and state back to the object and runs the shared Everruns runtime with providers and tools.</desc>
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 15px; fill: #0A0A0A; font-weight: 600; }
    .small-label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; }
    .header-text { font-size: 10px; fill: #A0A0A0; letter-spacing: 0.08em; }
    .step-num { font-size: 11px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 11px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="390" height="520" fill="#FFFFFF"/>

  <rect x="45" y="25" width="300" height="65" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="195" y="45" text-anchor="middle" class="header-text">REQUESTER</text>
  <text x="195" y="71" text-anchor="middle" class="label">Authenticated application</text>

  <rect x="45" y="145" width="300" height="70" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="195" y="164" text-anchor="middle" class="header-text">SESSION AUTHORITY</text>
  <text x="195" y="188" text-anchor="middle" class="label">Durable Object</text>
  <text x="195" y="205" text-anchor="middle" class="sublabel">input · journal · lease · alarm</text>

  <rect x="45" y="295" width="300" height="70" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="195" y="314" text-anchor="middle" class="header-text">EXECUTION HOST</text>
  <text x="195" y="338" text-anchor="middle" class="label">Native executor or Wasm host</text>

  <rect x="15" y="435" width="160" height="65" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="95" y="454" text-anchor="middle" class="header-text">AGENT LOOP</text>
  <text x="95" y="478" text-anchor="middle" class="small-label">Shared Everruns</text>
  <text x="95" y="494" text-anchor="middle" class="small-label">runtime</text>

  <rect x="215" y="435" width="160" height="65" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="295" y="454" text-anchor="middle" class="header-text">CAPABILITIES</text>
  <text x="295" y="478" text-anchor="middle" class="small-label">Providers and</text>
  <text x="295" y="494" text-anchor="middle" class="small-label">tools</text>

  <line x1="195" y1="90" x2="195" y2="135" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="190,135 195,145 200,135" fill="#0A1636"/>
  <rect x="185" y="107" width="18" height="18" fill="#0A1636"/>
  <text x="194" y="120" text-anchor="middle" class="step-num">1</text>
  <text x="250" y="121" text-anchor="middle" class="arrow-label">Admit input</text>

  <line x1="125" y1="215" x2="125" y2="285" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="120,285 125,295 130,285" fill="#0A1636"/>
  <rect x="115" y="233" width="18" height="18" fill="#0A1636"/>
  <text x="124" y="246" text-anchor="middle" class="step-num">2</text>
  <text x="68" y="273" text-anchor="middle" class="arrow-label">Alarm activation</text>

  <line x1="265" y1="295" x2="265" y2="225" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="260,225 265,215 270,225" fill="#0A1636"/>
  <text x="320" y="254" text-anchor="middle" class="arrow-label">Fenced journal</text>
  <text x="320" y="270" text-anchor="middle" class="arrow-label">and state</text>

  <line x1="95" y1="365" x2="95" y2="425" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="90,425 95,435 100,425" fill="#0A1636"/>
  <line x1="175" y1="468" x2="205" y2="468" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="205,463 215,468 205,473" fill="#0A1636"/>
</svg>
