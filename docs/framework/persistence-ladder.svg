<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .step-num { font-size: 10px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
  </style>

  <!-- White background -->
  <rect width="800" height="400" fill="#FFFFFF"/>

  <!-- Section header -->
  <text x="400" y="30" text-anchor="middle" class="header-text">WHERE SESSION STATE LIVES</text>

  <!-- Step 1: in memory -->
  <rect x="30" y="200" width="220" height="140" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <rect x="40" y="210" width="18" height="18" fill="#0A1636"/>
  <text x="49" y="223" text-anchor="middle" class="step-num">1</text>
  <text x="140" y="250" text-anchor="middle" class="label">In memory</text>
  <text x="140" y="270" text-anchor="middle" class="mono">Engine::new()</text>
  <text x="140" y="292" text-anchor="middle" class="sublabel">volatile, lost on process exit</text>
  <text x="140" y="310" text-anchor="middle" class="sublabel">tests, embedding, short tools</text>

  <!-- Step 2: LocalConfig -->
  <rect x="290" y="140" width="220" height="200" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <rect x="300" y="150" width="18" height="18" fill="#0A1636"/>
  <text x="309" y="163" text-anchor="middle" class="step-num">2</text>
  <text x="400" y="190" text-anchor="middle" class="label">Local, on disk</text>
  <text x="400" y="210" text-anchor="middle" class="mono">.local(LocalConfig::new(dir))</text>
  <text x="400" y="232" text-anchor="middle" class="sublabel">crash-durable event log,</text>
  <text x="400" y="248" text-anchor="middle" class="sublabel">SQLite task and schedule state</text>
  <text x="400" y="270" text-anchor="middle" class="sublabel">desktop apps, CLIs, one node</text>

  <!-- Step 3: Platform -->
  <rect x="550" y="80" width="220" height="260" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <rect x="560" y="90" width="18" height="18" fill="#0A1636"/>
  <text x="569" y="103" text-anchor="middle" class="step-num">3</text>
  <text x="660" y="130" text-anchor="middle" class="label">Everruns Platform</text>
  <text x="660" y="150" text-anchor="middle" class="mono">everruns-durable</text>
  <text x="660" y="172" text-anchor="middle" class="sublabel">PostgreSQL checkpoints</text>
  <text x="660" y="188" text-anchor="middle" class="sublabel">and canonical events</text>
  <text x="660" y="210" text-anchor="middle" class="sublabel">restarts, retries, remote clients</text>

  <!-- Steps up -->
  <line x1="250" y1="290" x2="282" y2="290" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="282,286 290,290 282,294" fill="#0A1636"/>
  <line x1="510" y1="290" x2="542" y2="290" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="542,286 550,290 542,294" fill="#0A1636"/>

  <!-- Recovery boundary axis -->
  <text x="30" y="358" class="header-text">RECOVERY BOUNDARY</text>
  <line x1="30" y1="366" x2="762" y2="366" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="762,362 770,366 762,370" fill="#0A1636"/>
  <text x="140" y="388" text-anchor="middle" class="arrow-label">one Engine</text>
  <text x="400" y="388" text-anchor="middle" class="arrow-label">one application process</text>
  <text x="660" y="388" text-anchor="middle" class="arrow-label">distributed server and workers</text>
</svg>
