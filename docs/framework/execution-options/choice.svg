<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Choose an agent execution interface</title><desc id="desc">Compare native tools, Bashkit with Python, Monty Python Code Mode with continuations, and session sandboxes for native packages and processes.</desc>
<style>text{font-family:Geist,Inter,system-ui,sans-serif}.title{font-size:16px;font-weight:600;fill:#0A0A0A}.sub{font-size:12px;fill:#404040}.head{font-size:11px;letter-spacing:1px;fill:#404040}.small{font-size:11px;fill:#404040}</style>
<defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#0A1636"/></marker></defs>
<rect width="800" height="390" fill="#fff"/><text x="24" y="25" class="head" text-anchor="start">CHOOSE THE EXECUTION CONTRACT</text><text x="24" y="56" class="sub" text-anchor="start">Framework and Server support each option. Bashkit already includes Python.</text><rect x="24" y="84" width="362" height="108" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="84" width="4" height="108" fill="#0A1636"/><text x="42" y="112" class="title" text-anchor="start">Native tools</text><text x="42" y="134" class="sub" text-anchor="start">Individual typed operations</text><text x="42" y="153" class="sub" text-anchor="start">Visual results and user interaction</text><rect x="414" y="84" width="362" height="108" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="414" y="84" width="4" height="108" fill="#0A1636"/><text x="432" y="112" class="title" text-anchor="start">Bashkit</text><text x="432" y="134" class="sub" text-anchor="start">A shell interface: pipelines and scripts</text><text x="432" y="153" class="sub" text-anchor="start">Includes CPython WASM</text><rect x="24" y="220" width="362" height="108" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="24" y="220" width="4" height="108" fill="#B45309"/><text x="42" y="248" class="title" text-anchor="start">Monty Python Code Mode</text><text x="42" y="270" class="sub" text-anchor="start">A Python interface to authorized tools</text><text x="42" y="289" class="sub" text-anchor="start">Suspended programs + effect journals</text><rect x="414" y="220" width="362" height="108" fill="#F5F5F5" stroke="#A0A0A0"/><rect x="414" y="220" width="4" height="108" fill="#0A1636"/><text x="432" y="248" class="title" text-anchor="start">Session sandbox</text><text x="432" y="270" class="sub" text-anchor="start">Native packages and processes</text><text x="432" y="289" class="sub" text-anchor="start">A full OS workspace and lifecycle</text><text x="24" y="368" class="sub" text-anchor="start">Compose explicitly. Keep one preferred interface. Never escalate through automatic fallback.</text></svg>