<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 735" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Multiplayer chat inside Cloudflare Durable Objects</title>
  <desc id="desc">Browsers use public room routes to a ChatRoom DO. Stable admissions reach a ChatSession DO for each conversation or search child. Each session runs Everruns Engine with its own journal and alarm, calls application tools on the room, and uses the shared OpenRouter driver. Durable alarms continue work after browsers disconnect.</desc>
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 15px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 12px; fill: #404040; }
    .header-text { font-size: 10px; fill: #404040; letter-spacing: 0.05em; }
    .arrow-label { font-size: 12px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="400" height="735" fill="#FFFFFF"/>
  <rect x="20" y="20" width="360" height="80" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="200" y="51" text-anchor="middle" class="label">Shared browsers: Alice + Bob</text>
  <text x="200" y="77" text-anchor="middle" class="sublabel">Live room snapshots</text>
  <line x1="200" y1="100" x2="200" y2="150" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="195,150 200,160 205,150" fill="#0A1636"/>
  <text x="220" y="135" class="arrow-label">Public room routes</text>
  <rect x="20" y="160" width="360" height="110" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="200" y="188" text-anchor="middle" class="header-text">APPLICATION SERVICES</text>
  <text x="200" y="214" text-anchor="middle" class="label">ChatRoom DO</text>
  <text x="200" y="240" text-anchor="middle" class="sublabel">Directory + presence + outbox + reminders + alarm</text>
  <line x1="135" y1="270" x2="135" y2="330" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="130,330 135,340 140,330" fill="#0A1636"/>
  <text x="112" y="310" text-anchor="end" class="arrow-label">Admit</text>
  <line x1="265" y1="340" x2="265" y2="280" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="260,280 265,270 270,280" fill="#0A1636"/>
  <text x="285" y="310" class="arrow-label">Tools</text>
  <rect x="20" y="340" width="360" height="110" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="200" y="365" text-anchor="middle" class="header-text">ONE PER CONVERSATION / SEARCH CHILD</text>
  <text x="200" y="390" text-anchor="middle" class="label">ChatSession DO</text>
  <text x="200" y="416" text-anchor="middle" class="sublabel">Engine + ObjectHosting · journal + epoch + alarm</text>
  <line x1="200" y1="450" x2="200" y2="510" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="195,510 200,520 205,510" fill="#0A1636"/>
  <text x="220" y="480" class="arrow-label">Shared driver</text>
  <text x="220" y="499" class="arrow-label">+ host fetch</text>
  <rect x="20" y="520" width="360" height="80" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="200" y="552" text-anchor="middle" class="label">OpenRouter</text>
  <text x="200" y="578" text-anchor="middle" class="sublabel">Muse Spark 1.3 Contributor</text>
  <rect x="20" y="630" width="360" height="85" fill="#FFFFFF" stroke="#404040" stroke-dasharray="4 3"/>
  <text x="38" y="655" class="label">Close the browsers. Work stays durable.</text>
  <text x="38" y="679" class="sublabel">Room/session alarms wake and recover work.</text>
  <text x="38" y="701" class="sublabel">Reconnect to read committed history.</text>
</svg>
