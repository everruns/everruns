<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Durable Object authority</title>
  <desc id="desc">An authenticated application admits input to a Durable Object. Its alarm activates a native executor or Wasm host, which writes fenced journal and state back to the object and runs the shared Everruns runtime with providers and tools.</desc>
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 15px; fill: #0A0A0A; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; }
    .header-text { font-size: 11px; fill: #A0A0A0; letter-spacing: 0.08em; }
    .step-num { font-size: 11px; fill: #FFFFFF; font-weight: 600; }
    .arrow-label { font-size: 11px; fill: #0A1636; font-weight: 500; }
  </style>
  <rect width="800" height="375" fill="#FFFFFF"/>

  <text x="110" y="53" text-anchor="middle" class="header-text">REQUESTER</text>
  <rect x="25" y="68" width="170" height="90" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="110" y="106" text-anchor="middle" class="label">Framework</text>
  <text x="110" y="128" text-anchor="middle" class="label">Engine / Session</text>

  <text x="400" y="53" text-anchor="middle" class="header-text">SESSION AUTHORITY</text>
  <rect x="315" y="68" width="170" height="90" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="400" y="109" text-anchor="middle" class="label">Durable Object</text>
  <text x="400" y="134" text-anchor="middle" class="sublabel">input · journal · lease · alarm</text>

  <text x="700" y="53" text-anchor="middle" class="header-text">EXECUTION HOST</text>
  <rect x="615" y="68" width="170" height="90" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="700" y="106" text-anchor="middle" class="label">Engine executor</text>
  <text x="700" y="130" text-anchor="middle" class="sublabel">native or Wasm</text>

  <text x="400" y="263" text-anchor="middle" class="header-text">AGENT LOOP</text>
  <rect x="315" y="275" width="170" height="80" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="400" y="311" text-anchor="middle" class="label">Shared Everruns</text>
  <text x="400" y="333" text-anchor="middle" class="label">runtime</text>

  <text x="700" y="263" text-anchor="middle" class="header-text">CAPABILITIES</text>
  <rect x="615" y="275" width="170" height="80" fill="#F5F5F5" stroke="#0A0A0A"/>
  <text x="700" y="321" text-anchor="middle" class="label">Providers and tools</text>

  <!-- Admit input, then activate the executor. -->
  <line x1="195" y1="113" x2="305" y2="113" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="305,108 315,113 305,118" fill="#0A1636"/>
  <rect x="203" y="104" width="18" height="18" fill="#0A1636"/>
  <text x="212" y="117" text-anchor="middle" class="step-num">1</text>
  <text x="265" y="97" text-anchor="middle" class="arrow-label">Admit input</text>

  <line x1="485" y1="113" x2="605" y2="113" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="605,108 615,113 605,118" fill="#0A1636"/>
  <rect x="493" y="104" width="18" height="18" fill="#0A1636"/>
  <text x="502" y="117" text-anchor="middle" class="step-num">2</text>
  <text x="555" y="97" text-anchor="middle" class="arrow-label">Alarm activation</text>

  <!-- The authority fences the executor's journal and session state. -->
  <path d="M 635 158 V 215 H 455 V 168" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="450,168 455,158 460,168" fill="#0A1636"/>
  <rect x="464" y="178" width="165" height="27" fill="#FFFFFF"/>
  <text x="546" y="197" text-anchor="middle" class="arrow-label">Fenced journal and state</text>

  <!-- Both placements run the same agent loop and provider/tool interfaces. -->
  <path d="M 755 158 V 242 H 285 V 315 H 305" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="305,310 315,315 305,320" fill="#0A1636"/>
  <line x1="485" y1="315" x2="605" y2="315" stroke="#0A1636" stroke-width="1.5"/>
  <polygon points="605,310 615,315 605,320" fill="#0A1636"/>
</svg>
