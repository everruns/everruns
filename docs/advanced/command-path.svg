  <text x="680.0" y="210.0" text-anchor="middle" class="sublabel">params → typed command</text>
  <rect x="580" y="255" width="200" height="60" fill="#0A1636" stroke="#0A1636" stroke-width="1"/>
  <text x="680.0" y="281.0" text-anchor="middle" class="label-inv">Command::run</text>
  <text x="680.0" y="297.0" text-anchor="middle" class="sublabel-inv">policy check · tracing · metrics</text>
  <rect x="580" y="340" width="200" height="54" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680.0" y="363.0" text-anchor="middle" class="label">Command::execute</text>
  <text x="680.0" y="379.0" text-anchor="middle" class="sublabel">domain queries → PostgreSQL</text>
  <rect x="164" y="428" width="170" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="249.0" y="446" text-anchor="middle" class="label">commands.json</text>
  <text x="249.0" y="462" text-anchor="middle" class="mono">crates/cli-contract</text>
  <text x="249.0" y="477" text-anchor="middle" class="sublabel">generated from the registry,</text>
  <text x="249.0" y="491" text-anchor="middle" class="sublabel">grammar for every MAPPER</text>
  <rect x="360" y="428" width="420" height="70" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="570.0" y="448.0" text-anchor="middle" class="label">Command registry</text>
  <text x="570.0" y="464.0" text-anchor="middle" class="sublabel">each command registers name, schema, method + path,</text>
  <text x="570.0" y="480.0" text-anchor="middle" class="sublabel">policy and dispatch fn, via inventory::submit!</text>
