  <rect x="360" y="110" width="190" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="455.0" y="128.0" text-anchor="middle" class="label">POST /v1/commands</text>
  <text x="455.0" y="144.0" text-anchor="middle" class="sublabel">by name · Idempotency-Key</text>
  <rect x="360" y="170" width="190" height="104" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
