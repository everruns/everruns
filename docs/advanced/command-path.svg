  <text x="249.0" y="384.0" text-anchor="middle" class="sublabel">gRPC · ExecuteCommand</text>
  <rect x="360" y="50" width="190" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
