  <text x="78.0" y="308.0" text-anchor="middle" class="label">Agent, shell</text>
  <text x="78.0" y="324.0" text-anchor="middle" class="sublabel">bash in its session</text>
  <rect x="16" y="350" width="124" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="78.0" y="368.0" text-anchor="middle" class="label">Worker itself</text>
