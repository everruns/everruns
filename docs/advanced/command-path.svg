  <text x="455.0" y="218.0" text-anchor="middle" class="sublabel">bashkit interpreter</text>
  <text x="455.0" y="234.0" text-anchor="middle" class="sublabel">everruns builtin, flat names</text>
  <text x="455.0" y="250.0" text-anchor="middle" class="sublabel">query refuses mutations</text>
  <rect x="506" y="159" width="44" height="11" fill="#0A1636"/>
  <text x="528" y="167" text-anchor="middle" class="tag">MAPPER</text>
  <rect x="360" y="290" width="190" height="104" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="455.0" y="322.0" text-anchor="middle" class="label">Worker gRPC handlers</text>
  <text x="455.0" y="338.0" text-anchor="middle" class="sublabel">session and org re-checked</text>
  <text x="455.0" y="354.0" text-anchor="middle" class="sublabel">Run: same toolset gate</text>
  <text x="455.0" y="370.0" text-anchor="middle" class="sublabel">ExecuteCommand: internal</text>
  <rect x="580" y="150" width="200" height="80" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="680.0" y="178.0" text-anchor="middle" class="label">Dispatch by name</text>
