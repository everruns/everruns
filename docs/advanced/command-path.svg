  <rect x="16" y="110" width="124" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="78.0" y="128.0" text-anchor="middle" class="label">Person</text>
  <text x="78.0" y="144.0" text-anchor="middle" class="sublabel">in a terminal</text>
