  <text x="78.0" y="188.0" text-anchor="middle" class="label">MCP client</text>
  <text x="78.0" y="204.0" text-anchor="middle" class="sublabel">ChatGPT, Claude, …</text>
  <rect x="16" y="230" width="124" height="44" fill="#F5F5F5" stroke="#0A0A0A" stroke-width="1"/>
  <text x="78.0" y="248.0" text-anchor="middle" class="label">Agent, tools</text>
  <text x="78.0" y="264.0" text-anchor="middle" class="sublabel">platform capability</text>
