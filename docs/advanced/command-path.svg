<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" fill="none">
  <style>
    text { font-family: 'Geist', 'Inter', system-ui, sans-serif; }
    .label { font-size: 13px; fill: #0A0A0A; font-weight: 600; }
    .label-inv { font-size: 13px; fill: #FFFFFF; font-weight: 600; }
    .sublabel { font-size: 11px; fill: #404040; font-weight: 400; }
    .sublabel-inv { font-size: 11px; fill: #D4D8E2; font-weight: 400; }
    .header-text { font-size: 11px; fill: #A0A0A0; font-weight: 400; letter-spacing: 0.08em; text-transform: uppercase; }
    .mono { font-family: 'Geist Mono', 'SF Mono', monospace; font-size: 10px; fill: #404040; }
    .arrow-label { font-size: 10px; fill: #0A1636; font-weight: 500; }
    .tag { font-size: 8px; fill: #FFFFFF; font-weight: 600; letter-spacing: 0.06em; }
  </style>
  <rect width="800" height="510" fill="#FFFFFF"/>
  <text x="78" y="32" text-anchor="middle" class="header-text">CALLERS</text>
  <text x="249" y="32" text-anchor="middle" class="header-text">ENTRY POINTS</text>
  <text x="455" y="32" text-anchor="middle" class="header-text">SERVER</text>
  <text x="680" y="32" text-anchor="middle" class="header-text">COMMAND PATH</text>
