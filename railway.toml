# Railway configuration for control-plane service
# See: https://docs.railway.com/reference/config-as-code

[build]
builder = "dockerfile"
dockerfilePath = "docker/Dockerfile.unified"
# Note: Set "Docker Build Target: control-plane" in Railway dashboard

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
