# Publish charts/everruns as an OCI chart for a release:
#   helm install everruns oci://ghcr.io/everruns/charts/everruns --version X.Y.Z
# The chart's version and appVersion are set to the release, so it runs that
# release's images. Dispatched by Release after it pushes the tag.
name: Publish Helm Chart

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.49.0)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: v3.19.0

jobs:
  publish:
    name: Publish Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate trusted release tag
        env:
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag must be a semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$GIT_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo "release tag input must match the workflow tag ref" >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Check the chart
        run: scripts/check-helm-chart.sh

      - name: Package and push
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          helm package charts/everruns --version "$version" --app-version "$version" -d dist
          echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USER" --password-stdin
          helm push "dist/everruns-$version.tgz" oci://ghcr.io/everruns/charts
