name: tool_search Reveal Eval Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/tool-search-reveal/**'
      - 'evals/common/**'
      - '.github/workflows/tool-search-reveal-evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/tool-search-reveal/**'
      - 'evals/common/**'
      - '.github/workflows/tool-search-reveal-evals.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  offline-evals:
    name: tool_search Reveal Eval Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evals/tool-search-reveal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: evals/tool-search-reveal
          shared-key: tool-search-reveal-evals
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint study
        run: cargo clippy --locked --all-targets -- -D warnings
      # No provider credentials: simulation proves runtime plumbing, not model quality.
      - name: Run deterministic tests and offline tool smoke
        run: cargo test --locked
