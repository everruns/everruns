name: Crate Release

# Independent library-crate releases, automated the same way as the product
# release (release.yml): tags are created by CI on merge to main, never pushed
# by hand. On every push to main this workflow compares each published crate's
# manifest version against what is already on crates.io; for any crate whose
# version is not yet published it creates the crate/<package>/v<version> tag and
# dispatches Publish Crate. Crates are released in dependency order so a
# dependant never publishes before the dependency it pins is on crates.io.
#
# Detection is by crates.io presence, not by diffing the push, so a version bump
# that merged before this workflow existed is still picked up, and re-runs are
# idempotent (a version already on crates.io is skipped). Every published crate
# (a package without `publish = false`) inherits the one platform version, so a
# product version bump releases the whole publish set here, in dependency order.

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '.github/workflows/crate-release.yml'
      # A fix to the publish workflow has to be able to re-drive the cascade it
      # broke. Without this, a release halted by a Publish Crate bug stays
      # unpublished until someone dispatches the controller by hand, and nothing
      # on main reports that the crates never shipped.
      - '.github/workflows/publish-crates.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List crates that would be released without tagging or publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crate-release
  cancel-in-progress: false

jobs:
  release-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create crate/<package>/v<version> tags
      actions: write # dispatch the Publish Crate workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve crates that need a release
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-plan.json
          import json, subprocess, sys, urllib.request, urllib.error

          def index_path(name: str) -> str:
              n = name.lower()
              if len(n) == 1:
                  return f"1/{n}"
              if len(n) == 2:
                  return f"2/{n}"
              if len(n) == 3:
                  return f"3/{n[0]}/{n}"
              return f"{n[0:2]}/{n[2:4]}/{n}"

          def published_versions(name: str) -> set[str]:
              url = f"https://index.crates.io/{index_path(name)}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      body = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return set()  # never published
                  raise
              return {json.loads(line)["vers"] for line in body.splitlines() if line.strip()}

          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          # Published packages are those whose manifest does not set publish = false
          # (cargo reports publish = [] for those).
          published = {p["name"]: p for p in meta["packages"] if p.get("publish") != []}

          existing = {name: published_versions(name) for name in published}

          to_release = {
              name: pkg["version"]
              for name, pkg in published.items()
              if pkg["version"] not in existing[name]
          }

          # A crate that has never been published cannot join a platform version
          # that was already cut. Its internal pins name that version, and the
          # siblings published at it came from the older commit, so `cargo
          # publish`'s verification build compiles the new crate against stale
          # dependency source and fails -- which is how
          # everruns-integrations-typesafe 0.28.0 broke after #3666 flipped it
          # from `publish = false` mid-cycle. Defer it to the next platform
          # version, where every crate publishes from one commit again.
          #
          # Scoped to never-published crates so a re-run can still finish a
          # partially published cascade: an existing crate resuming at the
          # version being cut is the normal case, not this one. The cost is that
          # a new crate added in a release whose cascade then fails ships one
          # release later instead; a deferred crate is named below either way.
          if any(pkg["version"] in existing[name] for name, pkg in published.items()):
              for name in sorted(n for n in to_release if not existing[n]):
                  print(
                      f"::notice::{name} {to_release[name]} is new and this platform "
                      f"version is already cut; it joins the next one",
                      file=sys.stderr,
                  )
                  del to_release[name]

          # Topologically sort the release set so dependencies publish first.
          deps = {
              name: {
                  d["name"]
                  for d in published[name]["dependencies"]
                  if d["name"] in to_release and (d.get("kind") in (None, "normal", "build"))
              }
              for name in to_release
          }
          ordered: list[str] = []
          done: set[str] = set()
          while len(ordered) < len(to_release):
              ready = sorted(n for n in to_release if n not in done and deps[n] <= done)
              if not ready:
                  print("::error::dependency cycle among crates to release", file=sys.stderr)
                  sys.exit(1)
              ordered.extend(ready)
              done.update(ready)

          print(json.dumps([
              {"package": n, "version": to_release[n], "tag": f"crate/{n}/v{to_release[n]}"}
              for n in ordered
          ]))
          PY

          COUNT=$(jq 'length' release-plan.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Release plan ($COUNT crate(s), dependency order):"
          jq -r '.[] | "  \(.package) \(.version)  (\(.tag))"' release-plan.json

      - name: Tag and publish in dependency order
        if: steps.plan.outputs.count != '0' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          count=$(jq 'length' release-plan.json)
          for i in $(seq 0 $((count - 1))); do
            PKG=$(jq -r ".[$i].package" release-plan.json)
            VER=$(jq -r ".[$i].version" release-plan.json)
            TAG=$(jq -r ".[$i].tag" release-plan.json)
            echo "::group::Release $PKG $VER ($TAG)"

            # Create the tag on GitHub's infrastructure (the Actions token can push
            # tags; a hand push cannot). A tag that already exists is reused and
            # never moved: it is the trusted provenance anchor for this package's
            # publish, which Publish Crate checks out from and validates against
            # the expected SHA before the crates.io token is used. Moving it would
            # let a published artifact stop matching the tag that names it.
            #
            # The plan only contains versions absent from crates.io, so a tag here
            # that points somewhere else is the residue of an attempt that tagged
            # and then failed to publish. It pins this package to that older commit
            # permanently, and no re-run can clear it. Fail here, where the remedy
            # is one command, rather than dispatching a run whose head is the stale
            # commit -- the correlation selector rejects it on headSha and the
            # controller then misreports it as "did not start", which is both wrong
            # and four minutes slower.
            EXISTING=""
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              EXISTING="$(git rev-list -n 1 "$TAG^{commit}")"
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
              EXISTING="$(git rev-list -n 1 "$TAG^{commit}")"
            fi
            if [ -n "$EXISTING" ]; then
              if [ "$EXISTING" != "$SHA" ]; then
                echo "::error::Tag $TAG exists at $EXISTING but this release is $SHA. A previous attempt tagged $PKG and did not publish it. Release tags are the trusted publish anchor and are never moved, so delete the stale tag and re-run Crate Release: gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
                exit 1
              fi
              echo "Tag $TAG already exists at $SHA; reusing"
            else
              git tag "$TAG" "$SHA"
              git push origin "refs/tags/$TAG:refs/tags/$TAG"
              echo "Created and pushed $TAG"
            fi

            # gh workflow run does not return a run ID. Give this dispatch a
            # controller-unique identity, then accept only a workflow run whose
            # event, package, tag, SHA, and correlation all match.
            CORRELATION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}-${SHA}"
            gh workflow run publish-crates.yml --ref "$TAG" \
              -f package="$PKG" -f tag="$TAG" -f sha="$SHA" \
              -f correlation="$CORRELATION"

            # The global run list may contain newer concurrent manual dispatches.
            # The selector ignores every run except this exact trusted release.
            RUN_ID=""
            for _ in $(seq 1 30); do
              sleep 6
              gh run list --workflow=publish-crates.yml --event=workflow_dispatch \
                --limit=100 --json databaseId,displayTitle,event,headSha \
                > publish-runs.json
              if CAND=$(python3 scripts/select_publish_run.py \
                --package "$PKG" --tag "$TAG" --sha "$SHA" \
                --correlation "$CORRELATION" < publish-runs.json); then
                RUN_ID="$CAND"
                break
              elif [ "$?" -eq 2 ]; then
                exit 1
              fi
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::Publish Crate run for $PKG did not start"; exit 1
            fi
            echo "Watching Publish Crate run $RUN_ID for $PKG..."
            gh run watch "$RUN_ID" --exit-status --interval 15

            # Let the crates.io sparse index publish the new version before a
            # dependant crate that pins it is published next.
            sleep 25
            echo "::endgroup::"
          done
          echo "All crate releases dispatched and confirmed."

      - name: Dry-run summary
        if: steps.plan.outputs.count != '0' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run — the following crates would be released:"
          jq -r '.[] | "  \(.package) \(.version)  (\(.tag))"' release-plan.json

      - name: Nothing to release
        if: steps.plan.outputs.count == '0'
        run: echo "No published crate has a version missing from crates.io; nothing to release."
