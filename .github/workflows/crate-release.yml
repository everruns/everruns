name: Crate Release

# Independent library-crate releases, automated the same way as the product
# release (release.yml): tags are created by CI on merge to main, never pushed
# by hand. On every push to main this workflow compares each published crate's
# manifest version against what is already on crates.io; for any crate whose
# version is not yet published it creates the crate/<package>/v<version> tag and
# dispatches Publish Crate. Crates are released in dependency order so a
# dependant never publishes before the dependency it pins is on crates.io.
#
# Detection is by crates.io presence, not by diffing the push, so a version bump
# that merged before this workflow existed is still picked up, and re-runs are
# idempotent (a version already on crates.io is skipped). Every published crate
# (a package without `publish = false`) inherits the one platform version, so a
# product version bump releases the whole publish set here, in dependency order.

on:
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - '.github/workflows/crate-release.yml'
      # A fix to the publish workflow has to be able to re-drive the cascade it
      # broke. Without this, a release halted by a Publish Crate bug stays
      # unpublished until someone dispatches the controller by hand, and nothing
      # on main reports that the crates never shipped.
      - '.github/workflows/publish-crates.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List crates that would be released without tagging or publishing'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: crate-release
  cancel-in-progress: false

jobs:
  release-crates:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create crate/<package>/v<version> tags
      actions: write # dispatch the Publish Crate workflow
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve crates that need a release
        id: plan
        run: |
          set -euo pipefail
          python3 - <<'PY' > release-plan.json
          import json, os, subprocess, sys, urllib.request, urllib.error

          def index_path(name: str) -> str:
              n = name.lower()
              if len(n) == 1:
                  return f"1/{n}"
              if len(n) == 2:
                  return f"2/{n}"
              if len(n) == 3:
                  return f"3/{n[0]}/{n}"
              return f"{n[0:2]}/{n[2:4]}/{n}"

          def published_versions(name: str) -> set[str]:
              url = f"https://index.crates.io/{index_path(name)}"
              try:
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      body = resp.read().decode()
              except urllib.error.HTTPError as exc:
                  if exc.code == 404:
                      return set()  # never published
                  raise
              return {json.loads(line)["vers"] for line in body.splitlines() if line.strip()}

          meta = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True))
          # Published packages are those whose manifest does not set publish = false
          # (cargo reports publish = [] for those).
          published = {p["name"]: p for p in meta["packages"] if p.get("publish") != []}

          existing = {name: published_versions(name) for name in published}

          to_release = {
              name: pkg["version"]
              for name, pkg in published.items()
              if pkg["version"] not in existing[name]
          }

          # A platform version is published from one commit. Once any sibling is
          # on crates.io at this version from another commit, a run here must not
          # finish the cascade: it would publish the rest from a different tree
          # under the same version. v0.34.1 did exactly that -- runs triggered by
          # later pushes to main picked up a halted cascade and shipped 16 crates
          # from one newer commit and `everruns` from another. Never-published
          # crates were already held back for the same reason (their verification
          # build compiles against the older siblings, which broke
          # everruns-integrations-typesafe 0.28.0); now everything is.
          #
          # "Another commit" is decided by release tags, not by "is any sibling
          # already at this version". Every publish is anchored by a
          # crate/<name>/v<version> tag, so a sibling whose tag names this commit
          # is an earlier attempt of this very cascade, which a re-run here must
          # finish -- new crates included (v0.30.0 deferred openrouter on a re-run
          # and broke everruns-platform when this was asked the weaker way).
          # The remedy for a version cut elsewhere is to re-run Crate Release on
          # the commit its tags name, or to cut the next version.
          head = os.environ.get("GITHUB_SHA", "")

          def release_tag_commit(name: str, version: str) -> str:
              """Commit that crate/<name>/v<version> anchors, or "" if untagged."""
              try:
                  return subprocess.check_output(
                      ["git", "rev-list", "-n", "1", f"crate/{name}/v{version}^{{commit}}"],
                      text=True,
                      stderr=subprocess.DEVNULL,
                  ).strip()
              except subprocess.CalledProcessError:
                  return ""

          # Absent a tag, or absent GITHUB_SHA, provenance cannot be established
          # and the conservative reading -- cut elsewhere -- is the one that holds.
          cut_elsewhere = any(
              pkg["version"] in existing[name]
              and not (head and release_tag_commit(name, pkg["version"]) == head)
              for name, pkg in published.items()
          )

          if cut_elsewhere and to_release:
              for name in sorted(to_release):
                  print(
                      f"::notice::{name} {to_release[name]} is held back: this platform "
                      f"version was cut at another commit, so finish it there or "
                      f"release it with the next version",
                      file=sys.stderr,
                  )
              to_release = {}

          # Topologically sort the release set so dependencies publish first.
          deps = {
              name: {
                  d["name"]
                  for d in published[name]["dependencies"]
                  if d["name"] in to_release
                  and d["name"] != name
                  and (
                      d.get("kind") in (None, "normal", "build")
                      # A dev-dependency that carries a version requirement
                      # stays in the packaged manifest, and `cargo package`
                      # resolves it from the index, so it must publish first.
                      # Version-less path dev-deps are stripped and stay out
                      # of the ordering. Ignoring the versioned ones put
                      # everruns-durable (no normal deps, dev-dep on
                      # everruns-core) first in the v0.34.0 cascade, where it
                      # failed to package and halted the release.
                      or (d.get("kind") == "dev" and d.get("req", "*") != "*")
                  )
              }
              for name in to_release
          }
          ordered: list[str] = []
          done: set[str] = set()
          while len(ordered) < len(to_release):
              ready = sorted(n for n in to_release if n not in done and deps[n] <= done)
              if not ready:
                  print("::error::dependency cycle among crates to release", file=sys.stderr)
                  sys.exit(1)
              ordered.extend(ready)
              done.update(ready)

          print(json.dumps([
              {"package": n, "version": to_release[n], "tag": f"crate/{n}/v{to_release[n]}"}
              for n in ordered
          ]))
          PY

          COUNT=$(jq 'length' release-plan.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Release plan ($COUNT crate(s), dependency order):"
          jq -r '.[] | "  \(.package) \(.version)  (\(.tag))"' release-plan.json

      # Fail before the first tag, not mid-cascade: package every crate in the
      # plan and check the order against the manifests cargo produces. A
      # halted cascade can only be finished by the next patch version.
      - name: Check publish order against packaged manifests
        if: steps.plan.outputs.count != '0'
        run: python3 scripts/check-publish-order.py --plan release-plan.json

      # A never-published name someone else holds, or more new names than the
      # crates.io burst allows, would halt the cascade part-way.
      - name: Check new crate names against crates.io
        if: steps.plan.outputs.count != '0'
        run: python3 scripts/release-preflight.py --names

      - name: Tag and publish in dependency order
        if: steps.plan.outputs.count != '0' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          count=$(jq 'length' release-plan.json)

          # Create every tag in the plan up front, in one atomic push, before
          # anything publishes. GitHub refuses a GITHUB_TOKEN push of a ref whose
          # tree has different workflow files from the default branch ("refusing
          # to allow a GitHub App to create or update workflow ... without
          # `workflows` permission"). Tagging one crate per step, an hour into a
          # cascade, failed as soon as any PR touching .github/workflows merged
          # to main -- twice during v0.34.1. Pushed straight after the release
          # commit lands, the tags all exist before main can move, a re-run here
          # only reuses them, and if the push is refused nothing has published.
          #
          # Tags are created on GitHub's infrastructure (the Actions token can
          # push tags; a hand push cannot). A tag that already exists is reused
          # and never moved: it is the trusted provenance anchor for this
          # package's publish, which Publish Crate checks out from and validates
          # against the expected SHA before the crates.io token is used. Moving
          # it would let a published artifact stop matching the tag that names it.
          #
          # The plan only contains versions absent from crates.io, so a tag that
          # points somewhere else is the residue of an attempt that tagged and
          # then failed to publish. It pins this package to that older commit
          # permanently, and no re-run can clear it. Fail here, where the remedy
          # is one command, rather than dispatching a run whose head is the stale
          # commit -- the correlation selector rejects it on headSha and the
          # controller then misreports it as "did not start".
          NEW_TAGS=()
          for i in $(seq 0 $((count - 1))); do
            TAG=$(jq -r ".[$i].tag" release-plan.json)
            EXISTING=""
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              EXISTING="$(git rev-list -n 1 "$TAG^{commit}")"
            elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
              EXISTING="$(git rev-list -n 1 "$TAG^{commit}")"
            fi
            if [ -n "$EXISTING" ]; then
              if [ "$EXISTING" != "$SHA" ]; then
                echo "::error::Tag $TAG exists at $EXISTING but this release is $SHA. A previous attempt tagged it and did not publish it. Release tags are the trusted publish anchor and are never moved, so delete the stale tag and re-run Crate Release: gh api -X DELETE repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG"
                exit 1
              fi
              echo "Tag $TAG already exists at $SHA; reusing"
            else
              git tag "$TAG" "$SHA"
              NEW_TAGS+=("refs/tags/$TAG:refs/tags/$TAG")
            fi
          done
          if [ "${#NEW_TAGS[@]}" -gt 0 ]; then
            git push --atomic origin "${NEW_TAGS[@]}"
            echo "Created and pushed ${#NEW_TAGS[@]} tag(s)"
          fi

          for i in $(seq 0 $((count - 1))); do
            PKG=$(jq -r ".[$i].package" release-plan.json)
            VER=$(jq -r ".[$i].version" release-plan.json)
            TAG=$(jq -r ".[$i].tag" release-plan.json)
            echo "::group::Release $PKG $VER ($TAG)"

            # gh workflow run does not return a run ID. Give this dispatch a
            # controller-unique identity, then accept only a workflow run whose
            # event, package, tag, SHA, and correlation all match.
            CORRELATION="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${i}-${SHA}"
            gh workflow run publish-crates.yml --ref "$TAG" \
              -f package="$PKG" -f tag="$TAG" -f sha="$SHA" \
              -f correlation="$CORRELATION"

            # The global run list may contain newer concurrent manual dispatches.
            # The selector ignores every run except this exact trusted release.
            RUN_ID=""
            for _ in $(seq 1 30); do
              sleep 6
              gh run list --workflow=publish-crates.yml --event=workflow_dispatch \
                --limit=100 --json databaseId,displayTitle,event,headSha \
                > publish-runs.json
              if CAND=$(python3 scripts/select_publish_run.py \
                --package "$PKG" --tag "$TAG" --sha "$SHA" \
                --correlation "$CORRELATION" < publish-runs.json); then
                RUN_ID="$CAND"
                break
              elif [ "$?" -eq 2 ]; then
                exit 1
              fi
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::Publish Crate run for $PKG did not start"; exit 1
            fi
            echo "Watching Publish Crate run $RUN_ID for $PKG..."
            # One automatic retry, of the same run (same tag, SHA and
            # correlation). The 0.34.2 cascade halted three times on a dropped
            # crates.io index connection, each costing a manual re-run. The
            # publish job is idempotent: an already-published version passes
            # only if its digest matches this commit's artifact, so a retry can
            # never publish anything a first attempt would not have.
            if ! gh run watch "$RUN_ID" --exit-status --interval 15; then
              echo "::warning::Publish Crate run $RUN_ID for $PKG failed; retrying its failed job once"
              gh run rerun "$RUN_ID" --failed
              sleep 10
              gh run watch "$RUN_ID" --exit-status --interval 15
            fi

            # A dependant may start only once Cargo can resolve the exact
            # artifact the trusted publisher verified, without a fixed delay.
            python3 scripts/lib/wait-for-crate-index.py \
              --package "$PKG" --version "$VER" --sha "$SHA"
            echo "::endgroup::"
          done
          echo "All crate releases dispatched and confirmed."

      - name: Dry-run summary
        if: steps.plan.outputs.count != '0' && github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run — the following crates would be released:"
          jq -r '.[] | "  \(.package) \(.version)  (\(.tag))"' release-plan.json

      - name: Nothing to release
        if: steps.plan.outputs.count == '0'
        run: echo "No published crate has a version missing from crates.io; nothing to release."
