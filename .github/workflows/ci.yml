name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check Cargo.lock is up to date
        run: cargo fetch --locked

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Fast unit tests - no external dependencies (PostgreSQL, LLM APIs)
  # Runs in ~30s, provides quick feedback on logic errors
  unit-test:
    name: Unit Tests (Pure)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run pure unit tests
        run: |
          cargo test -p everruns-anthropic --lib --all-features
          cargo test -p everruns-openai --lib --all-features
          cargo test -p everruns-gemini --lib --all-features
          cargo test -p everruns-internal-protocol --lib --all-features
          cargo test -p everruns-core --lib --all-features
          cargo test -p everruns-integrations-daytona --all-features

  # Integration tests requiring PostgreSQL
  # Tests API endpoints, repositories, and durable execution against real database
  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Cache sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-0.8

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            cargo install sqlx-cli --no-default-features --features postgres
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Run server unit tests (require DB for storage layer)
        run: cargo test -p everruns-server --lib

      - name: Run API integration tests (in-process)
        run: cargo test -p everruns-server --test api_integration_test -- --test-threads=1

      - name: Run repository integration tests
        run: cargo test -p everruns-server --test repository_integration_test -- --test-threads=1

      - name: Run durable integration tests
        run: cargo test -p everruns-durable --test postgres_integration_test -- --test-threads=1

      - name: Run durable repository tests
        run: cargo test -p everruns-durable --test postgres_repository_test -- --test-threads=1

      - name: Run LLM integration tests (skips providers without API keys)
        timeout-minutes: 10
        run: |
          cargo test -p everruns-core --test agent_run_basic --all-features
          cargo test -p everruns-core --test agent_run_with_thinking --all-features

  # Build release binaries and upload as artifacts for E2E jobs
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Build release binaries
        run: cargo build --release -p everruns-server -p everruns-worker -p everruns-cli

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-server
          path: target/release/everruns-server
          retention-days: 1

      - name: Upload worker binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-worker
          path: target/release/everruns-worker
          retention-days: 1

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-cli
          path: target/release/everruns
          retention-days: 1

  workflow-test:
    name: Workflow Tests (Server + Worker)
    runs-on: ubuntu-latest
    needs: build-binaries
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      API_BASE_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Cache sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-0.8

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            cargo install sqlx-cli --no-default-features --features postgres
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-server
          path: ./bin

      - name: Download worker binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-worker
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      - name: Start API server
        run: |
          ./bin/everruns-server > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"

      - name: Start Worker
        run: |
          ./bin/everruns-worker > worker.log 2>&1 &
          echo $! > worker.pid
          echo "Worker PID: $(cat worker.pid)"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      - name: Run workflow tests
        run: cargo test -p everruns-server --test workflow_test -- --test-threads=1

      - name: Stop services
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
          if [ -f worker.pid ]; then
            kill $(cat worker.pid) 2>/dev/null || true
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          cat server.log 2>/dev/null || echo "No server log"
          echo ""
          echo "=== Worker logs ==="
          cat worker.log 2>/dev/null || echo "No worker log"

  cli-e2e-test:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    needs: build-binaries
    timeout-minutes: 10

    env:
      DEV_MODE: "true"
      AUTH_MODE: none
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      DEFAULT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEFAULT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEFAULT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVERRUNS_API_KEY: "cli-e2e-test-key"

    steps:
      - uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-server
          path: ./bin

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-cli
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      - name: Add bin to PATH
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Start server (DEV_MODE with in-process worker)
        run: |
          ./bin/everruns-server > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -s http://localhost:9000/health > /dev/null; do sleep 1; done'
          echo "Server is ready (DEV_MODE with in-process worker)"

      - name: Run CLI E2E tests
        run: ./scripts/cli-e2e-test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Build
        run: cargo build --all-features --release

  ui-build:
    name: UI Build, Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/package-lock.json') }}-${{ hashFiles('apps/ui/src/**/*', 'apps/ui/app/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Type check & build
        run: npm run build

  docs-build:
    name: Docs Build & Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Astro check
        run: npm run check

      - name: Build docs
        run: npm run build

  openapi-check:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protobuf compiler
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Generate fresh OpenAPI spec
        run: cargo run --bin export-openapi --release > /tmp/openapi-fresh.json

      - name: Compare with committed spec
        run: |
          if ! diff -q docs/api/openapi.json /tmp/openapi-fresh.json > /dev/null 2>&1; then
            echo "❌ OpenAPI spec is out of date!"
            echo ""
            echo "The committed docs/api/openapi.json differs from the generated spec."
            echo "Please run: ./scripts/export-openapi.sh"
            echo ""
            echo "Diff (first 50 lines):"
            diff docs/api/openapi.json /tmp/openapi-fresh.json | head -50
            exit 1
          fi
          echo "✅ OpenAPI spec is up to date"

  # Docker builds using matrix for parallel execution
  docker-build:
    name: Docker Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: server
            dockerfile: docker/Dockerfile.unified
            image: everruns-server
          - target: worker
            dockerfile: docker/Dockerfile.unified
            image: everruns-worker

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}
