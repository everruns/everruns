name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

# Cancel in-progress runs for the same PR/branch on new pushes.
# On main, let every run finish so merged commits aren't silently skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope: PR code
  # would inherit it and could exfiltrate the whole Doppler vault via
  # build.rs, proc-macros, or tests. Inject it per step under a push-only
  # gate (see Slack + live-test jobs below).

jobs:
  # Detect which parts of the codebase changed to skip irrelevant jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.ci_event.outputs.run_ci }}
      rust: ${{ steps.core_filter.outputs.rust }}
      daytona: ${{ steps.live_filter.outputs.daytona }}
      deno: ${{ steps.live_filter.outputs.deno }}
      cursor: ${{ steps.live_filter.outputs.cursor }}
      browserless: ${{ steps.live_filter.outputs.browserless }}
      e2b: ${{ steps.live_filter.outputs.e2b }}
      sdk_compat: ${{ steps.core_filter.outputs.sdk_compat }}
      shell: ${{ steps.core_filter.outputs.shell }}
      ui: ${{ steps.core_filter.outputs.ui }}
      docs: ${{ steps.core_filter.outputs.docs }}
      docs_notebooks: ${{ steps.core_filter.outputs.docs_notebooks }}
      docker: ${{ steps.core_filter.outputs.docker }}
      postgres_integration: ${{ steps.core_filter.outputs.postgres_integration }}
      brave_search_integration: ${{ steps.core_filter.outputs.brave_search_integration }}
      duckduckgo_integration: ${{ steps.core_filter.outputs.duckduckgo_integration }}
      parallel_integration: ${{ steps.core_filter.outputs.parallel_integration }}
      skip_slow_rust: ${{ steps.ci_opt_outs.outputs.skip_slow_rust }}
      skip_postgres_integration: ${{ steps.ci_opt_outs.outputs.skip_postgres_integration }}
      skip_sdk_compat: ${{ steps.ci_opt_outs.outputs.skip_sdk_compat }}
      skip_ui_e2e: ${{ steps.ci_opt_outs.outputs.skip_ui_e2e }}
      skip_docs_notebooks: ${{ steps.ci_opt_outs.outputs.skip_docs_notebooks }}
      skip_docker: ${{ steps.ci_opt_outs.outputs.skip_docker }}
      skip_integration_workflows: ${{ steps.ci_opt_outs.outputs.skip_integration_workflows }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve CI event gate
        id: ci_event
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && \
             { [ "${EVENT_ACTION}" = "labeled" ] || [ "${EVENT_ACTION}" = "unlabeled" ]; }; then
            case "${LABEL_NAME}" in
              ci:skip-docker|ci:skip-slow-rust|ci:skip-postgres-integration|ci:skip-sdk-compat|ci:skip-ui-e2e|ci:skip-docs-notebooks|ci:skip-integration-workflows)
                echo "run_ci=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "run_ci=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CI opt-out labels
        id: ci_opt_outs
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          has_label() {
            [[ "$LABELS_JSON" == *"\"$1\""* ]]
          }

          set_output() {
            local name="$1"
            local label="$2"
            if has_label "$label"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          set_output skip_slow_rust "ci:skip-slow-rust"
          set_output skip_postgres_integration "ci:skip-postgres-integration"
          set_output skip_sdk_compat "ci:skip-sdk-compat"
          set_output skip_ui_e2e "ci:skip-ui-e2e"
          set_output skip_docs_notebooks "ci:skip-docs-notebooks"
          set_output skip_docker "ci:skip-docker"
          set_output skip_integration_workflows "ci:skip-integration-workflows"

      - uses: dorny/paths-filter@v3
        id: core_filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'integrations/**'
              - 'scripts/cli-e2e-test.sh'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            sdk_compat:
              - 'crates/**'
              - '.github/scripts/sdk-compat/**'
              - '.github/workflows/ci.yml'
            # Repo-owned shell tests cover scripts/test-*.sh plus the shell
            # libraries/assets they exercise. Workflow-specific harnesses under
            # .github/scripts stay owned by their dedicated jobs.
            shell:
              - 'scripts/run-shell-tests.sh'
              - 'scripts/test-*.sh'
              - 'scripts/lib/**'
              - 'plugins/everruns-dev/**'
              - '.agents/plugins/**'
              - '.claude-plugin/**'
              - 'local/Caddyfile'
              - 'examples/docker-compose-full.yaml'
              - 'justfile'
              - '.github/workflows/ci.yml'
            ui:
              - 'apps/ui/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - '.github/workflows/ci.yml'
            docs_notebooks:
              - 'apps/docs/scripts/execute-notebooks.py'
              - 'apps/docs/scripts/render-notebooks.mjs'
              - 'docs/tutorials/**'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'crates/**'
              - 'integrations/**'
              - 'examples/**'
              - 'docs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker-publish.yml'
            # PostgreSQL integration tests cover the server persistence/API
            # surface, durable engine stores, and provider live tests that
            # currently run inside the same CI job. Keep this narrower than the
            # general Rust filter so unrelated crates do not start PostgreSQL.
            postgres_integration:
              - 'crates/server/**'
              - 'crates/durable/**'
              - 'crates/core/**'
              - 'crates/config/**'
              - 'crates/session-sqldb/**'
              - 'crates/llm-tests/**'
              - 'crates/openai/**'
              - 'crates/anthropic/**'
              - 'crates/gemini/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            brave_search_integration:
              - 'integrations/brave-search/**'
            duckduckgo_integration:
              - 'integrations/duckduckgo/**'
            parallel_integration:
              - 'integrations/parallel/**'

      # Exclusion filters need `predicate-quantifier: every`; with the default
      # `some`, a rule like `!integrations/foo/**/*.md` matches almost every
      # non-markdown file and incorrectly enables the live paid matrix.
      - uses: dorny/paths-filter@v3
        id: live_filter
        with:
          predicate-quantifier: every
          filters: |
            # Live API jobs (daytona/deno/browserless/e2b) hit real external
            # services and cost real API budget. Exclude doc-only changes so
            # SPEC.md tweaks don't trigger the full paid matrix on every push
            # to main. The weekly `integration-live-sweep.yml` backstop still
            # catches shared-crate regressions that slip past these filters.
            daytona:
              - 'integrations/daytona/**'
              - '!integrations/daytona/**/*.md'
            deno:
              - 'integrations/deno/**'
              - '!integrations/deno/**/*.md'
            cursor:
              - 'integrations/cursor/**'
              - '!integrations/cursor/**/*.md'
            browserless:
              - 'integrations/browserless/**'
              - '!integrations/browserless/**/*.md'
            e2b:
              - 'integrations/e2b/**'
              - '!integrations/e2b/**/*.md'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Check publish-pin versions match workspace
        run: python3 scripts/sync-publish-pin-versions.py --check

  msrv:
    name: Published Crate MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Check published crates against MSRV
        run: |
          cargo check --locked --all-features \
            -p everruns-config \
            -p everruns-openui \
            -p everruns-a2ui \
            -p everruns-core \
            -p everruns-openai \
            -p everruns-anthropic \
            -p everruns-integrations-duckduckgo \
            -p everruns-integrations-github \
            -p everruns-integrations-daytona \
            -p everruns-integrations-e2b \
            -p everruns-integrations-parallel \
            -p everruns-runtime

  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check existing migrations are immutable
        run: bash scripts/lib/check-migration-immutability.sh

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Fast unit tests - no external dependencies (PostgreSQL, LLM APIs)
  # Runs in ~30s, provides quick feedback on logic errors
  unit-test:
    name: Unit Tests (Pure)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run pure unit tests
        run: |
          cargo test -p everruns-anthropic -p everruns-openai -p everruns-gemini -p everruns-internal-protocol -p everruns-core --lib --all-features
          cargo test -p everruns-runtime --test in_process_runtime_test --test runtime_host_test -- --test-threads=1
          # Lua code-mode capability: compiles the mlua engine (`lua` feature) and
          # exercises the end-to-end routing contract + runnable example.
          cargo test -p everruns-runtime --features lua --test lua_code_mode_test -- --test-threads=1
          cargo run -p everruns-runtime --features lua --example lua_code_mode_agent
          cargo test -p everruns-cli --test auth_integration_test --test chat_integration_test --test files_integration_test -- --test-threads=1
          # Do not pass --all-features to integration crates: it enables their *-live-tests
          # features, which fail closed without real credentials. Live tests run in their
          # own dedicated jobs (e.g. `daytona-live-test`) that provide Doppler secrets.
          cargo test -p everruns-integrations-daytona
          cargo test -p everruns-integrations-deno
          cargo test -p everruns-integrations-browserless
          cargo test -p everruns-integrations-cursor
          cargo test -p everruns-integrations-e2b
          cargo test -p everruns-integrations-github
          cargo test -p everruns-integrations-sprites

  # Durable-worker PR coverage. Catches regressions in the worker crate's
  # durable execution paths (act/reason/input task handling, DLQ emission,
  # session.idled, org_id roundtripping, task error mapping) before merge.
  # Serialized because a handful of tests mutate process-wide env vars.
  worker-test:
    name: Worker Tests (Durable Execution)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run worker library tests
        run: cargo test -p everruns-worker --lib -- --test-threads=1

  shell-test:
    name: Shell Tests (Repo Scripts)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.shell == 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lsof netcat-openbsd ripgrep

          CADDY_VERSION="2.9.1"
          CADDY_TARBALL=""
          CADDY_CHECKSUMS="caddy_${CADDY_VERSION}_checksums.txt"
          CADDY_BASE_URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          case "$(uname -m)" in
            x86_64) CADDY_ARCH="amd64" ;;
            aarch64) CADDY_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          CADDY_TARBALL="caddy_${CADDY_VERSION}_linux_${CADDY_ARCH}.tar.gz"
          curl -fsSL "${CADDY_BASE_URL}/${CADDY_TARBALL}" -o "/tmp/${CADDY_TARBALL}"
          curl -fsSL "${CADDY_BASE_URL}/${CADDY_CHECKSUMS}" -o "/tmp/${CADDY_CHECKSUMS}"
          grep "  ${CADDY_TARBALL}$" "/tmp/${CADDY_CHECKSUMS}" > /tmp/caddy.sha512
          (cd /tmp && sha512sum -c caddy.sha512)
          tar -xzf "/tmp/${CADDY_TARBALL}" -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy

      - name: Run repo shell tests
        run: ./scripts/run-shell-tests.sh

  # Live Daytona API tests — only when integrations/daytona/** changes and secret exists
  daytona-live-test:
    name: Daytona Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.daytona == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run Daytona live integration tests
        run: doppler run -- cargo test -p everruns-integrations-daytona --features daytona-live-tests --test live_api_test -- --test-threads=1

  # Live Browserless API tests — only when integrations/browserless/** changes
  browserless-live-test:
    name: Browserless Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.browserless == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run Browserless live integration tests
        run: doppler run -- cargo test -p everruns-integrations-browserless --features browserless-live-tests --test live_api -- --test-threads=1

  # Live E2B API tests — only when integrations/e2b/** changes
  e2b-live-test:
    name: E2B Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.e2b == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run E2B live integration tests
        run: doppler run -- cargo test -p everruns-integrations-e2b --features e2b-live-tests --test live_api_test -- --test-threads=1

  # Live Deno API tests — only when integrations/deno/** changes
  deno-live-test:
    name: Deno Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.deno == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DENO_SANDBOX_REGION: ams
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run Deno live integration tests
        run: doppler run -- cargo test -p everruns-integrations-deno --features deno-live-tests --test live_api_test -- --test-threads=1

  # Integration tests requiring PostgreSQL
  # Tests API endpoints, repositories, and durable execution against real database
  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.postgres_integration == 'true' && needs.changes.outputs.skip_slow_rust != 'true' && needs.changes.outputs.skip_postgres_integration != 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      # LLM provider keys are intentionally NOT exposed at job scope:
      # this job runs PR-controlled cargo test (and therefore arbitrary
      # build.rs / proc-macro / test code) which would otherwise be able
      # to read the keys from process env. The single step that needs
      # them (Run LLM integration tests) is gated to push events and
      # sets them via step env below.

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-bins-sqlx-0.9

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            if [ ! -f ~/.cargo/bin/cargo-binstall ]; then
              cargo install cargo-binstall --locked
            fi
            cargo binstall sqlx-cli --no-confirm --version '~0.9'
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Run server unit tests (require DB for storage layer)
        run: cargo test -p everruns-server --lib

      - name: Run server integration tests (API + repository)
        run: cargo test -p everruns-server --test api_integration_test --test repository_integration_test -- --test-threads=1

      # Domain-focused integration tests that previously only ran manually.
      # Kept split so CI failures surface the offending area fast; each file
      # exercises a cohesive slice (auth, org lifecycle, schedules, git sessions,
      # evals, ag_ui, client-side tools, llm defaults, org isolation).
      - name: Run domain integration tests
        run: |
          cargo test -p everruns-server \
            --test ag_ui_integration_test \
            --test app_a2a_integration_test \
            --test app_invocation_channels_integration_test \
            --test auth_integration_test \
            --test cli_auth_test \
            --test cli_auth_no_org_test \
            --test client_side_tools_test \
            --test evals_integration_test \
            --test llm_model_default_test \
            --test org_creation_test \
            --test org_isolation_test \
            --test org_lifecycle_test \
            --test schedule_integration_test \
            --test session_git_integration_test \
            -- --test-threads=1

      - name: Run durable integration tests
        run: cargo test -p everruns-durable --test postgres_integration_test --test postgres_repository_test --features postgres-tests -- --test-threads=1

      # `agent_reliability_test` was audited for EVE-349 but still fails on a
      # clean PostgreSQL-backed run; keep it out of required CI until its
      # restart/reclaim scenarios are stabilized.
      - name: Run durable failpoint tests
        run: cargo test -p everruns-durable --test failure_injection_test --features "failpoints,postgres-tests" -- --test-threads=1

      # Slack live tests need DOPPLER_TOKEN. Restrict to push events so the
      # token is never instantiated in a fork-PR context where untrusted
      # code (build.rs, proc-macros, test bodies) would see it via env.
      - name: Install Doppler CLI
        if: github.event_name == 'push'
        uses: dopplerhq/cli-action@v3

      - name: Run Slack integration tests (real API via Doppler)
        if: github.event_name == 'push'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env="DATABASE_URL" -- cargo test -p everruns-server --test slack_integration_test -- --test-threads=1

      # Gated to push events so PR-controlled cargo test cannot exfiltrate
      # the LLM provider keys via env. PR coverage of the LLM matrix is
      # still provided by `unit-test` (mocked) and the weekly live sweep.
      - name: Run LLM integration tests (skips providers without API keys)
        if: github.event_name == 'push'
        timeout-minutes: 10
        # Gemini cases chronically hit 429 `RESOURCE_EXHAUSTED` on the shared
        # CI key regardless of the 2 in-test retries. Skip the `gemini` provider
        # via the existing `SKIP_LLM_INTEGRATION_TESTS_PROVIDERS` hatch in
        # `crates/llm-tests/tests/llm_test_matrix/mod.rs` so CI reflects real
        # regressions, not upstream quota pressure. Revisit when quota is raised.
        env:
          SKIP_LLM_INTEGRATION_TESTS_PROVIDERS: gemini
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: cargo test -p everruns-llm-tests --test agent_run_basic --test agent_run_with_thinking --all-features

  # Build release binaries and upload as artifacts for E2E jobs and openapi-check
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "release"

      - name: Build release binaries
        run: cargo build --release -p everruns-server -p everruns-worker -p everruns-cli

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-server
          path: target/release/everruns-server
          retention-days: 1

      - name: Upload worker binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-worker
          path: target/release/everruns-worker
          retention-days: 1

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: everruns-cli
          path: target/release/everruns
          retention-days: 1

      - name: Upload export-openapi binary
        uses: actions/upload-artifact@v4
        with:
          name: export-openapi
          path: target/release/export-openapi
          retention-days: 1

  # Gated to push events: this job launches PR-built `everruns-server` and
  # `everruns-worker` binaries with ANTHROPIC/OPENAI/GEMINI keys in env, so
  # running it on fork PRs would let attacker-controlled binary code exfil
  # the keys. PR coverage of the binaries is still provided by build-binaries
  # (compile-time) and the workflow tests run on push to main.
  workflow-test:
    name: Workflow Tests (Server + Worker)
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: github.event_name == 'push' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      API_BASE_URL: http://localhost:9000
      WORKER_GRPC_AUTH_TOKEN: test-grpc-token-for-ci
      RATE_LIMIT_API_REQUESTS_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-bins-sqlx-0.9

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            if [ ! -f ~/.cargo/bin/cargo-binstall ]; then
              cargo install cargo-binstall --locked
            fi
            cargo binstall sqlx-cli --no-confirm --version '~0.9'
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-server
          path: ./bin

      - name: Download worker binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-worker
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      - name: Start API server
        run: |
          ./bin/everruns-server > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"

      - name: Start Worker
        run: |
          ./bin/everruns-worker > worker.log 2>&1 &
          echo $! > worker.pid
          echo "Worker PID: $(cat worker.pid)"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      - name: Run workflow tests
        run: cargo test -p everruns-server --test workflow_test -- --test-threads=1

      - name: Stop services
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
          if [ -f worker.pid ]; then
            kill $(cat worker.pid) 2>/dev/null || true
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          cat server.log 2>/dev/null || echo "No server log"
          echo ""
          echo "=== Worker logs ==="
          cat worker.log 2>/dev/null || echo "No worker log"

  # Gated to push events: this job launches the PR-built `everruns-server`
  # binary with DEFAULT_*_API_KEY in env (which map to the same secrets as
  # workflow-test), so running it on fork PRs would let attacker-controlled
  # binary code exfil the keys. PR coverage of the CLI is still provided by
  # the CLI integration tests under `unit-test` (which run without keys).
  cli-e2e-test:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: github.event_name == 'push' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 10

    env:
      DEV_MODE: "true"
      AUTH_MODE: none
      API_PREFIX: ""
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      DEFAULT_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEFAULT_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEFAULT_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVERRUNS_API_KEY: "cli-e2e-test-key"
      RATE_LIMIT_API_REQUESTS_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v5

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-server
          path: ./bin

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-cli
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      - name: Add bin to PATH
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Start server (DEV_MODE with in-process worker)
        run: |
          ./bin/everruns-server > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -s http://localhost:9000/health > /dev/null; do sleep 1; done'
          echo "Server is ready (DEV_MODE with in-process worker)"

      - name: Run CLI E2E tests
        run: ./scripts/cli-e2e-test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  sdk-compat-matrix:
    name: SDK Compat Matrix
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.sdk_compat == 'true' && needs.changes.outputs.skip_sdk_compat != 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve SDK version matrix
        id: matrix
        run: ./.github/scripts/sdk-compat/resolve-sdk-versions.sh

  sdk-compat-test:
    name: SDK Compat (${{ matrix.language }} / ${{ matrix.cohort }} / v${{ matrix.version }})
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
      - sdk-compat-matrix
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.sdk_compat == 'true' && needs.changes.outputs.skip_sdk_compat != 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.sdk-compat-matrix.outputs.matrix) }}

    env:
      DEV_MODE: "true"
      AUTH_MODE: none
      API_PREFIX: ""
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      EVERRUNS_API_KEY: sdk-compat-test-key
      EVERRUNS_BASE_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: everruns-server
          path: ./bin

      - name: Make server binary executable
        run: chmod +x ./bin/everruns-server

      - name: Start server (DEV_MODE with in-process worker)
        run: |
          ./bin/everruns-server > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          timeout 30 bash -c 'until curl -s http://localhost:9000/health > /dev/null; do sleep 1; done'
          echo "Server is ready"

      - name: Run TypeScript SDK compatibility suite
        if: matrix.language == 'typescript'
        run: ./.github/scripts/sdk-compat/test-typescript.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Run Python SDK compatibility suite
        if: matrix.language == 'python'
        run: ./.github/scripts/sdk-compat/test-python.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Run Rust SDK compatibility suite
        if: matrix.language == 'rust'
        run: ./.github/scripts/sdk-compat/test-rust.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  # Reuses export-openapi binary from build-binaries instead of rebuilding
  openapi-check:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Download export-openapi binary
        uses: actions/download-artifact@v4
        with:
          name: export-openapi
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/export-openapi

      - name: Generate fresh OpenAPI spec
        run: ./bin/export-openapi > /tmp/openapi-fresh.json

      - name: Compare with committed spec
        run: |
          if ! diff -q docs/api/openapi.json /tmp/openapi-fresh.json > /dev/null 2>&1; then
            echo "❌ OpenAPI spec is out of date!"
            echo ""
            echo "The committed docs/api/openapi.json differs from the generated spec."
            echo "Please run: ./scripts/export-openapi.sh"
            echo ""
            echo "Diff (first 50 lines):"
            diff docs/api/openapi.json /tmp/openapi-fresh.json | head -50
            exit 1
          fi
          echo "✅ OpenAPI spec is up to date"

  ui-build:
    name: UI Build, Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.ui == 'true'

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}-${{ hashFiles('apps/ui/src/**/*', 'apps/ui/app/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Run tests
        run: pnpm test

      - name: Type check & build
        run: pnpm run build

  ui-e2e:
    name: UI Playwright Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.ui == 'true' && needs.changes.outputs.skip_ui_e2e != 'true'

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui/e2e/playwright-report
          retention-days: 7

  docs-build:
    name: Docs Build & Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.docs == 'true'

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare notebook docs content
        run: pnpm run prepare-content

      - name: Execute notebook tutorials
        if: needs.changes.outputs.docs_notebooks == 'true' && needs.changes.outputs.skip_docs_notebooks != 'true'
        working-directory: .
        env:
          ADDR: 127.0.0.1:9301
          DEV_MODE: "true"
          OTEL_SDK_DISABLED: "true"
          EVERRUNS_API_URL: http://127.0.0.1:9301/api
          EVERRUNS_API_KEY: dev
          EVERRUNS_NOTEBOOK_SKIP_PIP: "1"
          EVERRUNS_NOTEBOOK_USE_LLMSIM: "1"
        run: |
          set -euo pipefail
          cargo build -p everruns-server
          ./target/debug/everruns-server > /tmp/everruns-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9301/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:9301/health > /dev/null || {
            cat /tmp/everruns-server.log
            exit 1
          }

          python3 -m venv /tmp/docs-notebooks-venv
          . /tmp/docs-notebooks-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install nbclient nbformat ipykernel everruns-sdk requests
          cd apps/docs
          python scripts/execute-notebooks.py

      - name: Astro check
        run: pnpm run check

      - name: Build docs
        run: pnpm run build

  # Docker builds — server and worker share builder-all stage, so build on
  # one runner to compile shared dependencies once instead of 2x.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.docker == 'true' && needs.changes.outputs.skip_docker != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.unified
          target: server
          push: false
          tags: everruns-server:ci
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

      - name: Build worker Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.unified
          target: worker
          push: false
          tags: everruns-worker:ci
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

  ci-opt-out-policy:
    name: CI Opt-Out Policy
    runs-on: ubuntu-latest
    if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'pull_request'
    needs: changes
    steps:
      - name: Require affected CI before merge
        run: |
          set -euo pipefail

          blocked=0

          require_if_affected() {
            local label="$1"
            local label_present="$2"
            local affected="$3"
            local check_name="$4"

            if [ "$label_present" = "true" ] && [ "$affected" = "true" ]; then
              echo "::error title=Affected CI skipped::$label suppresses affected CI: $check_name"
              blocked=1
            fi
          }

          if [ "${{ needs.changes.outputs.rust }}" = "true" ] || [ "${{ needs.changes.outputs.sdk_compat }}" = "true" ]; then
            slow_rust_affected=true
          else
            slow_rust_affected=false
          fi

          if [ "${{ needs.changes.outputs.brave_search_integration }}" = "true" ] || \
             [ "${{ needs.changes.outputs.duckduckgo_integration }}" = "true" ] || \
             [ "${{ needs.changes.outputs.parallel_integration }}" = "true" ]; then
            standalone_integration_affected=true
          else
            standalone_integration_affected=false
          fi

          require_if_affected "ci:skip-slow-rust" "${{ needs.changes.outputs.skip_slow_rust }}" "$slow_rust_affected" "slow Rust, release-binary-dependent, OpenAPI, and SDK checks"
          require_if_affected "ci:skip-postgres-integration" "${{ needs.changes.outputs.skip_postgres_integration }}" "${{ needs.changes.outputs.postgres_integration }}" "PostgreSQL integration tests"
          require_if_affected "ci:skip-sdk-compat" "${{ needs.changes.outputs.skip_sdk_compat }}" "${{ needs.changes.outputs.sdk_compat }}" "SDK compatibility checks"
          require_if_affected "ci:skip-ui-e2e" "${{ needs.changes.outputs.skip_ui_e2e }}" "${{ needs.changes.outputs.ui }}" "UI Playwright smoke"
          require_if_affected "ci:skip-docs-notebooks" "${{ needs.changes.outputs.skip_docs_notebooks }}" "${{ needs.changes.outputs.docs_notebooks }}" "docs notebook execution"
          require_if_affected "ci:skip-docker" "${{ needs.changes.outputs.skip_docker }}" "${{ needs.changes.outputs.docker }}" "Docker image build validation"
          require_if_affected "ci:skip-integration-workflows" "${{ needs.changes.outputs.skip_integration_workflows }}" "$standalone_integration_affected" "standalone Brave Search, DuckDuckGo, or Parallel MCP integration workflows"

          if [ "$blocked" -ne 0 ]; then
            cat <<'MSG'
          Opt-outs are allowed for interim pushes to save CI time, but before
          merge they must not suppress CI checks affected by this PR. Remove the
          relevant ci:skip-* label(s) and rerun CI on the final PR commit.
          MSG
            exit "$blocked"
          fi

          echo "No CI opt-out labels suppress affected checks."

  # Aggregation gate for branch protection.
  ci-success:
    name: Build Check
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - format
      - lockfile
      - msrv
      - clippy
      - unit-test
      - worker-test
      - shell-test
      - integration-test
      - build-binaries
      - workflow-test
      - cli-e2e-test
      - openapi-check
      - sdk-compat-matrix
      - sdk-compat-test
      - ui-build
      - ui-e2e
      - docs-build
      - docker-build
      - ci-opt-out-policy
      - browserless-live-test
      - daytona-live-test
      - e2b-live-test
      - deno-live-test
    steps:
      - name: Verify all jobs passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed (or were skipped due to path filtering)"
