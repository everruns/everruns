name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]

# Cancel in-progress runs for the same PR/branch on new pushes.
# On main, let every run finish so merged commits aren't silently skipped.
#
# Label events get their own group. They resolve `run_ci=false` for anything
# outside the ci:skip-* set, so all their jobs skip; sharing a group with the
# real run let that no-op cancel it and survive as the run of record. Dependabot
# applies its labels in the same second it opens the PR, so this was not a rare
# race — every Dependabot PR was green having run no CI at all (EVE-939).
# Separated, label runs can only ever cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && 'label' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Incremental compilation only helps when recompiling edited source on a
  # persistent machine. CI runners are ephemeral (fresh checkout per job), so
  # incremental artifacts are never reused — they just bloat the rust-cache
  # save/restore. Dependency caching (Swatinem/rust-cache) is unaffected.
  CARGO_INCREMENTAL: 0
  # Local dev/test profiles omit debug metadata for faster worktree iteration.
  # CI keeps source locations in failure backtraces without paying for full DWARF.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope: PR code
  # would inherit it and could exfiltrate the whole Doppler vault via
  # build.rs, proc-macros, or tests. Inject it per step under a push-only
  # gate (see Slack + live-test jobs below).

jobs:
  # Detect which parts of the codebase changed to skip irrelevant jobs
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.ci_event.outputs.run_ci }}
      rust: ${{ steps.core_filter.outputs.rust }}
      daytona: ${{ steps.live_filter.outputs.daytona }}
      cursor: ${{ steps.live_filter.outputs.cursor }}
      browserless: ${{ steps.live_filter.outputs.browserless }}
      e2b: ${{ steps.live_filter.outputs.e2b }}
      sdk_compat: ${{ steps.core_filter.outputs.sdk_compat }}
      shell: ${{ steps.core_filter.outputs.shell }}
      knowledge: ${{ steps.core_filter.outputs.knowledge }}
      ui: ${{ steps.core_filter.outputs.ui }}
      docs: ${{ steps.core_filter.outputs.docs }}
      docs_notebooks: ${{ steps.core_filter.outputs.docs_notebooks }}
      docker: ${{ steps.core_filter.outputs.docker }}
      postgres_integration: ${{ steps.core_filter.outputs.postgres_integration }}
      provider_live: ${{ steps.core_filter.outputs.provider_live }}
      object_storage: ${{ steps.core_filter.outputs.object_storage }}
      brave_search_integration: ${{ steps.core_filter.outputs.brave_search_integration }}
      duckduckgo_integration: ${{ steps.core_filter.outputs.duckduckgo_integration }}
      parallel_integration: ${{ steps.core_filter.outputs.parallel_integration }}
      ard: ${{ steps.core_filter.outputs.ard }}
      skip_slow_rust: ${{ steps.ci_opt_outs.outputs.skip_slow_rust }}
      skip_postgres_integration: ${{ steps.ci_opt_outs.outputs.skip_postgres_integration }}
      skip_sdk_compat: ${{ steps.ci_opt_outs.outputs.skip_sdk_compat }}
      skip_ui_e2e: ${{ steps.ci_opt_outs.outputs.skip_ui_e2e }}
      skip_docs_notebooks: ${{ steps.ci_opt_outs.outputs.skip_docs_notebooks }}
      skip_docker: ${{ steps.ci_opt_outs.outputs.skip_docker }}
      skip_integration_workflows: ${{ steps.ci_opt_outs.outputs.skip_integration_workflows }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check release workflow security
        run: bash scripts/test-release-workflow-security.sh

      - name: Resolve CI event gate
        id: ci_event
        env:
          EVENT_ACTION: ${{ github.event.action }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && \
             { [ "${EVENT_ACTION}" = "labeled" ] || [ "${EVENT_ACTION}" = "unlabeled" ]; }; then
            case "${LABEL_NAME}" in
              ci:skip-docker|ci:skip-slow-rust|ci:skip-postgres-integration|ci:skip-sdk-compat|ci:skip-ui-e2e|ci:skip-docs-notebooks|ci:skip-integration-workflows)
                echo "run_ci=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "run_ci=false" >> "$GITHUB_OUTPUT"
                ;;
            esac
          else
            echo "run_ci=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CI opt-out labels
        id: ci_opt_outs
        env:
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          has_label() {
            [[ "$LABELS_JSON" == *"\"$1\""* ]]
          }

          set_output() {
            local name="$1"
            local label="$2"
            if has_label "$label"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          set_output skip_slow_rust "ci:skip-slow-rust"
          set_output skip_postgres_integration "ci:skip-postgres-integration"
          set_output skip_sdk_compat "ci:skip-sdk-compat"
          set_output skip_ui_e2e "ci:skip-ui-e2e"
          set_output skip_docs_notebooks "ci:skip-docs-notebooks"
          set_output skip_docker "ci:skip-docker"
          set_output skip_integration_workflows "ci:skip-integration-workflows"

      - uses: dorny/paths-filter@v4
        id: core_filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'integrations/**'
              # Public application examples are workspace members and must
              # compile/test whenever their own code changes.
              - 'examples/coding-cli/**'
              - 'scripts/cli-e2e-test.sh'
              - 'scripts/lib/check-everruns-examples.sh'
              # The lockfile job runs the publish-cone gate; re-run it when the
              # gate or the pin-sync script it pairs with changes.
              - 'scripts/check-publish-cone.py'
              - 'scripts/sync-publish-pin-versions.py'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              # The prebuilt runtime image is assembled by the docker-build job
              # (gated on `rust`); list it here so editing it alone still runs
              # build-binaries + docker-build and validates the assembly.
              - 'docker/Dockerfile.prebuilt'
            sdk_compat:
              - 'crates/**'
              - '.github/scripts/sdk-compat/**'
              - '.github/workflows/ci.yml'
            # Repo-owned shell tests cover scripts/test-*.sh plus the shell
            # libraries/assets they exercise. Workflow-specific harnesses under
            # .github/scripts stay owned by their dedicated jobs.
            shell:
              - 'scripts/run-shell-tests.sh'
              - 'scripts/test-*.sh'
              - 'tests/fixtures/external-consumer/**'
              - 'scripts/check_okf.py'
              - 'scripts/lib/**'
              - 'scripts/sync-publish-pin-versions.py'
              # scripts/test-publish-crates-order.sh reads the publish workflow
              # and the workspace member manifests it publishes.
              - '.github/workflows/publish-crates.yml'
              # scripts/test-ci-job-timeouts.sh reads this workflow, so a PR that
              # drops a timeout-minutes must run the guard even when it touches
              # nothing under scripts/.
              - '.github/workflows/ci.yml'
              # scripts/test-cloud-env-tooling.sh reads the cloud bootstrap, so
              # a PR that unpins a tool there must run the guard even when it
              # touches no scripts/test-*.sh.
              - 'scripts/init-cloud-env.sh'
              - 'Cargo.toml'
              - 'crates/*/Cargo.toml'
              - 'integrations/*/Cargo.toml'
              - 'crates/*/README.md'
              - 'crates/*/src/lib.rs'
              - 'integrations/*/README.md'
              - 'integrations/*/src/lib.rs'
              - 'docs/**'
              # scripts/test-no-everruns-runtime.sh scans these trees too.
              - 'knowledge/**'
              - 'skills/**'
              - 'plugins/everruns-dev/**'
              - '.agents/plugins/**'
              - '.claude-plugin/**'
              - 'local/Caddyfile'
              - 'examples/docker-compose-full.yaml'
              - 'justfile'
              - '.github/workflows/ci.yml'
            knowledge:
              - 'knowledge/**'
              - 'scripts/check_okf.py'
              - 'scripts/test-knowledge-okf.sh'
              - 'justfile'
              - '.github/workflows/ci.yml'
            ui:
              - 'apps/ui/**'
              # api-types:check regenerates apps/ui/src/lib/api/generated from
              # this spec, so a spec-only change can leave the committed types
              # stale. Without it here the UI job is skipped and the drift only
              # surfaces on the next unrelated UI pull request.
              - 'docs/api/openapi.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'apps/docs/**'
              - 'docs/**'
              - '.github/workflows/ci.yml'
            docs_notebooks:
              - 'apps/docs/scripts/execute-notebooks.py'
              - 'apps/docs/scripts/render-notebooks.mjs'
              - 'docs/tutorials/**'
            docker:
              - 'docker/**'
              - '.dockerignore'
              - 'crates/**'
              - 'integrations/**'
              - 'examples/**'
              - 'docs/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/docker-publish.yml'
            # PostgreSQL integration tests cover the server persistence/API
            # surface and the durable engine stores. Keep this narrower than the
            # general Rust filter so unrelated crates do not start PostgreSQL.
            #
            # `crates/provider` and `crates/drivers` stay listed because the
            # server suites execute provider code paths, not because the live
            # matrix lives here — it no longer does (EVE-938). The gate that
            # decides whether provider wire protocols get live-tested is
            # `provider_live` below.
            postgres_integration:
              - 'crates/server/**'
              - 'crates/durable/**'
              - 'crates/core/**'
              - 'crates/config/**'
              - 'crates/session-sqldb/**'
              - 'crates/provider/**'
              - 'crates/drivers/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            # Gate for the live provider matrix (`live-provider-matrix` job).
            # Shaped around the crates that own provider wire behaviour, which
            # is what that matrix exists to validate.
            #
            # The provider entries are directory-wide on purpose. The gate used
            # to enumerate openai/anthropic/gemini, so every driver added later
            # fell outside it and `crates/provider` — which owns the wire
            # protocols themselves — was never listed at all. PR #3280 fixed an
            # openresponses_protocol.rs regression and the live matrix was
            # skipped on that very PR (EVE-936).
            # scripts/test-ci-provider-live-filter.sh pins the invariant.
            provider_live:
              - 'crates/provider/**'
              - 'crates/drivers/**'
              - 'crates/llm-tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            # S3 blob-backend integration coverage. Narrow on purpose so the
            # SeaweedFS-backed job only runs when the object-storage offload code,
            # its sidecar migration, or the harness/workflow that drives it
            # changes — it should not burn CI on unrelated PRs.
            object_storage:
              - 'crates/server/src/storage/blob_store.rs'
              - 'crates/server/src/storage/repositories/session_files.rs'
              - 'crates/server/src/storage/repositories/skills.rs'
              - 'crates/server/src/storage/backend.rs'
              - 'crates/server/src/storage/repositories/mod.rs'
              - 'crates/server/migrations/**'
              - 'crates/server/tests/blob_offload_integration_test.rs'
              - 'crates/server/tests/test_harness.rs'
              - 'crates/config/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            brave_search_integration:
              - 'integrations/brave-search/**'
            duckduckgo_integration:
              - 'integrations/duckduckgo/**'
            parallel_integration:
              - 'integrations/parallel/**'
            ard:
              - 'crates/ard/**'

      # Exclusion filters need `predicate-quantifier: every`; with the default
      # `some`, a rule like `!integrations/foo/**/*.md` matches almost every
      # non-markdown file and incorrectly enables the live paid matrix.
      - uses: dorny/paths-filter@v4
        id: live_filter
        with:
          predicate-quantifier: every
          filters: |
            # Live API jobs (daytona/browserless/e2b) hit real external
            # services and cost real API budget. Exclude doc-only changes so
            # SPEC.md tweaks don't trigger the full paid matrix on every push
            # to main. The weekly `integration-live-sweep.yml` backstop still
            # catches shared-crate regressions that slip past these filters.
            daytona:
              - 'integrations/daytona/**'
              - '!integrations/daytona/**/*.md'
            cursor:
              - 'integrations/cursor/**'
              - '!integrations/cursor/**/*.md'
            browserless:
              - 'integrations/browserless/**'
              - '!integrations/browserless/**/*.md'
            e2b:
              - 'integrations/e2b/**'
              - '!integrations/e2b/**/*.md'

  format:
    name: Format Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  lockfile:
    name: Lockfile Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Check publish-pin versions match workspace
        run: python3 scripts/sync-publish-pin-versions.py --check

      # Deterministic guard: a breaking bump of a foundational crate must
      # cascade to every published dependant in the same change, or the facade
      # publish strands on two incompatible copies of that crate (the failure
      # that blocked the everruns 0.19.0 facade in the v0.22.0 release).
      - name: Self-test the publish-cone gate
        run: python3 scripts/check-publish-cone.py --self-test

      - name: Check publish cone has no unhealed strands
        run: python3 scripts/check-publish-cone.py --pre-merge

  msrv:
    name: Published Crate MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust MSRV toolchain
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "msrv"

      - name: Check published crates against MSRV
        run: |
          cargo check --locked --all-features \
            -p everruns-builtins \
            -p everruns-core \
            -p everruns-openai \
            -p everruns-anthropic \
            -p everruns-turbopuffer \
            -p everruns-integrations-duckduckgo \
            -p everruns-integrations-github \
            -p everruns-integrations-daytona \
            -p everruns-integrations-e2b \
            -p everruns-integrations-parallel \
            -p everruns

  knowledge:
    name: Knowledge Bundle (OKF v0.2)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.knowledge == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install okf-lint
        run: cargo install okf-lint --version 0.1.1 --locked

      - name: Check knowledge bundle
        run: |
          python3 scripts/check_okf.py knowledge
          okf-lint knowledge --max-line-length 10000

  # Architecture guard (EVE-873): capability identity/config/definition types
  # live in crates/capability only; core/host/platform must consume the
  # neutral contract instead of growing a competing one.
  capability-contract:
    name: Capability Contract Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check capability contract ownership
        run: bash scripts/lib/check-capability-contract.sh

  # Architecture guard (EVE-875): production simulation lives in
  # everruns-llmsim, while testing/demo helpers live in test-support. Core and
  # provider-only trees stay clean, and product graphs never link test-support.
  test-support-isolation:
    name: Test-Support Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check test-support isolation
        run: bash scripts/lib/check-test-support-isolation.sh

  # Architecture guard: telemetry init and exporter implementations live
  # behind everruns-host/observability. Core carries only neutral observability
  # contracts, and Framework/provider trees ship no OTLP/exporter subtree.
  observability-isolation:
    name: Observability Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check observability isolation
        run: bash scripts/lib/check-observability-isolation.sh

  # Architecture guard (EVE-883): filesystem, shell, web, Lua, concrete HTTP,
  # and MCP adapters live in focused integration crates. Core remains the
  # neutral contract/kernel boundary and the default Framework avoids those
  # opt-in execution stacks.
  environment-capability-isolation:
    name: Environment Capability Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check environment capability isolation
        run: bash scripts/lib/check-environment-capability-isolation.sh

  # Architecture guard (EVE-884): portable policy implementations live in
  # everruns-builtins, core retains only neutral contracts, and minimal
  # Framework consumers can exclude the optional bundle.
  portable-builtins-isolation:
    name: Portable Built-ins Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check portable built-ins isolation
        run: bash scripts/lib/check-portable-builtins-isolation.sh

  # Architecture guard (EVE-877, EVE-881): stored Agent/AgentVersion and
  # Harness persistence records plus the built-in harness provisioning
  # templates live in crates/platform. Kernel crates (core, engine, provider,
  # capability) consume only the portable AgentDefinition/HarnessDefinition and
  # the resolved execution snapshot, and carry no everruns-platform edge.
  agent-record-isolation:
    name: Agent-Record Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check agent-record isolation
        run: bash scripts/lib/check-agent-record-isolation.sh

  # Architecture guard (EVE-874): official wire-protocol provider crates build
  # on the provider SPI (everruns-provider) alone — no direct core, host,
  # platform, or server dependency on any edge kind, and no heavy core
  # feature subtree in provider-only builds.
  provider-isolation:
    name: Provider Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check provider isolation
        run: bash scripts/lib/check-provider-isolation.sh

  # Architecture guard (EVE-903): core defaults are empty and its shipped
  # dependency tree excludes concrete TLS, HTTP, process, database,
  # interpreter, exporter, OpenAPI, and structural-parser implementations.
  core-kernel-dependencies:
    name: Core Kernel Dependency Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check core kernel dependencies
        run: bash scripts/lib/check-core-kernel-dependencies.sh

  # Public API/semver guard (EVE-906): rustdoc JSON records the complete
  # published core surface while source and documentation ratchets reject
  # compatibility owners, credential-bearing models, and new undocumented API.
  core-public-api:
    name: Core Public API Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - name: Install pinned rustdoc JSON toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-07-25

      - name: Check core public API
        env:
          CORE_API_TOOLCHAIN: nightly-2026-07-25
        run: bash scripts/lib/check-core-public-api.sh

  # Architecture guard (EVE-885): hosted knowledge, delegation, task, hook,
  # and management capability implementations live in crates/platform. Core
  # carries portable implementations and neutral contracts only.
  hosted-capability-isolation:
    name: Hosted Capability Isolation Guard
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Check hosted capability isolation
        run: bash scripts/lib/check-hosted-capability-isolation.sh

  migration-immutability:
    name: Migration Immutability
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check existing migrations are immutable
        run: bash scripts/lib/check-migration-immutability.sh

  # Guards against the silent-skip bug class: CI enumerates server integration
  # tests by name, so a new crates/server/tests/*.rs file is never run until
  # someone adds a `--test` line. This check fails if any server test file is
  # neither wired into a CI job nor explicitly allowlisted (EVE-664).
  test-enumeration:
    name: Test Enumeration
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Check every crate test file is run by a workflow or allowlisted
        run: bash scripts/lib/check-test-enumeration.sh

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct from the test jobs: clippy compiles --all-targets
          # --all-features, a different feature set than the default-feature
          # test builds. rust-cache keys ignore feature flags, so sharing one
          # key would make the two profiles thrash each other's target/ cache.
          shared-key: "clippy"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # Fast unit tests - no external dependencies (PostgreSQL, LLM APIs)
  # Runs in ~30s, provides quick feedback on logic errors
  unit-test:
    name: Unit Tests (Pure)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # This job builds the most of any single CI job: provider crates, the full
      # runtime, the CLI, and all integration crates share one target/ dir. Their
      # rlibs plus the linker's temporary output exhausted the runner's disk mid-
      # link (`ld terminated with signal 7 [Bus error]`, 36 MB free). Reclaim the
      # ~25 GB of preinstalled tooling this job never uses before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules
          df -h /

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run pure unit tests
        run: |
          # Provider crates: --lib only. Their integration tests are live (network)
          # and run in dedicated credentialed jobs, so the default suite stays --lib.
          cargo test -p everruns-anthropic -p everruns-openai -p everruns-gemini -p everruns-internal-protocol --lib --all-features
          # Core and the local embedder: run the WHOLE suite (lib + integration +
          # doctests), not just --lib, so integration tests aren't silently skipped.
          # Both are pure (llmsim-based, no credentials or network).
          cargo test -p everruns-core -p everruns --all-features
          # Production-safe deterministic simulator plus its optional host
          # extension. Pure llmsim; no credentials or network.
          cargo test -p everruns-llmsim --all-features
          # The provider SPI and the crates below reach CI here for the first
          # time: none of them had ever appeared in a `cargo test -p` line in
          # any workflow, so their tests/ files had never run. everruns-provider
          # was the costly one — its wire tests are wiremock-based (no network,
          # no credentials) and one of them was failing against committed code
          # while CI stayed green, because nothing executed it. Run the whole
          # suite, not --lib: the point is the integration tests.
          cargo test -p everruns-provider --all-features
          cargo test -p everruns-engine -p everruns-builtins --all-features
          cargo test -p everruns-integrations-docker --all-features
          # everruns-platform is in CI, but by named target: these four files
          # were never added to the list and so never ran. capability_boundary
          # is deliberately absent — it fails against current code and is parked
          # in the enumeration allowlist rather than wired in red.
          cargo test -p everruns-platform --test background_execution_test \
            --test citation_pipeline_test --test prompt_budget --test subagent_test
          # Test-support (EVE-875): in-memory loop, test doubles, fixture
          # capabilities, and llmsim-driven suites that moved out of core.
          cargo test -p everruns-test-support --all-features
          # mcp: whole crate (lib + http_transport + stdio_transport + doctests).
          # Was not tested in CI at all. --all-features enables the `stdio` transport
          # (off in hosted builds) so its transport test runs here. All in-process,
          # no network/credentials.
          cargo test -p everruns-mcp --all-features
          # ard: platform discovery capability (sibling of mcp/a2a). No --all-features
          # here — it enables `ard-live-tests`, which fails closed without a live
          # registry. Live coverage runs in the dedicated ard.yml workflow.
          cargo test -p everruns-ard
          # Do not pass --all-features here: it would enable `turbopuffer-live-tests`,
          # which fails closed without TURBOPUFFER_API_KEY. Live tests run separately.
          cargo test -p everruns-turbopuffer --lib
          # Run the whole host crate (lib unit tests incl. RealDiskFileStore /
          # in-memory store, ALL integration tests incl. the EVE-660 mount-resolver
          # conformance, and doctests). No per-test enumeration: new test files are
          # picked up automatically rather than silently skipped. Enable `lua` for
          # code-mode coverage and `bashkit` for the moved user-hook dispatcher;
          # the feature-specific MCP target runs immediately afterward.
          cargo test -p everruns-host --features lua,bashkit -- --test-threads=1
          cargo test -p everruns-host --features mcp --test mcp_runtime_test -- --test-threads=1
          # everruns facade (EVE-830): whole crate across every optional facade
          # feature, including local history/resume acceptance paths, plus a
          # bare-facade compile so public configuration cannot accidentally
          # acquire a feature-only dependency. Pure llmsim; no credentials.
          cargo test -p everruns --all-features
          cargo check -p everruns --no-default-features
          # Dynamically inventories every crates/everruns/examples/*.rs target,
          # rejects internal-crate imports, and compiles the complete set offline.
          bash scripts/lib/check-everruns-examples.sh
          cargo run -p everruns-host --features lua --example lua_code_mode_agent
          # Runnable demonstration of the EVE-660 mount resolver (/workspace mount + cwd).
          cargo run -p everruns-host --example mount_fs_workspace
          cargo test -p everruns-cli --test auth_integration_test --test chat_integration_test --test files_integration_test -- --test-threads=1
          # Do not pass --all-features to integration crates: it enables their *-live-tests
          # features, which fail closed without real credentials. Live tests run in their
          # own dedicated jobs (e.g. `daytona-live-test`) that provide Doppler secrets.
          cargo test -p everruns-integrations-daytona
          cargo test -p everruns-integrations-deno
          cargo test -p everruns-integrations-browserless
          cargo test -p everruns-integrations-cursor
          cargo test -p everruns-integrations-e2b
          cargo test -p everruns-integrations-github
          cargo test -p everruns-integrations-sprites

  # Durable-worker PR coverage. Catches regressions in the worker crate's
  # durable execution paths (act/reason/input task handling, DLQ emission,
  # session.idled, org_id roundtripping, task error mapping) before merge.
  # Serialized because a handful of tests mutate process-wide env vars.
  worker-test:
    name: Worker Tests (Durable Execution)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run worker tests
        # Whole crate (lib + integration), not just --lib: the network_reliability
        # integration test is pure (no network/credentials) and was being skipped.
        run: cargo test -p everruns-worker --all-features -- --test-threads=1

  shell-test:
    name: Shell Tests (Repo Scripts)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.shell == 'true'
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Install shell test dependencies
        # Step-level ceiling so a stalled package mirror names the install in the
        # failure instead of burning the whole job budget silently (EVE-921).
        # 12m against an observed max of 2.45m across 400 runs: the step also pulls
        # Caddy from GitHub releases, so leave room for a slow-but-working mirror.
        timeout-minutes: 12
        run: |
          # `apt-get update` exits non-zero when *any* configured repo fails, and
          # the runner image ships third-party lists we never install from
          # (packages.microsoft.com has 403'd and reddened main). Tolerate a
          # partial refresh; `apt-get install` still fails loudly if a package is
          # genuinely unavailable.
          sudo apt-get update || true
          sudo apt-get install -y lsof netcat-openbsd ripgrep

          CADDY_VERSION="2.9.1"
          CADDY_TARBALL=""
          CADDY_CHECKSUMS="caddy_${CADDY_VERSION}_checksums.txt"
          CADDY_BASE_URL="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          case "$(uname -m)" in
            x86_64) CADDY_ARCH="amd64" ;;
            aarch64) CADDY_ARCH="arm64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac

          CADDY_TARBALL="caddy_${CADDY_VERSION}_linux_${CADDY_ARCH}.tar.gz"
          curl -fsSL "${CADDY_BASE_URL}/${CADDY_TARBALL}" -o "/tmp/${CADDY_TARBALL}"
          curl -fsSL "${CADDY_BASE_URL}/${CADDY_CHECKSUMS}" -o "/tmp/${CADDY_CHECKSUMS}"
          grep "  ${CADDY_TARBALL}$" "/tmp/${CADDY_CHECKSUMS}" > /tmp/caddy.sha512
          (cd /tmp && sha512sum -c caddy.sha512)
          tar -xzf "/tmp/${CADDY_TARBALL}" -C /tmp caddy
          sudo install -m 0755 /tmp/caddy /usr/local/bin/caddy

      - name: Run repo shell tests
        run: ./scripts/run-shell-tests.sh

  # Live Daytona API tests — only when integrations/daytona/** changes and secret exists
  daytona-live-test:
    name: Daytona Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.daytona == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run Daytona live integration tests
        run: doppler run -- cargo test -p everruns-integrations-daytona --features daytona-live-tests --test live_api_test -- --test-threads=1

  # Live Browserless API tests — only when integrations/browserless/** changes
  browserless-live-test:
    name: Browserless Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.browserless == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run Browserless live integration tests
        run: doppler run -- cargo test -p everruns-integrations-browserless --features browserless-live-tests --test live_api -- --test-threads=1

  # Live E2B API tests — only when integrations/e2b/** changes
  e2b-live-test:
    name: E2B Live API Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.e2b == 'true' && github.event_name == 'push'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run E2B live integration tests
        run: doppler run -- cargo test -p everruns-integrations-e2b --features e2b-live-tests --test live_api_test -- --test-threads=1

  # The `deno-live-test` job is quarantined: the Deno organization's plan no
  # longer includes sandboxes, so `create_sandbox` returns 400
  # VERIFICATION_REQUIRED_FOR_SANDBOXES and the fail-closed live tests can never
  # pass. Per the fail-closed contract we remove the job rather than let it
  # silently skip/pass. The mock-backed unit tests still run above via
  # `cargo test -p everruns-integrations-deno`, so the client stays covered.
  # Restoring it means re-adding this job, its `deno` path filter and `changes`
  # output, its entry in the `build-check` needs list, and the matrix entry in
  # integration-live-sweep.yml. See EVE-946.

  # Integration tests requiring PostgreSQL
  # Tests API endpoints, repositories, and durable execution against real database
  integration-test:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.postgres_integration == 'true' && needs.changes.outputs.skip_slow_rust != 'true' && needs.changes.outputs.skip_postgres_integration != 'true'
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      # DOPPLER_TOKEN is not exposed at job scope: this job runs PR-controlled
      # cargo test (and therefore arbitrary build.rs / proc-macro / test code)
      # which would otherwise be able to read it from process env. The one step
      # that needs it (Slack integration tests) is gated to push events and
      # injects DOPPLER_TOKEN via step env below.

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Cache cargo binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-bins-sqlx-0.9

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            if [ ! -f ~/.cargo/bin/cargo-binstall ]; then
              cargo install cargo-binstall --locked
            fi
            cargo binstall sqlx-cli --no-confirm --version '~0.9'
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Run server unit tests (require DB for storage layer)
        run: cargo test -p everruns-server --lib

      - name: Run server integration tests (API + repository)
        run: cargo test -p everruns-server --test api_integration_test --test repository_integration_test --test repository_conformance_test -- --test-threads=1

      # Blob-offload suite against the in-memory object_store backend (no S3
      # container). Exercises the same offload code paths the S3 job covers,
      # giving every PostgreSQL PR coverage of the offload invariants without an
      # S3/SeaweedFS container (the PostgreSQL service container is still used).
      # The dedicated `s3-integration-test` job re-runs the
      # identical suite with STORAGE_BLOB_BACKEND=s3 against SeaweedFS.
      - name: Run blob offload integration tests (in-memory backend)
        run: cargo test -p everruns-server --test blob_offload_integration_test -- --test-threads=1

      # Domain-focused integration tests that previously only ran manually.
      # Kept split so CI failures surface the offending area fast; each file
      # exercises a cohesive slice (auth, org lifecycle, schedules, git sessions,
      # evals, ag_ui, client-side tools, llm defaults, org isolation).
      - name: Run domain integration tests
        run: |
          cargo test -p everruns-server \
            --test ag_ui_integration_test \
            --test agent_trigger_invocation_integration_test \
            --test app_a2a_integration_test \
            --test app_invocation_channels_integration_test \
            --test auth_integration_test \
            --test cli_auth_test \
            --test cli_auth_no_org_test \
            --test client_side_tools_test \
            --test evals_integration_test \
            --test observers_integration_test \
            --test prometheus_metrics_test \
            --test llm_model_default_test \
            --test org_creation_test \
            --test org_isolation_test \
            --test org_lifecycle_test \
            --test schedule_integration_test \
            --test session_git_integration_test \
            --test session_tab_counts_integration_test \
            -- --test-threads=1

      # Previously-unrun server integration tests, now wired in (EVE-664, EVE-668).
      # These files existed under crates/server/tests/ but were never named in any
      # CI step, so ~17 files silently never ran. These pass on a fresh migrated DB;
      # the still-failing ones are allowlisted in
      # scripts/lib/check-test-enumeration.sh with tracking issues
      # (EVE-667). The Test Enumeration job enforces that every crate test
      # file is either run here or explicitly allowlisted.
      - name: Run previously-unenumerated domain integration tests
        run: |
          cargo test -p everruns-server \
            --test app_api_integration_test \
            --test command_policy_enforcement_test \
            --test fcp_integration_test \
            --test guardrails_integration_test \
            --test mcp_endpoint_test \
            --test migration_history_test \
            --test openapi_coverage_test \
            --test openapi_descriptions_test \
            --test openapi_sdk_metadata_test \
            --test org_invitations_test \
            --test plugins_integration_test \
            --test plugins_remote_test \
            --test reporting_integration_test \
            --test session_workspace_attach_test \
            --test skills_integration_test \
            --test strict_client_tools \
            --test subagent_spawn_handles_test \
            --test workspace_files_integration_test \
            -- --test-threads=1

      - name: Run durable integration tests
        run: cargo test -p everruns-durable --test postgres_integration_test --test postgres_repository_test --features postgres-tests -- --test-threads=1

      # `agent_reliability_test` was audited for EVE-349 but still fails on a
      # clean PostgreSQL-backed run; keep it out of required CI until its
      # restart/reclaim scenarios are stabilized.
      - name: Run durable failpoint tests
        run: cargo test -p everruns-durable --test failure_injection_test --features "failpoints,postgres-tests" -- --test-threads=1

      # Slack live tests need DOPPLER_TOKEN. Restrict to push events so the
      # token is never instantiated in a fork-PR context where untrusted
      # code (build.rs, proc-macros, test bodies) would see it via env.
      - name: Install Doppler CLI
        if: github.event_name == 'push'
        uses: dopplerhq/cli-action@v4

      - name: Run Slack integration tests (real API via Doppler)
        if: github.event_name == 'push'
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run --preserve-env="DATABASE_URL" -- cargo test -p everruns-server --test slack_integration_test -- --test-threads=1

  # Live provider matrix — validates real provider wire protocols.
  #
  # Split out of `Integration Tests (PostgreSQL)` (EVE-938). `crates/llm-tests`
  # never reads DATABASE_URL, so the matrix needed provider credentials, not a
  # database; the old `--preserve-env="DATABASE_URL"` was vestigial. Living
  # inside a PostgreSQL-gated job meant its gate was shaped around server
  # persistence rather than around providers, which is how `crates/provider`
  # came to be missing from the filter deciding whether provider wire
  # protocols get live-tested at all (EVE-936). Its own job carries its own
  # provider-shaped gate, and provider-only changes no longer start PostgreSQL.
  #
  # Gated to push events so PR-controlled cargo test cannot exfiltrate the
  # Doppler vault via env (build.rs, proc-macros, test bodies) — the same
  # TM-CI-001/TM-CI-002 boundary the step carried before the split. PR coverage
  # of the LLM matrix is still mocked in `unit-test`.
  live-provider-matrix:
    name: Live Provider Matrix
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.provider_live == 'true' && github.event_name == 'push'
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Run LLM integration tests (skips providers without API keys or out of quota)
        # Provider API keys come from Doppler (the repo has no per-provider
        # GitHub secrets), matching the Slack live step. `doppler run`
        # injects ANTHROPIC_API_KEY / OPENAI_API_KEY / GEMINI_API_KEY /
        # OPENROUTER_API_KEY; the matrix runs every provider and skips only
        # those whose key is absent from the vault, or whose account is out of
        # quota/credits (a live billing condition, not a code regression — see
        # `skip_if_quota!` / `is_quota_exhausted` in
        # crates/llm-tests/tests/llm_test_matrix/mod.rs). Genuine API/contract
        # breaks still fail the step.
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        # A sampling miss fails the step once the in-test retries are exhausted:
        # a turn that never called the advertised tool proves nothing about the
        # provider's wire serialization, which is what this matrix exists to
        # check. `--nocapture` exposes the generations behind the failure.
        run: doppler run -- cargo test -p everruns-llm-tests --test agent_run_basic --test agent_run_with_thinking --test subagent_live_test --all-features -- --nocapture

  # S3 blob-backend integration tests.
  # The PostgreSQL `integration-test` job above only exercises the inline
  # (STORAGE_BLOB_BACKEND=db) storage path. This job brings up a real
  # S3-compatible object store (SeaweedFS, matching local dev) alongside
  # PostgreSQL and runs the
  # backend-agnostic offload suite with STORAGE_BLOB_BACKEND=s3 so the
  # object-storage offload code (create/read/update/CAS/move/copy/delete,
  # materialization, org-scoped image delete guard) is covered against the real
  # S3 client path — not just the in-memory object_store backend.
  s3-integration-test:
    name: Integration Tests (S3 Blob Backend)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.object_storage == 'true' && needs.changes.outputs.skip_slow_rust != 'true' && needs.changes.outputs.skip_postgres_integration != 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # SeaweedFS is started as a `docker run` step (see "Start SeaweedFS"
      # below) rather than a service container, because the upstream seaweedfs
      # image needs a `server -s3` command and GH service containers cannot
      # express a command.

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      # Drive the offload code path against the real S3 client. The endpoint is
      # plain HTTP (local container), so ALLOW_HTTP + path-style are required.
      STORAGE_BLOB_BACKEND: s3
      STORAGE_S3_BUCKET: everruns-test
      STORAGE_S3_ENDPOINT: http://localhost:9000
      STORAGE_S3_REGION: us-east-1
      STORAGE_S3_ACCESS_KEY_ID: everruns
      STORAGE_S3_SECRET_ACCESS_KEY: everruns-secret
      STORAGE_S3_ALLOW_HTTP: "true"
      STORAGE_S3_FORCE_PATH_STYLE: "true"

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Cache cargo binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-bins-sqlx-0.9

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            if [ ! -f ~/.cargo/bin/cargo-binstall ]; then
              cargo install cargo-binstall --locked
            fi
            cargo binstall sqlx-cli --no-confirm --version '~0.9'
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Start SeaweedFS and create the bucket
        run: |
          # Ephemeral S3-compatible store for this job only, matching the
          # SeaweedFS backend used in local dev (scripts/lib/seaweedfs.sh). The
          # S3 gateway runs on the container's :8333, mapped to host :9000 so
          # STORAGE_S3_ENDPOINT stays unchanged. The same identities config the
          # local script uses supplies the static credentials. `latest` is used
          # deliberately: these are throwaway test containers (no production
          # surface), and it avoids pinning to an unverifiable date-stamped tag.
          docker run -d --name seaweedfs \
            -p 9000:8333 \
            -v "${{ github.workspace }}/local/seaweedfs-s3-config.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:latest \
            server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
          echo "Waiting for SeaweedFS to accept S3 requests..."
          ready=
          for i in {1..30}; do
            # Any HTTP response (incl. 403 from the unauthenticated ListBuckets)
            # means the S3 gateway is up; curl exits 0 once the port answers.
            # Bounded per attempt so a stalled connect can't hang the job.
            if curl -s -o /dev/null --connect-timeout 5 --max-time 10 http://localhost:9000/; then
              echo "SeaweedFS is ready!"
              ready=1
              break
            fi
            echo "Attempt $i: SeaweedFS not ready yet..."
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "SeaweedFS failed to become ready"; docker logs seaweedfs || true; exit 1
          fi
          # Create the test bucket via the SeaweedFS shell (idempotent), retried
          # while the filer finishes coming up behind the S3 gateway.
          created=
          for i in {1..15}; do
            if echo 's3.bucket.create -name everruns-test' \
              | docker exec -i seaweedfs weed shell -master localhost:9333 > /dev/null 2>&1; then
              echo "Bucket ready!"
              created=1
              break
            fi
            echo "Attempt $i: bucket not created yet..."
            sleep 2
          done
          if [ -z "$created" ]; then
            echo "SeaweedFS bucket creation failed"; docker logs seaweedfs || true; exit 1
          fi

      - name: Run blob offload integration tests (S3 backend)
        run: cargo test -p everruns-server --test blob_offload_integration_test -- --test-threads=1

  # Build release binaries and upload as artifacts for E2E jobs and openapi-check
  build-binaries:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "ci-bins"

      # release-ci profile: opt-level=1, no LTO — these binaries only drive the
      # e2e/workflow/openapi CI jobs, so we trade optimization for ~2x faster
      # builds. Published binaries/images still use `release` (Dockerfile.unified).
      - name: Build CI binaries
        run: cargo build --profile release-ci -p everruns-server -p everruns-worker -p everruns-cli

      - name: Upload server binary
        uses: actions/upload-artifact@v7
        with:
          name: everruns-server
          path: target/release-ci/everruns-server
          retention-days: 1

      - name: Upload worker binary
        uses: actions/upload-artifact@v7
        with:
          name: everruns-worker
          path: target/release-ci/everruns-worker
          retention-days: 1

      - name: Upload CLI binary
        uses: actions/upload-artifact@v7
        with:
          name: everruns-cli
          path: target/release-ci/everruns
          retention-days: 1

      - name: Upload export-openapi binary
        uses: actions/upload-artifact@v7
        with:
          name: export-openapi
          path: target/release-ci/export-openapi
          retention-days: 1

  # Gated to push events: this job launches PR-built `everruns-server` and
  # `everruns-worker` binaries with ANTHROPIC/OPENAI/GEMINI keys in env, so
  # running it on fork PRs would let attacker-controlled binary code exfil
  # the keys. PR coverage of the binaries is still provided by build-binaries
  # (compile-time) and the workflow tests run on push to main.
  workflow-test:
    name: Workflow Tests (Server + Worker)
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: github.event_name == 'push' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: everruns_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      API_BASE_URL: http://localhost:9000
      WORKER_GRPC_AUTH_TOKEN: test-grpc-token-for-ci
      RATE_LIMIT_API_REQUESTS_PER_MINUTE: "0"
      # This job exercises the real durable topology: the server owns Postgres
      # state and exposes the gRPC control-plane on :9001, and a separate
      # everruns-worker binary connects to it. That path only runs when the
      # server is NOT in DEV_MODE (DEV_MODE=true forces in-memory storage and
      # disables the gRPC control-plane — see app_builder.rs), which would leave
      # the external worker unable to connect. AUTH_MODE=none still requires a
      # dev deployment grade (EVE-621), so opt in via DEPLOYMENT_GRADE=dev
      # instead of DEV_MODE, satisfying the auth gate without touching the
      # storage/gRPC wiring.
      DEPLOYMENT_GRADE: dev
      AUTH_MODE: none

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Cache cargo binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/cargo-binstall
            ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-cargo-bins-sqlx-0.9

      - name: Install sqlx-cli
        run: |
          if [ ! -f ~/.cargo/bin/sqlx ]; then
            if [ ! -f ~/.cargo/bin/cargo-binstall ]; then
              cargo install cargo-binstall --locked
            fi
            cargo binstall sqlx-cli --no-confirm --version '~0.9'
          fi

      - name: Run migrations
        run: sqlx migrate run --source crates/server/migrations

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-server
          path: ./bin

      - name: Download worker binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-worker
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      # The server, not the test process, is what needs a provider credential
      # for the org-default path: tenant execution resolves keys fail-closed
      # from the database (provider_resolver.rs), with no env fallback. The
      # bridge is seeding — under DEPLOYMENT_GRADE=dev the server copies
      # DEFAULT_<PROVIDER>_API_KEY into the seeded provider rows (encrypted) at
      # startup, so the normal DB path can resolve them (seed.rs).
      #
      # Started without those vars the seed fills nothing and every org-default
      # turn fails `provider_misconfigured`, however well-credentialed the test
      # process is. Doppler names the secrets OPENAI_API_KEY/ANTHROPIC_API_KEY,
      # so map them the way scripts/lib/services.sh does for local dev.
      #
      # Only the server needs this: the worker receives resolved credentials
      # over the gRPC control-plane and reads no DEFAULT_* var itself.
      # Fetched as two named secrets rather than `doppler run`, so only these
      # variables are added to the server's environment and `$!` stays the
      # server's own PID for the stop step.
      - name: Start API server
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          set -euo pipefail
          openai_key="$(doppler secrets get OPENAI_API_KEY --plain)"
          anthropic_key="$(doppler secrets get ANTHROPIC_API_KEY --plain)"
          if [ -z "$openai_key" ] || [ -z "$anthropic_key" ]; then
            echo "Doppler returned an empty provider key; the org-default tests cannot run." >&2
            exit 1
          fi
          DEFAULT_OPENAI_API_KEY="$openai_key" \
          DEFAULT_ANTHROPIC_API_KEY="$anthropic_key" \
            ./bin/everruns-server > server.log 2>&1 &
          echo $! > server.pid
          echo "Server PID: $(cat server.pid)"

      - name: Start Worker
        run: |
          ./bin/everruns-worker > worker.log 2>&1 &
          echo $! > worker.pid
          echo "Worker PID: $(cat worker.pid)"

      - name: Wait for server to be ready
        run: |
          echo "Waiting for server to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:9000/health > /dev/null 2>&1; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i: Server not ready yet..."
            sleep 2
          done
          echo "Server failed to start"
          cat server.log
          exit 1

      # Provider credentials come from Doppler, matching the live LLM step. This
      # job is already push-only, the same trust boundary that step relies on,
      # so a PR cannot reach the vault through it.
      #
      # EVERRUNS_REQUIRE_LIVE_TESTS makes a missing credential fail loudly.
      # The reasoning projection test verifies a real provider's reasoning
      # through the worker into the API; without a key it can only test the
      # error path, and skipping quietly would report success while verifying
      # nothing. The llmsim tests in this job are unaffected — they never read a
      # provider key.
      - name: Run workflow tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EVERRUNS_REQUIRE_LIVE_TESTS: "1"
          # Live tests skipped by a provider account block append one line here.
          # Named in --preserve-env so the value survives `doppler run` whatever
          # the vault holds.
          EVERRUNS_LIVE_SKIP_REPORT: ${{ github.workspace }}/live-provider-skips.md
        run: >-
          doppler run --preserve-env="DATABASE_URL,API_BASE_URL,AUTH_MODE,DEPLOYMENT_GRADE,WORKER_GRPC_AUTH_TOKEN,SECRETS_ENCRYPTION_KEY,RATE_LIMIT_API_REQUESTS_PER_MINUTE,EVERRUNS_REQUIRE_LIVE_TESTS,EVERRUNS_LIVE_SKIP_REPORT"
          -- cargo test -p everruns-server --test workflow_test -- --test-threads=1

      # libtest captures stdout for tests that pass, so a skipped live test is
      # invisible in a green run unless it is re-emitted here. Step summaries are
      # not readable over the Actions API, so the log is the only channel a
      # scheduled maintenance session can check — the same reason
      # security-alerts.yml tees its report instead of only writing the summary.
      #
      # `always()`: the report matters just as much when a later assertion failed.
      - name: Report skipped live tests
        if: always()
        run: |
          report="${{ github.workspace }}/live-provider-skips.md"
          if [ -s "$report" ]; then
            echo "::warning::Live provider tests were skipped — see the lines below; their assertions did not run."
            cat "$report"
            {
              echo "### Skipped live provider tests"
              cat "$report"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No live provider tests were skipped; live assertions ran."
          fi

      - name: Stop services
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
          fi
          if [ -f worker.pid ]; then
            kill $(cat worker.pid) 2>/dev/null || true
          fi

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server logs ==="
          cat server.log 2>/dev/null || echo "No server log"
          echo ""
          echo "=== Worker logs ==="
          cat worker.log 2>/dev/null || echo "No worker log"

  # Runs the PR-built `everruns-server` + CLI binaries under DEV_MODE (LlmSim),
  # so no real provider keys are needed or injected. Kept push-gated alongside
  # `workflow-test` to avoid spending the heavy binary e2e on every PR; PR
  # coverage of the CLI is provided by the CLI integration tests under
  # `unit-test`.
  cli-e2e-test:
    name: CLI E2E Tests
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: github.event_name == 'push' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 10

    env:
      DEV_MODE: "true"
      AUTH_MODE: none
      API_PREFIX: ""
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      EVERRUNS_API_KEY: "cli-e2e-test-key"
      RATE_LIMIT_API_REQUESTS_PER_MINUTE: "0"

    steps:
      - uses: actions/checkout@v7

      - name: Ensure jq is available
        # Same apt stall mode as the shell-test install, but the runner image ships
        # jq so this short-circuits before apt is reached (measured at 0.00m across
        # 400 runs). Kept well under the job's own 10m ceiling (EVE-921).
        timeout-minutes: 5
        run: |
          # jq ships with the GitHub-hosted runner image, so the apt path is only
          # a fallback. See the shell-test job for why the refresh is tolerated.
          if command -v jq >/dev/null 2>&1; then
            jq --version
            exit 0
          fi
          sudo apt-get update || true
          sudo apt-get install -y jq

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-server
          path: ./bin

      - name: Download CLI binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-cli
          path: ./bin

      - name: Make binaries executable
        run: chmod +x ./bin/*

      - name: Add bin to PATH
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Start server (DEV_MODE with in-process worker)
        run: |
          ./bin/everruns-server > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          # Wait for server to be ready
          timeout 30 bash -c 'until curl -s http://localhost:9000/health > /dev/null; do sleep 1; done'
          echo "Server is ready (DEV_MODE with in-process worker)"

      - name: Run CLI E2E tests
        run: ./scripts/cli-e2e-test.sh

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  sdk-compat-matrix:
    name: SDK Compat Matrix
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.sdk_compat == 'true' && needs.changes.outputs.skip_sdk_compat != 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Resolve SDK version matrix
        id: matrix
        run: ./.github/scripts/sdk-compat/resolve-sdk-versions.sh

  sdk-compat-test:
    name: SDK Compat (${{ matrix.language }} / ${{ matrix.cohort }} / v${{ matrix.version }})
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
      - sdk-compat-matrix
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.sdk_compat == 'true' && needs.changes.outputs.skip_sdk_compat != 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.sdk-compat-matrix.outputs.matrix) }}

    env:
      DEV_MODE: "true"
      AUTH_MODE: none
      API_PREFIX: ""
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
      EVERRUNS_API_KEY: sdk-compat-test-key
      EVERRUNS_BASE_URL: http://localhost:9000

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        if: matrix.language == 'typescript'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Rust toolchain
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-server
          path: ./bin

      - name: Make server binary executable
        run: chmod +x ./bin/everruns-server

      - name: Start server (DEV_MODE with in-process worker)
        run: |
          ./bin/everruns-server > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          timeout 30 bash -c 'until curl -s http://localhost:9000/health > /dev/null; do sleep 1; done'
          echo "Server is ready"

      - name: Run TypeScript SDK compatibility suite
        if: matrix.language == 'typescript'
        run: ./.github/scripts/sdk-compat/test-typescript.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Run Python SDK compatibility suite
        if: matrix.language == 'python'
        run: ./.github/scripts/sdk-compat/test-python.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Run Rust SDK compatibility suite
        if: matrix.language == 'rust'
        run: ./.github/scripts/sdk-compat/test-rust.sh "${{ matrix.version }}" "$EVERRUNS_BASE_URL" "$EVERRUNS_API_KEY"

      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Server Logs ==="
          cat /tmp/server.log || true

      - name: Stop server
        if: always()
        run: kill $SERVER_PID || true

  # Reuses export-openapi binary from build-binaries instead of rebuilding
  openapi-check:
    name: OpenAPI Spec Freshness
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Download export-openapi binary
        uses: actions/download-artifact@v8
        with:
          name: export-openapi
          path: ./bin

      - name: Make binary executable
        run: chmod +x ./bin/export-openapi

      - name: Generate fresh OpenAPI spec
        run: ./bin/export-openapi > /tmp/openapi-fresh.json

      - name: Compare with committed spec
        run: |
          if ! diff -q docs/api/openapi.json /tmp/openapi-fresh.json > /dev/null 2>&1; then
            echo "❌ OpenAPI spec is out of date!"
            echo ""
            echo "The committed docs/api/openapi.json differs from the generated spec."
            echo "Please run: ./scripts/export-openapi.sh"
            echo ""
            echo "Diff (first 50 lines):"
            diff docs/api/openapi.json /tmp/openapi-fresh.json | head -50
            exit 1
          fi
          echo "✅ OpenAPI spec is up to date"

  ui-build:
    name: UI Build, Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.ui == 'true'
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: apps/ui/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}-${{ hashFiles('apps/ui/src/**/*', 'apps/ui/app/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check generated API types
        run: pnpm run api-types:check

      - name: Type check
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm run build

  ui-e2e:
    name: UI Playwright Smoke
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.ui == 'true' && needs.changes.outputs.skip_ui_e2e != 'true'
    timeout-minutes: 35

    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('apps/ui/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # `--with-deps` shells out to apt for the Chromium system libraries, so
        # this step has the same stall mode as the shell-test install (EVE-921).
        # Sized off the cold-cache path, not the 0.27m median. A run of this branch
        # missed the browser cache entirely and this step took 14.0m and still
        # succeeded — more than double the 6.6m max seen across 400 mostly-warm
        # runs. 25m keeps roughly 1.8x over that cold path.
        timeout-minutes: 25
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        run: pnpm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/ui/e2e/playwright-report
          retention-days: 7

  docs-build:
    name: Docs Build & Check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.docs == 'true'
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/docs

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: apps/docs/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare notebook docs content
        run: pnpm run prepare-content

      - name: Execute notebook tutorials
        if: needs.changes.outputs.docs_notebooks == 'true' && needs.changes.outputs.skip_docs_notebooks != 'true'
        working-directory: .
        env:
          ADDR: 127.0.0.1:9301
          DEV_MODE: "true"
          OTEL_SDK_DISABLED: "true"
          EVERRUNS_API_URL: http://127.0.0.1:9301/api
          EVERRUNS_API_KEY: dev
          EVERRUNS_NOTEBOOK_SKIP_PIP: "1"
          EVERRUNS_NOTEBOOK_USE_LLMSIM: "1"
        run: |
          set -euo pipefail
          cargo build -p everruns-server
          ./target/debug/everruns-server > /tmp/everruns-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true; wait $SERVER_PID 2>/dev/null || true' EXIT

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:9301/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:9301/health > /dev/null || {
            cat /tmp/everruns-server.log
            exit 1
          }

          python3 -m venv /tmp/docs-notebooks-venv
          . /tmp/docs-notebooks-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install nbclient nbformat ipykernel everruns-sdk requests
          cd apps/docs
          python scripts/execute-notebooks.py

      - name: Astro check
        run: pnpm run check

      - name: Build docs
        run: pnpm run build

  # Docker image validation for PRs. Instead of recompiling the whole workspace
  # inside Docker (~28 min), this packages the binaries already built by
  # `build-binaries` into the runtime images via docker/Dockerfile.prebuilt —
  # validating the runtime layer (base image, COPY, ENV, CMD) in seconds.
  #
  # The full build-from-source, multi-arch images are produced at release time
  # by docker-publish.yml (which also validates the Dockerfile.unified builder
  # stage from-source on PRs that touch docker/** paths). This job therefore
  # gates on `rust` (not the broader `docker` filter) so the build-binaries
  # artifacts it consumes are guaranteed to exist.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - changes
      - build-binaries
    if: needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.rust == 'true' && needs.changes.outputs.skip_slow_rust != 'true' && needs.changes.outputs.skip_docker != 'true'
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download server binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-server
          path: ./bin

      - name: Download worker binary
        uses: actions/download-artifact@v8
        with:
          name: everruns-worker
          path: ./bin

      # No host chmod needed: Dockerfile.prebuilt uses COPY --chmod, and the
      # image is only built here (never run in CI).
      - name: Build server Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          target: server
          push: false
          tags: everruns-server:ci

      - name: Build worker Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.prebuilt
          target: worker
          push: false
          tags: everruns-worker:ci

  ci-opt-out-policy:
    name: CI Opt-Out Policy
    runs-on: ubuntu-latest
    if: needs.changes.outputs.run_ci == 'true' && github.event_name == 'pull_request'
    needs: changes
    timeout-minutes: 10
    steps:
      - name: Require affected CI before merge
        run: |
          set -euo pipefail

          blocked=0

          require_if_affected() {
            local label="$1"
            local label_present="$2"
            local affected="$3"
            local check_name="$4"

            if [ "$label_present" = "true" ] && [ "$affected" = "true" ]; then
              echo "::error title=Affected CI skipped::$label suppresses affected CI: $check_name"
              blocked=1
            fi
          }

          if [ "${{ needs.changes.outputs.rust }}" = "true" ] || [ "${{ needs.changes.outputs.sdk_compat }}" = "true" ]; then
            slow_rust_affected=true
          else
            slow_rust_affected=false
          fi

          if [ "${{ needs.changes.outputs.brave_search_integration }}" = "true" ] || \
             [ "${{ needs.changes.outputs.duckduckgo_integration }}" = "true" ] || \
             [ "${{ needs.changes.outputs.parallel_integration }}" = "true" ]; then
            standalone_integration_affected=true
          else
            standalone_integration_affected=false
          fi

          require_if_affected "ci:skip-slow-rust" "${{ needs.changes.outputs.skip_slow_rust }}" "$slow_rust_affected" "slow Rust, release-binary-dependent, OpenAPI, and SDK checks"
          require_if_affected "ci:skip-postgres-integration" "${{ needs.changes.outputs.skip_postgres_integration }}" "${{ needs.changes.outputs.postgres_integration }}" "PostgreSQL integration tests"
          require_if_affected "ci:skip-sdk-compat" "${{ needs.changes.outputs.skip_sdk_compat }}" "${{ needs.changes.outputs.sdk_compat }}" "SDK compatibility checks"
          require_if_affected "ci:skip-ui-e2e" "${{ needs.changes.outputs.skip_ui_e2e }}" "${{ needs.changes.outputs.ui }}" "UI Playwright smoke"
          require_if_affected "ci:skip-docs-notebooks" "${{ needs.changes.outputs.skip_docs_notebooks }}" "${{ needs.changes.outputs.docs_notebooks }}" "docs notebook execution"
          require_if_affected "ci:skip-docker" "${{ needs.changes.outputs.skip_docker }}" "${{ needs.changes.outputs.docker }}" "Docker image build validation"
          require_if_affected "ci:skip-integration-workflows" "${{ needs.changes.outputs.skip_integration_workflows }}" "$standalone_integration_affected" "standalone Brave Search, DuckDuckGo, or Parallel MCP integration workflows"

          if [ "$blocked" -ne 0 ]; then
            cat <<'MSG'
          Opt-outs are allowed for interim pushes to save CI time, but before
          merge they must not suppress CI checks affected by this PR. Remove the
          relevant ci:skip-* label(s) and rerun CI on the final PR commit.
          MSG
            exit "$blocked"
          fi

          echo "No CI opt-out labels suppress affected checks."

  # Aggregation gate for branch protection.
  ci-success:
    name: Build Check
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - format
      - lockfile
      - msrv
      - knowledge
      - clippy
      - unit-test
      - worker-test
      - shell-test
      - integration-test
      - s3-integration-test
      - build-binaries
      - workflow-test
      - cli-e2e-test
      - openapi-check
      - sdk-compat-matrix
      - sdk-compat-test
      - ui-build
      - ui-e2e
      - docs-build
      - docker-build
      - ci-opt-out-policy
      - browserless-live-test
      - daytona-live-test
      - e2b-live-test
    timeout-minutes: 10
    steps:
      - name: Verify all jobs passed
        run: |
          # A run gated off by the label event (run_ci=false) skips every job,
          # and an all-"skipped" result set would otherwise read as a pass. That
          # turns "nothing ran" into a green required check, which is how four
          # Dependabot PRs became mergeable with no CI behind them (EVE-939).
          # Refuse to speak for a run that executed nothing; the real run's own
          # Build Check is the one that carries the verdict.
          if [ "${{ needs.changes.outputs.run_ci }}" != "true" ]; then
            echo "run_ci=false: this run executed no jobs, so it has nothing to attest"
            exit 1
          fi

          results='${{ toJson(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed (or were skipped due to path filtering)"
