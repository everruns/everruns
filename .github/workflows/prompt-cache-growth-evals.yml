name: Prompt Cache Growth Eval Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/prompt-cache-growth/**'
      - 'evals/common/**'
      - '.github/workflows/prompt-cache-growth-evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/prompt-cache-growth/**'
      - 'evals/common/**'
      - '.github/workflows/prompt-cache-growth-evals.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  offline-evals:
    name: Prompt Cache Growth Eval Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evals/prompt-cache-growth
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: evals/prompt-cache-growth
          shared-key: prompt-cache-growth-evals
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint study
        run: cargo clippy --locked --all-targets -- -D warnings
      # No server or provider: cause attribution and scorers on recorded event shapes.
      - name: Run deterministic tests
        run: cargo test --locked
