name: CI Batch Tracking
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-batch-tracking
  cancel-in-progress: false
  queue: max
jobs:
  reconcile:
    if: github.ref == 'refs/heads/main' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event != 'pull_request' && startsWith(github.event.workflow_run.display_title, 'CI ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Never execute or download artifacts from PR code in this credentialed job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
      - uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4
      - name: Reconcile failing checks in Linear
        env:
          GH_TOKEN: ${{ github.token }}
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- python3 .github/scripts/ci/track_failures.py
