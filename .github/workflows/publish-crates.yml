name: Publish Crate

on:
  repository_dispatch:
    types: [publish-crate]
  workflow_dispatch:
    inputs:
      package:
        description: 'Cargo package to publish (for example everruns-core)'
        required: true
        type: string
      tag:
        description: 'Package release tag (for example crate/everruns-core/v0.18.1)'
        required: true
        type: string
      sha:
        description: '40-character commit SHA the tag must resolve to'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-crate-${{ github.event.client_payload.package || github.event.inputs.package || 'unknown' }}-${{ github.event.client_payload.tag || github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish ${{ github.event.client_payload.package || github.event.inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve package release
        id: release
        env:
          DISPATCH_PACKAGE: ${{ github.event.client_payload.package || github.event.inputs.package || '' }}
          DISPATCH_SHA: ${{ github.event.client_payload.sha || github.event.inputs.sha || '' }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag || github.event.inputs.tag || '' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "repository_dispatch" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::Unsupported event for crate publish: $EVENT_NAME"
            exit 1
          fi
          if [[ ! "$DISPATCH_PACKAGE" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
            echo "::error::Invalid Cargo package name: $DISPATCH_PACKAGE"
            exit 1
          fi
          if [[ ! "$DISPATCH_TAG" =~ ^crate/[a-z0-9][a-z0-9_-]*/v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?)$ ]]; then
            echo "::error::Package tag must look like crate/PACKAGE/v1.2.3: $DISPATCH_TAG"
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}"
          if [ "$DISPATCH_TAG" != "crate/$DISPATCH_PACKAGE/v$VERSION" ]; then
            echo "::error::Tag package does not match requested package: $DISPATCH_TAG"
            exit 1
          fi
          if [[ ! "$DISPATCH_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Dispatch must include the 40-character release commit SHA"
            exit 1
          fi

          {
            echo "package=$DISPATCH_PACKAGE"
            echo "tag=$DISPATCH_TAG"
            echo "version=$VERSION"
            echo "expected_sha=$DISPATCH_SHA"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Verify package tag is trusted
        id: trusted_ref
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.expected_sha }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/heads/main:refs/remotes/origin/main" \
            "refs/tags/$TAG:refs/tags/$TAG"
          TAG_SHA="$(git rev-list -n 1 "$TAG^{commit}")"
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Package tag $TAG resolves to $TAG_SHA, expected $EXPECTED_SHA"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_SHA" origin/main; then
            echo "::error::Package tag $TAG ($TAG_SHA) is not reachable from origin/main"
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted package release
        env:
          TRUSTED_SHA: ${{ steps.trusted_ref.outputs.sha }}
        run: |
          set -euo pipefail
          git -c advice.detachedHead=false checkout --detach "$TRUSTED_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Verify package version and dependency pins
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          python3 - "$PACKAGE" "$VERSION" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys
          import tomllib

          package_name, expected_version = sys.argv[1:]
          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--no-deps", "--format-version", "1"], text=True
          ))
          matches = [package for package in metadata["packages"] if package["name"] == package_name]
          if len(matches) != 1:
              raise SystemExit(f"Expected one workspace package named {package_name}, found {len(matches)}")
          package = matches[0]
          if package.get("publish") == []:
              raise SystemExit(f"Package {package_name} is not publishable")
          manifest_path = pathlib.Path(package["manifest_path"])
          with manifest_path.open("rb") as handle:
              manifest_version = tomllib.load(handle)["package"].get("version")
          if manifest_version != expected_version:
              raise SystemExit(
                  f"Tag version {expected_version} does not match {package_name} manifest version "
                  f"{manifest_version!r}"
              )
          print(f"Package version verified: {package_name} {expected_version}")
          PY
          python3 scripts/sync-publish-pin-versions.py --check

      - name: Build package artifact
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: cargo package --locked --package "$PACKAGE"

      - name: Publish package
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          status() {
            python3 - "$PACKAGE" "$VERSION" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          package, version = sys.argv[1:]
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{package}/{version}",
              headers={"User-Agent": "everruns-ci"},
          )
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("published" if response.status == 200 else "error")
          except urllib.error.HTTPError as error:
              print("missing" if error.code == 404 else "error")
          except urllib.error.URLError:
              print("error")
          PY
          }

          current="$(status)"
          if [ "$current" = "missing" ]; then
            CARGO_REGISTRY_TOKEN="${{ secrets.CARGO_REGISTRY_TOKEN }}" \
              cargo publish --locked --no-verify --package "$PACKAGE"
          elif [ "$current" != "published" ]; then
            echo "::error::Could not determine crates.io state for $PACKAGE $VERSION"
            exit 1
          fi

          visible=false
          for attempt in {1..30}; do
            if [ "$(status)" = "published" ]; then
              echo "$PACKAGE $VERSION is visible on crates.io"
              visible=true
              break
            fi
            echo "Waiting for $PACKAGE $VERSION to appear on crates.io ($attempt/30)"
            sleep 10
          done
          if [ "$visible" != true ]; then
            echo "::error::$PACKAGE $VERSION did not appear on crates.io in time"
            exit 1
          fi

          # A retry of the same trusted tag may encounter an already-published
          # version. Fail closed unless crates.io contains the artifact built
          # from this exact commit.
          python3 - "$PACKAGE" "$VERSION" <<'PY'
          import hashlib
          import pathlib
          import sys
          import urllib.request

          package, version = sys.argv[1:]
          local = pathlib.Path(f"target/package/{package}-{version}.crate")
          local_digest = hashlib.sha256(local.read_bytes()).hexdigest()
          request = urllib.request.Request(
              f"https://crates.io/api/v1/crates/{package}/{version}/download",
              headers={"User-Agent": "everruns-ci"},
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              published_digest = hashlib.sha256(response.read()).hexdigest()
          if local_digest != published_digest:
              raise SystemExit(
                  f"Published {package} {version} digest does not match the trusted local artifact"
              )
          print(f"Verified published artifact digest for {package} {version}")
          PY
