name: DuckDuckGo Integration

on:
  push:
    branches: [main]
    paths:
      - 'integrations/duckduckgo/**'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths:
      - 'integrations/duckduckgo/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  integration-test:
    name: DuckDuckGo API Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:skip-integration-workflows') && !contains(github.event.pull_request.labels.*.name, 'ci:skip-integration-workflows'))
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run integration tests
        run: cargo test -p everruns-integrations-duckduckgo --features integration
