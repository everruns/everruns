name: Container Sandbox Integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/container-sandbox-integration.yml'
      - 'crates/platform/src/container_sandbox/**'
      - 'crates/platform/tests/container_sandbox_live_api_test.rs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/container-sandbox-integration.yml'
      - 'crates/platform/src/container_sandbox/**'
      - 'crates/platform/tests/container_sandbox_live_api_test.rs'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  unit-test:
    name: Container Sandbox Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run unit tests
        run: |
          cargo test -p everruns-platform --features container-sandbox --lib container_sandbox::

  live-test:
    name: Container Sandbox Live API Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 10

    services:
      docker:
        image: docker:dind
        env:
          # Disable TLS so the daemon listens on plain HTTP :2375.
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375

    env:
      # Steer the DockerClient at the service-mapped daemon. See
      # `crates/platform/tests/container_sandbox_live_api_test.rs` for the contract.
      CONTAINER_SANDBOX_DOCKER_HOST: http://localhost:2375

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:2375/_ping >/dev/null 2>&1; then
              echo "Docker daemon is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Docker daemon did not become ready within 60s" >&2
          exit 1

      - name: Run live integration tests
        run: cargo test -p everruns-platform --features container-sandbox-live-tests --test container_sandbox_live_api_test -- --test-threads=1
