name: Browserless Integration

# Browserless bills per browser session and the account runs on a small credit
# allowance, so the paid live suite runs only when the Browserless integration
# itself changes (pushes to main touching the paths below) or on manual
# dispatch. It is deliberately NOT in `integration-live-sweep.yml` and does not
# fire on `ci.yml` edits: both used to re-run it on unrelated merges and burned
# the monthly credits. The mock-backed unit tests still run in ci.yml on every
# change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/integrations/src/browserless/**'
      - 'crates/integrations/tests/browserless_*.rs'
      - '!crates/integrations/src/browserless/**/*.md'
      - '.github/workflows/browserless-integration.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  live-test:
    name: Browserless Live API Tests
    runs-on: ubuntu-latest
    # Only main runs beside the vault token, even on manual dispatch.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doppler CLI
        id: doppler_install
        # Absorbs one transient installer failure; see
        # scripts/test-doppler-install-retry.sh for why.
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "debug"

      # BROWSERLESS_TOKEN reaches the tests through `doppler run` below. An extra $GITHUB_ENV export would add nothing but an
      # unmasked copy in every later step's env block.
      - name: Run Browserless live integration tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- cargo test -p everruns-integrations --features browserless-live-tests --test browserless_live_api -- --test-threads=1
