name: License Check

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'integrations/**'
      - 'deny.toml'
      - '.github/workflows/licenses.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'integrations/**'
      - 'deny.toml'
      - '.github/workflows/licenses.yml'

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.16"

jobs:
  check-licenses:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-registry-

      - name: Cache cargo-deny binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if [ ! -f ~/.cargo/bin/cargo-deny ]; then
            cargo install cargo-deny --locked
          fi

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories (RustSec)
        run: cargo deny check advisories
