name: License Check

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'integrations/**'
      - 'deny.toml'
      - '.github/workflows/licenses.yml'
      # Non-workspace lockfiles: separate dependency trees the root cargo-deny
      # run never resolves. Kept in sync by scripts/test-nonworkspace-advisories.sh.
      - '**/Cargo.lock'
      - 'scripts/lib/check-nonworkspace-advisories.sh'
  pull_request:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'integrations/**'
      - 'deny.toml'
      - '.github/workflows/licenses.yml'
      - '**/Cargo.lock'
      - 'scripts/lib/check-nonworkspace-advisories.sh'

permissions:
  contents: read

env:
  # Must be a full version: it pins the install, not just the cache key. cargo-deny
  # moves options between global and subcommand scope across minor releases, so an
  # unpinned "latest" can change the CLI under the advisory guards without warning.
  CARGO_DENY_VERSION: "0.20.2"

jobs:
  check-licenses:
    name: Check Dependency Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-deny-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-registry-

      - name: Cache cargo-deny binary
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: ${{ runner.os }}-cargo-deny-${{ env.CARGO_DENY_VERSION }}

      - name: Install cargo-deny
        run: |
          if [ ! -f ~/.cargo/bin/cargo-deny ]; then
            cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked
          fi
          cargo deny --version

      - name: Check licenses
        run: cargo deny check licenses

      - name: Check advisories (RustSec)
        run: cargo deny check advisories

      # The step above resolves the workspace Cargo.lock only. Excluded crates
      # keep their own lockfile, so they need their own pass (EVE-915).
      - name: Check advisories (non-workspace lockfiles)
        run: scripts/lib/check-nonworkspace-advisories.sh
