name: Sprites Integration

# Exclude doc-only changes from triggering the paid live API job. The
# weekly `integration-live-sweep.yml` backstop still covers shared-crate
# regressions that slip past the per-integration path filter.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/sprites/**'
      - '!integrations/sprites/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/sprites/**'
      - '!integrations/sprites/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope so it
  # cannot reach the PR-triggered unit-test job (which runs untrusted
  # code). It is scoped to live-test below, which only runs on push or
  # workflow_dispatch.

jobs:
  unit-test:
    name: Sprites Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run unit tests
        run: cargo test -p everruns-integrations-sprites

  live-test:
    name: Sprites Live API Tests
    runs-on: ubuntu-latest
    # Keep PRs fast, but allow manual dispatch so secret wiring can be verified
    # immediately after Doppler changes without waiting for the weekly sweep.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0


      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Export SPRITES_API_TOKEN from Doppler
        run: |
          echo "SPRITES_API_TOKEN=$(doppler secrets get SPRITES_API_TOKEN --plain)" >> "$GITHUB_ENV"

      - name: Run Sprites live integration tests
        run: doppler run -- cargo test -p everruns-integrations-sprites --features sprites-live-tests --test live_api_test -- --test-threads=1
