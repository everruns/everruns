name: Validators

# The validators (validators/agents-1m, validators/agents-75k, sharing
# validators/lib): their own tests (scoring, adapters against harness
# outputs, the backtest on saved 75k runs, the cluster simulation, the coding
# profile) and each entry point end to end at the free levels without the
# cargo fleet tests. Seconds, no build.

on:
  pull_request:
    paths:
      - 'validators/**'
      - 'scripts/agentd/**'
      - 'crates/drivers/llmsim/scenarios/**'
      - 'crates/agentd-testkit/tests/**'
      - 'crates/agentd/tests/**'
      - 'tests/models/**'
      - 'scripts/check-tla-models.sh'
      - '.github/workflows/validators.yml'
  push:
    branches: [main]
    paths:
      - 'validators/**'
      - 'scripts/agentd/**'
      - 'crates/drivers/llmsim/scenarios/**'
      - '.github/workflows/validators.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validators:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        validator: [agents-1m, agents-75k]
    defaults:
      run:
        working-directory: validators/${{ matrix.validator }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # freshness compares evidence commits with the tree
      - run: python3 -m unittest discover -s tests -t . -v
      - run: ../lib/workload/generate.py --check
      - name: End to end (free levels, quick)
        run: ./validate --quick --out "$RUNNER_TEMP/${{ matrix.validator }}" && ./validate --plan
