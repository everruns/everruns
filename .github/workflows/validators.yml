name: Validators

# The 1M agents validator (validators/agents-1m): its own tests (scoring,
# adapters against harness outputs, the backtest on saved 75k runs, the
# cluster simulation, the coding profile) and the entry point end to end at
# the free levels without the cargo fleet tests. Seconds, no build.

on:
  pull_request:
    paths:
      - 'validators/**'
      - 'scripts/agentd/**'
      - 'crates/drivers/llmsim/scenarios/**'
      - 'crates/agentd-testkit/tests/**'
      - '.github/workflows/validators.yml'
  push:
    branches: [main]
    paths:
      - 'validators/**'
      - 'scripts/agentd/**'
      - 'crates/drivers/llmsim/scenarios/**'
      - '.github/workflows/validators.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agents-1m:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: validators/agents-1m
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # freshness compares evidence commits with the tree
      - run: python3 -m unittest discover -s tests -t . -v
      - run: workload/generate.py --check
      - name: End to end (free levels, quick)
        run: ./validate --quick --out "$RUNNER_TEMP/agents-1m" && ./validate --plan
