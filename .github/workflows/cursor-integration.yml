name: Cursor Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/integrations/src/cursor/**'
      - 'crates/integrations/tests/cursor_*.rs'
      - '!crates/integrations/src/cursor/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'crates/integrations/src/cursor/**'
      - 'crates/integrations/tests/cursor_*.rs'
      - '!crates/integrations/src/cursor/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope so it
  # cannot reach the PR-triggered unit-test job (which runs untrusted
  # code). It is scoped to live-test below, which only runs on push or
  # workflow_dispatch.

jobs:
  unit-test:
    name: Cursor Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run unit tests
        run: cargo test -p everruns-integrations --features cursor

  live-test:
    name: Cursor Live API Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doppler CLI
        id: doppler_install
        # Absorbs one transient installer failure; see
        # scripts/test-doppler-install-retry.sh for why.
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "debug"

      - name: Run Cursor live integration tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- cargo test -p everruns-integrations --features cursor-live-tests --test cursor_live_api_test -- --test-threads=1
