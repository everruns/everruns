name: Cursor Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/cursor/**'
      - '!integrations/cursor/**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/cursor/**'
      - '!integrations/cursor/**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope so it
  # cannot reach the PR-triggered unit-test job (which runs untrusted
  # code). It is scoped to live-test below, which only runs on push or
  # workflow_dispatch.

jobs:
  unit-test:
    name: Cursor Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run unit tests
        run: cargo test -p everruns-integrations-cursor

  live-test:
    name: Cursor Live API Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run Cursor live integration tests
        run: doppler run -- cargo test -p everruns-integrations-cursor --features cursor-live-tests --test live_api_test -- --test-threads=1
