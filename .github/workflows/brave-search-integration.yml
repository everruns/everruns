name: Brave Search Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'crates/integrations/src/brave_search/**'
      - 'crates/integrations/tests/brave_search_*.rs'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths:
      - 'crates/integrations/src/brave_search/**'
      - 'crates/integrations/tests/brave_search_*.rs'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  # DOPPLER_TOKEN is intentionally NOT exposed at workflow scope so it
  # cannot reach the PR-triggered unit-test job (which runs untrusted
  # code). It is scoped to live-test below, which only runs on push or
  # workflow_dispatch.

jobs:
  unit-test:
    name: Brave Search Unit Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:skip-integration-workflows') && !contains(github.event.pull_request.labels.*.name, 'ci:skip-integration-workflows'))
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run unit tests
        run: cargo test -p everruns-integrations --features brave-search

  # Live tests hit the real Brave Search API and need DOPPLER_TOKEN.
  # Restricted to push/workflow_dispatch so the secret is never available
  # in a fork-PR context where untrusted code (build.rs, proc-macros,
  # tests) could exfiltrate it. The weekly `integration-live-sweep.yml`
  # backstop catches shared-crate regressions that slip past this gate.
  live-test:
    name: Brave Search Live API Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "debug"

      - name: Install Doppler CLI
        id: doppler_install
        # Absorbs one transient installer failure; see
        # scripts/test-doppler-install-retry.sh for why.
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      # `doppler run` injects BRAVE_SEARCH_API_KEY into this one command only.
      # Writing it to $GITHUB_ENV instead would print it in the env block of
      # every later step, unmasked.
      - name: Run integration tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- cargo test -p everruns-integrations --features brave-search-integration
