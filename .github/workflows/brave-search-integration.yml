name: Brave Search Integration

on:
  push:
    branches: [main]
    paths:
      - 'integrations/brave-search/**'
  pull_request:
    branches: [main]
    paths:
      - 'integrations/brave-search/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

jobs:
  integration-test:
    name: Brave Search API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "integration"

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v3

      - name: Fetch Brave Search API key from Doppler
        run: |
          echo "BRAVE_SEARCH_API_KEY=$(doppler secrets get BRAVE_SEARCH_API_KEY --plain)" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: cargo test -p everruns-integrations-brave-search --features integration
