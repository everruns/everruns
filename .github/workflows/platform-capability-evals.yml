name: Platform Capability Eval Checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals/platform-capability/**'
      - 'crates/cli-contract/commands.json'
      - '.github/workflows/platform-capability-evals.yml'
  push:
    branches: [main]
    paths:
      - 'evals/platform-capability/**'
      - 'crates/cli-contract/commands.json'
      - '.github/workflows/platform-capability-evals.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  offline-evals:
    name: Platform Capability Eval Offline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: evals/platform-capability
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evals/platform-capability
          shared-key: platform-capability-evals
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint study
        run: cargo clippy --locked --all-targets -- -D warnings
      # No provider credentials: these are the deterministic checks only. They
      # prove the dataset is well formed and that every command line a case
      # expects exists in the shared contract, not that a model scores well.
      #
      # This workflow exists because its absence had consequences: the suite's
      # own test asserted 9 samples against a 13-sample dataset, and nothing
      # ran it to notice.
      - name: Run deterministic tests and offline tool smoke
        run: cargo test --locked
