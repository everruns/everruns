# Weekly/on-demand backstop for path-filtered integration workflows.
# PRs stay fast by keeping costly/stateful live jobs off the hot path; pushes to
# main still run change-scoped live coverage; this workflow runs the full live
# matrix so shared crate, harness, and dependency regressions cannot hide behind
# per-integration path filters.
name: Integration Live Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  doppler-backed-live-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      DENO_SANDBOX_REGION: ${{ matrix.deno_sandbox_region || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Daytona Live API Tests
            command: cargo test -p everruns-integrations-daytona --features daytona-live-tests --test live_api_test -- --test-threads=1
          - name: Browserless Live API Tests
            command: cargo test -p everruns-integrations-browserless --features browserless-live-tests --test live_api -- --test-threads=1
          - name: E2B Live API Tests
            command: cargo test -p everruns-integrations-e2b --features e2b-live-tests --test live_api_test -- --test-threads=1
          - name: Deno Live API Tests
            command: cargo test -p everruns-integrations-deno --features deno-live-tests --test live_api_test -- --test-threads=1
            deno_sandbox_region: ams
          - name: Cursor Live API Tests
            command: cargo test -p everruns-integrations-cursor --features cursor-live-tests --test live_api_test -- --test-threads=1
          - name: Sprites Live API Tests
            command: cargo test -p everruns-integrations-sprites --features sprites-live-tests --test live_api_test -- --test-threads=1
            required_secret: SPRITES_API_TOKEN
          - name: Brave Search API Tests
            command: cargo test -p everruns-integrations-brave-search --features integration
          # ARD Live Registry Tests are quarantined: the public reference
          # registry (https://agenticresourcediscovery.org/api/v1) was
          # decommissioned (now docs-only; 405/404 on the API, registry/api
          # subdomains no longer resolve), so the fail-closed live tests can
          # never pass. Per the fail-closed contract we remove the job rather
          # than let it silently skip/pass. The wiremock-backed unit +
          # integration tests (`cargo test -p everruns-ard`) still
          # cover the ARD client. Re-add this entry (or repoint
          # ARD_LIVE_REGISTRY_URL) once a reachable reference registry exists.
          # See EVE-659.

    steps:
      - uses: actions/checkout@v7

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Export required Doppler secret
        if: ${{ matrix.required_secret != null && matrix.required_secret != '' }}
        run: |
          echo "${{ matrix.required_secret }}=$(doppler secrets get ${{ matrix.required_secret }} --plain)" >> "$GITHUB_ENV"

      - name: Run live tests
        run: doppler run -- ${{ matrix.command }}

  duckduckgo-integration-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DuckDuckGo API Tests
            command: cargo test -p everruns-integrations-duckduckgo --features integration
          - name: Parallel MCP Tests
            command: cargo test -p everruns-integrations-parallel --features integration

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run integration tests
        run: ${{ matrix.command }}

  container-sandbox-live-test:
    name: Container Sandbox Live API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      docker:
        image: docker:dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375

    env:
      CONTAINER_SANDBOX_DOCKER_HOST: http://localhost:2375

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:2375/_ping >/dev/null 2>&1; then
              echo "Docker daemon is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Docker daemon did not become ready within 60s" >&2
          exit 1

      - name: Run live integration tests
        run: cargo test -p everruns-platform --features container-sandbox-live-tests --test container_sandbox_live_api_test -- --test-threads=1
