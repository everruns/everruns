# Weekly/on-demand backstop for path-filtered integration workflows.
# PRs stay fast by keeping costly/stateful live jobs off the hot path; pushes to
# main still run change-scoped live coverage; this workflow runs the full live
# matrix so shared crate, harness, and dependency regressions cannot hide behind
# per-integration path filters.
name: Integration Live Sweep

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  doppler-backed-live-tests:
    name: ${{ matrix.name }}
    # A manual dispatch may pick any branch; only main runs beside the vault
    # token (EVE-1190). Schedules always run on the default branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Daytona Live API Tests
            command: cargo test -p everruns-integrations --features daytona-live-tests --test daytona_live_api_test --test daytona_live_openapi_test -- --test-threads=1
          # Browserless Live API Tests are out of the sweep: the account runs on
          # a small credit allowance, so its live job runs only when the
          # integration changes or on manual dispatch of
          # browserless-integration.yml.
          - name: E2B Live API Tests
            command: cargo test -p everruns-integrations --features e2b-live-tests --test e2b_live_api_test -- --test-threads=1
          - name: Cursor Live API Tests
            command: cargo test -p everruns-integrations --features cursor-live-tests --test cursor_live_api_test -- --test-threads=1
          - name: Modal Live API Tests
            command: cargo test -p everruns-integrations --features modal-live-tests --test modal_live -- --test-threads=1
          # Sprites Live API Tests are out of the sweep: Sprites is experimental
          # and its live job runs only on manual dispatch of
          # sprites-integration.yml.
          - name: Brave Search API Tests
            command: cargo test -p everruns-integrations --features brave-search-integration
          - name: TypeSafe System One API Tests
            command: cargo test -p everruns-integrations --features typesafe-integration
          - name: OpenAI Decisions Live API Tests
            command: cargo test -p everruns-integrations --features openai-decisions-live-tests --test openai_decisions_live
          - name: Microsoft Foundry Decisions Live API Tests
            command: cargo test -p everruns-integrations --features foundry-decisions-live-tests --test foundry_decisions_live
          - name: Classification Service Live Tests
            command: bash -lc 'UTILITY_TYPESAFE_API_KEY="${UTILITY_TYPESAFE_API_KEY:-$TYPESAFE_API_KEY}" cargo test -p everruns-integrations --features typesafe-live-tests --test typesafe_classifier_live'
          # ARD Live Registry Tests are quarantined: the public reference
          # registry (https://agenticresourcediscovery.org/api/v1) was
          # decommissioned (now docs-only; 405/404 on the API, registry/api
          # subdomains no longer resolve), so the fail-closed live tests can
          # never pass. Per the fail-closed contract we remove the job rather
          # than let it silently skip/pass. The wiremock-backed unit +
          # integration tests (`cargo test -p everruns-ard`) still
          # cover the ARD client. Re-add this entry (or repoint
          # ARD_LIVE_REGISTRY_URL) once a reachable reference registry exists.
          # See EVE-659.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doppler CLI
        id: doppler_install
        # Absorbs one transient installer failure; see
        # scripts/test-doppler-install-retry.sh for why.
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "debug"

      # Every secret reaches the matrix command through `doppler run` below.
      # An $GITHUB_ENV export would add nothing but an unmasked copy in every
      # later step's env block.
      - name: Run live tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- ${{ matrix.command }}

  # Framework examples against a real model. Nothing else runs them: CI only
  # compiles examples, and `hello` once shipped failing at Agent::build().
  framework-examples-live:
    name: Framework Examples (live)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doppler CLI
        id: doppler_install
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "debug"

      - name: Run live examples
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -- bash scripts/run-live-examples.sh

  # Server tests that need an outside service: github.com for the Git fetch
  # and knowledge source checks, a TypeSafe key for the Slack relevance
  # classifier, a NATS JetStream server for live event delivery. They sit
  # behind the server's `live-tests` feature, so PR builds never compile them,
  # and fail here when a service is missing instead of skipping.
  server-live-tests:
    name: Server Live Tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # A debug build of the server's lib tests is most of the time.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Doppler CLI
        id: doppler_install
        continue-on-error: true
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Pause before Doppler CLI retry
        if: steps.doppler_install.outcome == 'failure'
        run: sleep 15

      - name: Install Doppler CLI (retry)
        if: steps.doppler_install.outcome == 'failure'
        uses: dopplerhq/cli-action@4819d808ab99e5cde19a0637a16536a4038fad73 # v4

      - name: Start NATS with JetStream
        run: |
          docker run -d --name live-nats -p 4222:4222 \
            mirror.gcr.io/library/nats:2-alpine --jetstream
          for _ in $(seq 30); do
            docker logs live-nats 2>&1 | grep -q 'Server is ready' && exit 0
            sleep 1
          done
          docker logs live-nats
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "server-live"

      - name: Run server live tests
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          EVERRUNS_TEST_NATS_URL: nats://127.0.0.1:4222
        run: |
          doppler run -- bash -c 'UTILITY_TYPESAFE_API_KEY="${UTILITY_TYPESAFE_API_KEY:-$TYPESAFE_API_KEY}" \
            cargo test --locked -p everruns-server --lib --features live-tests -- --exact --nocapture \
              channels::slack::events::response_policy::tests::live_jev_relevance_matches_intent_examples \
              domains::git_fetch::tests::fetches_a_real_repository \
              domains::knowledge_indexes::source_sync::tests::live_stored_github_url_retry_reads_bashkit_knowledge_root \
              live_updates::event_delivery::tests::oversize_generation_reaches_nats_subscribers'

  duckduckgo-integration-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: DuckDuckGo API Tests
            command: cargo test -p everruns-integrations --features duckduckgo-integration
          - name: Parallel MCP Tests
            command: cargo test -p everruns-integrations --features parallel-integration

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Run integration tests
        run: ${{ matrix.command }}

  container-sandbox-live-test:
    name: Container Sandbox Live API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      docker:
        image: docker:dind
        env:
          DOCKER_TLS_CERTDIR: ""
        options: --privileged
        ports:
          - 2375:2375

    env:
      CONTAINER_SANDBOX_DOCKER_HOST: http://localhost:2375

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "debug"

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:2375/_ping >/dev/null 2>&1; then
              echo "Docker daemon is ready"
              exit 0
            fi
            sleep 1
          done
          echo "Docker daemon did not become ready within 60s" >&2
          exit 1

      - name: Run live integration tests
        run: cargo test -p everruns-capabilities --features container-sandbox-live-tests --test container_sandbox_live_api_test -- --test-threads=1
