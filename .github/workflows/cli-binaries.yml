name: Publish CLI Binaries

# GITHUB_TOKEN-created releases don't trigger `release: published` (anti-recursion).
# The Release workflow dispatches this workflow explicitly, same pattern as Docker Publish.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: everruns-aarch64-apple-darwin.tar.gz
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: everruns-x86_64-apple-darwin.tar.gz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: everruns-x86_64-unknown-linux-gnu.tar.gz

    steps:
      - name: Validate trusted release tag
        env:
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag must be a semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$GIT_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo "release tag input must match the workflow tag ref" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "cli"

      - name: Build CLI binary
        run: cargo build --release --target ${{ matrix.target }} -p everruns-cli

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" everruns
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --clobber

  update-homebrew:
    name: Update Homebrew formula
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate trusted release tag
        env:
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag must be a semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$GIT_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo "release tag input must match the workflow tag ref" >&2
            exit 1
          fi

      - name: Download SHA256 checksums from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-gnu; do
            gh release download "$RELEASE_TAG" \
              --repo "${{ github.repository }}" \
              --pattern "everruns-${target}.tar.gz.sha256"
          done

      - name: Generate Homebrew formula
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          # Validate checksum files exist and are non-empty
          for f in everruns-aarch64-apple-darwin.tar.gz.sha256 \
                   everruns-x86_64-apple-darwin.tar.gz.sha256 \
                   everruns-x86_64-unknown-linux-gnu.tar.gz.sha256; do
            if [[ ! -s "$f" ]]; then
              echo "Error: checksum file '$f' is missing or empty." >&2
              exit 1
            fi
          done

          SHA_ARM64=$(awk '{print $1}' everruns-aarch64-apple-darwin.tar.gz.sha256)
          SHA_X86_64_MACOS=$(awk '{print $1}' everruns-x86_64-apple-darwin.tar.gz.sha256)
          SHA_LINUX=$(awk '{print $1}' everruns-x86_64-unknown-linux-gnu.tar.gz.sha256)

          for var in SHA_ARM64 SHA_X86_64_MACOS SHA_LINUX; do
            if [[ -z "${!var}" ]]; then
              echo "Error: extracted $var is empty." >&2
              exit 1
            fi
          done

          BASE_URL="$SERVER_URL/$REPOSITORY/releases/download/$RELEASE_TAG"

          cat > everruns.rb <<FORMULA
          # typed: false
          # frozen_string_literal: true

          class Everruns < Formula
            desc "Open-source AI agent platform"
            homepage "${SERVER_URL}/${REPOSITORY}"
            license "Apache-2.0"

            on_macos do
              if Hardware::CPU.arm?
                url "${BASE_URL}/everruns-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_ARM64}"
              else
                url "${BASE_URL}/everruns-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_X86_64_MACOS}"
              end
            end

            on_linux do
              depends_on arch: :x86_64
              if Hardware::CPU.arm?
                odie "Linux ARM is not supported by this formula"
              else
                url "${BASE_URL}/everruns-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX}"
              end
            end

            def install
              bin.install "everruns"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/everruns --version")
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' everruns.rb

          echo "Generated formula:"
          cat everruns.rb

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@014df23b1329b615816a38eb5f473bb9000700b1 # v3

      - name: Push formula to homebrew-tap
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"

          # Fetch the Homebrew tap PAT from Doppler (has push access to homebrew-tap)
          GH_PAT=$(doppler secrets get HOMEBREW_TAP_GITHUB_TOKEN --plain)
          if [[ -z "${GH_PAT}" ]]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is missing or empty in Doppler."
            exit 1
          fi
          echo "::add-mask::${GH_PAT}"

          # Use askpass instead of embedding credentials in the clone URL
          ASKPASS_SCRIPT="$(mktemp)"
          cat > "${ASKPASS_SCRIPT}" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Username*) echo "x-access-token" ;;
            *Password*) echo "${GH_PAT}" ;;
          esac
          EOF
          chmod 700 "${ASKPASS_SCRIPT}"
          trap 'rm -f "${ASKPASS_SCRIPT}"' EXIT
          export GH_PAT
          export GIT_ASKPASS="${ASKPASS_SCRIPT}"
          export GIT_TERMINAL_PROMPT=0

          # Clone the tap repo
          git clone "https://github.com/everruns/homebrew-tap.git" tap
          cp everruns.rb tap/Formula/everruns.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/everruns.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "everruns ${VERSION}"
          git push origin main
