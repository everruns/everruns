# Docker Compose quickstart smoke.
#
# Runs scripts/smoke-docker-compose.sh, which follows
# docs/getting-started/docker-compose.md step by step (secrets, .env, up,
# sign in, personal access token, agent, session, message, completed turn).
#
# It runs published images, not PR-built ones: CI binaries cannot run in the
# distroless base (see docker/Dockerfile.prebuilt), and the guide tells readers
# to pull published images anyway. So PRs that change the compose file, the
# guide, or the script are checked against `latest`, every release is checked
# right after its images publish, and a daily run catches drift from either.
name: Compose Smoke

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to test (default: latest)'
        required: false
        type: string
  schedule:
    - cron: '30 6 * * *'
  workflow_run:
    workflows: ['Docker Publish']
    types: [completed]
  pull_request:
    paths:
      - 'examples/docker-compose-full.yaml'
      - 'docs/getting-started/docker-compose.md'
      - 'scripts/smoke-docker-compose.sh'
      - '.github/workflows/compose-smoke.yml'
      - 'crates/cli/**'
      - 'scripts/smoke-everruns-docker.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Compose Quickstart Smoke (${{ matrix.stack }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # What the guide's .env selects.
          - stack: guide
            profiles: scale,metrics
          # The lean default set, with no profiles.
          - stack: lean
            profiles: ""
    # After Docker Publish, only test runs that published release images.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Run Compose quickstart
        env:
          EVERRUNS_TAG: ${{ inputs.tag || 'latest' }}
          SMOKE_PROFILES: ${{ matrix.profiles }}
          COMPOSE_PROJECT_NAME: everruns-smoke-${{ matrix.stack }}
        run: scripts/smoke-docker-compose.sh

  # `everruns docker up` with the CLI built from this checkout, against the
  # same published images.
  cli-up:
    name: everruns docker up Smoke
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 30
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "cli"

      - name: Build CLI
        run: cargo build -p everruns-cli

      - name: Run everruns docker up
        env:
          EVERRUNS_TAG: ${{ inputs.tag || 'latest' }}
        run: scripts/smoke-everruns-docker.sh target/debug/everruns
