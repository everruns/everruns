name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.5.0)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Check if this is a release commit - always runs to suppress "no jobs ran" notifications
  check-release:
    runs-on: ubuntu-latest
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
    steps:
      - name: Check if release commit
        id: check
        env:
          # A boolean, not the message. The runner prints every `env:` entry
          # verbatim, so handing this step the commit body published each merged
          # PR description into a public log -- and a credential *shape* quoted
          # in one (a placeholder, a key under discussion) then trips the hourly
          # Actions log secret scan, as commit d6f65f8 did. The subject is a
          # prefix of the message, so `startsWith` reads it for free.
          # Quoted because the expression contains a colon, which bare YAML
          # would read as a mapping.
          IS_RELEASE: "${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release): prepare v') }}"
        run: |
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "This is a release commit, proceeding with release"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
            echo "Not a release commit, skipping release job"
          fi

  release:
    needs: check-release
    if: needs.check-release.outputs.is_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Extract version from commit message or input
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          # Use input version if manual trigger, otherwise extract from commit message
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Read the subject from the checked-out commit rather than taking the
            # message through `env:`. Same reason as check-release above: the
            # runner prints an env entry verbatim, and the body of a squashed
            # release PR is a changelog that can quote anything.
            VERSION=$(git log -1 --format=%s HEAD | grep -oP 'prepare v\K[0-9]+\.[0-9]+\.[0-9]+' || true)
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::Could not extract version from commit message or input"
            exit 1
          fi
          # Reject non-semver shapes so tainted inputs cannot inject shell via later steps
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be semver X.Y.Z: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"

      - name: Check if tag already exists
        id: check_tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi
          echo "Tag does not exist, proceeding..."

      - name: Extract release notes from CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Extract the section for this version from CHANGELOG.md
          # Matches from "## [X.Y.Z]" until the next "## [" or end of significant content
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) found=1
              next
            }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            echo "::warning::No changelog entry found for version $VERSION"
            NOTES="Release v$VERSION"
          fi

          # Write to file to preserve formatting
          echo "$NOTES" > release_notes.md
          echo "Release notes extracted:"
          cat release_notes.md

      - name: Install release card renderer
        run: |
          set -euo pipefail
          npm install --global pnpm@10.33.0
          pnpm --dir apps/docs install --frozen-lockfile

      - name: Render release card
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          pnpm --dir apps/docs run release-card \
            --input ../../release-card.yml \
            --expect-version "$VERSION" \
            --output "../../release-card-v$VERSION.png"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file release_notes.md \
            --target "$TARGET_SHA" \
            "release-card-v$VERSION.png#Everruns release card"

          echo "Created release v$VERSION"

      # GITHUB_TOKEN tag pushes don't trigger other workflows (GitHub anti-recursion).
      # Explicitly dispatch Docker Publish to build version-tagged images.
      - name: Trigger Docker Publish for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Triggering Docker Publish for tag $TAG..."
          gh workflow run docker-publish.yml --ref "$TAG" -f "tag=$TAG"
          echo "Docker Publish triggered for $TAG"

      - name: Trigger CLI binary builds for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Triggering CLI binary builds for tag $TAG..."
          gh workflow run cli-binaries.yml --ref "$TAG" -f "tag=$TAG"
          echo "CLI binary builds triggered for $TAG"

      - name: Trigger server & worker binary builds for release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Triggering server & worker binary builds for tag $TAG..."
          gh workflow run server-worker-binaries.yml --ref "$TAG" -f "tag=$TAG"
          echo "Server & worker binary builds triggered for $TAG"
