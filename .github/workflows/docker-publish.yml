name: Docker Publish

# Trigger strategy (see knowledge/project/release-process.md#docker-image-tagging):
# - Tag push (v*) / workflow_dispatch: publish multi-arch release images.
# - Pull request: validate Docker build only when Docker-relevant files change.
# - No main-branch push: per-commit Docker images are intentionally not
#   produced. Image builds (especially arm64 via QEMU) are expensive and the
#   previous `:development` rolling tag hid tag drift behind a moving target.
#   Consumers should pin to a released tag.
on:
  push:
    tags: ['v*']
  # Triggered by Release workflow after creating tag (GITHUB_TOKEN tag pushes
  # don't fire push events, so Release calls this via workflow_dispatch)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to build and publish (e.g., v0.8.0)'
        required: true
        type: string
  # Gate PR builds on Docker-relevant paths. PR validation exists to catch
  # Dockerfile / workflow regressions before they land. Rust/UI source
  # changes are validated by tag builds at release time. PR builds still
  # push SHA-tagged images to GHCR (pre-existing behavior) — these are
  # traceability artifacts, not a consumer-facing channel.
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled]
    paths:
      - 'docker/**'
      - 'apps/ui/Dockerfile'
      - 'apps/ui/.dockerignore'
      - '.dockerignore'
      - '.github/workflows/docker-publish.yml'

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Repository name for image naming
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}

jobs:
  # Build all Rust images on a single runner so the shared builder-all stage
  # is compiled once (per architecture) instead of 3x across separate runners.
  build-rust-images:
    name: Build Rust Images
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:skip-docker') && !contains(github.event.pull_request.labels.*.name, 'ci:skip-docker'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # QEMU needed for multi-arch builds (ARM64 cross-compilation)
      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "sha_short=${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "sha_short=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]] && [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release ref must be a semantic version tag: $REF_NAME" >&2
            exit 1
          fi
          # workflow_dispatch is only trusted when dispatched against the
          # matching version tag ref (as release.yml does with --ref "$TAG").
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ "$GIT_REF" != refs/tags/v* ]]; then
              echo "workflow_dispatch must run on a v* tag ref; got $GIT_REF" >&2
              exit 1
            fi
            if [ "$REF_NAME" != "$INPUT_TAG" ]; then
              echo "workflow_dispatch tag input must match ref_name ($REF_NAME)" >&2
              exit 1
            fi
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      # Build ARM64 on version tags and release dispatches.
      # PRs only build amd64 since PR validation only confirms the build works.
      - name: Determine platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      # --- Server image ---
      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}/everruns-server
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.release_tag.outputs.tag }},enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.sha.outputs.sha_short }}
            type=raw,value=${{ steps.sha.outputs.sha }}

      - name: Build and push server
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.unified
          target: server
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

      # --- Worker image ---
      - name: Extract metadata (worker)
        id: meta-worker
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}/everruns-worker
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.release_tag.outputs.tag }},enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.sha.outputs.sha_short }}
            type=raw,value=${{ steps.sha.outputs.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.unified
          target: worker
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-worker.outputs.tags }}
          labels: ${{ steps.meta-worker.outputs.labels }}
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

      # --- Admin image (skip on PRs — not needed for CI validation) ---
      - name: Extract metadata (admin)
        if: github.event_name != 'pull_request'
        id: meta-admin
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}/everruns-admin
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.release_tag.outputs.tag }},enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.sha.outputs.sha_short }}
            type=raw,value=${{ steps.sha.outputs.sha }}

      - name: Build and push admin
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/Dockerfile.unified
          target: admin
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha,scope=docker-rust
          cache-to: type=gha,mode=max,scope=docker-rust

  # UI image builds independently (different Dockerfile, Node.js stack)
  build-ui-image:
    name: Build UI Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || (((github.event.action != 'labeled' && github.event.action != 'unlabeled') || github.event.label.name == 'ci:skip-docker') && !contains(github.event.pull_request.labels.*.name, 'ci:skip-docker'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine SHA
        id: sha
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
            echo "sha_short=${PR_HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
            echo "sha_short=${COMMIT_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release tag
        id: release_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GIT_REF" == refs/tags/* ]] && [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release ref must be a semantic version tag: $REF_NAME" >&2
            exit 1
          fi
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [[ "$GIT_REF" != refs/tags/v* ]]; then
              echo "workflow_dispatch must run on a v* tag ref; got $GIT_REF" >&2
              exit 1
            fi
            if [ "$REF_NAME" != "$INPUT_TAG" ]; then
              echo "workflow_dispatch tag input must match ref_name ($REF_NAME)" >&2
              exit 1
            fi
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GIT_REF" == refs/tags/v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine platforms
        id: platforms
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
          fi

      - name: Extract metadata (ui)
        id: meta-ui
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_BASE }}/everruns-ui
          tags: |
            type=ref,event=tag
            type=raw,value=${{ steps.release_tag.outputs.tag }},enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=latest,enable=${{ steps.release_tag.outputs.is_release == 'true' }}
            type=raw,value=${{ steps.sha.outputs.sha_short }}
            type=raw,value=${{ steps.sha.outputs.sha }}

      - name: Build and push UI
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: apps/ui
          file: apps/ui/Dockerfile
          target: ui
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.meta-ui.outputs.tags }}
          labels: ${{ steps.meta-ui.outputs.labels }}
          cache-from: type=gha,scope=docker-ui
          cache-to: type=gha,mode=max,scope=docker-ui
