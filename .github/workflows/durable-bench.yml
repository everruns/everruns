# Temporary A/B experiment for EVE-1262 (never merged): the server turn latency
# bench before and after the session actor cutover (#4608), on the same day's
# runners, two runs each.
name: Durable Benchmarks

on:
  workflow_dispatch:

concurrency:
  group: eve-1262-ab
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  server-turn-latency:
    name: Turn latency ${{ matrix.arm }} run ${{ matrix.rep }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arm: [before-actors, after-actors]
        rep: [3]
        include:
          - arm: before-actors
            ref: 7c48799f78d38bbfd3d759f88cb7d3c23e214daf
          - arm: after-actors
            ref: 3fd200f4cd2d1dc12c7f42f4cded581e2be4f487
    env:
      DATABASE_URL: postgres://everruns:everruns@localhost:5432/everruns_test
      SECRETS_ENCRYPTION_KEY: kek-v1:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - uses: actions/checkout@v7
        with:
          path: probe

      - name: Start PostgreSQL with pg_stat_statements
        run: |
          docker run -d --name bench-postgres -p 5432:5432 \
            -e POSTGRES_USER=everruns -e POSTGRES_PASSWORD=everruns -e POSTGRES_DB=everruns_test \
            mirror.gcr.io/library/postgres:17-alpine -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
          for _ in $(seq 60); do
            docker exec bench-postgres pg_isready -U everruns -d everruns_test && exit 0
            sleep 1
          done
          exit 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: server-turn-latency-bench
          save-if: false

      - name: Database counters before
        run: |
          docker exec bench-postgres psql -U everruns -d everruns_test -Atc \
            "select 'before', xact_commit, xact_rollback, tup_inserted, tup_updated from pg_stat_database where datname='everruns_test'"
          docker exec bench-postgres psql -U everruns -d everruns_test -Atc "select 'wal', wal_records, wal_sync, wal_sync_time from pg_stat_wal" || true
          nproc; cat /proc/cpuinfo | grep 'model name' | head -1

      - name: Run turn_latency
        run: |
          cargo bench -p everruns-server --bench turn_latency -- \
            --moniker github-ubuntu-latest --summary "$RUNNER_TEMP/summary.jsonl" --top 25

      - name: Database counters after
        if: always()
        run: |
          docker exec bench-postgres psql -U everruns -d everruns_test -Atc \
            "select 'after', xact_commit, xact_rollback, tup_inserted, tup_updated from pg_stat_database where datname='everruns_test'"
          docker exec bench-postgres psql -U everruns -d everruns_test -Atc "select 'wal', wal_records, wal_sync, wal_sync_time from pg_stat_wal" || true
          cat "$RUNNER_TEMP/summary.jsonl" || true
          for f in gaps.sql gaps_c1.sql slowturns.sql byturn.sql; do
            echo "== $f"
            docker exec -i bench-postgres psql -U everruns -d everruns_test < "probe/.github/eve-1262/$f" || true
          done
