name: MCP conformance
on:
  pull_request:
    paths:
      - "crates/core/src/mcp/**"
      - "crates/server/src/api/mcp_endpoint/**"
      - "crates/server/src/domains/mcp_servers/events.rs"
      - "crates/server/src/domains/agent_triggers/mcp_event.rs"
      - "crates/server/tests/domain/mcp*"
      - "crates/server/tests/domain/mcp*/**"
      - "crates/server/tests/test_harness/mcp_events_conformance.rs"
      - "crates/server/tests/test_harness/egress_fakes.rs"
      - "scripts/mcp*conformance*/**"
      - "scripts/mcp-events-conformance.sh"
      - ".github/workflows/mcp-conformance.yml"
  push:
    branches: [main]
    paths:
      - "crates/core/src/mcp/**"
      - "crates/server/src/**/mcp*/**"
      - "crates/server/src/domains/agent_triggers/mcp_event.rs"
      - "crates/server/tests/domain/mcp*"
      - "crates/server/tests/domain/mcp*/**"
      - "crates/server/tests/test_harness/mcp_events_conformance.rs"
      - "crates/server/tests/test_harness/egress_fakes.rs"
      - "scripts/mcp*conformance*"
      - "scripts/mcp*conformance*/**"
      - ".github/workflows/mcp-conformance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  base:
    name: Released MCP baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-conformance
      - run: npm ci --ignore-scripts --prefix scripts/mcp-conformance
      - run: cargo test --locked -p everruns-server --test domain official_mcp_baseline -- --ignored --nocapture --test-threads=1
        env:
          MCP_CONFORMANCE_DIR: scripts/mcp-conformance/node_modules/@modelcontextprotocol/conformance
  events:
    name: Events extension upstream checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # No Doppler, cloud credentials, write token, or pull_request_target.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: mcp-conformance
      - run: bash scripts/mcp-events-conformance.sh --setup-only
      - run: cargo test --locked -p everruns-server --test domain official_events_checks -- --ignored --nocapture --test-threads=1
        env:
          MCP_EVENTS_CONFORMANCE_DIR: ${{ github.workspace }}/.local/mcp-events-conformance/upstream
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mcp-events-conformance-results
          path: .local/mcp-events-conformance/results
