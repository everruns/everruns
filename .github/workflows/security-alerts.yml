name: Security Alerts

# Publishes open Dependabot and code-scanning alerts into a job log a scheduled
# maintenance session can actually read.
#
# Those two APIs are 403 for such a session, and no token it holds changes that:
# the agent egress proxy rewrites `Authorization` for api.github.com, so every
# request authenticates as the session's own App installation whatever it sends
# (EVE-926). Its security step therefore falls back to `cargo deny` and
# `pnpm audit`. That fallback is a real signal but not an equivalent one: it
# cannot see GitHub-only advisories, alerts on ecosystems with no local gate,
# the dismissed/snoozed state that says an alert was already triaged, or CodeQL
# findings at all.
#
# A workflow job can grant itself `security-events: read` on the built-in
# GITHUB_TOKEN, which needs no org or app administration — unlike the App-scope
# change EVE-926 asks for. The Actions API that exposes this run's logs and
# artifacts is already readable from a scheduled session.
#
# That recovers code scanning, not everything. Measured on run 32458309940: the
# same job that read code-scanning alerts was still refused Dependabot alerts
# with 403, and no `permissions:` key changes that — Dependabot alert reads need
# the App scope EVE-926 asks for. So the job reports the Dependabot half as
# blocked rather than failing on it, and stays red-on-regression only for the
# half a workflow can actually read.

on:
  schedule:
    # Daily: alerts appear when advisories are published, not when this repo
    # changes, so tying this to pushes would answer the wrong question — the
    # same reasoning that moved the RustSec gate off path filters (EVE-920).
    - cron: '43 5 * * *'
  workflow_dispatch:
  # Deliberately no `pull_request` trigger. A fork PR's GITHUB_TOKEN is never
  # granted `security-events`, so this job would fail for outside contributors
  # on a permission they cannot be given; and running PR-controlled script code
  # under an elevated token is the pattern TM-CI-001..005 keeps off PR events.
  # scripts/test-security-alerts-report.sh covers the formatting on every PR
  # through the `Shell Tests (Repo Scripts)` job, which needs no token.

permissions:
  contents: read
  security-events: read

concurrency:
  group: security-alerts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    name: Report Open Alerts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Check report formatting
        run: scripts/test-security-alerts-report.sh

      - name: Report open alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Goes to the log (readable over the Actions API, which is the channel
          # a scheduled session has), the summary, and an artifact. The report is
          # still worth publishing when the script exits non-zero — that exit
          # means an endpoint was unreadable, and the reason is in the report.
          set +e
          scripts/report_security_alerts.py | tee security-alerts.md
          status=${PIPESTATUS[0]}
          cat security-alerts.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-alerts
          path: security-alerts.md
          if-no-files-found: warn
