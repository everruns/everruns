# Helm chart checks.
#
# `check` lints and renders charts/everruns (scripts/check-helm-chart.sh).
# `kind` installs it on a kind cluster with published images and runs
# scripts/smoke-helm-chart.sh: healthy rollout, sign-in through the proxy, and
# generated secrets kept across upgrade and reinstall. Like Compose Smoke it
# runs `latest` on PRs, after each image publish, and daily. `cli-up` runs
# `everruns k8s up` (CLI built from this checkout) on kind with this chart:
# scripts/smoke-everruns-k8s.sh.
name: Helm Chart

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to install (default: latest)'
        required: false
        type: string
  schedule:
    - cron: '45 6 * * *'
  workflow_run:
    workflows: ['Docker Publish']
    types: [completed]
  pull_request:
    paths:
      - 'charts/**'
      - 'examples/docker-compose-full.yaml'
      - 'scripts/check-helm-chart.sh'
      - 'scripts/smoke-helm-chart.sh'
      - 'scripts/smoke-everruns-k8s.sh'
      - 'crates/cli/src/commands/k8s/**'
      - 'crates/cli/src/commands/docker/signin.rs'
      - '.github/workflows/helm-chart.yml'
      - '.github/workflows/publish-helm-chart.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HELM_VERSION: v3.19.0
  KIND_VERSION: v0.30.0

jobs:
  check:
    name: Helm Chart Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install helm
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Check the chart
        run: scripts/check-helm-chart.sh

  kind:
    name: Helm Chart on kind
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install helm and kind
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install /tmp/kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster --name everruns --wait 120s

      - name: Install the chart and smoke it
        env:
          EVERRUNS_TAG: ${{ inputs.tag || 'latest' }}
        run: scripts/smoke-helm-chart.sh

  cli-up:
    name: everruns k8s up on kind
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    timeout-minutes: 45
    env:
      CARGO_NET_RETRY: 10
      CARGO_HTTP_MULTIPLEXING: "false"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "cli"

      - name: Build CLI
        run: cargo build -p everruns-cli

      - name: Install helm and kind
        run: |
          curl -fsSL "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" | tar xz -C /tmp
          sudo mv /tmp/linux-amd64/helm /usr/local/bin/helm
          curl -fsSLo /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install /tmp/kind /usr/local/bin/kind

      - name: Create cluster
        run: kind create cluster --name everruns --wait 120s

      - name: Run everruns k8s up
        env:
          EVERRUNS_TAG: ${{ inputs.tag || 'latest' }}
        run: scripts/smoke-everruns-k8s.sh target/debug/everruns
