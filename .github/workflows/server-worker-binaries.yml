name: Publish Server & Worker Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.binary }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64
          - binary: everruns-server
            package: everruns-server
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: everruns-server-x86_64-unknown-linux-gnu.tar.gz
          - binary: everruns-worker
            package: everruns-worker
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: everruns-worker-x86_64-unknown-linux-gnu.tar.gz
          # aarch64
          - binary: everruns-server
            package: everruns-server
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: everruns-server-aarch64-unknown-linux-gnu.tar.gz
          - binary: everruns-worker
            package: everruns-worker
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            archive: everruns-worker-aarch64-unknown-linux-gnu.tar.gz

    steps:
      - name: Validate trusted release tag
        env:
          GIT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "release tag must be a semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          if [ "$GIT_REF" != "refs/tags/$RELEASE_TAG" ] || [ "$REF_NAME" != "$RELEASE_TAG" ]; then
            echo "release tag input must match the workflow tag ref" >&2
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@01ba1edad32c6f80dbcce879d3e0fa5a00b2a84e # 1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: "server-worker-${{ matrix.target }}"

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }} -p ${{ matrix.package }} --bin ${{ matrix.binary }}

      - name: Package binary
        run: |
          cd target/${{ matrix.target }}/release
          tar czf "$GITHUB_WORKSPACE/${{ matrix.archive }}" ${{ matrix.binary }}
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "${{ matrix.archive }}" \
            "${{ matrix.archive }}.sha256" \
            --clobber
