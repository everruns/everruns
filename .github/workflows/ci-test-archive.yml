name: Test Archive Pilot
# Explicit experiment: one compile, the same libtest executable on two runners.
# No nextest process-per-test change and no provider credentials.
on:
  workflow_dispatch:
    inputs:
      experiment:
        type: choice
        description: Controlled experiment (Rust profiles also measures server test concurrency)
        default: archive
        options: [archive, rust-profiles]
      server_concurrency:
        type: boolean
        description: Also measure repeated server-library concurrency
        default: true
permissions:
  contents: read
concurrency:
  group: test-archive-pilot-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    if: inputs.experiment != 'rust-profiles'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        cache: [dependencies, workspace]
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Prepare linker and disk
        timeout-minutes: 5
        run: |
          bash scripts/ci-prepare-disk.sh
          if ! command -v ld.lld >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq lld
          fi
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          # Separate immutable keys, identical source/toolchain/flags. Run twice
          # at this same revision to compare misses with exact hits.
          shared-key: test-archive-pilot-v2-${{ matrix.cache }}-${{ github.sha }}
          cache-workspace-crates: ${{ matrix.cache == 'workspace' }}
      - name: Report cache identity
        env:
          CACHE_VARIANT: ${{ matrix.cache }}
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Cache variant=$CACHE_VARIANT exact_hit=$CACHE_HIT revision=$GITHUB_SHA"
      - name: Compile the server unit executable once
        run: cargo test --locked -p everruns-server --lib --no-run --message-format=json > /tmp/test-artifacts.jsonl
      - name: Archive only the compiled test executable
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,tarfile,time,zlib
          artifacts=[json.loads(line) for line in pathlib.Path('/tmp/test-artifacts.jsonl').read_text().splitlines()]
          executables=[pathlib.Path(a['executable']) for a in artifacts if a.get('reason')=='compiler-artifact' and a.get('executable') and a['profile']['test']]
          assert len(executables)==1, executables
          executable=executables[0]
          measurements={'revision':os.environ['GITHUB_SHA'],'binary_bytes':executable.stat().st_size,'gzip':[]}
          # Count streamed output without retaining a second large artifact.
          for level in (1,9):
              start=time.monotonic()
              compressor=zlib.compressobj(level,wbits=31)
              size=0
              with executable.open('rb') as source:
                  for chunk in iter(lambda:source.read(1024*1024),b''):
                      size+=len(compressor.compress(chunk))
              size+=len(compressor.flush())
              measurements['gzip'].append({'level':level,'seconds':round(time.monotonic()-start,3),'bytes':size})
          start=time.monotonic()
          with tarfile.open('server-tests.tar.gz','w:gz',compresslevel=1) as archive:
              archive.add(executable,arcname='server-tests')
          measurements['archive_seconds']=round(time.monotonic()-start,3)
          measurements['archive_bytes']=pathlib.Path('server-tests.tar.gz').stat().st_size
          with executable.open('rb') as source:
              checksum=hashlib.file_digest(source,'sha256').hexdigest()
          pathlib.Path('server-tests.sha256').write_text(checksum+'  server-tests\n')
          report=json.dumps(measurements,indent=2)
          pathlib.Path('archive-measurements.json').write_text(report+'\n')
          print(report)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: server-test-archive-${{ matrix.cache }}
          path: |
            server-tests.tar.gz
            server-tests.sha256
            archive-measurements.json
          # The payload is already gzip-compressed.
          compression-level: 0
          if-no-files-found: error
          retention-days: 2
  execute:
    name: Archived tests (${{ matrix.cache }}, ${{ matrix.database }})
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [native, durable]
        cache: [dependencies, workspace]
    services:
      postgres:
        image: ${{ matrix.database == 'durable' && 'mirror.gcr.io/library/postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: everruns
          POSTGRES_PASSWORD: everruns
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      RUST_TEST_THREADS: '4'
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.cache/everruns/postgres
          key: ${{ runner.os }}-pg-embedded-17
      - uses: actions/download-artifact@v8
        with:
          name: server-test-archive-${{ matrix.cache }}
      - name: Select durable external PostgreSQL
        if: matrix.database == 'durable'
        run: echo 'EVERRUNS_TEST_POSTGRES_URL=postgres://everruns:everruns@localhost:5432/postgres' >> "$GITHUB_ENV"
      - name: Verify and run the shared executable
        env:
          # Cargo supplies this variable and package cwd to fixture readers.
          CARGO_MANIFEST_DIR: ${{ github.workspace }}/crates/server
        run: |
          tar -xzf server-tests.tar.gz
          sha256sum --check server-tests.sha256
          cd "$CARGO_MANIFEST_DIR"
          "$GITHUB_WORKSPACE/server-tests"
      - name: Verify the durable service survives a crash
        if: matrix.database == 'durable'
        timeout-minutes: 3
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: bash .github/scripts/ci/postgres_recovery.sh

  rust-profiles:
    if: inputs.experiment == 'rust-profiles'
    name: CI profile (opt=${{ matrix.opt }})
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        opt: ['1', '0']
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_CI_OPT_LEVEL: ${{ matrix.opt }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Prepare linker and disk
        run: |
          bash scripts/ci-prepare-disk.sh
          command -v ld.lld || { sudo apt-get update -qq && sudo apt-get install -y -qq lld; }
          rustc -Vv
          ld.lld --version
      # Deliberately no target cache: paired cold builds then dependency-only
      # warm builds on the same runner. No experiment keys crowd production.
      - name: Measure cold and dependency-warm binary builds
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/profile-target
        run: python3 .github/scripts/ci/rust_profile.py profile
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rust-profile-${{ matrix.opt }}
          path: ${{ runner.temp }}/profile-measurements.json
          if-no-files-found: error
          retention-days: 7

  server-concurrency:
    if: inputs.experiment == 'rust-profiles' && inputs.server_concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: '-C link-arg=-fuse-ld=lld'
      SECRETS_ENCRYPTION_KEY: kek-v1:8B3uCQ4Znx45hl5nB+PKVriRrj/KtEVM+wBZ2VGa9vY=
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: Prepare linker and disk
        run: |
          bash scripts/ci-prepare-disk.sh
          command -v ld.lld || { sudo apt-get update -qq && sudo apt-get install -y -qq lld; }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration-v2
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/everruns/postgres
          key: ${{ runner.os }}-pg-embedded-17
      - name: Measure private-database library tests at bounded concurrency
        run: python3 .github/scripts/ci/rust_profile.py concurrency
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-concurrency
          path: ${{ runner.temp }}/concurrency-measurements.json
          if-no-files-found: error
          retention-days: 7
