version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # `buffa` must track whatever `connectrpc` links against. connectrpc 0.8.1
      # depends on buffa 0.8, so taking buffa 0.9 puts two buffa crates in the
      # graph and the connectrpc-generated e2b code stops type-checking against
      # `::buffa::bytes::BufMut`. Drop this once connectrpc ships a 0.9 release.
      - dependency-name: "buffa"

  - package-ecosystem: "docker"
    directories:
      - "/crates/server"
      - "/crates/worker"
      - "/apps/ui"
      - "/docker"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "npm"
    directories:
      - "/apps/ui"
      - "/apps/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"
    ignore:
      # astro 7 still does `import yaml from "js-yaml"` internally, and Vite
      # externalizes that bare specifier so the prerender bundle resolves it from
      # the app root. Hoisting js-yaml 5 (ESM-only, no default export) there
      # breaks `astro build`. Drop this once astro moves off the default import.
      - dependency-name: "js-yaml"
        update-types: ["version-update:semver-major"]
      # openapi-typescript 7.13.0 reads `ts.factory` off the typescript package,
      # which TypeScript 7 no longer exposes that way, so `api-types:check` dies
      # with "Cannot read properties of undefined (reading
      # 'createKeywordTypeNode')". Everything else in the UI — typecheck, build,
      # lint, jest — is already clean on TypeScript 7. Drop this once
      # openapi-typescript supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @ag-ui/core 1.0 is an AG-UI protocol major, not a package refactor: the
      # zod schemas moved to the `@ag-ui/core/schemas` subpath export, and the
      # reasoning channel was renamed `THINKING_*` -> `REASONING_*`. The server
      # emits AG-UI from the Rust `ag-ui-core` 0.1.0 crate
      # (crates/server/src/api/ag_ui.rs), which still speaks `THINKING_*`, and
      # the npm package is also a transitive runtime dep of
      # @openuidev/react-headless — so taking the npm major alone desynchronizes
      # the two ends of the wire. The pnpm override in apps/ui/pnpm-workspace.yaml
      # pins 0.0.59, so a bump to the devDependency range on its own is a no-op
      # that only makes package.json disagree with the override. Drop this once
      # EVE-1135 migrates both ends together.
      - dependency-name: "@ag-ui/core"
        update-types: ["version-update:semver-major"]
